name: I-180 exact repository startup once

on:
  pull_request:
    branches:
      - agent/frontier-050-execution
    types: [opened, synchronize, reopened]
    paths:
      - 'ops/I180_STARTUP_TRIGGER.txt'

permissions:
  contents: write

concurrency:
  group: i180-exact-repository-startup-once
  cancel-in-progress: false

jobs:
  start-i180:
    if: github.event.pull_request.head.ref == 'ops/i180-startup-20260810'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Run exact repository startup
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-lock.txt
          bash bootstrap.sh
          bash tools/start_work.sh
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.load(open('STATE.json'))
          q=json.load(open('WORK_QUEUE.json'))
          assert s['active_work_unit']=='I-180', s
          assert s['current_module']=='I', s
          assert s['current_run'], s
          active=[x['id'] for x in q['items'] if x.get('status')=='ACTIVE']
          assert active==['I-180'], active
          run=Path('modules/I/runs')/s['current_run']
          assert run.is_dir(), run
          packet=Path('work_packets/ACTIVE_WORK_PACKET.md').read_text()
          assert 'I-180' in packet, packet[:500]
          print('ACTIVE_RUN='+s['current_run'])
          print('ACTIVE_PACKET=work_packets/ACTIVE_WORK_PACKET.md')
          PY
          python tools/rfc.py doctor
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
      - name: Commit repository-generated I startup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Repository startup produced no new mutation.'
            exit 0
          fi
          git commit -m 'Start governed I-180 repository work packet'
          git pull --rebase origin agent/frontier-050-execution
          git push origin HEAD:agent/frontier-050-execution
          printf 'I180_STARTUP_COMMIT=%s\n' "$(git rev-parse HEAD)"
