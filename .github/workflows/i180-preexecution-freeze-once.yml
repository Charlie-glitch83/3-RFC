name: G-160 to I interface superseding repair once

on:
  pull_request:
    branches:
      - agent/frontier-050-execution
    types: [opened, synchronize, reopened]
    paths:
      - 'ops/G160_I_INTERFACE_REPAIR_TRIGGER.txt'

permissions:
  contents: write

concurrency:
  group: g160-i-interface-superseding-repair-once
  cancel-in-progress: false

jobs:
  repair-g160-i-interface:
    if: github.event.pull_request.head.ref == 'ops/g160-i-interface-repair-20260810'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Diagnose and route the upstream interface defect
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-lock.txt
          RUN='I-180-20260810T134326Z'
          R="modules/I/runs/$RUN"

          # Phase 1: preserve the I science and harden the live G contract.
          python tools/repair_g160_i_interface.py prepare
          python - <<'PY'
          import json
          from pathlib import Path
          audit=json.loads(Path('audit/G160_I_CHILD_INTERFACE_DEFECT_20260810.json').read_text())
          assert audit['result']=='REPAIR_REQUIRED_AT_G_BEFORE_I_CAN_PHYSICALLY_EXECUTE', audit
          assert audit['diagnosis']['triad_falsified'] is False
          assert audit['diagnosis']['I_law_falsified'] is False
          assert audit['diagnosis']['F_parent_replay_required_now'] is False
          assert audit['diagnosis']['G_superseding_replay_required'] is True
          assert audit['diagnosis']['HU_replay_required_after_G'] is True
          cfg=json.loads(Path('config/required_output_contracts.json').read_text())
          names={x['name'] for x in cfg['modules']['G']['required_child_bindings']}
          required={'i_route_registry','i_route_resolved_process_activity','i_route_to_relational_ancestry','i_aggregate_no_loss_reconstruction','i_geometry_child_packet'}
          assert required <= names, (required-names)
          global_bind=json.loads(Path('configured_runs/binding_sheets/G_recombination_network.bindings.json').read_text())
          assert all(x.get('value') is None for x in global_bind['bindings'])
          PY

          # The corrected I law reached FORMALIZED, but physical execution never began.
          python tools/rfc.py promote-module I --to FORMALIZED --fidelity MINIMAL_SPINE --evidence "$R/PRE_EXECUTION_LOCK.json"
          python tools/rfc.py close-run --run-id "$RUN" --result BLOCKED --closeout "$R/CLOSEOUT.md"

          # Phase 2: move the sole active frontier upstream to G and preserve replay order G -> HU -> I.
          python tools/repair_g160_i_interface.py route
          python tools/rfc.py reopen-module G --fidelity PRODUCTION --evidence audit/G160_I_CHILD_INTERFACE_DEFECT_20260810.json

          # Repository-controlled startup creates the new G run and active packet.
          bash tools/start_work.sh

          python - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path('STATE.json').read_text())
          queue=json.loads(Path('WORK_QUEUE.json').read_text())['items']
          by={x['id']:x for x in queue}
          assert state['active_work_unit']=='G-165', state
          assert state['current_module']=='G', state
          assert state['current_run'] and state['current_run'].startswith('G-165-'), state
          assert state['modules']['G']['evidence_state']=='DESIGN', state['modules']['G']
          assert state['modules']['G']['fidelity']=='PRODUCTION', state['modules']['G']
          assert state['modules']['I']['evidence_state']=='FORMALIZED', state['modules']['I']
          assert by['G-165']['status']=='ACTIVE'
          assert by['HU-175']['status']=='BLOCKED' and by['HU-175']['depends_on']==['G-165']
          assert by['I-180']['status']=='BLOCKED' and set(by['I-180']['depends_on'])=={'G-165','HU-175'}
          if 'HI-190' in by:
              assert 'HU-175' in by['HI-190']['depends_on'] and 'HU-170' not in by['HI-190']['depends_on']
          packet=Path('work_packets/ACTIVE_WORK_PACKET.md').read_text()
          assert 'G-165' in packet and 'Module G' in packet
          run=Path('modules/G/runs')/state['current_run']
          bind=json.loads((run/'binding_sheets/G_recombination_network.bindings.json').read_text())
          assert all(x.get('value') is None for x in bind['bindings'])
          print('ACTIVE_REPAIR_RUN='+state['current_run'])
          PY

          python tools/rfc.py doctor
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan

      - name: Commit governed repair routing and repository-generated G run
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Reroute repaired I lineage through route-resolved G replay'
          git pull --rebase origin agent/frontier-050-execution
          git push origin HEAD:agent/frontier-050-execution
          printf 'G165_REPAIR_ROUTE_COMMIT=%s\n' "$(git rev-parse HEAD)"
