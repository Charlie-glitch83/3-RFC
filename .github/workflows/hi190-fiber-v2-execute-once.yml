name: HI-190 repaired b-M fiber execution once

on:
  pull_request:
    branches:
      - agent/frontier-050-execution
    types: [opened, synchronize, reopened]
    paths:
      - 'ops/HI190_FIBER_V2_TRIGGER.txt'

permissions:
  contents: write

concurrency:
  group: hi190-repaired-b-m-fiber-once
  cancel-in-progress: false

jobs:
  execute-hi190-fiber:
    if: github.event.pull_request.head.ref == 'ops/hi190-fiber-v2-20260810'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Execute repaired HI-190 b-M parent fiber product
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-lock.txt
          RID='HI-190-20260810T165541Z'
          R="modules/HI/runs/$RID"
          PRE_SHA="$(git rev-parse HEAD)"
          printf '%s\n' "$PRE_SHA" > /tmp/hi190_pre_sha.txt
          python tools/rfc.py doctor
          python tools/director.py doctor
          python tools/hi190_replay_v2.py freeze

          cat > /tmp/HI-WL-001.output.txt <<'EOF'
          Symbol::undefined2: Warning: Global symbols "T, B, B, T, B, T" are undefined.
          General::messages: Messages were generated which may indicate errors.

          Out[1]= "<|\"call\" -> \"HI-WL-001\", \"instantiated\" -> \"{{a*u, b*u}, {c*v, d*v}}\", \"compositionPass\" -> True|>"
          EOF
          cat > /tmp/HI-WL-002.output.txt <<'EOF'
          Symbol::undefined2: Warning: Global symbols "T, Cp, T, T, Cp, Cp, Cp" are undefined.
          General::messages: Messages were generated which may indicate errors.

          Out[1]= "<|\"call\" -> \"HI-WL-002\", \"propagatedCovariance\" -> \"{{a^2 + b^2 + 2*a*b*r, b*(d + c*r) + a*(c + d*r)}, {b*(d + c*r) + a*(c + d*r), c^2 + d^2 + 2*c*d*r}}\", \"symmetric\" -> True|>"
          EOF
          python tools/director.py wolfram-record --run "$RID" --call HI-WL-001 --output /tmp/HI-WL-001.output.txt
          python tools/director.py wolfram-record --run "$RID" --call HI-WL-002 --output /tmp/HI-WL-002.output.txt
          python tools/run_reference_checks.py --module HI --output "$R/reference_checks.json"
          python tools/materialize_solver_config.py --template "$R/solver_templates/HI_instantiated_transfer.template.json" --binding-sheet "$R/binding_sheets/HI_instantiated_transfer.bindings.json" --output "$R/solver_configs/HI_instantiated_transfer.json"
          python tools/run_configured_solver.py --config "$R/solver_configs/HI_instantiated_transfer.json" --output-dir "$R/solver_outputs/linear_transfer"
          python tools/hi190_replay_v2.py execute
          python tools/hi190_replay_v2.py witness_check
          python tools/hi190_independent_v2.py

          rm -rf /tmp/hi190-clean
          mkdir -p /tmp/hi190-clean
          git archive "$PRE_SHA" | tar -x -C /tmp/hi190-clean
          (
            cd /tmp/hi190-clean
            python tools/hi190_replay_v2.py freeze
            python tools/director.py wolfram-record --run "$RID" --call HI-WL-001 --output /tmp/HI-WL-001.output.txt
            python tools/director.py wolfram-record --run "$RID" --call HI-WL-002 --output /tmp/HI-WL-002.output.txt
            python tools/run_reference_checks.py --module HI --output "$R/reference_checks.json"
            python tools/materialize_solver_config.py --template "$R/solver_templates/HI_instantiated_transfer.template.json" --binding-sheet "$R/binding_sheets/HI_instantiated_transfer.bindings.json" --output "$R/solver_configs/HI_instantiated_transfer.json"
            python tools/run_configured_solver.py --config "$R/solver_configs/HI_instantiated_transfer.json" --output-dir "$R/solver_outputs/linear_transfer"
            python tools/hi190_replay_v2.py execute
            python tools/hi190_replay_v2.py witness_check
            python tools/hi190_independent_v2.py
          )
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('.').resolve(); replay=Path('/tmp/hi190-clean').resolve(); rid='HI-190-20260810T165541Z'
          rels=[f'modules/HI/runs/{rid}/FROZEN_DERIVATION_SPEC.json',f'modules/HI/runs/{rid}/primary/HI190_INSTANTIATED_TRANSFER_BRANCH_FAMILY_V2.json',f'modules/HI/runs/{rid}/primary/HI190_MODE_EIGENSTRUCTURE_V2.json',f'modules/HI/runs/{rid}/primary/HI190_GAUGE_FRAME_MAPPING_V2.json',f'modules/HI/runs/{rid}/primary/HI190_ERROR_COVARIANCE_PROPAGATION_V2.json',f'modules/HI/runs/{rid}/primary/HI190_PHYSICAL_TRANSFER_INSTANTIATION_STATE_V2.json',f'modules/HI/runs/{rid}/countermodels/HI190_SEMANTIC_COUNTERMODELS_V2.json',f'modules/HI/runs/{rid}/independent/INDEPENDENT_RECONSTRUCTION.json']
          def sh(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          rows=[]; ok=True
          for rel in rels:
            ah=sh(root/rel); bh=sh(replay/rel); match=ah==bh; ok &= match
            rows.append({'path':rel,'primary_sha256':ah,'replay_sha256':bh,'match':match})
          out={'schema_version':'4.0','run_id':rid,'result':'PASS' if ok else 'FAIL','clean_checkout':True,'preexecution_commit':Path('/tmp/hi190_pre_sha.txt').read_text().strip(),'artifact_hashes_match':bool(ok),'compared_artifacts':rows}
          (root/f'modules/HI/runs/{rid}/REPLAY_RECORD.json').write_text(json.dumps(out,indent=2)+'\n')
          if not ok: raise SystemExit('HI clean replay artifact mismatch')
          print(json.dumps(out,indent=2))
          PY

          python tools/hi190_replay_v2.py finalize
          python tools/hi190_replay_v2.py manifest
          python tools/scientific_completion_guard.py --run "$R"
          CUR="$(python -c "import json; print(json.load(open('STATE.json'))['modules']['HI']['evidence_state'])")"
          if [ "$CUR" = "FROZEN" ]; then
            python tools/rfc.py reopen-module HI --fidelity PRODUCTION --evidence modules/I/frozen/H_I_to_HI_v2.json
          fi
          python tools/rfc.py promote-module HI --to FORMALIZED --fidelity PRODUCTION --evidence "$R/FROZEN_DERIVATION_SPEC.json"
          python tools/rfc.py promote-module HI --to IMPLEMENTED --fidelity PRODUCTION --evidence "$R/primary/HI190_PHYSICAL_TRANSFER_INSTANTIATION_STATE_V2.json"
          python tools/rfc.py promote-module HI --to VERIFIED --fidelity PRODUCTION --evidence "$R/GATE_RESULTS.json"
          python tools/rfc.py promote-module HI --to PHYSICALLY_EXECUTED --fidelity PRODUCTION --evidence "$R/PARENT_BOUND_EXECUTION_ATTESTATION.json"
          python tools/rfc.py promote-module HI --to INDEPENDENTLY_REPRODUCED --fidelity PRODUCTION --evidence "$R/independent/INDEPENDENT_RECONSTRUCTION.json"
          python tools/rfc.py promote-module HI --to FROZEN --fidelity PRODUCTION --evidence modules/HI/frozen/H_HI_to_J_v2.json
          python tools/rfc.py close-run --run-id "$RID" --result PASS --closeout "$R/CLOSEOUT.md"
          python tools/rfc.py record-claim --file audit/HI190_CLAIM.json
          python tools/rfc.py advance --task HI-190 --result PASS --evidence "$R/CLOSEOUT.md"
          bash tools/start_work.sh
          python tools/rfc.py doctor
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
          python - <<'PY'
          import json
          s=json.load(open('STATE.json'))
          assert s['active_work_unit']=='J-200', s
          assert s['current_module']=='J', s
          assert s['current_run'] and s['current_run'].startswith('J-200-'), s
          print('NEXT_ACTIVE_RUN='+s['current_run'])
          PY

      - name: Commit HI-190 and J-200 startup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Execute repaired HI b-M fiber and advance to J'
          git pull --rebase origin agent/frontier-050-execution
          git push origin HEAD:agent/frontier-050-execution
          printf 'HI190_EXECUTION_COMMIT=%s\n' "$(git rev-parse HEAD)"
