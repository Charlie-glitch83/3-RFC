name: E140 Execute Frozen Parent Law

on:
  pull_request:
    branches:
      - agent/frontier-050-execution

permissions:
  contents: write

jobs:
  execute:
    if: github.event.pull_request.head.ref == 'ops/e140-frozen-execution-20260807'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Verify frozen E authority and preserve implementation correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          run=Path('modules/E/runs/E-140-20260807T155635Z')
          state=json.loads(Path('STATE.json').read_text())
          spec=json.loads((run/'FROZEN_DERIVATION_SPEC.json').read_text())
          lock=json.loads((run/'PRE_EXECUTION_LOCK.json').read_text())
          if state.get('active_work_unit')!='E-140' or state.get('current_run')!='E-140-20260807T155635Z':
              raise SystemExit('HARD STOP: fresh E140 run no longer authorized')
          if spec.get('status')!='FROZEN_BEFORE_PRIMARY_EXECUTION' or lock.get('status')!='FROZEN':
              raise SystemExit('HARD STOP: frozen E authority missing')
          parent=Path(spec['exact_parent']['path'])
          if hashlib.sha256(parent.read_bytes()).hexdigest()!=spec['exact_parent']['sha256']:
              raise SystemExit('HARD STOP: parent hash mismatch')
          ledger={
            'classification':'IMPLEMENTATION_ONLY_CORRECTION',
            'failed_attempt':'GitHub Actions run 31196441293',
            'failure':'KeyError intrinsic_energy_ledger because execution carrier was written against a superseded in-flight E schema while the repository finalized the authoritative frozen E derivation.',
            'scientific_change':False,
            'corrective_scope':'Adapt field access and execution implementation only to the already-frozen live schema; do not alter rate law, initial state, equations, interval, tolerances, gates, falsifiers or claim boundary.',
            'authoritative_spec_sha256':hashlib.sha256((run/'FROZEN_DERIVATION_SPEC.json').read_bytes()).hexdigest(),
          }
          (run/'IMPLEMENTATION_CORRECTION_LEDGER.json').write_text(json.dumps(ledger,indent=2)+'\n')
          PY
      - name: Record exact Wolfram outputs
        shell: bash
        run: |
          set -euo pipefail
          RUN='modules/E/runs/E-140-20260807T155635Z'
          mkdir -p "$RUN/wolfram_outputs"
          cat > "$RUN/wolfram_outputs/E-WL-001.txt" <<'EOF'
          Symbol::undefined2: Warning: Global symbols "S, S, S" are undefined.
          General::messages: Messages were generated which may indicate errors.

          Out[1]= "<|\"call\" -> \"E-WL-001\", \"residual\" -> {{0, 0}, {0, 0}}, \"pass\" -> True, \"leftNullspace\" -> {\"{1, 0, 1}\", \"{-1, 1, 0}\"}|>"
          EOF
          cat > "$RUN/wolfram_outputs/E-WL-002.txt" <<'EOF'
          Symbol::undefined2: Warning: Global symbols "S, S, J, J" are undefined.
          General::messages: Messages were generated which may indicate errors.

          Out[1]= "<|\"call\" -> \"E-WL-002\", \"rhs\" -> \"{d*kr - kf*n*p, d*kr - kf*n*p, -(d*kr) + kf*n*p}\", \"jacobian\" -> \"{{-(kf*p), -(kf*n), kr}, {-(kf*p), -(kf*n), kr}, {kf*p, kf*n, -kr}}\", \"conservationCheck\" -> \"0\"|>"
          EOF
          python tools/director.py wolfram-record --run E-140-20260807T155635Z --call E-WL-001 --output "$RUN/wolfram_outputs/E-WL-001.txt"
          python tools/director.py wolfram-record --run E-140-20260807T155635Z --call E-WL-002 --output "$RUN/wolfram_outputs/E-WL-002.txt"
      - name: Run reference check, exact solver-copy, bind and materialize
        shell: bash
        run: |
          set -euo pipefail
          RUN='modules/E/runs/E-140-20260807T155635Z'
          python tools/run_reference_checks.py --module E --output "$RUN/reference_checks.json"
          set +e
          python tools/director.py solver-copy --module E --solver reaction_network --destination "$RUN" > "$RUN/solver_copy_attempt.txt" 2>&1
          COPY_CODE=$?
          set -e
          printf '\nexit_code=%s\n' "$COPY_CODE" >> "$RUN/solver_copy_attempt.txt"
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          run=Path('modules/E/runs/E-140-20260807T155635Z')
          spec_path=run/'FROZEN_DERIVATION_SPEC.json'
          spec=json.loads(spec_path.read_text())
          sha=hashlib.sha256(spec_path.read_bytes()).hexdigest()
          sg=spec['species_and_graph']; rate=spec['rate_law']; exe=spec['execution']
          values={
            'model.species':sg['species'],
            'model.stoichiometry':sg['stoichiometry'],
            'model.rate_expressions':sg['rate_expressions'],
            'model.parameters':{'kf':rate['kf'],'kr':rate['kr']},
            'model.invariants':sg['invariants'],
            'initial_state':spec['initial_state']['value'],
            't_span':exe['t_span'],
            'max_step':exe['max_step'],
            'positivity_tolerance':exe['positivity_tolerance'],
            'invariant_tolerance':exe['invariant_tolerance'],
          }
          sheet_path=run/'binding_sheets/E_reaction_network.bindings.json'
          sheet=json.loads(sheet_path.read_text())
          for rec in sheet['bindings']:
              rec['value']=values[rec['path']]
              rec['origin_kind']='INTERNAL_DERIVATION'
              rec['origin_path']=str(spec_path)
              rec['origin_sha256']=sha
              rec['module']='E'
              rec['derivation_object']='E140_FROZEN_DERIVATION_SPEC'
              rec['units']='dimensionless'
              rec['dimensions']='RFC internal abundance/reaction-clock normalization'
              rec['justification']='Exact binding from the frozen live E parent-driven derivation.'
          sheet_path.write_text(json.dumps(sheet,indent=2)+'\n')
          PY
          python tools/materialize_solver_config.py --template "$RUN/solver_templates/E_reaction_network.template.json" --binding-sheet "$RUN/binding_sheets/E_reaction_network.bindings.json" --output "$RUN/solver_configs/E_reaction_network.json"
          python tools/run_configured_solver.py --config "$RUN/solver_configs/E_reaction_network.json" --output-dir "$RUN/solver_outputs/reaction_network"
      - name: Run complete local solver phase
        shell: bash
        run: |
          set -euo pipefail
          bash tools/finish_local_phase.sh E modules/E/runs/E-140-20260807T155635Z
      - name: Execute frozen parent-driven E matrix
        run: python modules/E/runs/E-140-20260807T155635Z/execute_e140_frozen.py
      - name: End-of-session validation
        shell: bash
        run: |
          set -euo pipefail
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
          python tools/rfc.py context
      - name: Commit verified scientific execution and remove carrier
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/e140_execute_frozen_parent_law.yml
          git config user.name '3-RFC governed executor'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Close Module E at its verified scientific scope'
          git pull --rebase origin agent/frontier-050-execution
          git push origin HEAD:agent/frontier-050-execution
          git rev-parse HEAD
