name: Apply A-100 verified evidence once

on:
  push:
    branches: [agent/frontier-050-execution]
    paths:
      - '.github/a100-evidence-trigger.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      EXECUTION_BRANCH: agent/frontier-050-execution
      SOURCE_COMMIT: 2a54d53cc87f584173e521a85b548584fd13034b
      RUN_ID: A-100-20260806T173458Z
      EVIDENCE_ARCHIVE_SHA256: f4b1ea136c7b26fd6d587ae11d5470521092392d9c371801172919e2b3a33102
      H_A_SHA256: 728caf8c049d0114caef6f7b36af00065a32b4dc5f4faad02c6b9bcb16c933e7
      OUTPUT_TREE_SHA256: 33d1967c587a282e43896bc3f6c1f00a49bd1c2da0bfdcd4cc26982512e81b6c
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-lock.txt
      - name: Reconstruct exact immutable A-100 evidence payload
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/a100-evidence.b64
          for i in $(seq -w 0 14); do
            git show "$SOURCE_COMMIT:.a100_bundle/chunk-$i" >> /tmp/a100-evidence.b64
          done
          base64 -d /tmp/a100-evidence.b64 > /tmp/a100-evidence.tar.xz
          echo "$EVIDENCE_ARCHIVE_SHA256  /tmp/a100-evidence.tar.xz" | sha256sum -c -
          mkdir -p /tmp/a100-reference
          tar -xJf /tmp/a100-evidence.tar.xz -C /tmp/a100-reference
          tar -xJf /tmp/a100-evidence.tar.xz -C .
      - name: Verify exact frozen Module A evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          run_id = os.environ['RUN_ID']
          run = Path('modules/A/runs') / run_id
          state = json.loads(Path('STATE.json').read_text())
          gates = json.loads((run / 'GATE_RESULTS.json').read_text())
          replay = json.loads((run / 'REPLAY_RECORD.json').read_text())
          manifest = json.loads((run / 'GENERATED_OUTPUT_MANIFEST.json').read_text())
          assert state['generation_mode'] == 'GENERATION_SEALED'
          assert state['active_work_unit'] == 'A-100'
          assert state['current_module'] == 'A'
          assert state['current_run'] == run_id
          assert gates['overall'] == 'PASS'
          assert all(g['result'] == 'PASS' and g['score'] >= 0.95 for g in gates['gates'])
          assert replay['result'] == 'PASS'
          assert replay['clean_checkout'] is True
          assert replay['artifact_hashes_match'] is True
          handoff = Path('modules/A/frozen/H_A_to_B.json')
          assert hashlib.sha256(handoff.read_bytes()).hexdigest() == os.environ['H_A_SHA256']
          errors = []
          for item in manifest['outputs']:
              p = Path(item['path'])
              if not p.exists():
                  errors.append((item['path'], 'missing'))
                  continue
              digest = hashlib.sha256(p.read_bytes()).hexdigest()
              if digest != item['sha256'] or p.stat().st_size != item['bytes']:
                  errors.append((item['path'], digest, p.stat().st_size))
          canonical = json.dumps(manifest['outputs'], sort_keys=True, separators=(',', ':')).encode()
          tree = hashlib.sha256(canonical).hexdigest()
          assert not errors, errors
          assert tree == manifest['tree_sha256'] == os.environ['OUTPUT_TREE_SHA256']
          assert manifest['status'] == 'FINAL'
          assert len(manifest['outputs']) == 56
          PY
      - name: Run frozen README verification matrix
        shell: bash
        run: |
          set -euo pipefail
          run="modules/A/runs/$RUN_ID"
          python tools/director.py doctor | tee "$run/FINAL_DOCTOR_EVIDENCE_COMMIT.txt"
          python -m unittest discover -s tests -v 2>&1 | tee "$run/FINAL_UNIT_TESTS_EVIDENCE_COMMIT.txt"
          python tools/rfc.py firewall-scan | tee "$run/FINAL_FIREWALL_EVIDENCE_COMMIT.txt"
          python tools/rfc.py context | tee "$run/FINAL_CONTEXT_EVIDENCE_COMMIT.txt"
      - name: Commit and remotely verify exact A-100 evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .a100_bundle
          rm -f .github/a100-evidence-trigger.txt .github/workflows/apply-a100-evidence-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test -f modules/A/frozen/H_A_to_B.json
          test -f "modules/A/runs/$RUN_ID/CLOSEOUT.md"
          test ! -e .a100_bundle
          test ! -e .github/a100-evidence-trigger.txt
          test ! -e .github/workflows/apply-a100-evidence-once.yml
          git commit -m 'Execute and freeze Module A prephysical handoff'
          EVIDENCE_COMMIT=$(git rev-parse HEAD)
          git push origin HEAD:"$EXECUTION_BRANCH"
          REMOTE=$(git ls-remote origin "refs/heads/$EXECUTION_BRANCH" | awk '{print $1}')
          test "$REMOTE" = "$EVIDENCE_COMMIT"
          git diff-tree --no-commit-id --name-only -r "$EVIDENCE_COMMIT" | tee /tmp/a100-evidence-changed-files.txt
          test -s /tmp/a100-evidence-changed-files.txt
          echo "EVIDENCE_COMMIT=$EVIDENCE_COMMIT" >> "$GITHUB_ENV"
      - name: Close Module A and authorize exactly B-110
        shell: bash
        run: |
          set -euo pipefail
          run="modules/A/runs/$RUN_ID"
          python - <<'PY'
          import os
          from pathlib import Path
          p = Path('modules/A/runs') / os.environ['RUN_ID'] / 'CLOSEOUT.md'
          text = p.read_text()
          text = text.replace('administrative close-run awaits the verified GitHub evidence commit.', 'verified GitHub evidence commit recorded; administrative close-run completed.')
          text = text.replace('promotion to be recorded after the evidence commit is verified', 'promotion recorded after exact GitHub evidence verification')
          text = text.replace('PENDING_EVIDENCE_COMMIT', os.environ['EVIDENCE_COMMIT'])
          p.write_text(text)
          PY
          python tools/rfc.py record-commit "$EVIDENCE_COMMIT" --branch "$EXECUTION_BRANCH" --note 'Verified exact A-100 evidence commit and changed-file scope on GitHub'
          python tools/rfc.py close-run --run-id "$RUN_ID" --result PASS --closeout "$run/CLOSEOUT.md"
          python tools/rfc.py promote-module A --to FORMALIZED --fidelity PRODUCTION --evidence modules/A/frozen/H_A_to_B.json
          python tools/rfc.py promote-module A --to VERIFIED --fidelity PRODUCTION --evidence "$run/INDEPENDENT_VERIFICATION.md"
          python tools/rfc.py promote-module A --to INDEPENDENTLY_REPRODUCED --fidelity PRODUCTION --evidence "$run/independent/INDEPENDENT_RECONSTRUCTION.json"
          python tools/rfc.py promote-module A --to FROZEN --fidelity PRODUCTION --evidence modules/A/frozen/H_A_to_B.json
          python tools/rfc.py advance --task A-100 --result PASS --evidence "$run/CLOSEOUT.md" --note 'Module A closed at FROZEN/PRODUCTION; authorize exactly B-110'
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
          python tools/rfc.py context
          test "$(python - <<'PY'
          import json
          print(json.load(open('STATE.json'))['active_work_unit'])
          PY
          )" = 'B-110'
          git add -A
          git commit -m 'Close Module A and authorize B-110'
          CLOSEOUT_COMMIT=$(git rev-parse HEAD)
          git push origin HEAD:"$EXECUTION_BRANCH"
          REMOTE=$(git ls-remote origin "refs/heads/$EXECUTION_BRANCH" | awk '{print $1}')
          test "$REMOTE" = "$CLOSEOUT_COMMIT"
          git diff-tree --no-commit-id --name-only -r "$CLOSEOUT_COMMIT" | tee /tmp/a100-closeout-changed-files.txt
          test -s /tmp/a100-closeout-changed-files.txt
          echo "A-100 evidence commit: $EVIDENCE_COMMIT"
          echo "Module A closeout commit: $CLOSEOUT_COMMIT"
