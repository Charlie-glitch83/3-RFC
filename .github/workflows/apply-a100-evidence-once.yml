name: Apply A-100 verified evidence once

on:
  push:
    branches: [agent/a100-recovery]
    paths: ['.github/a100-evidence-trigger.txt']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      RUN_ID: A-100-20260806T173458Z
      TARGET_BRANCH: agent/frontier-050-execution
      EVIDENCE_ARCHIVE_SHA256: f4b1ea136c7b26fd6d587ae11d5470521092392d9c371801172919e2b3a33102
      H_A_SHA256: 728caf8c049d0114caef6f7b36af00065a32b4dc5f4faad02c6b9bcb16c933e7
      OUTPUT_TREE_SHA256: 33d1967c587a282e43896bc3f6c1f00a49bd1c2da0bfdcd4cc26982512e81b6c
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-lock.txt
      - name: Reconstruct and verify exact A-100 evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .a100_bundle -maxdepth 1 -type f -name 'chunk-*' | wc -l)" -eq 15
          cat .a100_bundle/chunk-* | base64 -d > /tmp/a100-evidence.tar.xz
          echo "$EVIDENCE_ARCHIVE_SHA256  /tmp/a100-evidence.tar.xz" | sha256sum -c -
          tar -xJf /tmp/a100-evidence.tar.xz -C .
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          run = Path('modules/A/runs') / os.environ['RUN_ID']
          state = json.loads(Path('STATE.json').read_text())
          gates = json.loads((run / 'GATE_RESULTS.json').read_text())
          replay = json.loads((run / 'REPLAY_RECORD.json').read_text())
          manifest = json.loads((run / 'GENERATED_OUTPUT_MANIFEST.json').read_text())
          assert state['generation_mode'] == 'GENERATION_SEALED'
          assert state['active_work_unit'] == 'A-100' and state['current_module'] == 'A'
          assert state['current_run'] == os.environ['RUN_ID']
          assert gates['overall'] == 'PASS'
          assert all(g['result'] == 'PASS' and g['score'] >= 0.95 for g in gates['gates'])
          assert replay['result'] == 'PASS' and replay['clean_checkout'] and replay['artifact_hashes_match']
          assert hashlib.sha256(Path('modules/A/frozen/H_A_to_B.json').read_bytes()).hexdigest() == os.environ['H_A_SHA256']
          for item in manifest['outputs']:
              p = Path(item['path'])
              assert p.exists() and p.stat().st_size == item['bytes']
              assert hashlib.sha256(p.read_bytes()).hexdigest() == item['sha256']
          canonical = json.dumps(manifest['outputs'], sort_keys=True, separators=(',', ':')).encode()
          assert hashlib.sha256(canonical).hexdigest() == manifest['tree_sha256'] == os.environ['OUTPUT_TREE_SHA256']
          assert manifest['status'] == 'FINAL' and len(manifest['outputs']) == 56
          PY
          run="modules/A/runs/$RUN_ID"
          python tools/director.py doctor | tee "$run/FINAL_DOCTOR_EVIDENCE_COMMIT.txt"
          python -m unittest discover -s tests -v 2>&1 | tee "$run/FINAL_UNIT_TESTS_EVIDENCE_COMMIT.txt"
          python tools/rfc.py firewall-scan | tee "$run/FINAL_FIREWALL_EVIDENCE_COMMIT.txt"
          python tools/rfc.py context | tee "$run/FINAL_CONTEXT_EVIDENCE_COMMIT.txt"
      - name: Commit and publish exact verified Module A evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .a100_bundle
          rm -f .github/a100-evidence-trigger.txt .github/workflows/apply-a100-evidence-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test -f modules/A/frozen/H_A_to_B.json
          test -f "modules/A/runs/$RUN_ID/CLOSEOUT.md"
          git diff --cached --quiet && { echo 'No A-100 evidence changes produced' >&2; exit 1; }
          git commit -m 'Execute and freeze Module A prephysical handoff'
          evidence_sha=$(git rev-parse HEAD)
          git fetch origin "refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          live_sha=$(git rev-parse "refs/remotes/origin/$TARGET_BRANCH")
          git push --force-with-lease="refs/heads/$TARGET_BRANCH:$live_sha" origin "HEAD:refs/heads/$TARGET_BRANCH"
          remote_sha=$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)
          test "$remote_sha" = "$evidence_sha"
