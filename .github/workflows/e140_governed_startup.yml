name: E140 Governed Startup

on:
  pull_request:
    types: [opened, reopened]
    branches:
      - agent/frontier-050-execution

permissions:
  contents: write

jobs:
  startup-e140:
    if: github.event.pull_request.head.ref == 'agent/e140-startup-trigger'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout execution branch
        uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install repository execution dependencies
        run: python -m pip install --disable-pip-version-check numpy networkx scipy sympy
      - name: Run root README startup exactly
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path('STATE.json').read_text())
          queue=json.loads(Path('WORK_QUEUE.json').read_text())
          items={i['id']:i for i in queue['items']}
          if state.get('active_work_unit')!='E-140' or state.get('current_module')!='E':
              raise SystemExit('HARD STOP: E-140 is not the sole active work unit')
          if state.get('current_run') is not None:
              raise SystemExit('HARD STOP: E run already exists; startup workflow is one-shot')
          if items['E-140']['status']!='ACTIVE' or items['F-150']['status']!='BLOCKED':
              raise SystemExit('HARD STOP: expected E ACTIVE and F BLOCKED')
          PY
          bash bootstrap.sh
          bash tools/start_work.sh
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
          python tools/rfc.py context
          python - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path('STATE.json').read_text())
          run=state.get('current_run')
          if not run or not run.startswith('E-140-'):
              raise SystemExit(f'HARD STOP: governed E run was not created: {run!r}')
          run_path=Path('modules/E/runs')/run
          if not run_path.is_dir(): raise SystemExit('HARD STOP: E run directory missing')
          sheet=run_path/'binding_sheets'/'E_reaction_network.bindings.json'
          if not sheet.exists(): raise SystemExit('HARD STOP: E binding sheet missing')
          if '__BIND_' not in sheet.read_text():
              raise SystemExit('HARD STOP: copied E binding sheet was unexpectedly pre-bound')
          print(run)
          PY
      - name: Commit governed startup artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name '3-RFC governed executor'
          git config user.email 'actions@users.noreply.github.com'
          git add STATE.json WORK_QUEUE.json memory work_packets/ACTIVE_WORK_PACKET.md modules/E/runs
          if git diff --cached --quiet; then echo 'HARD STOP: no governed startup changes'; exit 1; fi
          git commit -m 'Start governed E-140 run from root README'
          git push origin HEAD:agent/frontier-050-execution
          git rev-parse HEAD
