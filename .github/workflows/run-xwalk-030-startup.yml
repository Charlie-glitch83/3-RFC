name: Close XWALK-030 and advance

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  close:
    if: github.head_ref == 'agent/xwalk-030-execution'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xwalk-030-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements-lock.txt
      - name: Record, close, and advance XWALK-030
        shell: bash
        run: |
          set -euo pipefail
          python tools/rfc.py record-commit 8913ed740c60cc7ea02652150a3dd8e962d4ecae --branch agent/xwalk-030-execution --note 'Verified XWALK-030 enhancement-crosswalk commit, exact changed files, source hashes, gate evidence, independent review, and closeout'
          python tools/rfc.py close-run --run-id XWALK-030-20260806T130603Z --result PASS --closeout runs/XWALK-030-20260806T130603Z/CLOSEOUT.md
          python tools/rfc.py advance --task XWALK-030 --result PASS --evidence runs/XWALK-030-20260806T130603Z/CLOSEOUT.md
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
          python tools/rfc.py context
      - name: Commit formal transition and remove temporary runners
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/run-xwalk-030-startup.yml
          rm -f .github/xwalk-030-startup-trigger.txt .github/xwalk-030-startup-trigger-2.txt .github/xwalk-030-finalize-trigger.txt
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Close XWALK-030 and activate legacy recovery'
          git pull --rebase origin agent/xwalk-030-execution
          git push origin agent/xwalk-030-execution
