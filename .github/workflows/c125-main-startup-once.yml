name: J-200 indexed source-scope repair once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: j200-source-repair-once
  cancel-in-progress: false

jobs:
  repair-j200:
    if: github.event.pull_request.head.ref == 'ops/j200-indexed-repair-20260810'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Execute repository-governed J source repair
        shell: bash
        run: bash tools/run_j200_source_repair_dispatch.sh
