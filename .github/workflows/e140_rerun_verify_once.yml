name: E140 Governed Rerun Verify Once

on:
  pull_request:
    branches:
      - agent/frontier-050-execution
    paths:
      - '.github/e140-rerun-trigger.txt'

permissions:
  contents: write

jobs:
  rerun-verify-e140:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install frozen dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-lock.txt

      - name: Verify exact active E frontier
        run: |
          python - <<'PY'
          import json
          s=json.load(open('STATE.json'))
          assert s['active_work_unit']=='E-140',s
          assert s['current_run']=='E-140-20260807T232334Z',s
          lock=json.load(open('modules/E/runs/E-140-20260807T232334Z/PRE_EXECUTION_LOCK.json'))
          assert lock['status']=='FROZEN_BEFORE_PRIMARY_EXECUTION',lock
          src=json.load(open('modules/E/runs/E-140-20260807T232334Z/SOURCE_REGISTER.json'))
          assert src['public_data_declaration'].startswith('NONE'),src
          PY

      - name: Rematerialize corrected provenance-bound E config
        run: |
          python tools/materialize_solver_config.py \
            --template modules/E/runs/E-140-20260807T232334Z/solver_templates/E_reaction_network.template.json \
            --binding-sheet modules/E/runs/E-140-20260807T232334Z/binding_sheets/E_reaction_network.bindings.json \
            --output modules/E/runs/E-140-20260807T232334Z/solver_configs/E_reaction_network.json
          python - <<'PY'
          import json
          p='modules/E/runs/E-140-20260807T232334Z/solver_configs/E_reaction_network.json'
          c=json.load(open(p))
          assert c['model']['invariants']['Q_total']==[1,1,1,2,2,2,3],c['model']['invariants']
          assert c['generation_mode']=='GENERATION_SEALED'
          PY

      - name: Rerun frozen primary E reaction network
        run: |
          rm -rf modules/E/runs/E-140-20260807T232334Z/solver_outputs/reaction_network
          python tools/run_configured_solver.py \
            --config modules/E/runs/E-140-20260807T232334Z/solver_configs/E_reaction_network.json \
            --output-dir modules/E/runs/E-140-20260807T232334Z/solver_outputs/reaction_network
          python - <<'PY'
          import json
          r=json.load(open('modules/E/runs/E-140-20260807T232334Z/solver_outputs/reaction_network/result.json'))
          assert r['success'] is True,r
          assert r['pass_flags']['positivity'] is True,r['pass_flags']
          assert r['pass_flags']['invariants'] is True,r['pass_flags']
          PY

      - name: Apply exact implementation-only withheld-route verifier correction
        run: python modules/E/runs/E-140-20260807T232334Z/verification/patch_withheld_check.py

      - name: Execute complete frozen E verification matrix
        id: matrix
        continue-on-error: true
        run: python modules/E/runs/E-140-20260807T232334Z/verification/verify_e140.py

      - name: Run repository validation after full rerun
        id: repo_validation
        continue-on-error: true
        run: |
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan

      - name: Commit all E rerun and verification evidence even on failure
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/E/runs/E-140-20260807T232334Z
          if git diff --cached --quiet; then
            echo 'No E140 rerun changes to commit'
          else
            git commit -m 'Rerun frozen Module E matrix after verifier correction'
            git pull --rebase origin agent/frontier-050-execution
            git push origin HEAD:agent/frontier-050-execution
          fi

      - name: Enforce frozen componentwise verdict
        if: always()
        run: |
          python - <<'PY'
          import json
          g=json.load(open('modules/E/runs/E-140-20260807T232334Z/GATE_RESULTS.json'))
          print(json.dumps(g,indent=2))
          assert g['overall']=='PASS',g
          assert all(v['pass'] for v in g['componentwise'].values()),g
          u=json.load(open('modules/E/runs/E-140-20260807T232334Z/verification/UNCERTAINTY_COVARIANCE.json'))
          assert u['pass'] is True,u
          f=json.load(open('modules/E/runs/E-140-20260807T232334Z/verification/FREEZE_OUT_WITNESS.json'))
          assert f['pass'] is True,f
          PY
