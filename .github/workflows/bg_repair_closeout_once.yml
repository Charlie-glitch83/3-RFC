* Only after `H_F_to_G_v2` is frozen may G bind its recombination-network and visibility solvers, execute the nonequilibrium history, opacity/optical-depth law, visibility surface, covariance, restart/replay and independent reconstruction.\n\n## Preservation\n\nExisting B-F `MINIMAL_SPINE` runs remain immutable lower-fidelity evidence. The prior G obstruction attempt remains preserved as a source-recovery failure. No public target values, remembered standard coefficients, or historical proxy scores may generate the superseding lineage.\n'''
          Path('recovery/BG_SUPERSEDING_LINEAGE_PACKET.md').write_text(packet)
          close=f'''# B-G source-lineage repair closeout\n\n**Result: PASS — repair closed; science replay resumes under the active G work unit.**\n\nA full path/hash scan of every tracked repository file was completed before modification. The root cause was not a missing scientific idea: `docs/18_SOURCE_RECOVERY_MAP.md` says prior formal A-M laws default to `REPLAY_REQUIRED`, while REC-040 intentionally recovered only five Module-L objects. The later B-F runs then froze legitimate but reduced `MINIMAL_SPINE` substitutes, and the first G attempt treated the reduced F handoff as source-exhaustive.\n\nThe repair recovered **{len(m['objects'])}** exact B-G formal/repair/verification/handoff objects from `Charlie-glitch83/2-RFC@{m['source_commit']}`, verified every byte against `recovery/LINEAGE_CROSSWALK.json`, registered them as `REPLAY_REQUIRED`, and inherited no old PASS. The prior G attempt was closed as `BLOCKED / SUPERSEDED ATTEMPT` with no primary G execution and no scientific G obstruction claim. The two run-local authority upgrades were corrected back to their global `INTERPRETIVE_SYNTHESIS` classification.\n\nExisting B-F frozen runs were **not overwritten**. They remain valid at their declared lower-fidelity scope. A fresh governed G run has been started, but G primary execution is explicitly unauthorized until the recovered science is replayed sequentially B->C->D->E->F into a versioned child-ready `H_F_to_G_v2`.\n\nA small controller guard now prevents future module PASS closeout unless every `recipe.json.required_outputs` item has explicit semantic/hash evidence and run-local source classifications agree with the global source registry. This is a guardrail against another reduced substitute being frozen as a complete module; it does not replace scientific derivation.\n\n## Strongest supported repair claim\n\nThe previous G source-exhaustion/underdetermination conclusion is false. The repository now contains the exact recoverable B-G theorem lineage needed