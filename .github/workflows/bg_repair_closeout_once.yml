      - name: Read and hash every tracked plus newly generated file after repair
        run: |
          python - <<'PY'
          import hashlib,json,subprocess
          from datetime import datetime,timezone
          from pathlib import Path
          paths=set(subprocess.check_output(['git','ls-files']).decode().splitlines())
          for p in subprocess.check_output(['git','ls-files','--others','--exclude-standard']).decode().splitlines(): paths.add(p)
          rows=[]
          for rel in sorted(x for x in paths if x):
              p=Path(rel)
              if not p.is_file(): continue
              data=p.read_bytes(); rows.append({'path':rel,'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data)})
          out={'schema_version':'1.0','snapshot':'POST_REPAIR_PRE_COMMIT','branch':'agent/frontier-050-execution','base_git_head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'scanned_utc':datetime.now(timezone.utc).isoformat(),'file_count':len(rows),'read_errors':[],'files':rows}
          Path('audit/REPOSITORY_FULL_SCAN_20260808_POST_REPAIR.json').write_text(json.dumps(out,indent=2)+'\n')
          PY

