name: B-G Source-Lineage Repair Closeout Once

on:
  push:
    branches:
      - agent/frontier-050-execution
    paths:
      - '.github/bg-repair-closeout-trigger.txt'

permissions:
  contents: write

concurrency:
  group: bg-source-lineage-repair-closeout
  cancel-in-progress: false

jobs:
  repair-closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install frozen repository dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-lock.txt

      - name: Verify exact repair frontier
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          s=json.load(open('STATE.json'))
          assert s['active_work_unit']=='G-160',s
          assert s['current_module']=='G',s
          assert s['current_run']=='G-160-20260808T021341Z',s
          assert s['modules']['B']['evidence_state']=='FROZEN' and s['modules']['B']['fidelity']=='MINIMAL_SPINE'
          assert s['modules']['F']['evidence_state']=='FROZEN' and s['modules']['F']['fidelity']=='MINIMAL_SPINE'
          p=Path('modules/F/frozen/H_F_to_G.json')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='bc996dc35f7cf1c2bafc3523133c1470dd9184f4ebff97f5e94b0f0fe1840154'
          r=json.load(open('modules/G/runs/G-160-20260808T021341Z/run.json'))
          assert r['status']=='CREATED',r
          PY

      - name: Read and hash every tracked repository file before repair
        run: |
          python - <<'PY'
          import hashlib,json,subprocess,zipfile
          from datetime import datetime,timezone
          from pathlib import Path
          files=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          files=[x for x in files if x]
          rows=[]
          for rel in files:
              p=Path(rel); data=p.read_bytes()
              rec={'path':rel,'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data)}
              try:
                  txt=data.decode('utf-8')
                  rec['kind']='TEXT'; rec['lines']=txt.count('\n')+(0 if not txt or txt.endswith('\n') else 1)
              except UnicodeDecodeError:
                  rec['kind']='BINARY'
              if zipfile.is_zipfile(p):
                  with zipfile.ZipFile(p) as z:
                      rec['zip_members']=len(z.infolist())
              rows.append(rec)
          out={'schema_version':'1.0','snapshot':'PRE_REPAIR','branch':'agent/frontier-050-execution','git_head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'scanned_utc':datetime.now(timezone.utc).isoformat(),'tracked_file_count':len(rows),'read_errors':[],'files':rows}
          Path('audit/REPOSITORY_FULL_SCAN_20260808_PRE_REPAIR.json').write_text(json.dumps(out,indent=2)+'\n')
          Path('audit/REPOSITORY_FULL_SCAN_20260808.md').write_text('# Full repository pre-repair scan — 2026-08-08\n\nEvery tracked file on `agent/frontier-050-execution` was opened as bytes and SHA-256 inventoried before the B-G repair. Text files were decoded and line-counted where UTF-8; binary files were hashed; ZIPs were opened and member-counted. This machine inventory complements the file-by-file semantic soak that preceded the repair.\n\n- tracked files scanned: `%d`\n- read errors: `0`\n- pre-repair Git head: `%s`\n\nSee `audit/REPOSITORY_FULL_SCAN_20260808_PRE_REPAIR.json` for the complete path/hash inventory.\n' % (len(rows),out['git_head']))
          PY

      - name: Recover exact B-G formal science as replay-required candidates
        run: |
          rm -rf /tmp/2-RFC
          git clone --quiet https://github.com/Charlie-glitch83/2-RFC.git /tmp/2-RFC
          git -C /tmp/2-RFC checkout --quiet --detach b0f21d023f64ce9c70fd4755dfdbb7357b9f7a10
          python - <<'PY'
          import hashlib,json,shutil
          from datetime import datetime,timezone
          from pathlib import Path
          SRC=Path('/tmp/2-RFC')
          COMMIT='b0f21d023f64ce9c70fd4755dfdbb7357b9f7a10'
          DEST=Path('recovery/admitted/2-RFC')/COMMIT
          cross=json.load(open('recovery/LINEAGE_CROSSWALK.json'))
          def flatten(x):
              if isinstance(x,dict):
                  if all(k in x for k in ('repository','commit','path','sha256')):
                      yield x
                  for v in x.values(): yield from flatten(v)
              elif isinstance(x,list):
                  for v in x: yield from flatten(v)
          records=list(flatten(cross))
          bykey={(r['repository'],r['commit'],r['path']):r for r in records}
          module_prefixes=tuple(f'modules/{m}/' for m in 'BCDEFG')
          proofs={
            'proofs/GENESIS_REALIZATION.md','proofs/MICROSCOPIC_CONSTITUTION.md','proofs/THERMAL_EVOLUTION.md',
            'proofs/PRIMORDIAL_NUCLEOSYNTHESIS.md','proofs/POST_NUCLEAR_PERSISTENCE.md','proofs/NONEQUILIBRIUM_RECOMBINATION.md'}
          science={
            'science/PHYSICAL_REALIZATION.md','science/MICROSCOPIC_PHYSICS.md','science/THERMAL_EVOLUTION.md',
            'science/PRIMORDIAL_NUCLEOSYNTHESIS.md','science/POST_NUCLEAR_PLASMA.md','science/NONEQUILIBRIUM_RECOMBINATION.md'}
          architecture={
            'architecture/2RFC_DETAILED_SCIENTIFIC_GAP_TO_LIBRARY_REPAIR_PLAN.md',
            'architecture/2RFC_MANUSCRIPT_SOURCE_TRACEABILITY_RULES.md',
            'architecture/2RFC_WOLFRAM_INTEGRATION_RULES.md'}
          chosen=[]
          for r in records:
              if r['repository']!='Charlie-glitch83/2-RFC' or r['commit']!=COMMIT: continue
              p=r['path']
              if p.startswith(module_prefixes) or p in proofs or p in science or p in architecture:
                  if (SRC/p).is_file(): chosen.append(r)
          if not chosen:
              raise SystemExit('HARD STOP: no B-G crosswalked source objects selected')
          objects=[]
          chosen_paths=set()
          for r in sorted(chosen,key=lambda x:x['path']):
              rel=r['path']; chosen_paths.add(rel); src=SRC/rel
              digest=hashlib.sha256(src.read_bytes()).hexdigest()
              if digest!=r['sha256']: raise SystemExit(f'HARD STOP source hash mismatch {rel}')
              dst=DEST/rel; dst.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(src,dst)
              if hashlib.sha256(dst.read_bytes()).hexdigest()!=digest: raise SystemExit(f'HARD STOP copied hash mismatch {rel}')
              objects.append({'repository':'Charlie-glitch83/2-RFC','commit':COMMIT,'path':rel,'sha256':digest,'bytes':src.stat().st_size,'classification':'REPLAY_REQUIRED','prior_crosswalk_classification':r.get('classification'),'reason':'Recovered as exact formal/repair/verification/handoff candidate under docs/18 default disposition. No historical PASS, physical execution state, or empirical claim is inherited.'})
          discoveries=[]
          for p in SRC.rglob('*'):
              if not p.is_file(): continue
              rel=p.relative_to(SRC).as_posix()
              if not rel.startswith(module_prefixes): continue
              if ('Enhancement' in p.name or 'REPAIR' in p.name.upper() or 'HANDOFF' in p.name.upper()) and rel not in chosen_paths and ('Charlie-glitch83/2-RFC',COMMIT,rel) not in bykey:
                  discoveries.append({'path':rel,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'classification':'DISCOVERED_UNCROSSWALKED_REVIEW_REQUIRED','used_for_generation':False})
          manifest={'schema_version':'1.0','object_id':'BG_REPLAY_CANDIDATE_MANIFEST','status':'EXACT_BYTES_RECOVERED_REPLAY_REQUIRED','source_repository':'Charlie-glitch83/2-RFC','source_commit':COMMIT,'authority_rule':'P29, revised N-body, P30, live 3-RFC module specs/recipes and exact executed parents remain controlling. These objects may be replayed and rederived; their old status words are not inherited.','objects':objects,'uncrosswalked_discoveries':discoveries,'recovered_utc':datetime.now(timezone.utc).isoformat()}
          Path('recovery/BG_REPLAY_CANDIDATE_MANIFEST.json').write_text(json.dumps(manifest,indent=2)+'\n')
          registry_path=Path('memory/SOURCE_REGISTRY.json'); registry=json.load(open(registry_path)); existing={(x.get('sha256'),x.get('frozen_path')) for x in registry.get('sources',[])}
          stamp=datetime.now(timezone.utc).isoformat()
          for x in objects:
              fp=(DEST/x['path']).as_posix(); key=(x['sha256'],fp)
              if key in existing: continue
              registry.setdefault('sources',[]).append({'label':'2-RFC replay candidate: '+x['path'],'sha256':x['sha256'],'bytes':x['bytes'],'classification':'REPLAY_REQUIRED','origin':f"Charlie-glitch83/2-RFC@{COMMIT}:{x['path']}",'frozen_path':fp,'admitted_utc':stamp,'admitted_by_work_unit':'G-160_SOURCE_LINEAGE_REPAIR','replay_rule':'Exact bytes only; fresh 3-RFC derivation/replay required; historical PASS not inherited.'})
              existing.add(key)
          registry_path.write_text(json.dumps(registry,indent=2)+'\n')
          print(json.dumps({'recovered_objects':len(objects),'uncrosswalked_discoveries':len(discoveries)},indent=2))
          PY

      - name: Close the false G obstruction as a source-lineage defect
        run: |
          python - <<'PY'
          import json,shutil
          from datetime import datetime,timezone
          from pathlib import Path
          R=Path('modules/G/runs/G-160-20260808T021341Z')
          for src,dst in [('SOURCE_REGISTER.json','SOURCE_REGISTER_PRE_REPAIR.json'),('GATE_RESULTS.json','GATE_RESULTS_PRE_REPAIR.json'),('CLOSEOUT.md','CLOSEOUT_PRE_REPAIR.md')]:
              if not (R/dst).exists(): shutil.copy2(R/src,R/dst)
          reg=json.load(open('memory/SOURCE_REGISTRY.json'))
          global_classes={}
          for x in reg.get('sources',[]):
              if x.get('sha256') and x.get('classification'): global_classes.setdefault(x['sha256'],set()).add(x['classification'])
          src=json.load(open(R/'SOURCE_REGISTER.json')); corrections=[]
          for bucket in ('admitted_sources','procedure_only_sources','replay_required_sources','sources'):
              for rec in src.get(bucket,[]):
                  sha=rec.get('sha256'); local=rec.get('classification')
                  if sha in global_classes and len(global_classes[sha])==1:
                      canonical=next(iter(global_classes[sha]))
                      if local and local!=canonical:
                          corrections.append({'path':rec.get('path'),'sha256':sha,'from':local,'to':canonical})
                          rec['classification']=canonical
          src['status']='CLOSED_SOURCE_LINEAGE_DEFECT_SUPERSEDED'
          src['repair_note']='The prior underdetermination conclusion is not a scientific G obstruction. REC-040 recovered Module L only, while docs/18 marks prior formal A-M laws REPLAY_REQUIRED by default. Exact B-G formal science has now been recovered for fresh replay. The current F MINIMAL_SPINE handoff remains valid lower-fidelity evidence but is not exhaustive of the recoverable theorem lineage.'
          src['source_classification_corrections']=corrections
          (R/'SOURCE_REGISTER.json').write_text(json.dumps(src,indent=2)+'\n')
          ledger={'schema_version':'1.0','run_id':R.name,'classification':'FALSE_OBSTRUCTION_SOURCE_RECOVERY_REPAIR','timestamp_utc':datetime.now(timezone.utc).isoformat(),'scientific_failure':False,'primary_execution_performed':False,'root_causes':['REC-040 was explicitly scoped to recover five Module-L objects and did not replay B-G formal science.','The live B-F executions closed MINIMAL_SPINE substitutes while several recipe/spec required child-ready objects were omitted.','The G attempt treated the reduced H_F_to_G as exhaustive of all recoverable source science.','Two globally INTERPRETIVE_SYNTHESIS audit documents were locally upgraded to ADMITTED_SOURCE.'],'corrections':corrections,'preservation':['Original source register, gates and closeout copied verbatim to *_PRE_REPAIR files.','All B-F frozen MINIMAL_SPINE runs remain unchanged as valid lower-fidelity evidence.','No historical B-G PASS state is inherited.'],'required_next_science':'Fresh versioned B->C->D->E->F theorem replay from exact recovered objects, producing a superseding child-ready F->G parent before any G primary recombination/visibility execution.'}
          (R/'REPAIR_LEDGER.json').write_text(json.dumps(ledger,indent=2)+'\n')
          gates={'run_id':R.name,'overall':'BLOCKED','classification':'SOURCE_LINEAGE_RECOVERY_DEFECT_SUPERSEDED','scientific_G_obstruction_established':False,'primary_execution_performed':False,'componentwise':{'source admission and parent completeness':{'pass':False,'status':'REPAIR_REQUIRED','reason':'The attempt did not admit/replay the exact prior B-G formal derivation corpus and therefore could not lawfully conclude source-level absence.'},'G physical solver execution':{'pass':False,'status':'NOT_RUN','reason':'No primary G solver was authorized.'},'preservation of failed attempt':{'pass':True,'status':'PASS','reason':'Original obstruction evidence is retained verbatim in *_PRE_REPAIR files and existing obstruction records.'}}}
          (R/'GATE_RESULTS.json').write_text(json.dumps(gates,indent=2)+'\n')
          (R/'CLOSEOUT.md').write_text('# G-160 attempt closeout — source-lineage repair\n\n**Result:** `BLOCKED / SUPERSEDED ATTEMPT`, not a scientific failure of Module G.\n\nThe original run never executed the recombination or visibility solvers. Its hard stop was produced after treating the reduced `H_F_to_G` MINIMAL_SPINE handoff as exhaustive and after the repository had recovered only Module-L objects from the older 2-RFC lineage. The repository recovery map explicitly says old formal A-M laws default to `REPLAY_REQUIRED`; those B-G objects had not been replayed here.\n\nA full repository scan and exact 2-RFC recovery now show that the stronger B-G theorem lineage contains the missing upstream responsibilities: B four-sector genesis; C charge/symmetry/photon/neutrino/nucleon and rate-generating law; D thermal/transport evolution; E nuclear-ready trajectories; F plasma/radiation/opacity/recombination-entry state; and G nonequilibrium recombination/visibility construction. Those old status words are **not inherited**. They are exact replay candidates that must be rederived in a versioned superseding lineage.\n\nThe current B-F MINIMAL_SPINE runs remain frozen and valid at their declared lower-fidelity scope. Their omission of child-critical objects cannot be used to erase the stronger recoverable science.\n\n**Strongest supported repair claim:** the previous G underdetermination conclusion is invalid as a source-exhaustion claim because the required B-G formal corpus was never admitted/replayed in the active 3-RFC lineage.\n\n**Still unsupported:** a new 3-RFC physical recombination/visibility result. That requires fresh B->F replay and a superseding `H_F_to_G` before G primary execution.\n')
          PY
          python tools/rfc.py close-run --run-id G-160-20260808T021341Z --result BLOCKED --closeout modules/G/runs/G-160-20260808T021341Z/CLOSEOUT.md

      - name: Install one scientific-output completeness and source-class guard
        run: |
          cat > tools/scientific_completion_guard.py <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations
          import argparse,hashlib,json
          from pathlib import Path
          ROOT=Path(__file__).resolve().parents[1]
          def load(p): return json.loads(Path(p).read_text(encoding='utf-8'))
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          def validate_source_classes(run: Path):
              errors=[]; srcp=run/'SOURCE_REGISTER.json'
              if not srcp.exists(): return ['missing SOURCE_REGISTER.json']
              src=load(srcp); reg=load(ROOT/'memory/SOURCE_REGISTRY.json')
              classes={}
              for x in reg.get('sources',[]):
                  if x.get('sha256') and x.get('classification'): classes.setdefault(x['sha256'],set()).add(x['classification'])
              for bucket in ('admitted_sources','procedure_only_sources','replay_required_sources','sources'):
                  for rec in src.get(bucket,[]):
                      digest=rec.get('sha256'); local=rec.get('classification')
                      if digest in classes and local and local not in classes[digest]: errors.append(f"source classification drift {digest}: run-local {local} vs global {sorted(classes[digest])}")
              return errors
          def evidence_path(run: Path, rel: str):
              a=(ROOT/rel).resolve()
              if a.exists() and (a==ROOT or ROOT in a.parents): return a
              b=(run/rel).resolve()
              if b.exists() and ROOT in b.parents: return b
              return None
          def validate_required_outputs(run: Path):
              meta=load(run/'run.json'); mod=meta.get('module')
              modules=set(load(ROOT/'config/module_graph.json').get('module_order',[]))
              if mod not in modules: return []
              recipe=load(ROOT/'recipes'/mod/'recipe.json'); expected=recipe.get('required_outputs',[])
              p=run/'OUTPUT_COMPLETENESS.json'
              if not p.exists(): return ['PASS requires OUTPUT_COMPLETENESS.json']
              doc=load(p); errors=[]
              if doc.get('run_id')!=meta.get('run_id'): errors.append('OUTPUT_COMPLETENESS run_id mismatch')
              if doc.get('module')!=mod: errors.append('OUTPUT_COMPLETENESS module mismatch')
              if doc.get('overall')!='PASS': errors.append('OUTPUT_COMPLETENESS overall must be PASS')
              rows=doc.get('required_outputs',[]); by={r.get('requirement'):r for r in rows if isinstance(r,dict) and r.get('requirement')}
              if set(by)!=set(expected):
                  missing=[x for x in expected if x not in by]; extra=[x for x in by if x not in expected]
                  if missing: errors.append(f'missing required outputs: {missing}')
                  if extra: errors.append(f'unexpected required outputs: {extra}')
              for req in expected:
                  r=by.get(req)
                  if not r: continue
                  if r.get('status')!='PASS': errors.append(f'required output not PASS: {req}')
                  if len(str(r.get('semantic_check','')).strip())<20: errors.append(f'missing substantive semantic_check: {req}')
                  ev=r.get('evidence',[])
                  if not isinstance(ev,list) or not ev: errors.append(f'no evidence for required output: {req}'); continue
                  for item in ev:
                      if isinstance(item,str): rel=item; declared=None
                      elif isinstance(item,dict): rel=item.get('path'); declared=item.get('sha256')
                      else: errors.append(f'invalid evidence record for {req}'); continue
                      if not rel: errors.append(f'evidence path missing for {req}'); continue
                      ep=evidence_path(run,rel)
                      if ep is None or not ep.is_file(): errors.append(f'evidence file missing for {req}: {rel}'); continue
                      if declared and sha(ep)!=declared: errors.append(f'evidence hash mismatch for {req}: {rel}')
              return errors
          def validate(run: Path): return validate_source_classes(run)+validate_required_outputs(run)
          def main():
              ap=argparse.ArgumentParser(); ap.add_argument('--run',required=True); args=ap.parse_args(); run=(ROOT/args.run).resolve()
              if ROOT not in run.parents: raise SystemExit('run must be inside repository')
              errors=validate(run)
              if errors:
                  print('SCIENTIFIC COMPLETION GUARD: FAIL')
                  for e in errors: print('- '+e)
                  return 1
              print('SCIENTIFIC COMPLETION GUARD: PASS')
              return 0
          if __name__=='__main__': raise SystemExit(main())
          PY
          chmod +x tools/scientific_completion_guard.py
          cat > templates/OUTPUT_COMPLETENESS.json <<'EOF'
          {
            "schema_version": "1.0",
            "run_id": "",
            "module": "",
            "overall": "DRAFT",
            "required_outputs": []
          }
          EOF
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/rfc.py'); text=p.read_text()
          if 'import subprocess\n' not in text:
              text=text.replace('import shutil\n','import shutil\nimport subprocess\n',1)
          old='"CHECKPOINT_RECORD.json", "GENERATED_OUTPUT_MANIFEST.json", "REPLAY_RECORD.json",'
          new='"CHECKPOINT_RECORD.json", "GENERATED_OUTPUT_MANIFEST.json", "OUTPUT_COMPLETENESS.json", "REPLAY_RECORD.json",'
          if old in text: text=text.replace(old,new,1)
          elif '"OUTPUT_COMPLETENESS.json"' not in text: raise SystemExit('HARD STOP new-run template list not found')
          old_docs='"REPLAY_RECORD.json", "CHECKPOINT_RECORD.json", "GENERATED_OUTPUT_MANIFEST.json",\n        "ENVIRONMENT.json"'
          new_docs='"REPLAY_RECORD.json", "CHECKPOINT_RECORD.json", "GENERATED_OUTPUT_MANIFEST.json", "OUTPUT_COMPLETENESS.json",\n        "ENVIRONMENT.json"'
          if old_docs in text: text=text.replace(old_docs,new_docs,1)
          marker='    if args.result == "PASS":\n        gate_path = path / "GATE_RESULTS.json"\n'
          inject='    if args.result == "PASS":\n        guard = subprocess.run([sys.executable, str(ROOT / "tools/scientific_completion_guard.py"), "--run", str(path.relative_to(ROOT))])\n        if guard.returncode != 0:\n            print("PASS rejected by scientific completion/source-class guard", file=sys.stderr)\n            return 2\n\n    if args.result == "PASS":\n        gate_path = path / "GATE_RESULTS.json"\n'
          if marker in text: text=text.replace(marker,inject,1)
          elif 'PASS rejected by scientific completion/source-class guard' not in text: raise SystemExit('HARD STOP close-run PASS marker not found')
          p.write_text(text)
          PY
          cat > tests/test_scientific_completion_guard.py <<'PY'
          import importlib.util,json,unittest
          from pathlib import Path
          ROOT=Path(__file__).resolve().parents[1]
          spec=importlib.util.spec_from_file_location('scientific_completion_guard',ROOT/'tools/scientific_completion_guard.py')
          guard=importlib.util.module_from_spec(spec); spec.loader.exec_module(guard)
          class GuardTests(unittest.TestCase):
              def test_repaired_g_source_register_does_not_upgrade_global_source_classes(self):
                  run=ROOT/'modules/G/runs/G-160-20260808T021341Z'
                  self.assertEqual(guard.validate_source_classes(run),[])
              def test_output_template_is_draft(self):
                  doc=json.loads((ROOT/'templates/OUTPUT_COMPLETENESS.json').read_text())
                  self.assertEqual(doc['overall'],'DRAFT')
                  self.assertEqual(doc['required_outputs'],[])
              def test_close_run_is_wired_to_guard(self):
                  text=(ROOT/'tools/rfc.py').read_text()
                  self.assertIn('scientific_completion_guard.py',text)
                  self.assertIn('OUTPUT_COMPLETENESS.json',text)
          if __name__=='__main__': unittest.main()
          PY

      - name: Start a fresh governed G run by the repository startup protocol
        run: |
          bash bootstrap.sh
          bash tools/start_work.sh
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.load(open('STATE.json')); rid=s['current_run']
          assert rid and rid.startswith('G-160-') and rid!='G-160-20260808T021341Z',s
          r=Path('modules/G/runs')/rid
          assert (r/'OUTPUT_COMPLETENESS.json').exists(),r
          print(rid)
          PY

      - name: Bind the fresh G run to the repaired replay prerequisite without executing G physics
        run: |
          python - <<'PY'
          import hashlib,json
          from datetime import datetime,timezone
          from pathlib import Path
          s=json.load(open('STATE.json')); rid=s['current_run']; R=Path('modules/G/runs')/rid
          recovery=json.load(open('recovery/BG_REPLAY_CANDIDATE_MANIFEST.json'))
          srcreg=json.load(open('memory/SOURCE_REGISTRY.json'))
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          parent='modules/F/frozen/H_F_to_G.json'
          replay=[{'label':'replay candidate '+x['path'],'path':f"recovery/admitted/2-RFC/{recovery['source_commit']}/{x['path']}",'sha256':x['sha256'],'classification':'REPLAY_REQUIRED','role':'SUPERCEDING_B_TO_G_FORMAL_LINEAGE_REPLAY_INPUT'} for x in recovery['objects']]
          source={
            'schema_version':'1.0','run_id':rid,'status':'RECOVERED_SOURCE_LINEAGE_READY_FOR_SUPERSEDING_PARENT_REPLAY','generation_mode':'GENERATION_SEALED',
            'exact_parents':[{'object_id':'H_F_to_G','path':parent,'sha256':sha(parent),'role':'CURRENT_EXECUTED_MINIMAL_SPINE_ANCESTRY_NOT_EXHAUSTIVE_PARENT'}],
            'admitted_sources':[
              {'label':'Triadic emergence and theorem architecture','path':'sources/frozen/cef6d68b05eb509e471c55a18b5fffedd9c411b44bc0d5bd0f6b5ee86bd8b53e/Presentation 29 revised  raw LaTeX.md','sha256':'cef6d68b05eb509e471c55a18b5fffedd9c411b44bc0d5bd0f6b5ee86bd8b53e','classification':'CANONICAL_AUTHORITY'},
              {'label':'Revised triadic N-body proof','path':'sources/frozen/0eb5e85475e9f3ab7242ee35c359b063ea62a4e66fa7124b9f6ccad41141ab28/A_Triadic_Solution_to_the_General_N_Body_Problem_Revised.pdf','sha256':'0eb5e85475e9f3ab7242ee35c359b063ea62a4e66fa7124b9f6ccad41141ab28','classification':'CANONICAL_AUTHORITY'},
              {'label':'Universe architecture and full ledger','path':'sources/frozen/4895c3777da3aa84da4ec2343419ffbc07502b3738602308a1f402862441eaf6/Presentation 30 raw LaTex.md','sha256':'4895c3777da3aa84da4ec2343419ffbc07502b3738602308a1f402862441eaf6','classification':'CANONICAL_AUTHORITY'}],
