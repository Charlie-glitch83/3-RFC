          with open('memory/FAILURE_LOG.jsonl','a') as f:
              f.write(json.dumps({'failure_id':'G-160-FALSE-OBSTRUCTION-SOURCE-RECOVERY-20260808','run_id':'G-160-20260808T021341Z','gate':'source admission and parent completeness','category':'SOURCE_RECOVERY_LINEAGE_DEFECT','description':'G was stopped after treating a reduced MINIMAL_SPINE F handoff as exhaustive even though the repository recovery map marked prior formal A-M science REPLAY_REQUIRED and REC-040 recovered only Module L.','earliest_affected_object':'B->C sector/microscopic handoff completeness','changes_frozen_science':False,'required_replay_scope':'versioned B->C->D->E->F->G superseding lineage','strongest_claim_remaining':'Current B-F runs remain valid at lower-fidelity scope; exact stronger B-G theorem corpus is recovered for replay, not inherited as PASS.','timestamp_utc':datetime.now(timezone.utc).isoformat()})+'\n')
