          Path('recovery/BG_REPAIR_CLOSEOUT.md').write_text(close)
          Path('recovery/BG_REPAIR_CLOSEOUT.json').write_text(json.dumps({'schema_version':'1.0','status':'PASS','repair':'B-G source-lineage recovery and false G obstruction closeout','recovered_objects':len(m['objects']),'old_g_attempt':'G-160-20260808T021341Z','old_g_attempt_result':'BLOCKED_SUPERSEDED_SOURCE_LINEAGE_DEFECT','historical_pass_inherited':False,'b_f_frozen_runs_overwritten':False,'new_active_run':json.load(open('STATE.json'))['current_run'],'primary_G_execution_authorized':False,'next_science':'recovery/BG_SUPERSEDING_LINEAGE_PACKET.md'},indent=2)+'\n')
          with open('memory/DECISION_LOG.jsonl','a') as f:
