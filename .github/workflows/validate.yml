name: Validate 3-RFC Repository

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write

jobs:
  validate:
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements-lock.txt
      - run: python tools/rfc.py doctor
      - run: python -m unittest discover -s tests -v
      - run: python tools/rfc.py firewall-scan

  finalize_boot:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.number == 1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements-lock.txt
      - name: Apply formal closeout
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/finalize_boot_cleanup.py
      - run: python tools/rfc.py doctor
      - run: python tools/director.py doctor
      - run: python -m unittest discover -s tests -v
      - run: python tools/rfc.py firewall-scan
      - name: Commit formal closeout
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add STATE.json WORK_QUEUE.json memory runs/BOOT-000 tests/test_repository.py tools/rfc.py work_packets/ACTIVE_WORK_PACKET.md
          git commit -m 'Close BOOT-000 and activate source admission'
          git push origin main
      - name: Delete temporary branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -c "import tools.finalize_boot_cleanup as m; m.delete_temp_branches()"
