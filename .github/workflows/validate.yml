name: Validate 3-RFC Repository

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements-lock.txt
      - run: python tools/rfc.py doctor
      - run: python -m unittest discover -s tests -v
      - run: python tools/rfc.py firewall-scan

  reconcile-a100-queue:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/a100-queue-reconcile-v3'
    runs-on: ubuntu-latest
    env:
      BRANCH: agent/frontier-050-execution
      EVIDENCE_COMMIT: b6280513dc47339ddf024be6275817d3f38a9d39
      HANDOFF_SHA256: 728caf8c049d0114caef6f7b36af00065a32b4dc5f4faad02c6b9bcb16c933e7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements-lock.txt
      - name: Reconcile and verify governed queue
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$EVIDENCE_COMMIT^{commit}"
          test "$(sha256sum modules/A/frozen/H_A_to_B.json | awk '{print $1}')" = "$HANDOFF_SHA256"
          python - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path('STATE.json').read_text())
          assert state['active_work_unit']=='B-110'
          assert state['current_module']=='B'
          assert state['current_run'] is None
          assert state['modules']['A']['evidence_state']=='FROZEN'
          assert state['modules']['A']['fidelity']=='PRODUCTION'
          assert 'b6280513dc47339ddf024be6275817d3f38a9d39' in Path('modules/A/runs/A-100-20260806T173458Z/CLOSEOUT.md').read_text()
          p=Path('WORK_QUEUE.json'); q=json.loads(p.read_text())
          for item in q['items']:
              if item['id']=='A-100': item['status']='PASS'
              elif item['id']=='B-110': item['status']='ACTIVE'
              elif item['status']=='ACTIVE': raise AssertionError(item['id'])
          assert [x['id'] for x in q['items'] if x['status']=='ACTIVE']==['B-110']
          assert next(x for x in q['items'] if x['id']=='FRONTIER-050')['status']=='PASS'
          p.write_text(json.dumps(q,indent=2)+'\n')
          PY
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
          python tools/rfc.py context
      - name: Commit queue only, clean generated refresh, rebase, push, and verify
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add WORK_QUEUE.json
          git commit -m 'Reconcile A-100 queue and authorize B-110'
          git restore .
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          FINAL_SHA=$(git rev-parse HEAD)
          git push origin HEAD:"$BRANCH"
          REMOTE_SHA=$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')
          test "$REMOTE_SHA" = "$FINAL_SHA"
          echo "Verified queue reconciliation commit: $FINAL_SHA"
