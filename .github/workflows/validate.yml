name: Validate 3-RFC Repository

on:
  push:
  pull_request:

permissions:
  contents: write

concurrency:
  group: 3rfc-a100-closeout-repair
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name != 'push' || github.event.head_commit.message != 'Trigger final A-100 archival reconciliation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements-lock.txt
      - run: python tools/rfc.py doctor
      - run: python -m unittest discover -s tests -v
      - run: python tools/rfc.py firewall-scan

  reconcile-a100-archive:
    if: github.event_name == 'push' && github.event.head_commit.message == 'Trigger final A-100 archival reconciliation'
    runs-on: ubuntu-latest
    env:
      BRANCH: agent/frontier-050-execution
      A_RUN_ID: A-100-20260806T173458Z
      B_RUN_ID: B-110-20260807T002248Z
      EVIDENCE_COMMIT: b6280513dc47339ddf024be6275817d3f38a9d39
      HANDOFF_SHA256: 728caf8c049d0114caef6f7b36af00065a32b4dc5f4faad02c6b9bcb16c933e7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements-lock.txt
      - name: Reconcile A-100 archival records without altering frozen science
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$EVIDENCE_COMMIT" HEAD
          test "$(sha256sum modules/A/frozen/H_A_to_B.json | awk '{print $1}')" = "$HANDOFF_SHA256"
          python - <<'PY'
          import importlib.util, json, os
          from pathlib import Path

          root = Path.cwd()
          a_run_id = os.environ['A_RUN_ID']
          b_run_id = os.environ['B_RUN_ID']
          a_path = root / 'modules/A/runs' / a_run_id
          b_path = root / 'modules/B/runs' / b_run_id

          state = json.loads((root/'STATE.json').read_text())
          queue = json.loads((root/'WORK_QUEUE.json').read_text())
          assert state['active_work_unit'] == 'B-110'
          assert state['current_module'] == 'B'
          assert state['current_run'] == b_run_id
          assert state['modules']['A']['evidence_state'] == 'FROZEN'
          assert state['modules']['A']['fidelity'] == 'PRODUCTION'
          assert state['modules']['A']['active_run'] is None
          assert state['modules']['B']['active_run'] == b_run_id
          statuses = {x['id']: x['status'] for x in queue['items']}
          assert statuses['A-100'] == 'PASS' and statuses['B-110'] == 'ACTIVE'
          assert [x['id'] for x in queue['items'] if x['status'] == 'ACTIVE'] == ['B-110']
          assert json.loads((b_path/'run.json').read_text())['status'] == 'CREATED'

          closeout = a_path/'CLOSEOUT.md'
          text = closeout.read_text()
          assert os.environ['EVIDENCE_COMMIT'] in text
          assert 'PENDING_EVIDENCE_COMMIT' not in text
          closed_utc = state['modules']['A']['evidence_history'][1]['timestamp_utc']

          run_json_path = a_path/'run.json'
          run_json = json.loads(run_json_path.read_text())
          run_json['status'] = 'PASS'
          run_json['closed_utc'] = closed_utc
          run_json['closeout'] = str(closeout.relative_to(root))
          run_json_path.write_text(json.dumps(run_json, indent=2) + '\n')

          spec = importlib.util.spec_from_file_location('rfc_cli', root/'tools/rfc.py')
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          digest = mod.sha256_tree(a_path)

          idx_path = root/'memory/RUN_INDEX.json'
          idx = json.loads(idx_path.read_text())
          rec = next(x for x in idx['runs'] if x['run_id'] == a_run_id)
          rec.update({'status':'PASS','closed_utc':closed_utc,'tree_sha256':digest,'closeout':str(closeout.relative_to(root))})
          idx_path.write_text(json.dumps(idx, indent=2) + '\n')

          reg_path = root/'memory/ARTIFACT_REGISTRY.json'
          reg = json.loads(reg_path.read_text())
          artifact = {'path':str(a_path.relative_to(root)),'sha256':digest,'kind':'RUN_BUNDLE','created_utc':closed_utc,'work_unit':'A-100','run_id':a_run_id}
          reg['artifacts'] = [x for x in reg.get('artifacts',[]) if not (x.get('kind')=='RUN_BUNDLE' and x.get('run_id')==a_run_id)]
          reg['artifacts'].append(artifact)
          reg_path.write_text(json.dumps(reg, indent=2) + '\n')
          print('canonical_a100_run_tree_sha256=' + digest)
          PY
      - name: Verify complete repository state
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'B-110' work_packets/ACTIVE_WORK_PACKET.md
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
          python tools/rfc.py context
          python - <<'PY'
          import json, os
          s=json.load(open('STATE.json')); q=json.load(open('WORK_QUEUE.json'))['items']
          a=json.load(open(f"modules/A/runs/{os.environ['A_RUN_ID']}/run.json"))
          b=json.load(open(f"modules/B/runs/{os.environ['B_RUN_ID']}/run.json"))
          idx=json.load(open('memory/RUN_INDEX.json'))['runs']
          reg=json.load(open('memory/ARTIFACT_REGISTRY.json'))['artifacts']
          assert s['active_work_unit']=='B-110' and s['current_module']=='B' and s['current_run']==os.environ['B_RUN_ID']
          assert [x['id'] for x in q if x['status']=='ACTIVE']==['B-110']
          assert next(x for x in q if x['id']=='A-100')['status']=='PASS'
          assert a['status']=='PASS' and b['status']=='CREATED'
          ar=next(x for x in idx if x['run_id']==os.environ['A_RUN_ID']); assert ar['status']=='PASS' and ar.get('tree_sha256')
          aa=next(x for x in reg if x.get('run_id')==os.environ['A_RUN_ID'] and x.get('kind')=='RUN_BUNDLE'); assert aa['sha256']==ar['tree_sha256']
          PY
      - name: Commit, push, and verify remote archival reconciliation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .a100_closeout_repair
          rm -f .github/a100-closeout-repair-trigger.txt .github/a100-admin-repair-trigger.txt .github/a100-finalize-trigger.txt .github/a100-finalize-v2-trigger.txt .github/a100-finalize-v3-trigger.txt .github/a100-finalize-v4-trigger.txt .github/a100-finalize-v5-trigger.txt .github/reconcile-a100-b110-trigger.txt .github/reconcile-a100-b110-v2-trigger.txt
          rm -f .github/workflows/finalize-a100*.yml .github/workflows/reconcile-a100-b110-once.yml .github/workflows/repair-a100-admin-closeout.yml .github/workflows/finalize-a100-closeout-retry.yml
          cat > .github/workflows/validate.yml <<'YAML'
          name: Validate 3-RFC Repository

          on:
            push:
            pull_request:

          jobs:
            validate:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with:
                    python-version: '3.11'
                    cache: pip
                - run: python -m pip install --disable-pip-version-check -r requirements-lock.txt
                - run: python tools/rfc.py doctor
                - run: python -m unittest discover -s tests -v
                - run: python tools/rfc.py firewall-scan
          YAML
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize Module A archival records and continue B-110'
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          FINAL_SHA=$(git rev-parse HEAD)
          git push origin HEAD:"$BRANCH"
          REMOTE_SHA=$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')
          test "$REMOTE_SHA" = "$FINAL_SHA"
          git diff-tree --no-commit-id --name-only -r "$FINAL_SHA" | tee /tmp/final-files.txt
          grep -qx 'modules/A/runs/A-100-20260806T173458Z/run.json' /tmp/final-files.txt
          grep -qx 'memory/RUN_INDEX.json' /tmp/final-files.txt
          grep -qx 'memory/ARTIFACT_REGISTRY.json' /tmp/final-files.txt
          echo "FINAL_SHA=$FINAL_SHA" >> "$GITHUB_STEP_SUMMARY"
