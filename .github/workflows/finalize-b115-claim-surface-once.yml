name: Finalize B-115 claim surface once

on:
  issue_comment:
    types: [created]

permissions:
  contents: write

jobs:
  finalize:
    if: >-
      github.event.issue.number == 65 &&
      github.event.issue.pull_request &&
      github.event.comment.user.login == 'Charlie-glitch83' &&
      github.event.comment.body == '/finalize-b115-claim-surface-20260808'
    runs-on: ubuntu-latest
    env:
      BRANCH: agent/frontier-050-execution
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements-lock.txt
      - name: Correct evidence-matched claim surface
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime,timezone
          from pathlib import Path
          s=json.load(open('STATE.json')); q={x['id']:x for x in json.load(open('WORK_QUEUE.json'))['items']}
          assert s['active_work_unit']=='C-125' and s['current_module']=='C' and s['current_run'] is None,s
          assert s['modules']['B']['evidence_state']=='FROZEN' and s['modules']['B']['fidelity']=='PRODUCTION',s['modules']['B']
          assert json.load(open('modules/B/runs/B-115-20260808T060000Z/run.json'))['status']=='PASS'
          assert q['B-115']['status']=='PASS' and q['C-125']['status']=='ACTIVE'
          manifest=json.load(open('modules/B/frozen/H_B_to_C_v2_MANIFEST.json'))
          assert manifest['fidelity']=='PRODUCTION' and manifest['object_id']=='H_B_to_C_V2',manifest
          s['strongest_supported_claim']='The unchanged physically executed B-110 Big-Implosion state now has a complete, nonduplicated, independently reconstructed and cleanly replayed four-sector genesis partition at PRODUCTION fidelity. H_B_to_C_v2 is frozen and child-ready, preserving the exact first-physical-state ancestry while supplying ordinary, radiative, compression-relic and dissipative-tail preparticle seeds for the sole active C-125 microscopic replay.'
          s['strongest_unsupported_claim']='No superseding channel-complete microscopic constitution H_C_to_D_v2, full nonequilibrium thermal history H_D_to_E_v2, source-owned nucleosynthesis H_E_to_F_v2, child-ready post-nuclear plasma/opacity H_F_to_G_v2, physical recombination/visibility/last-scattering state, or empirical agreement is yet established by the repaired lineage.'
          s['last_updated_utc']=datetime.now(timezone.utc).isoformat()
          Path('STATE.json').write_text(json.dumps(s,indent=2,ensure_ascii=False)+'\n')
          PY
          python tools/rfc.py context
          python tools/rfc.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
      - name: Commit and verify execution branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add STATE.json memory/CURRENT_CONTEXT.md
          git commit -m 'Align claim surface with verified B-115 closeout'
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          sha=$(git rev-parse HEAD)
          git push origin HEAD:"$BRANCH"
          remote=$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')
          test "$remote" = "$sha"
          echo "FINAL_SHA=$sha" >> "$GITHUB_STEP_SUMMARY"
