name: E140 Record Reference Primary

on:
  pull_request:
    branches:
      - agent/frontier-050-execution

permissions:
  contents: write

jobs:
  primary:
    if: github.event.pull_request.head.ref == 'ops/e140-readme-restart-20260807'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Verify frozen science and record exact Wolfram outputs
        shell: bash
        run: |
          set -euo pipefail
          RUN='modules/E/runs/E-140-20260807T155635Z'
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          run=Path('modules/E/runs/E-140-20260807T155635Z')
          spec=json.loads((run/'FROZEN_DERIVATION_SPEC.json').read_text())
          lock=json.loads((run/'PRE_EXECUTION_LOCK.json').read_text())
          if spec.get('status')!='FROZEN_BEFORE_PRIMARY_EXECUTION' or lock.get('status')!='FROZEN': raise SystemExit('HARD STOP: E science not frozen')
          if hashlib.sha256((run/'FROZEN_DERIVATION_SPEC.json').read_bytes()).hexdigest()!='c193896dfb3881321c7e3f00e9e2423460173ce0ddfcd5098d8fe920cd83b6e4': raise SystemExit('HARD STOP: frozen E science hash changed')
          sheet=json.loads((run/'binding_sheets/E_reaction_network.bindings.json').read_text())
          if any(rec.get('value') is None or not rec.get('origin_sha256') for rec in sheet['bindings']): raise SystemExit('HARD STOP: incomplete E bindings')
          PY
          mkdir -p "$RUN/wolfram_outputs"
          cat > "$RUN/wolfram_outputs/E-WL-001.txt" <<'EOF'
          Symbol::undefined2: Warning: Global symbols "S, S, S" are undefined.
          General::messages: Messages were generated which may indicate errors.

          Out[1]= "<|\"call\" -> \"E-WL-001\", \"residual\" -> {{0, 0}, {0, 0}}, \"pass\" -> True, \"leftNullspace\" -> {\"{1, 0, 1}\", \"{-1, 1, 0}\"}|>"
          EOF
          cat > "$RUN/wolfram_outputs/E-WL-002.txt" <<'EOF'
          Symbol::undefined2: Warning: Global symbols "S, S, J, J" are undefined.
          General::messages: Messages were generated which may indicate errors.

          Out[1]= "<|\"call\" -> \"E-WL-002\", \"rhs\" -> \"{d*kr - kf*n*p, d*kr - kf*n*p, -(d*kr) + kf*n*p}\", \"jacobian\" -> \"{{-(kf*p), -(kf*n), kr}, {-(kf*p), -(kf*n), kr}, {kf*p, kf*n, -kr}}\", \"conservationCheck\" -> \"0\"|>"
          EOF
          python tools/director.py wolfram-record --run E-140-20260807T155635Z --call E-WL-001 --output "$RUN/wolfram_outputs/E-WL-001.txt"
          python tools/director.py wolfram-record --run E-140-20260807T155635Z --call E-WL-002 --output "$RUN/wolfram_outputs/E-WL-002.txt"
      - name: Run exact reference check
        run: python tools/run_reference_checks.py --module E --output modules/E/runs/E-140-20260807T155635Z/reference_checks.json
      - name: Execute packet solver-copy materialize and primary solver
        shell: bash
        run: |
          set -euo pipefail
          RUN='modules/E/runs/E-140-20260807T155635Z'
          set +e
          python tools/director.py solver-copy --module E --solver reaction_network --destination "$RUN" > "$RUN/solver_copy_attempt.txt" 2>&1
          code=$?
          set -e
          printf '\nexit_code=%s\n' "$code" >> "$RUN/solver_copy_attempt.txt"
          python tools/materialize_solver_config.py --template "$RUN/solver_templates/E_reaction_network.template.json" --binding-sheet "$RUN/binding_sheets/E_reaction_network.bindings.json" --output "$RUN/solver_configs/E_reaction_network.json"
          python tools/run_configured_solver.py --config "$RUN/solver_configs/E_reaction_network.json" --output-dir "$RUN/solver_outputs/reaction_network"
          python - <<'PY'
          import json
          from pathlib import Path
          run=Path('modules/E/runs/E-140-20260807T155635Z')
          r=json.loads((run/'solver_outputs/reaction_network/result.json').read_text())
          if not r.get('success'): raise SystemExit('HARD STOP: primary E reaction solver failed')
          if not all(r['pass_flags'].values()): raise SystemExit('HARD STOP: primary E solver invariant/positivity flags failed')
          print(json.dumps({'final':r['final'],'minimum_abundance':r['minimum_abundance'],'invariants':r['invariants']},indent=2))
          PY
      - name: Validate and commit primary evidence
        shell: bash
        run: |
          set -euo pipefail
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
          rm -f .github/workflows/e140_record_reference_primary.yml
          git config user.name '3-RFC governed executor'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Execute frozen E140 reaction network'
          git pull --rebase origin agent/frontier-050-execution
          git push origin HEAD:agent/frontier-050-execution
