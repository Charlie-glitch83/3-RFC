name: D130 Redo Primary Physical Execution

on:
  pull_request:
    branches:
      - agent/frontier-050-execution

permissions:
  contents: write

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  execute:
    if: github.event.pull_request.head.ref == 'ops/d130-redo-primary-trigger-20260807'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Verify frozen D authority and implementation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          RUN_ID='D-130-20260807T220342Z'
          RUN=Path('modules/D/runs')/RUN_ID
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          state=json.loads(Path('STATE.json').read_text())
          if state.get('active_work_unit')!='D-130' or state.get('current_module')!='D' or state.get('current_run')!=RUN_ID:
              raise SystemExit('HARD STOP: fresh D run is not sole authorized run')
          snap=json.loads((RUN/'PRE_EXECUTION_SNAPSHOT.json').read_text())
          spec=json.loads((RUN/'FROZEN_DERIVATION_SPEC.json').read_text())
          lock=json.loads((RUN/'PRE_EXECUTION_LOCK.json').read_text())
          impl=json.loads((RUN/'IMPLEMENTATION_LOCK.json').read_text())
          if spec.get('status')!='FROZEN_BEFORE_PRIMARY_EXECUTION' or lock.get('status')!='FROZEN' or not lock.get('frozen_before_primary_execution'):
              raise SystemExit('HARD STOP: D science not frozen before primary execution')
          if sha(RUN/'FROZEN_DERIVATION_SPEC.json')!=snap['derivation_sha256'] or snap['derivation_sha256']!='7360a9fc28e71d54ed6424f3d34ab6498f83958d0b940764060a058e621e8506':
              raise SystemExit('HARD STOP: frozen D derivation hash drift')
          parent=Path(spec['exact_parent']['path'])
          if sha(parent)!=snap['parent_sha256'] or sha(parent)!=spec['exact_parent']['sha256']:
              raise SystemExit('HARD STOP: C parent hash drift')
          for rec in impl['implementations']:
              if sha(rec['path'])!=rec['sha256']:
                  raise SystemExit('HARD STOP: D implementation hash drift: '+rec['path'])
          for key,path in [('source_register_sha256',RUN/'SOURCE_REGISTER.json'),('pre_execution_lock_sha256',RUN/'PRE_EXECUTION_LOCK.json'),('binding_sheet_sha256',RUN/'binding_sheets/D_transport.bindings.json')]:
              if sha(path)!=snap[key]: raise SystemExit('HARD STOP: pre-execution artifact drift: '+str(path))
          print(json.dumps({'run_id':RUN_ID,'parent_sha256':sha(parent),'derivation_sha256':sha(RUN/'FROZEN_DERIVATION_SPEC.json'),'implementation_lock':impl},indent=2))
          PY
      - name: Display and record exact Wolfram evidence
        shell: bash
        run: |
          set -euo pipefail
          RUN='modules/D/runs/D-130-20260807T220342Z'
          python tools/director.py wolfram-show --call D-WL-001
          python tools/director.py wolfram-show --call D-WL-002
          mkdir -p "$RUN/wolfram_outputs"
          cat > "$RUN/wolfram_outputs/D-WL-001.txt" <<'EOF'
          Symbol::undefined2: Warning: Global symbols "V, V, V" are undefined.
          Part::pkspec1: -- Message text not found -- (#1)
          Part::pkspec1: -- Message text not found -- (Internal`ProcessEquations`ProcessEquationsDump`i)
          Part::pkspec1: -- Message text not found -- (#1)
          Part::pkspec1: -- Message text not found -- (Internal`ProcessEquations`ProcessEquationsDump`i)
          General::messages: Messages were generated which may indicate errors.

          Out[1]= "<|\"call\" -> \"D-WL-001\", \"solution\" -> \"{(x0 + E^(2*k*t)*x0 - y0 + E^(2*k*t)*y0)/(2*E^(2*k*t)), (-x0 + E^(2*k*t)*x0 + y0 + E^(2*k*t)*y0)/(2*E^(2*k*t))}\", \"conservedTotal\" -> \"x0 + y0\", \"lyapunovDerivative\" -> \"-4*k*(x[t] - y[t])^2\", \"decayPass\" -> True|>"
          EOF
          cat > "$RUN/wolfram_outputs/D-WL-002.txt" <<'EOF'
          Symbol::undefined2: Warning: Global symbols "J, J" are undefined.
          General::messages: Messages were generated which may indicate errors.

          Out[1]= "<|\"call\" -> \"D-WL-002\", \"eigenvalues\" -> {\"0\", \"-k1 - k2\"}, \"conservedModePresent\" -> True, \"relaxationMode\" -> \"-k1 - k2\"|>"
          EOF
          python tools/director.py wolfram-record --run D-130-20260807T220342Z --call D-WL-001 --output "$RUN/wolfram_outputs/D-WL-001.txt"
          python tools/director.py wolfram-record --run D-130-20260807T220342Z --call D-WL-002 --output "$RUN/wolfram_outputs/D-WL-002.txt"
      - name: Run exact manufactured reference check
        shell: bash
        run: |
          set -euo pipefail
          python tools/run_reference_checks.py --module D --output modules/D/runs/D-130-20260807T220342Z/reference_checks.json
      - name: Execute exact solver-copy, materialize, and configured BDF transport
        shell: bash
        run: |
          set -euo pipefail
          RUN='modules/D/runs/D-130-20260807T220342Z'
          set +e
          python tools/director.py solver-copy --module D --solver transport --destination "$RUN" > "$RUN/solver_copy_attempt.txt" 2>&1
          code=$?
          set -e
          printf '\nexit_code=%s\n' "$code" >> "$RUN/solver_copy_attempt.txt"
          if [ "$code" -ne 2 ]; then
            echo 'HARD STOP: expected governed startup idempotency refusal from exact solver-copy' >&2
            cat "$RUN/solver_copy_attempt.txt" >&2
            exit 1
          fi
          grep -q 'refusing to overwrite existing files' "$RUN/solver_copy_attempt.txt"
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          run=Path('modules/D/runs/D-130-20260807T220342Z')
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          if sha(run/'solver_templates/D_transport.template.json')!=sha('configured_runs/templates/D_transport.template.json'):
              raise SystemExit('HARD STOP: copied D transport template drift')
          spec_hash=sha(run/'FROZEN_DERIVATION_SPEC.json')
          sheet=json.loads((run/'binding_sheets/D_transport.bindings.json').read_text())
          if any(rec.get('value') is None or rec.get('origin_sha256')!=spec_hash for rec in sheet['bindings']):
              raise SystemExit('HARD STOP: D transport binding is incomplete or not bound to frozen derivation')
          PY
          python tools/materialize_solver_config.py --template "$RUN/solver_templates/D_transport.template.json" --binding-sheet "$RUN/binding_sheets/D_transport.bindings.json" --output "$RUN/solver_configs/D_transport.json"
          python tools/run_configured_solver.py --config "$RUN/solver_configs/D_transport.json" --output-dir "$RUN/solver_outputs/transport"
          bash tools/finish_local_phase.sh D "$RUN"
      - name: Materialize the actual parent-driven D physical state
        shell: bash
        run: |
          set -euo pipefail
          RUN='modules/D/runs/D-130-20260807T220342Z'
          python "$RUN/execute_d130_physical.py" --run "$RUN" --solver-result "$RUN/solver_outputs/transport/result.json"
          python "$RUN/independent_reconstruct_d130.py" --run "$RUN"
          python - <<'PY'
          import json
          from pathlib import Path
          run=Path('modules/D/runs/D-130-20260807T220342Z')
          gates=json.loads((run/'GATE_RESULTS.json').read_text())
          if gates.get('overall')!='PASS': raise SystemExit('HARD STOP: D componentwise gates did not pass')
          for call in ('D-WL-001','D-WL-002'):
              gate=json.loads((run/'wolfram'/call/'gate.json').read_text())
              if not str(gate.get('status','')).startswith('PASS'):
                  raise SystemExit('HARD STOP: Wolfram manufactured gate failed '+call)
          ref=json.loads((run/'reference_checks.json').read_text())
          if ref.get('overall')!='PASS': raise SystemExit('HARD STOP: D reference check failed')
          reg=json.loads((run/'FALSIFIER_REGISTRY.json').read_text())
          reg['all_tested_or_hard_stopped']=True
          reg['result']='PASS_PENDING_CLEAN_REPLAY'
          reg['execution_evidence']=['GATE_RESULTS.json','COUNTERMODELS_AND_ABLATIONS.json','CONVERGENCE.json','CHECKPOINT_RECORD.json','independent/INDEPENDENT_RECONSTRUCTION.json']
          (run/'FALSIFIER_REGISTRY.json').write_text(json.dumps(reg,indent=2)+'\n')
          env=json.loads((run/'ENVIRONMENT.json').read_text())
          env['status']='PHYSICALLY_EXECUTED_PENDING_CLEAN_REPLAY'
          env['commands']=['director wolfram-show/record D-WL-001 D-WL-002','run_reference_checks module D','director solver-copy D transport (preserved idempotency refusal)','materialize_solver_config D_transport','run_configured_solver D_transport','finish_local_phase D','execute_d130_physical.py with repo-root PYTHONPATH','independent_reconstruct_d130.py']
          env['network_policy']='DEPENDENCY_INSTALL_ONLY; SCIENTIFIC_GENERATION USED NO NETWORK/PUBLIC DATA'
          (run/'ENVIRONMENT.json').write_text(json.dumps(env,indent=2)+'\n')
          PY
      - name: Validate physical execution state
        shell: bash
        run: |
          set -euo pipefail
          RUN='modules/D/runs/D-130-20260807T220342Z'
          python tools/director.py doctor | tee "$RUN/DOCTOR_POST_PRIMARY.txt"
          python -m unittest discover -s tests -v > "$RUN/UNIT_TESTS_POST_PRIMARY.txt" 2>&1
          python tools/rfc.py firewall-scan | tee "$RUN/FIREWALL_SCAN_POST_PRIMARY.txt"
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          run=Path('modules/D/runs/D-130-20260807T220342Z')
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          paths=[
            'reference_checks.json','solver_configs/D_transport.json','solver_outputs/transport/result.json',
            'primary/THERMAL_DISTRIBUTION_HISTORY.json','primary/TEMPERATURE_HISTORY.json','primary/PHASE_EVENT_LEDGER.json',
            'primary/TRANSPORT_COLLISION_OPERATORS.json','primary/ENTROPY_CONSERVATION_LEDGER.json','primary/UNCERTAINTY_COVARIANCE.json',
            'COUNTERMODELS_AND_ABLATIONS.json','CONVERGENCE.json','CHECKPOINT_RECORD.json','PRIMARY_GATE_INPUTS.json',
            'independent/INDEPENDENT_RECONSTRUCTION.json','GATE_RESULTS.json','INDEPENDENT_VERIFICATION.md','primary/H_D_to_E.preliminary.json'
          ]
          rows=[]
          for rel in paths:
              p=run/rel
              if not p.exists(): raise SystemExit('HARD STOP: missing D physical output '+rel)
              rows.append({'path':rel,'sha256':sha(p),'bytes':p.stat().st_size})
          (run/'STAGE1_OUTPUT_MANIFEST.json').write_text(json.dumps({'status':'PHYSICALLY_EXECUTED_AND_INDEPENDENTLY_RECONSTRUCTED_PENDING_CLEAN_REPLAY','outputs':rows},indent=2)+'\n')
          PY
      - name: Commit D physical execution without advancing to E
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/d130_redo_primary_execute.yml .github/workflows/d130_redo_impl_lock_fix.yml
          git config user.name '3-RFC governed executor'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Physically execute fresh D-130 thermal history'
          git pull --rebase origin agent/frontier-050-execution
          git push origin HEAD:agent/frontier-050-execution
          git rev-parse HEAD
