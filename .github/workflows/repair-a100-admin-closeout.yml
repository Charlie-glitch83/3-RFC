name: Repair and finalize A-100 administrative closeout

on:
  push:
    branches: [agent/frontier-050-execution]
    paths:
      - '.github/a100-admin-repair-trigger.txt'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    env:
      BRANCH: agent/frontier-050-execution
      RUN_ID: A-100-20260806T173458Z
      EVIDENCE_COMMIT: b6280513dc47339ddf024be6275817d3f38a9d39
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-lock.txt
      - name: Normalize interrupted administrative state only
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$EVIDENCE_COMMIT" HEAD
          python - <<'PY'
          import json, os
          from pathlib import Path
          run_id=os.environ['RUN_ID']
          state_path=Path('STATE.json'); state=json.loads(state_path.read_text())
          queue_path=Path('WORK_QUEUE.json'); queue=json.loads(queue_path.read_text())
          state['active_work_unit']='A-100'; state['current_module']='A'; state['current_run']=run_id
          rec=state['modules']['A']
          design=next((x for x in rec.get('evidence_history',[]) if x.get('state')=='DESIGN'), {'state':'DESIGN','evidence':'repository bootstrap'})
          rec.clear(); rec.update({'evidence_state':'DESIGN','fidelity':'UNSTARTED','active_run':run_id,'frozen_artifacts':[],'evidence_history':[design]})
          for item in queue['items']:
              if item['id']=='A-100': item['status']='ACTIVE'
              elif item['id']=='B-110': item['status']='BLOCKED'
          run_path=Path('modules/A/runs')/run_id/'run.json'; run=json.loads(run_path.read_text())
          run['status']='CREATED'; run.pop('closed_utc',None); run.pop('closeout',None); run_path.write_text(json.dumps(run,indent=2)+'\n')
          idx_path=Path('memory/RUN_INDEX.json'); idx=json.loads(idx_path.read_text())
          for row in idx.get('runs',[]):
              if row.get('run_id')==run_id:
                  row['status']='CREATED'
                  for k in ('closed_utc','tree_sha256','closeout'): row.pop(k,None)
          state_path.write_text(json.dumps(state,indent=2)+'\n')
          queue_path.write_text(json.dumps(queue,indent=2)+'\n')
          idx_path.write_text(json.dumps(idx,indent=2)+'\n')
          PY
      - name: Execute governed closeout transaction
        shell: bash
        run: |
          set -euo pipefail
          run="modules/A/runs/$RUN_ID"; closeout="$run/CLOSEOUT.md"
          python - <<'PY'
          import os
          from pathlib import Path
          p=Path('modules/A/runs')/os.environ['RUN_ID']/'CLOSEOUT.md'
          t=p.read_text().replace('administrative close-run awaits the verified GitHub evidence commit.','verified GitHub evidence commit recorded; administrative close-run completed.').replace('promotion to be recorded after the evidence commit is verified','promotion recorded after exact GitHub evidence verification').replace('PENDING_EVIDENCE_COMMIT',os.environ['EVIDENCE_COMMIT'])
          assert os.environ['EVIDENCE_COMMIT'] in t
          p.write_text(t)
          PY
          python tools/rfc.py record-commit "$EVIDENCE_COMMIT" --branch "$BRANCH" --note 'Verified exact A-100 evidence commit and changed-file scope on GitHub'
          python tools/rfc.py close-run --run-id "$RUN_ID" --result PASS --closeout "$closeout"
          python tools/rfc.py promote-module A --to FORMALIZED --fidelity PRODUCTION --evidence modules/A/frozen/H_A_to_B.json
          python tools/rfc.py promote-module A --to VERIFIED --fidelity PRODUCTION --evidence "$run/INDEPENDENT_VERIFICATION.md"
          python tools/rfc.py promote-module A --to INDEPENDENTLY_REPRODUCED --fidelity PRODUCTION --evidence "$run/independent/INDEPENDENT_RECONSTRUCTION.json"
          python tools/rfc.py freeze modules/A/frozen/H_A_to_B.json --kind MODULE_HANDOFF
          python tools/rfc.py promote-module A --to FROZEN --fidelity PRODUCTION --evidence modules/A/frozen/H_A_to_B.json
          python tools/rfc.py advance --task A-100 --result PASS --evidence "$closeout" --note 'Module A closed at FROZEN/PRODUCTION; authorize exactly B-110'
      - name: Verify exact final state and all repository gates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          state=json.load(open('STATE.json')); queue=json.load(open('WORK_QUEUE.json'))['items']; run=json.load(open(f"modules/A/runs/{os.environ['RUN_ID']}/run.json")); idx=json.load(open('memory/RUN_INDEX.json'))['runs']
          assert state['active_work_unit']=='B-110' and state['current_module']=='B' and state['current_run'] is None
          assert state['modules']['A']['evidence_state']=='FROZEN' and state['modules']['A']['fidelity']=='PRODUCTION' and state['modules']['A']['active_run'] is None
          assert [x['id'] for x in queue if x['status']=='ACTIVE']==['B-110']
          assert next(x for x in queue if x['id']=='A-100')['status']=='PASS'
          assert run['status']=='PASS'
          assert next(x for x in idx if x['run_id']==os.environ['RUN_ID'])['status']=='PASS'
          PY
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
          python tools/rfc.py context
      - name: Commit, push, and verify exact remote commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .a100_bundle
          find .github -maxdepth 2 -type f \( -iname '*a100*' -o -iname '*finalize-a100*' \) -delete
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Close Module A and authorize B-110'
          final_sha=$(git rev-parse HEAD)
          git push origin HEAD:"$BRANCH"
          remote_sha=$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')
          test "$remote_sha" = "$final_sha"
          git diff-tree --no-commit-id --name-only -r "$final_sha" | tee /tmp/final-files.txt
          test -s /tmp/final-files.txt
          echo "final_sha=$final_sha" >> "$GITHUB_STEP_SUMMARY"
