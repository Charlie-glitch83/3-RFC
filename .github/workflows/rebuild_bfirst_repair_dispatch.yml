name: Rebuild B-First Repair Dispatcher

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main
    paths:
      - '.github/child-readiness-repair-trigger.txt'

permissions:
  contents: write

concurrency:
  group: rebuild-bfirst-repair-dispatch
  cancel-in-progress: false

jobs:
  repair-and-close-b115:
    if: startsWith(github.event.pull_request.head.ref, 'ops/main-dispatch-bfirst-repair')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements-lock.txt
      - run: bash tools/run_bfirst_repair_dispatch.sh
