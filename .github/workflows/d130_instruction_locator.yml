name: One-use D130 instruction locator

on:
  pull_request:
    branches:
      - agent/frontier-050-execution

permissions:
  contents: read

jobs:
  locate:
    if: github.event.pull_request.head.ref == 'ops/d130-instruction-locator-20260807'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - name: Locate governing protocol and ownership files
        shell: bash
        run: |
          set -euo pipefail
          echo '=== CANDIDATE FILENAMES ==='
          find . -type f | sed 's#^./##' | grep -Ei '(deriv|execut|protocol|ownership|clock|frame|gauge|conservation|source)' | sort
          echo '=== TEXT REFERENCES ==='
          grep -RniE 'derivation protocol|execution protocol|module ownership|clock/frame|clock|phase-event|entropy production' docs theory config recipes modules/D 2>/dev/null | head -n 500 || true
