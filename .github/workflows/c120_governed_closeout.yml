name: C120 Governed Closeout

on:
  pull_request:
    branches:
      - agent/frontier-050-execution

permissions:
  contents: write

concurrency:
  group: c120-governed-closeout
  cancel-in-progress: false

jobs:
  execute-c120:
    if: github.event.pull_request.head.ref == 'agent/c120-governed-trigger'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout locked execution branch
        uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
          path: primary_checkout
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install execution dependencies
        run: python -m pip install --disable-pip-version-check numpy networkx scipy sympy
      - name: Execute frozen Module C in primary checkout
        working-directory: primary_checkout
        shell: bash
        run: |
          set -euo pipefail
          RUN='modules/C/runs/C-120-20260807T032543Z'
          python tools/rfc.py doctor
          python tools/director.py doctor
          python tools/director.py wolfram-record --run C-120-20260807T032543Z --call C-WL-001 --output "$RUN/wolfram/C-WL-001/output.txt"
          python tools/director.py wolfram-record --run C-120-20260807T032543Z --call C-WL-002 --output "$RUN/wolfram/C-WL-002/output.txt"
          python tools/run_reference_checks.py --module C --output "$RUN/reference_checks.json"
          mkdir -p "$RUN/solver_configs" "$RUN/solver_outputs/spectral_model"
          python tools/materialize_solver_config.py --template "$RUN/solver_templates/C_spectral_model.template.json" --binding-sheet "$RUN/binding_sheets/C_spectral_model.bindings.json" --output "$RUN/solver_configs/C_spectral_model.json"
          python tools/run_configured_solver.py --config "$RUN/solver_configs/C_spectral_model.json" --output-dir "$RUN/solver_outputs/spectral_model"
          bash tools/finish_local_phase.sh C "$RUN"
          python "$RUN/primary_module_c.py"
          python "$RUN/independent_module_c.py"
          python "$RUN/validate_module_c.py"
          python tools/rfc.py firewall-scan | tee "$RUN/FIREWALL_SCAN.txt"
          python -m unittest discover -s tests -v
          python tools/director.py doctor
      - name: Record primary deterministic hashes
        working-directory: primary_checkout
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          run=pathlib.Path('modules/C/runs/C-120-20260807T032543Z')
          rels=['reference_checks.json','solver_outputs/spectral_model/result.json','primary/MICROSCOPIC_CONSTITUTION.json','primary/COUNTERMODEL_RESULTS.json','primary/UNCERTAINTY_ENVELOPE.json','primary/PRIMARY_SUMMARY.json','independent/INDEPENDENT_RECONSTRUCTION.json','GATE_RESULTS.json','CHECKPOINT_RECORD.json','checkpoints/C_MICROSCOPIC_CONSTITUTION.json','wolfram/C-WL-001/gate.json','wolfram/C-WL-002/gate.json']
          out={rel:hashlib.sha256((run/rel).read_bytes()).hexdigest() for rel in rels}
          pathlib.Path('../c120_primary_hashes.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
      - name: Clean replay checkout
        uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
          path: replay_checkout
      - name: Replay frozen Module C from clean checkout
        working-directory: replay_checkout
        shell: bash
        run: |
          set -euo pipefail
          RUN='modules/C/runs/C-120-20260807T032543Z'
          python tools/rfc.py doctor
          python tools/director.py doctor
          python tools/director.py wolfram-record --run C-120-20260807T032543Z --call C-WL-001 --output "$RUN/wolfram/C-WL-001/output.txt"
          python tools/director.py wolfram-record --run C-120-20260807T032543Z --call C-WL-002 --output "$RUN/wolfram/C-WL-002/output.txt"
          python tools/run_reference_checks.py --module C --output "$RUN/reference_checks.json"
          mkdir -p "$RUN/solver_configs" "$RUN/solver_outputs/spectral_model"
          python tools/materialize_solver_config.py --template "$RUN/solver_templates/C_spectral_model.template.json" --binding-sheet "$RUN/binding_sheets/C_spectral_model.bindings.json" --output "$RUN/solver_configs/C_spectral_model.json"
          python tools/run_configured_solver.py --config "$RUN/solver_configs/C_spectral_model.json" --output-dir "$RUN/solver_outputs/spectral_model"
          bash tools/finish_local_phase.sh C "$RUN"
          python "$RUN/primary_module_c.py"
          python "$RUN/independent_module_c.py"
          python "$RUN/validate_module_c.py"
      - name: Compare replay hashes and certify replay
        shell: bash
        run: |
          python - <<'PY'
          import copy,hashlib,json,pathlib,subprocess
          first=json.loads(pathlib.Path('c120_primary_hashes.json').read_text())
          rrun=pathlib.Path('replay_checkout/modules/C/runs/C-120-20260807T032543Z')
          prun=pathlib.Path('primary_checkout/modules/C/runs/C-120-20260807T032543Z')
          second={rel:hashlib.sha256((rrun/rel).read_bytes()).hexdigest() for rel in first}
          matches={rel:{'primary_sha256':first[rel],'replay_sha256':second[rel],'match':first[rel]==second[rel]} for rel in first}
          if not all(v['match'] for v in matches.values()): raise SystemExit('HARD STOP: clean replay C scientific hashes differ')
          def semantic(path):
              obj=json.loads(path.read_text()); obj=copy.deepcopy(obj); bm=obj.get('binding_manifest',{}); bm.pop('template_path',None); bm.pop('binding_sheet_path',None); return hashlib.sha256((json.dumps(obj,sort_keys=True,separators=(',',':'))+'\n').encode()).hexdigest()
          pcfg=prun/'solver_configs/C_spectral_model.json'; rcfg=rrun/'solver_configs/C_spectral_model.json'
          rawp=hashlib.sha256(pcfg.read_bytes()).hexdigest(); rawr=hashlib.sha256(rcfg.read_bytes()).hexdigest(); semp=semantic(pcfg); semr=semantic(rcfg)
          if semp!=semr: raise SystemExit('HARD STOP: canonicalized C solver config differs across clean checkout')
          ref=subprocess.check_output(['git','-C','replay_checkout','rev-parse','HEAD'],text=True).strip()
          rec={'run_id':'C-120-20260807T032543Z','result':'PASS','clean_checkout':True,'artifact_hashes_match':True,'replay_ref':ref,'method':'second clean checkout followed by frozen Wolfram-record/reference/materialize/spectral/local-phase/primary/independent/validate sequence','compared_artifacts':matches,'config_reproducibility':{'primary_raw_sha256':rawp,'replay_raw_sha256':rawr,'raw_hash_match':rawp==rawr,'primary_semantic_sha256':semp,'replay_semantic_sha256':semr,'semantic_match':True,'normalization':'remove only checkout-specific absolute binding_manifest template_path and binding_sheet_path; retain every scientific value and provenance hash'}}
          (prun/'REPLAY_RECORD.json').write_text(json.dumps(rec,indent=2,sort_keys=True)+'\n')
          PY
      - name: Finalize evidence and register C closeout
        working-directory: primary_checkout
        shell: bash
        run: |
          set -euo pipefail
          RUN='modules/C/runs/C-120-20260807T032543Z'
          python "$RUN/finalize_module_c.py"
          python tools/rfc.py promote-module C --to FORMALIZED --fidelity MINIMAL_SPINE --evidence "$RUN/FROZEN_DERIVATION_SPEC.json"
          python tools/rfc.py promote-module C --to IMPLEMENTED --fidelity MINIMAL_SPINE --evidence "$RUN/solver_outputs/spectral_model/result.json"
          python tools/rfc.py promote-module C --to VERIFIED --fidelity MINIMAL_SPINE --evidence "$RUN/GATE_RESULTS.json"
          python tools/rfc.py promote-module C --to PHYSICALLY_EXECUTED --fidelity MINIMAL_SPINE --evidence "$RUN/primary/MICROSCOPIC_CONSTITUTION.json"
          python tools/rfc.py promote-module C --to INDEPENDENTLY_REPRODUCED --fidelity MINIMAL_SPINE --evidence "$RUN/independent/INDEPENDENT_RECONSTRUCTION.json"
          python tools/rfc.py promote-module C --to FROZEN --fidelity MINIMAL_SPINE --evidence modules/C/frozen/H_C_to_D.json
          python tools/rfc.py close-run --run-id C-120-20260807T032543Z --result PASS --closeout "$RUN/CLOSEOUT.md"
          python tools/rfc.py context
          python tools/director.py doctor
          python tools/rfc.py doctor
      - name: Commit verified Module C closeout candidate
        working-directory: primary_checkout
        shell: bash
        run: |
          set -euo pipefail
          git config user.name '3-RFC governed executor'
          git config user.email 'actions@users.noreply.github.com'
          git status --short
          git add -A
          if git diff --cached --quiet; then echo 'HARD STOP: no C closeout changes to commit'; exit 1; fi
          git commit -m 'Close Module C at its verified scientific scope'
          git push origin HEAD:agent/frontier-050-execution
          git rev-parse HEAD
