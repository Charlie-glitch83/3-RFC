name: E140 Restart After Derivation Mismatch

on:
  pull_request:
    branches:
      - agent/frontier-050-execution

permissions:
  contents: write

jobs:
  restart:
    if: github.event.pull_request.head.ref == 'ops/e140-instruction-locator-20260807'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-lock.txt
      - name: Preserve mismatch and create fresh E run
        shell: bash
        run: |
          set -euo pipefail
          RUN='modules/E/runs/E-140-20260807T155635Z'
          cat > "$RUN/CLOSEOUT.md" <<'EOF'
          # E-140 Pre-Execution Derivation Mismatch

          Result: BLOCKED before primary execution.

          The provisional E derivation froze a two-channel canonical-kernel normalization. Before any physical E execution, repository-native execution instructions were found that require the parent-derived symmetry-preserving branch interface and the exact C/D interaction scales instead. The provisional derivation is preserved as a failed pre-execution attempt and is not a scientific parent.

          No physical reaction-network solver was executed and no E abundance result is claimed.
          EOF
          printf '%s\n' '{"failure_id":"E140-PREEXEC-DERIVATION-MISMATCH","run_id":"E-140-20260807T155635Z","category":"PREEXECUTION_SCIENTIFIC_DERIVATION_MISMATCH","description":"Provisional frozen rate normalization did not match repository-native parent-law execution contract; detected before physical execution.","changes_frozen_science":true,"required_replay_scope":"new governed E run from exact D parent"}' > "$RUN/FAILURES.jsonl"
          python tools/rfc.py close-run --run-id E-140-20260807T155635Z --result BLOCKED --closeout "$RUN/CLOSEOUT.md"
          python tools/rfc.py advance --task E-140 --result FAIL --evidence "$RUN/CLOSEOUT.md" --note 'Pre-execution derivation mismatch preserved; E remains active for fresh parent-law derivation.'
          bash tools/start_work.sh
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
      - name: Commit restart and remove carrier
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/e140_restart_after_derivation_mismatch.yml
          git config user.name '3-RFC governed executor'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Restart E140 on repository parent-law contract'
          git pull --rebase origin agent/frontier-050-execution
          git push origin HEAD:agent/frontier-050-execution
