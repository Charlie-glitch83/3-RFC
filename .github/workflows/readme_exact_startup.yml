name: One-use exact README startup carrier

on:
  pull_request:
    branches:
      - agent/frontier-050-execution

permissions:
  contents: write

jobs:
  startup:
    if: github.event.pull_request.head.ref == 'ops/readme-exact-startup-20260807b'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install repository requirements
        shell: bash
        run: python -m pip install -r requirements-lock.txt
      - name: Run exact README startup commands
        shell: bash
        run: |
          set -euo pipefail
          bash bootstrap.sh
          bash tools/start_work.sh
      - name: Commit startup-generated state and remove carrier
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/readme_exact_startup.yml
          git config user.name '3-RFC governed executor'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Refresh active work from exact root README startup'
          git pull --rebase origin agent/frontier-050-execution
          git push origin HEAD:agent/frontier-050-execution
