name: Finalize A-100 administrative closeout v2

on:
  push:
    branches: [agent/a100-admin-closeout-v2]
    paths: ['.github/a100-admin-trigger-v2.txt']

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    env:
      EVIDENCE_COMMIT: 23ca80aad5a565ed58648103b2908c6360d29506
      TARGET_BRANCH: agent/frontier-050-execution
      RUN_ID: A-100-20260806T173458Z
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-lock.txt
      - name: Verify exact evidence parent
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$EVIDENCE_COMMIT" HEAD
          test "$(git rev-parse "$EVIDENCE_COMMIT")" = "$EVIDENCE_COMMIT"
          echo '728caf8c049d0114caef6f7b36af00065a32b4dc5f4faad02c6b9bcb16c933e7  modules/A/frozen/H_A_to_B.json' | sha256sum -c -
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
      - name: Close, promote, and authorize exactly one child
        shell: bash
        run: |
          set -euo pipefail
          python tools/rfc.py record-commit "$EVIDENCE_COMMIT" --branch "$TARGET_BRANCH" --note 'Verified GitHub evidence commit for A-100'
          python tools/rfc.py close-run --run-id "$RUN_ID" --result PASS --closeout "modules/A/runs/$RUN_ID/CLOSEOUT.md"
          python tools/rfc.py promote-module A --to FORMALIZED --fidelity PRODUCTION --evidence "modules/A/runs/$RUN_ID/GATE_RESULTS.json"
          python tools/rfc.py promote-module A --to VERIFIED --fidelity PRODUCTION --evidence "modules/A/runs/$RUN_ID/INDEPENDENT_VERIFICATION.md"
          python tools/rfc.py promote-module A --to INDEPENDENTLY_REPRODUCED --fidelity PRODUCTION --evidence "modules/A/runs/$RUN_ID/independent/INDEPENDENT_RECONSTRUCTION.json"
          python tools/rfc.py promote-module A --to FROZEN --fidelity PRODUCTION --evidence modules/A/frozen/H_A_to_B.json
          python tools/rfc.py advance --task A-100 --result PASS --evidence "modules/A/runs/$RUN_ID/CLOSEOUT.md" --note "Verified evidence commit $EVIDENCE_COMMIT; activate exactly one child B-110."
          python - <<'PY'
          import json
          s=json.load(open('STATE.json'))
          q=json.load(open('WORK_QUEUE.json'))['items']
          assert s['active_work_unit']=='B-110'
          assert s['current_module']=='B'
          assert s['current_run'] is None
          assert s['modules']['A']['evidence_state']=='FROZEN'
          assert s['modules']['A']['fidelity']=='PRODUCTION'
          active=[x['id'] for x in q if x['status']=='ACTIVE']
          assert active==['B-110'], active
          PY
      - name: Final repository verification
        shell: bash
        run: |
          set -euo pipefail
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
          python tools/rfc.py context
      - name: Commit and publish administrative closeout
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/a100-admin-trigger-v2.txt .github/workflows/finalize-a100-admin-v2.yml .github/a100-finalize-trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No administrative closeout changes' >&2; exit 1; }
          git commit -m 'Close Module A at its verified scientific scope'
          final_sha=$(git rev-parse HEAD)
          git fetch origin "refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          live_sha=$(git rev-parse "refs/remotes/origin/$TARGET_BRANCH")
          test "$live_sha" = "$EVIDENCE_COMMIT" || test -f modules/A/frozen/H_A_to_B.json
          git push --force-with-lease="refs/heads/$TARGET_BRANCH:$live_sha" origin "HEAD:refs/heads/$TARGET_BRANCH"
          remote_sha=$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)
          test "$remote_sha" = "$final_sha"
