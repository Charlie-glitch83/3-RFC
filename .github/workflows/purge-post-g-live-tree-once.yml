name: Purge post-G live tree once

on:
  pull_request:
    branches:
      - agent/frontier-050-execution
    types: [opened, synchronize, reopened]
    paths:
      - 'ops/PURGE_POST_G_TRIGGER.txt'

permissions:
  contents: write

concurrency:
  group: purge-post-g-live-tree-once
  cancel-in-progress: false

jobs:
  purge:
    if: github.event.pull_request.head.ref == 'ops/purge-post-g-20260810'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rebuild authoritative live tree at the G boundary
        shell: bash
        run: |
          set -euo pipefail
          BOUNDARY='b07dd70edf7001e141d31775e3d5a6fb6c6f019f'
          BOOT='b1642cbbbbc05c3cae77da030420c115e03f87e5'
          BRANCH='agent/frontier-050-execution'
          git reset --hard "$BOUNDARY"
          git clean -fdx

          # G-165 itself hashes this exact object as an admitted input. Preserve
          # the byte-exact source while erasing all executed/frozen post-G state.
          I_G_INPUT='modules/I/repair/I180_CORRECTED_DERIVATION_SPEC.json'
          test -f "$I_G_INPUT"
          cp "$I_G_INPUT" /tmp/I180_CORRECTED_DERIVATION_SPEC.json

          for m in HU I HI J K L M KLM N O P Q; do
            git rm -r -f --ignore-unmatch "modules/$m"
            git checkout "$BOOT" -- "modules/$m"
            git rm -r -f --ignore-unmatch "recipes/$m"
            git checkout "$BOOT" -- "recipes/$m"
          done
          mkdir -p modules/I/repair
          cp /tmp/I180_CORRECTED_DERIVATION_SPEC.json "$I_G_INPUT"
          git add "$I_G_INPUT"

          # Remove disposable execution transports and restore only bootstrap CI.
          git rm -r -f --ignore-unmatch .github/workflows
          git checkout "$BOOT" -- .github/workflows
          git rm -r -f --ignore-unmatch ops safety
          git rm -f --ignore-unmatch work_packets/ACTIVE_WORK_PACKET.md

          BOOT="$BOOT" python - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          boot=os.environ['BOOT']
          markers=('HU-170','HU-175','HU-176','I-180','I180','I-185','I185','HI-190','HI190','HI-191','J-200','J200')
          protected={'audit/G165_CLAIM.json'}
          for root in ('tools','tests','audit'):
              base=Path(root)
              if not base.exists(): continue
              for p in sorted(base.rglob('*')):
                  if not p.is_file(): continue
                  rel=p.as_posix()
                  if rel in protected: continue
                  try: text=p.read_text(encoding='utf-8',errors='ignore')
                  except Exception: text=''
                  named=any(x.lower() in p.name.lower() for x in ('hu175','hu176','i180','i185','hi190','j200','mode_basis'))
                  marked=any(x in text for x in markers)
                  if root=='audit': remove=named or marked
                  else:
                      existed=subprocess.run(['git','cat-file','-e',f'{boot}:{rel}'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode==0
                      remove=(not existed) and (named or marked)
                  if remove:
                      subprocess.run(['git','rm','-f','--ignore-unmatch',rel],check=True)
          PY

          BOOT="$BOOT" python - <<'PY'
          import copy, json, os, subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          BOOT=os.environ['BOOT']
          DOWN={'HU','I','HI','J','K','L','M','KLM','N','O','P','Q'}
          PRE={'REPO','SOURCES','THEORY','RECOVERY','AUDIT','A','B','C','D','E','F','G'}
          def load(p): return json.loads(Path(p).read_text(encoding='utf-8'))
          def save(p,o): Path(p).write_text(json.dumps(o,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          def git_json(path):
              return json.loads(subprocess.check_output(['git','show',f'{BOOT}:{path}'],text=True))
          def is_down_id(v):
              if not isinstance(v,str): return False
              return any(v==m or v.startswith(m+'-') for m in DOWN)
          def has_down_path(obj):
              s=json.dumps(obj,ensure_ascii=False)
              return any(f'modules/{m}/' in s for m in DOWN)

          # Reset all scientific state after G to the untouched bootstrap definitions.
          state=load('STATE.json'); bstate=git_json('STATE.json')
          for m in DOWN: state['modules'][m]=copy.deepcopy(bstate['modules'][m])
          state['project_status']='ACTIVE'
          state['active_work_unit']='HU-170'
          state['current_module']='HU'
          state['current_run']=None
          state['last_verified_commit']=None
          state['last_verified_branch']='agent/frontier-050-execution'
          state['last_updated_utc']=datetime.now(timezone.utc).isoformat()
          state.pop('repair_state',None)
          gclaim=load('audit/G165_CLAIM.json')
          state['strongest_supported_claim']=gclaim.get('text','Module G-165 is frozen at its verified scope.')
          state['strongest_unsupported_claim']='No HU or later-module scientific result is present or supported in the live repository.'
          save('STATE.json',state)

          # Preserve the governed A-G history including G-165, then reinstall the
          # original future queue. Only HU-170 is authorized next; all later items block.
          q=load('WORK_QUEUE.json'); bq=git_json('WORK_QUEUE.json')
          prefix=[copy.deepcopy(x) for x in q['items'] if x.get('module') in PRE]
          bi=next(i for i,x in enumerate(bq['items']) if x.get('id')=='G-160')
          suffix=[]
          for x in copy.deepcopy(bq['items'][bi+1:]):
              x['depends_on']=['G-165' if d=='G-160' else d for d in x.get('depends_on',[])]
              x['status']='ACTIVE' if x.get('id')=='HU-170' else 'BLOCKED'
              suffix.append(x)
          q['items']=prefix+suffix
          save('WORK_QUEUE.json',q)

          # Remove downstream run/artifact/claim authority from machine memory.
          p=Path('memory/RUN_INDEX.json')
          if p.exists():
              o=load(p); o['runs']=[r for r in o.get('runs',[]) if r.get('module') not in DOWN and not is_down_id(r.get('task_id'))]; save(p,o)
          p=Path('memory/ARTIFACT_REGISTRY.json')
          if p.exists():
              o=load(p); o['artifacts']=[a for a in o.get('artifacts',[]) if not has_down_path(a) and a.get('module') not in DOWN and not is_down_id(a.get('work_unit'))]; save(p,o)
          p=Path('CLAIMS_LEDGER.json')
          if p.exists():
              o=load(p); o['claims']=[c for c in o.get('claims',[]) if c.get('owner') not in DOWN and c.get('module') not in DOWN and not is_down_id(c.get('work_unit')) and not has_down_path(c)]; save(p,o)

          for fn in ('memory/DECISION_LOG.jsonl','memory/FAILURE_LOG.jsonl'):
              p=Path(fn)
              if not p.exists(): continue
              kept=[]
              for line in p.read_text(encoding='utf-8').splitlines():
                  if not line.strip(): continue
                  try: rec=json.loads(line)
                  except Exception: continue
                  s=json.dumps(rec,ensure_ascii=False)
                  bad=is_down_id(rec.get('work_unit')) or is_down_id(rec.get('module')) or has_down_path(rec)
                  bad=bad or any(tok in s for tok in ('HU-170','HU-175','HU-176','I-180','I180','I-185','I185','HI-190','HI190','HI-191','J-200','J200'))
                  if not bad: kept.append(json.dumps(rec,ensure_ascii=False))
              p.write_text(('\n'.join(kept)+'\n') if kept else '',encoding='utf-8')
          PY

          python tools/rfc.py context
          python tools/rfc.py doctor
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan

          python - <<'PY'
          import json
          from pathlib import Path
          downstream=('HU','I','HI','J','K','L','M','KLM','N','O','P','Q')
          s=json.loads(Path('STATE.json').read_text())
          q=json.loads(Path('WORK_QUEUE.json').read_text())
          assert s['active_work_unit']=='HU-170' and s['current_run'] is None, s
          assert [x['id'] for x in q['items'] if x.get('status')=='ACTIVE']==['HU-170']
          for m in downstream:
              rec=s['modules'][m]
              assert rec['evidence_state']=='DESIGN' and rec['fidelity']=='UNSTARTED', (m,rec)
              for sub in ('runs','frozen'):
                  p=Path('modules')/m/sub
                  assert not p.exists() or not any(x.is_file() and x.name!='.gitkeep' for x in p.rglob('*')), p
          # G's exact provenance input is the sole deliberate downstream-named byte retained.
          assert Path('modules/I/repair/I180_CORRECTED_DERIVATION_SPEC.json').is_file()
          assert Path('modules/G/runs/G-165-20260810T144936Z/run.json').is_file()
          assert Path('modules/G/frozen/H_G_to_I_v2.json').is_file()
          print('POST_G_PURGE_ASSERTIONS=PASS')
          PY

      - name: Commit and force-replace governed branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Purge all live scientific state after Module G'
          git push --force-with-lease origin HEAD:agent/frontier-050-execution
          printf 'POST_G_CLEAN_COMMIT=%s\n' "$(git rev-parse HEAD)"
