name: Repair False G Obstruction and Reopen Child-Ready F Once

on:
  pull_request:
    branches:
      - agent/frontier-050-execution
    paths:
      - '.github/child-readiness-repair-trigger.txt'

permissions:
  contents: write

concurrency:
  group: child-readiness-repair-once
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'ops/child-readiness-repair-20260808'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install frozen repository dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-lock.txt

      - name: Verify exact current repair frontier
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          s=json.load(open('STATE.json'))
          assert s['active_work_unit']=='G-160',s
          assert s['current_module']=='G',s
          assert s['current_run'] and s['current_run'].startswith('G-160-'),s
          assert s['modules']['F']['evidence_state']=='FROZEN',s['modules']['F']
          assert s['modules']['F']['fidelity']=='MINIMAL_SPINE',s['modules']['F']
          p=Path('modules/F/frozen/H_F_to_G.json')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='bc996dc35f7cf1c2bafc3523133c1470dd9184f4ebff97f5e94b0f0fe1840154'
          parent=json.load(open(p))
          assert parent['electromagnetic_charge_status']=='NOT_DERIVED_AT_MINIMAL_SPINE'
          assert parent['residual_route_network']['physical_photon_opacity_status']=='NOT_DERIVED'
          assert 'PHOTON_IDENTITY_UNASSIGNED' in parent['radiation_channel']['status']
          idx=json.load(open('memory/RUN_INDEX.json'))['runs']
          old=[r for r in idx if r['run_id']=='G-160-20260808T021341Z']
          assert old and old[0]['status']=='BLOCKED',old
          assert s.get('repair_state')=='BG_SOURCE_LINEAGE_REPAIR_CLOSED',s.get('repair_state')
          PY

      - name: Close current blank G retry as superseded BLOCKED attempt
        run: |
          RID=$(python - <<'PY'
          import json
          print(json.load(open('STATE.json'))['current_run'])
          PY
          )
          python - "$RID" <<'PY'
          import json,sys
          from pathlib import Path
          rid=sys.argv[1]
          R=Path('modules/G/runs')/rid
          run=json.load(open(R/'run.json'))
          assert run['status']=='CREATED',run
          (R/'CLOSEOUT.md').write_text(f'''# {rid} Superseded Pre-Execution Closeout

## Result

**BLOCKED / SUPERSEDED BEFORE SCIENTIFIC EXECUTION.**

This retry workspace was automatically created after the preserved G-160 obstruction was closed. No G primary physics was executed here. The recovered B-G source corpus is valuable `REPLAY_REQUIRED` science, but it has not yet been freshly replayed into a child-ready F parent. The exact current `H_F_to_G` still leaves the material plasma/radiation/opacity bindings required by Module G unresolved.

## Strongest supported claim

The recovered B-G formal corpus supplies the scientific construction path needed for a superseding F-to-G lineage, while the preserved G obstruction remains valid evidence against treating the old reduced F parent as exhaustive.

## Strongest unsupported claim

No freshly replayed child-ready F parent, physical recombination history, opacity history, visibility function, radiation surface, or G child handoff is established by this retry.

The canonical repair frontier moves upstream to F-155; this G workspace is preserved as a blocked pre-execution attempt.
''',encoding='utf-8')
          PY
          python tools/rfc.py close-run --run-id "$RID" --result BLOCKED --closeout "modules/G/runs/$RID/CLOSEOUT.md"

      - name: Apply repository-wide child-readiness repair
        run: |
          python tools/repair_child_readiness.py
          python tools/rfc.py reopen-module F --fidelity PRODUCTION --evidence audit/CHILD_READINESS_REPAIR_20260808.json

      - name: Create governed F-155 repair workspace
        run: |
          python tools/rfc.py new-run F --run-id F-155-20260808T054200Z
          python tools/director.py prepare-active
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.load(open('STATE.json'))
          assert s['active_work_unit']=='F-155',s
          assert s['current_module']=='F',s
          assert s['current_run']=='F-155-20260808T054200Z',s
          assert s['modules']['F']['evidence_state']=='DESIGN',s['modules']['F']
          assert s['modules']['F']['fidelity']=='PRODUCTION',s['modules']['F']
          assert s['modules']['G']['evidence_state']=='BLOCKED',s['modules']['G']
          R=Path('modules/F/runs/F-155-20260808T054200Z')
          c=json.load(open(R/'OUTPUT_CONTRACT.json'))
          required=json.load(open('modules/F/spec.json'))['required_outputs']
          assert [x['name'] for x in c['required_outputs']]==required
          assert c['status']=='DRAFT'
          packet=Path('work_packets/ACTIVE_WORK_PACKET.md').read_text()
          assert '# ACTIVE WORK PACKET — F-155' in packet
          assert str(R) in packet
          PY

      - name: Verify incomplete F cannot falsely PASS
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('rfc',Path('tools/rfc.py'))
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          ok,errors=mod.validate_required_output_contract(Path('modules/F/runs/F-155-20260808T054200Z'),'F')
          assert ok is False
          assert errors
          print('\n'.join(errors))
          PY

      - name: Validate repaired repository
        run: |
          python tools/director.py doctor
          python tools/rfc.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
          python tools/rfc.py context

      - name: Commit repaired governed frontier
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'HARD STOP: repair workflow produced no governed changes'
            exit 1
          fi
          git commit -m 'Repair child-readiness closure and reopen Module F'
          git pull --rebase origin agent/frontier-050-execution
          git push origin HEAD:agent/frontier-050-execution
          echo "REPAIR_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify remote repair SHA and frontier
        run: |
          git fetch origin agent/frontier-050-execution
          REMOTE=$(git rev-parse origin/agent/frontier-050-execution)
          test "$REMOTE" = "$REPAIR_SHA"
          python - <<'PY'
          import json
          s=json.load(open('STATE.json'))
          q={x['id']:x for x in json.load(open('WORK_QUEUE.json'))['items']}
          assert s['active_work_unit']=='F-155',s
          assert s['current_run']=='F-155-20260808T054200Z',s
          assert s['modules']['F']['evidence_state']=='DESIGN' and s['modules']['F']['fidelity']=='PRODUCTION',s['modules']['F']
          assert s['modules']['G']['evidence_state']=='BLOCKED',s['modules']['G']
          assert q['F-155']['status']=='ACTIVE'
          assert q['G-160']['status']=='BLOCKED' and q['G-160']['depends_on']==['F-155']
          PY
          echo "Verified repair SHA: $REMOTE"
