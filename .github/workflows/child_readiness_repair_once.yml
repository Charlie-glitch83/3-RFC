name: Close B-G Repair and Reopen B-First Superseding Replay Once

on:
  pull_request:
    branches:
      - agent/frontier-050-execution
    paths:
      - '.github/child-readiness-repair-trigger.txt'

permissions:
  contents: write

concurrency:
  group: bg-superseding-repair-once
  cancel-in-progress: false

jobs:
  repair:
    if: startsWith(github.event.pull_request.head.ref, 'ops/child-readiness-repair-20260808')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install frozen repository dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-lock.txt

      - name: Verify exact recovered repair prerequisite
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.load(open('STATE.json'))
          assert s['active_work_unit']=='G-160' and s['current_module']=='G',s
          rid=s['current_run']; assert rid and rid.startswith('G-160-'),s
          R=Path('modules/G/runs')/rid
          run=json.load(open(R/'run.json')); assert run['status']=='CREATED',run
          lock=json.load(open(R/'PRE_EXECUTION_LOCK.json'))
          assert lock['authorization']=='NOT_AUTHORIZED_PENDING_SUPERSEDING_F_TO_G_PARENT',lock
          assert lock['repair_prerequisite']=='recovery/BG_SUPERSEDING_LINEAGE_PACKET.md',lock
          assert Path(lock['repair_prerequisite']).is_file()
          assert json.load(open('modules/G/runs/G-160-20260808T021341Z/run.json'))['status']=='BLOCKED'
          for m in 'BCDEF':
              rec=s['modules'][m]
              assert rec['evidence_state']=='FROZEN' and rec['fidelity']=='MINIMAL_SPINE',(m,rec)
          PY

      - name: Close current G recovery-planning shell as BLOCKED
        run: |
          RID=$(python - <<'PY'
          import json
          print(json.load(open('STATE.json'))['current_run'])
          PY
          )
          python - "$RID" <<'PY'
          import json,sys
          from pathlib import Path
          rid=sys.argv[1]; R=Path('modules/G/runs')/rid
          (R/'CLOSEOUT.md').write_text(f'''# {rid} Superseding-Lineage Prerequisite Closeout

## Result

**BLOCKED BEFORE PRIMARY EXECUTION.**

The exact recovered B-G corpus is available as `REPLAY_REQUIRED`, but the frozen repair packet requires a versioned superseding replay in the order B -> C -> D -> E -> F -> G. This G planning shell is therefore closed without executing recombination physics.

## Strongest supported claim

The repository has exact recovered source material and a frozen scientific replay order for constructing a child-ready superseding F-to-G parent while preserving the earlier lower-fidelity runs.

## Strongest unsupported claim

No `H_B_to_C_v2`, `H_C_to_D_v2`, `H_D_to_E_v2`, `H_E_to_F_v2`, `H_F_to_G_v2`, physical recombination history, opacity history, visibility function or radiation surface has yet been freshly executed and frozen in the superseding 3-RFC lineage.
''',encoding='utf-8')
          PY
          python tools/rfc.py close-run --run-id "$RID" --result BLOCKED --closeout "modules/G/runs/$RID/CLOSEOUT.md"

      - name: Install B-first superseding replay frontier and closure guards
        run: |
          python tools/repair_superseding_lineage_frontier.py
          python tools/rfc.py reopen-module B --fidelity PRODUCTION --evidence recovery/BG_SUPERSEDING_LINEAGE_PACKET.md

      - name: Create governed B-115 workspace
        run: |
          python tools/director.py doctor
          python tools/director.py prepare-active --create-run
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.load(open('STATE.json')); q={x['id']:x for x in json.load(open('WORK_QUEUE.json'))['items']}
          assert s['active_work_unit']=='B-115' and s['current_module']=='B',s
          assert s['modules']['B']['evidence_state']=='DESIGN' and s['modules']['B']['fidelity']=='PRODUCTION',s['modules']['B']
          assert [q[x]['status'] for x in ['B-115','C-125','D-135','E-145','F-155','G-160']]==['ACTIVE','BLOCKED','BLOCKED','BLOCKED','BLOCKED','BLOCKED']
          rid=s['current_run']; assert rid and rid.startswith('B-115-'),s
          R=Path('modules/B/runs')/rid
          c=json.load(open(R/'OUTPUT_CONTRACT.json')); required=json.load(open('modules/B/spec.json'))['required_outputs']
          assert [x['name'] for x in c['required_outputs']]==required
          assert c['status']=='DRAFT'
          packet=Path('work_packets/ACTIVE_WORK_PACKET.md').read_text()
          assert '# ACTIVE WORK PACKET — B-115' in packet and str(R) in packet
          print(rid)
          PY

      - name: Verify incomplete superseding B cannot falsely PASS
        run: |
          python - <<'PY'
          import importlib.util,json
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('rfc',Path('tools/rfc.py'))
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          rid=json.load(open('STATE.json'))['current_run']
          ok,errors=m.validate_required_output_contract(Path('modules/B/runs')/rid,'B')
          assert ok is False and errors
          print('\n'.join(errors))
          PY

      - name: Validate repaired repository
        run: |
          python tools/rfc.py doctor
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
          python tools/rfc.py context

      - name: Commit closed repair and governed B-first frontier
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then echo 'HARD STOP: repair produced no governed changes'; exit 1; fi
          git commit -m 'Close B-G source repair and reopen B-first superseding replay'
          git pull --rebase origin agent/frontier-050-execution
          git push origin HEAD:agent/frontier-050-execution
          echo "REPAIR_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify remote repair SHA and frontier
        run: |
          git fetch origin agent/frontier-050-execution
          test "$(git rev-parse origin/agent/frontier-050-execution)" = "$REPAIR_SHA"
          python - <<'PY'
          import json
          s=json.load(open('STATE.json')); q={x['id']:x for x in json.load(open('WORK_QUEUE.json'))['items']}
          assert s['repair_state']=='BG_SUPERSEDING_REPLAY_AUTHORIZED_B_FIRST',s
          assert s['active_work_unit']=='B-115' and s['current_run'].startswith('B-115-'),s
          assert s['modules']['B']['evidence_state']=='DESIGN' and s['modules']['B']['fidelity']=='PRODUCTION',s['modules']['B']
          assert s['modules']['G']['evidence_state']=='BLOCKED',s['modules']['G']
          assert [q[x]['status'] for x in ['B-115','C-125','D-135','E-145','F-155','G-160']]==['ACTIVE','BLOCKED','BLOCKED','BLOCKED','BLOCKED','BLOCKED']
          PY
          echo "Verified repair SHA: $REPAIR_SHA"
