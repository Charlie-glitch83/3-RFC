name: Purge post-G live tree once v4

on:
  pull_request:
    branches:
      - agent/frontier-050-execution
    types: [synchronize]
    paths:
      - 'ops/PURGE_POST_G_TRIGGER.txt'

permissions:
  contents: write

jobs:
  purge:
    if: github.event.pull_request.head.ref == 'ops/purge-post-g-20260810'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-lock.txt
      - name: Execute validated purge and retain workflow transport surface
        shell: bash
        run: |
          set -euo pipefail
          START="$(git rev-parse HEAD)"
          git show '1516171b36d4e339d0fc2460ebde9a983ca2a6f7:.github/workflows/purge-post-g-live-tree-once.yml' > /tmp/purge.yml
          python - <<'PY'
          from pathlib import Path
          lines=Path('/tmp/purge.yml').read_text().splitlines()
          start=next(i for i,x in enumerate(lines) if x.strip()=='- name: Rebuild authoritative live tree at the G boundary')
          run=next(i for i in range(start+1,len(lines)) if lines[i].strip()=='run: |')
          end=next(i for i in range(run+1,len(lines)) if lines[i].startswith('      - name: Commit and force-replace governed branch'))
          block=[x[10:] if x.startswith('          ') else x for x in lines[run+1:end]]
          text='\n'.join(block)+'\n'
          text=text.replace('python tools/rfc.py context\npython tools/rfc.py doctor', 'python tools/rfc.py context\npython tools/director.py prepare-active\npython tools/rfc.py doctor')
          Path('/tmp/purge-rebuild.sh').write_text(text)
          PY
          bash /tmp/purge-rebuild.sh
          git checkout "$START" -- .github/workflows
          git add -A
          git status --short
      - name: Commit and push non-workflow purge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Purge all live scientific state after Module G'
          git push --force-with-lease origin HEAD:agent/frontier-050-execution
          printf 'POST_G_CLEAN_COMMIT=%s\n' "$(git rev-parse HEAD)"
