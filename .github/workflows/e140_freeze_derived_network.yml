name: E140 Freeze Derived Network

on:
  pull_request:
    branches:
      - agent/frontier-050-execution

permissions:
  contents: write

jobs:
  freeze:
    if: github.event.pull_request.head.ref == 'ops/e140-instruction-locator-20260807'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Freeze exact E derivation before primary execution
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, math
          from pathlib import Path

          RUN_ID='E-140-20260807T155635Z'
          RUN=Path('modules/E/runs')/RUN_ID
          state=json.loads(Path('STATE.json').read_text())
          if state.get('active_work_unit')!='E-140' or state.get('current_module')!='E' or state.get('current_run')!=RUN_ID:
              raise SystemExit('HARD STOP: fresh E140 run is not solely authorized')
          if state['modules']['E']['evidence_state']!='DESIGN':
              raise SystemExit('HARD STOP: E must still be DESIGN before derivation freeze')

          def sha(path): return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          def read(path): return json.loads(Path(path).read_text())

          a_path='modules/A/frozen/H_A_to_B.json'
          b_path='modules/B/frozen/H_B_to_C.json'
          c_path='modules/C/runs/C-120-20260807T032543Z/primary/MICROSCOPIC_CONSTITUTION.json'
          d_path='modules/D/runs/D-130-20260807T053432Z/frozen/H_D_to_E.json'
          d_manifest='modules/D/runs/D-130-20260807T053432Z/GENERATED_OUTPUT_MANIFEST.json'
          recipe='recipes/E/recipe.json'
          work='recipes/E/WORK_ORDER.md'
          model_prompt='recipes/E/MODEL_PROMPT.md'
          spec='modules/E/spec.json'
          derivation_protocol='docs/09_DERIVATION_PROTOCOL.md'
          execution_protocol='docs/10_EXECUTION_PROTOCOL.md'
          zero_design='docs/26_ZERO_DESIGN_OPERATOR_PROTOCOL.md'
          constitution='docs/00_SCIENTIFIC_CONSTITUTION.md'
          binding_protocol='configured_runs/BINDING_PROTOCOL.md'
          wl1='recipes/E/wolfram/E-WL-001.wl'
          wl2='recipes/E/wolfram/E-WL-002.wl'

          A=read(a_path); B=read(b_path); C=read(c_path); D=read(d_path)
          dm=read(d_manifest)
          expected=next(x['sha256'] for x in dm['outputs'] if x['path']=='frozen/H_D_to_E.json')
          if sha(d_path)!=expected or expected!='199b89ccbdea06714a5539c5d3baf53cd332e5b65922676c6c8d37cc7c824af8':
              raise SystemExit('HARD STOP: exact D->E parent mismatch')

          delta=float(A['recursive_kernel']['specification']['delta'])
          nc=int(A['recursive_kernel']['specification']['closure_depth'])
          if abs(delta-float(B['operator']['delta']))>1e-15:
              raise SystemExit('HARD STOP: inherited delta mismatch')
          gap=float(C['constitution']['dimensionless_doublet_gap'])
          y0=list(map(float,D['final_population']))

          raw1=delta**-1
          raw2=delta**-2
          norm=raw1+raw2
          kf=raw1/norm
          kr=raw2/norm
          if abs((kf/kr)-delta)>1e-12 or abs((kf+kr)-1.0)>1e-12:
              raise SystemExit('HARD STOP: two-channel kernel normalization failed')

          # Reaction extent x: n=n0-x, p=p0-x, d=d0+x.
          n0,p0,d0=y0
          qa=kf
          qb=-(kf*(n0+p0)+kr)
          qc=kf*n0*p0-kr*d0
          disc=qb*qb-4*qa*qc
          roots=[(-qb-math.sqrt(disc))/(2*qa),(-qb+math.sqrt(disc))/(2*qa)]
          feasible=[x for x in roots if -d0-1e-14 <= x <= min(n0,p0)+1e-14]
          if len(feasible)!=1:
              raise SystemExit(f'HARD STOP: expected unique positivity-preserving equilibrium extent, got {feasible}')
          xeq=feasible[0]
          eq=[n0-xeq,p0-xeq,d0+xeq]
          qfreeze=delta**(-nc)
          xtarget=xeq + qfreeze*(0.0-xeq)
          r1,r2=sorted(roots)
          if abs(xeq-r1)>1e-12:
              raise SystemExit('HARD STOP: stable feasible root classification changed')
          def primitive(x):
              return math.log((x-r1)/(x-r2))/(kf*(r1-r2))
          tfreeze=primitive(xtarget)-primitive(0.0)
          if not math.isfinite(tfreeze) or tfreeze<=0:
              raise SystemExit('HARD STOP: invalid derived freeze time')
          max_step=tfreeze/128.0
          energy=[gap,gap,2.0*gap]

          source={
            'schema_version':'1.0','run_id':RUN_ID,'module':'E','generation_mode':'GENERATION_SEALED','public_data_declaration':'NONE',
            'exact_parents':[{'object_id':'H_D_to_E','path':d_path,'sha256':sha(d_path),'role':'SOLE_DIRECT_PHYSICAL_PARENT'}],
            'inherited_canonical_authorities':[
              {'path':a_path,'sha256':sha(a_path),'role':'CANONICAL_RECURSIVE_KERNEL_AND_DEPTH'},
              {'path':b_path,'sha256':sha(b_path),'role':'ANCESTRY_AND_DELTA_CONTINUITY'},
              {'path':c_path,'sha256':sha(c_path),'role':'INTERNAL_GAP_AND_CONSERVATION_SCALE'}
            ],
            'module_authorities':[
              {'path':recipe,'sha256':sha(recipe)}, {'path':work,'sha256':sha(work)}, {'path':model_prompt,'sha256':sha(model_prompt)}, {'path':spec,'sha256':sha(spec)},
              {'path':derivation_protocol,'sha256':sha(derivation_protocol)}, {'path':execution_protocol,'sha256':sha(execution_protocol)}, {'path':zero_design,'sha256':sha(zero_design)},
              {'path':constitution,'sha256':sha(constitution)}, {'path':binding_protocol,'sha256':sha(binding_protocol)}, {'path':wl1,'sha256':sha(wl1)}, {'path':wl2,'sha256':sha(wl2)}
            ],
            'historical_failures_used_for_generation':False,'public_or_observed_abundance_targets_used':False,'imports':[],'urls':[],'constants':[]
          }
          (RUN/'SOURCE_REGISTER.json').write_text(json.dumps(source,indent=2)+'\n')

          deriv={
            'schema_version':'1.0','object_id':'E140_FROZEN_DERIVATION_SPEC','run_id':RUN_ID,'module':'E','status':'FROZEN_BEFORE_PRIMARY_EXECUTION','generation_mode':'GENERATION_SEALED','fidelity':'MINIMAL_SPINE',
            'exact_parent':{'object_id':'H_D_to_E','path':d_path,'sha256':sha(d_path)},
            'triadic_descent':{
              'CIF':'E opens the source-owned three-species possibility basis [n,p,d] and the two ordered reversible reaction channels fixed by the E stoichiometric program.',
              'QV':'The inherited recursive kernel weights the ordered forward/reverse reaction channels by its first two normalized modal weights; mass-action flow selects the unique positivity-preserving equilibrium and recursively compresses residual disequilibrium.',
              'RFL':'The stabilized isotope-abundance state, additive conservation ledgers, freeze-out witness, delta-envelope uncertainty state, restart record and H_E_to_F are retained as downstream memory.'
            },
            'nbody_mode':'RELATIONAL_GRAMMAR_ACTIVE_REACTION_HYPERGRAPH_SPECIALIZATION',
            'species_and_graph':{
              'species':['n','p','d'],
              'semantics':'RFC Module-E internal primordial species labels in the exact E program order; no empirical Standard Model/nuclear correspondence is claimed at MINIMAL_SPINE.',
              'ordered_parent_map':'D final_population indices 0,1,2 map index-preservingly to E program species n,p,d.',
              'stoichiometry':[[-1,1],[-1,1],[1,-1]],
              'reactions':['n+p->d','d->n+p'],
              'rate_expressions':['kf*n*p','kr*d'],
              'invariants':{'baryon':[1.0,1.0,2.0],'charge':[0.0,1.0,1.0],'energy':energy},
              'energy_interpretation':'Internal parent-gap-scaled additive carrier energy E_i=g_C*A_i; this is conserved exactly by E stoichiometry. No dimensionful nuclear binding energy is claimed.'
            },
            'rate_law':{
              'canonical_kernel_expression':'w_j=delta^-j at the E reaction-clock origin; normalize over the two exact ordered E reaction channels.',
              'delta':delta,'closure_depth':nc,'raw_weights':[raw1,raw2],
              'kf_expression':'delta^-1/(delta^-1+delta^-2)=delta/(delta+1)','kr_expression':'delta^-2/(delta^-1+delta^-2)=1/(delta+1)',
              'kf':kf,'kr':kr,'kf_plus_kr':kf+kr,'kf_over_kr':kf/kr,
              'units':'inverse intrinsic E reaction-clock unit after kf+kr=1 gauge fixing',
              'uniqueness_statement':'For the exact two ordered E reaction channels, canonical kernel ordering and the intrinsic-clock normalization kf+kr=1 uniquely fix kf and kr. No observational or historical abundance coefficient enters.'
            },
            'initial_state':{'source':'exact D final_population','value':y0,'positive':min(y0)>0},
            'equilibrium':{
              'extent_equation':'F(x)=kf(n0-x)(p0-x)-kr(d0+x)=0',
              'roots':roots,'selected_extent':xeq,'selection_rule':'unique root on the positivity-preserving stoichiometric interval [-d0,min(n0,p0)]',
              'state':eq,'forward_reverse_balance_residual':kf*eq[0]*eq[1]-kr*eq[2]
            },
            'freeze_out':{
              'residual_extent_fraction_expression':'q_E=delta^-nClosure','q_E':qfreeze,
              'witness':'first state on the monotone physical extent branch satisfying |x_eq-x|/|x_eq-x0| <= q_E',
              'target_extent':xtarget,'derived_t_freeze':tfreeze,
              'interpretation':'QV has compressed the remaining reaction disequilibrium to the canonical recursive closure-depth factor; RFL stores the resulting abundance state.'
            },
            'execution':{
              't_span':[0.0,tfreeze],'method':'BDF','rtol':1e-9,'atol':1e-12,'max_step':max_step,
              'max_step_definition':'t_freeze/128, inheriting the immediately-parent D baseline resolution convention',
              'convergence_steps':[tfreeze/32.0,tfreeze/64.0,tfreeze/128.0,tfreeze/256.0],
              'positivity_tolerance':1e-9,'invariant_tolerance':1e-9
            },
            'uncertainty':{
              'classification':'INHERITED_SOURCE_DECIMAL_REPRESENTATION_ENVELOPE_PLUS_DERIVED_E_ENVELOPE_COVARIANCE',
              'delta_members':[x['delta'] for x in D['uncertainty_covariance']['decimal_envelope_replays']],
              'rule':'For each frozen delta member, inherit its D final_at_one_gap_efold state, rederive kf, kr, equilibrium, freeze witness and final E state with no retuning; report componentwise envelope and diagnostic covariance separately from stochastic covariance.',
              'stochastic_covariance':'ZERO_NO_STOCHASTIC_VARIABLE_ADMITTED'
            },
            'network_size_rule':'The E source graph has exactly two ordered reaction channels. N=1 forward-only and reverse-only truncations are mandatory withheld-reaction ablations; N=2 is the source-complete minimal-spine network. No unsupported third reaction may be added for a cosmetic size sequence.',
            'countermodels':['SCALAR_COLLAPSE: replace ordered kernel weights by kf=kr=1/2','FORWARD_WITHHELD: remove n+p->d','REVERSE_WITHHELD: remove d->n+p','CHANNEL_SWAP: exchange the two canonical kernel weights'],
            'gates':['baryon/charge/energy accounting','network convergence','rate-source audit','no scalar-channel collapse','withheld reaction and independent implementation checks'],
            'falsifiers':['exact D parent SHA mismatch','any historical/public abundance target enters generation','kf/kr differs from inherited delta above 1e-12','kf+kr differs from 1 above 1e-12','stoichiometric invariant residual exceeds 1e-12','any abundance below -1e-9','BDF refinement changes final state above 1e-8 L_infinity','independent extent reconstruction differs above 1e-8 L_infinity','full two-channel network is not distinguishable from scalar-collapse or withheld-channel countermodels'],
            'independent_verifier_design':'Reconstruct delta and nClosure from H_A_to_B ancestry, reconstruct kf/kr from the first two normalized kernel weights, inherit the exact D final population, solve the one-dimensional reaction-extent Riccati equation independently, derive the unique feasible equilibrium and q_E freeze witness, then compare against primary solver outputs without trusting primary gate summaries.',
            'claim_boundary':'Module E may establish an internally generated RFC minimal-spine primordial three-species reaction state, source-owned two-channel rate law, conserved baryon/charge/internal-energy ledgers, freeze-out witness and inherited uncertainty envelope. It does not establish calibrated nuclear reaction rates, MeV binding energies, SI time, Standard Model isotope correspondence, or empirical abundance agreement.'
          }
          (RUN/'FROZEN_DERIVATION_SPEC.json').write_text(json.dumps(deriv,indent=2)+'\n')

          lock={
            'schema_version':'1.0','run_id':RUN_ID,'status':'FROZEN','frozen_before_primary_execution':True,
            'authority_hashes':[sha(recipe),sha(work),sha(model_prompt),sha(spec),sha(derivation_protocol),sha(execution_protocol),sha(zero_design),sha(constitution),sha(binding_protocol)],
            'parent_hashes':[sha(d_path)],'definition_hashes':[sha(wl1),sha(wl2),sha(RUN/'FROZEN_DERIVATION_SPEC.json')],
            'candidate_classes':['exact ordered E two-channel kernel manifestation','withheld-channel ablations','scalar-collapse countermodel'],
            'equations_and_laws':['n+p<->d mass action','kf=delta/(delta+1)','kr=1/(delta+1)','extent F(x)=kf(n0-x)(p0-x)-kr(d0+x)','q_E=delta^-18'],
            'dimensions_units_frames_gauges_clocks':['abundances are dimensionless RFC carrier abundances','tau_E intrinsic dimensionless reaction clock','kf+kr=1 fixes reaction-clock gauge','energy ledger is parent-gap-scaled dimensionless internal energy'],
            'methods':['BDF primary','analytic/closed-form extent independent reconstruction'],'tolerances':['rtol=1e-9','atol=1e-12','positivity=1e-9','invariant=1e-9','reconstruction/convergence=1e-8'],
            'stopping_rules':['primary execution ends at derived q_E freeze witness','any unresolved __BIND token is hard stop'],
            'expected_invariants':['baryon','charge','parent-gap-scaled internal energy','positivity'],
            'tests':['exact Wolfram E-WL-001 and E-WL-002','manufactured reference check','rate refinement','withheld channels','scalar collapse','delta envelope','restart','clean replay','independent extent reconstruction'],
            'gates':deriv['gates'],'falsifiers':deriv['falsifiers'],'claim_boundary':deriv['claim_boundary'],'independent_verifier_design':deriv['independent_verifier_design'],
            'allowed_implementation_only_corrections':['serialization','path handling','numerical root/event location implementation','runner dependency installation; no source/rate/equation/gate/threshold/claim changes']
          }
          (RUN/'PRE_EXECUTION_LOCK.json').write_text(json.dumps(lock,indent=2)+'\n')
          PY
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
      - name: Commit frozen derivation and remove carrier
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/e140_freeze_derived_network.yml
          git config user.name '3-RFC governed executor'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Freeze E140 parent-derived reaction law'
          git pull --rebase origin agent/frontier-050-execution
          git push origin HEAD:agent/frontier-050-execution
