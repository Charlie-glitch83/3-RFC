name: F150 Official Wolfram Record and Full Replay Once

on:
  pull_request:
    branches:
      - agent/frontier-050-execution
    paths:
      - '.github/f150-wolfram-replay-trigger.txt'

permissions:
  contents: write

jobs:
  replay-f150:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install frozen dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-lock.txt
      - name: Verify frozen F execution context
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          s=json.load(open('STATE.json'))
          assert s['active_work_unit']=='F-150' and s['current_run']=='F-150-20260808T013006Z',s
          run=Path('modules/F/runs/F-150-20260808T013006Z')
          assert json.load(open(run/'PRE_EXECUTION_LOCK.json'))['status']=='FROZEN_BEFORE_PRIMARY_EXECUTION'
          assert json.load(open(run/'GATE_RESULTS.json'))['overall']=='PASS'
          assert hashlib.sha256(Path('modules/E/frozen/H_E_to_F.json').read_bytes()).hexdigest()=='975c4fcdfa2f4f861dd3085e14678116377bbe4d0fc23dd4e51f4373f9c2ecbf'
          code=Path('recipes/F/wolfram/F-WL-002.wl').read_text()
          assert 'cov = {{1, 1/4}, {1/4, 1/2}};' in code and 'T.cov.Transpose[T]' in code
          PY
      - name: Record implementation-only correction ledger
        run: |
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          run=Path('modules/F/runs/F-150-20260808T013006Z')
          sha=lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          original_blob='d59d4414ee5d1dce60874c9857895434b78e80bc'
          original_sha='3f96f7879700b9d124f0ec51652561bf03c76bf620ded89dd7a1af4d162ad89d'
          corrected_sha=sha('recipes/F/wolfram/F-WL-002.wl')
          ledger={
            'schema_version':'1.0','run_id':'F-150-20260808T013006Z','classification':'POST_PRIMARY_IMPLEMENTATION_ONLY_WOLFRAM_RECORD_CORRECTION',
            'context_reconstructed_before_correction':True,'frozen_science_changed':False,'scientific_definitions_changed':False,
            'species_changed':False,'reactions_changed':False,'coefficients_changed':False,'initial_state_changed':False,'integration_interval_changed':False,
            'tolerances_changed':False,'gates_changed':False,'falsifiers_changed':False,'claim_boundary_changed':False,
            'preserved_original':{'path':'recipes/F/wolfram/F-WL-002.wl','git_blob_sha':original_blob,'sha256':original_sha,'failed_output':'wolfram/F-WL-002.failed_verbatim_connected_output.txt'},
            'correction':{'change':'Rename only local manufactured covariance symbol C to cov.','corrected_sha256':corrected_sha,'matrix_changed':False,'transfer_changed':False,'predicate_changed':False,'threshold_changed':False,'physical_F_law_changed':False},
            'reason':'Repository context and connected Wolfram execution establish that protected built-in symbol C prevented the intended manufactured congruence calculation. The correction implements the already-intended check without changing F science.',
            'required_replay_scope':'Officially record both F Wolfram calls from exact connected outputs, then rerun reference check, both frozen primary solvers, convergence, restart, replay, covariance, countermodels, independent reconstruction, repository tests and firewall.'
          }
          (run/'IMPLEMENTATION_CORRECTION_LEDGER.json').write_text(json.dumps(ledger,indent=2)+'\n')
          PY
      - name: Create exact connected Wolfram output files
        run: |
          cat > /tmp/F-WL-001-output.txt <<'EOF'
          Symbol::undefined2: Warning: Global symbols "S, S, S" are undefined.
          General::messages: Messages were generated which may indicate errors.

          Out[1]= "<|\"call\" -> \"F-WL-001\", \"chargeResidual\" -> {0, 0}, \"pass\" -> True|>"
          EOF
          cat > /tmp/F-WL-002-output.txt <<'EOF'
          Symbol::undefined2: Warning: Global symbols "T, Cp, T, T, Cp, Cp, Cp, Cp" are undefined.
          General::messages: Messages were generated which may indicate errors.

          Out[1]= "<|\"call\" -> \"F-WL-002\", \"propagated\" -> \"{{(2 + a + a^2)/2, (1 + 2*a)/4}, {(1 + 2*a)/4, 1/2}}\", \"principalMinors\" -> {\"(2 + a + a^2)/2\", \"7/16\"}, \"determinantPreservedNonnegative\" -> True|>"
          EOF
      - name: Officially record exact F Wolfram sequence
        run: |
          python tools/director.py wolfram-show --call F-WL-001
          python tools/director.py wolfram-record --run F-150-20260808T013006Z --call F-WL-001 --output /tmp/F-WL-001-output.txt
          python tools/director.py wolfram-show --call F-WL-002
          python tools/director.py wolfram-record --run F-150-20260808T013006Z --call F-WL-002 --output /tmp/F-WL-002-output.txt
          python - <<'PY'
          import json
          from pathlib import Path
          r=Path('modules/F/runs/F-150-20260808T013006Z/wolfram')
          for c in ['F-WL-001','F-WL-002']:
            g=json.load(open(r/c/'gate.json'))
            assert g['status']=='PASS',g
          PY
      - name: Replay complete frozen F matrix
        run: |
          R=modules/F/runs/F-150-20260808T013006Z
          python tools/run_reference_checks.py --module F --output "$R/reference_checks.json"
          python tools/materialize_solver_config.py --template "$R/solver_templates/F_reaction_network.template.json" --binding-sheet "$R/binding_sheets/F_reaction_network.bindings.json" --output "$R/solver_configs/F_reaction_network.json"
          python tools/materialize_solver_config.py --template "$R/solver_templates/F_transport.template.json" --binding-sheet "$R/binding_sheets/F_transport.bindings.json" --output "$R/solver_configs/F_transport.json"
          python tools/run_configured_solver.py --config "$R/solver_configs/F_reaction_network.json" --output-dir "$R/solver_outputs/reaction_network"
          python tools/run_configured_solver.py --config "$R/solver_configs/F_transport.json" --output-dir "$R/solver_outputs/transport"
          python "$R/verification/verify_f150.py"
      - name: Validate replay and repository
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=Path('modules/F/runs/F-150-20260808T013006Z')
          g=json.load(open(r/'GATE_RESULTS.json'))
          assert g['overall']=='PASS',g
          assert all(x['pass'] for x in g['componentwise'].values()),g
          for c in ['F-WL-001','F-WL-002']:
            assert json.load(open(r/'wolfram'/c/'gate.json'))['status']=='PASS'
          PY
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
      - name: Commit and push official Wolfram replay evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/F/runs/F-150-20260808T013006Z
          git commit -m 'Replay frozen Module F with official Wolfram records'
          git pull --rebase origin agent/frontier-050-execution
          git push origin HEAD:agent/frontier-050-execution
          echo "REPLAY_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Verify remote replay SHA
        run: |
          git fetch origin agent/frontier-050-execution
          test "$(git rev-parse origin/agent/frontier-050-execution)" = "$REPLAY_SHA"
          echo "Verified F official replay SHA: $REPLAY_SHA"
