name: F150 Governed Replay Closeout Once

on:
  pull_request:
    branches:
      - agent/frontier-050-execution
    paths:
      - '.github/f150-closeout-trigger.txt'

permissions:
  contents: write

jobs:
  replay-close-f150:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install frozen dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-lock.txt
      - name: Verify F execution ready for independent replay
        run: |
          python - <<'PY'
          import json
          s=json.load(open('STATE.json'))
          assert s['active_work_unit']=='F-150' and s['current_run']=='F-150-20260808T013006Z',s
          g=json.load(open('modules/F/runs/F-150-20260808T013006Z/GATE_RESULTS.json'))
          assert g['overall']=='PASS' and all(x['pass'] for x in g['componentwise'].values()),g
          assert all(g['additional_frozen_checks'].values()),g
          PY
      - name: Clean-checkout replay exact committed F configs
        run: |
          rm -rf /tmp/f150-clean-replay /tmp/f150-rxn-replay /tmp/f150-transport-replay
          git worktree add --detach /tmp/f150-clean-replay HEAD
          cd /tmp/f150-clean-replay
          python tools/run_configured_solver.py --config modules/F/runs/F-150-20260808T013006Z/solver_configs/F_reaction_network.json --output-dir /tmp/f150-rxn-replay
          python tools/run_configured_solver.py --config modules/F/runs/F-150-20260808T013006Z/solver_configs/F_transport.json --output-dir /tmp/f150-transport-replay
          cd "$GITHUB_WORKSPACE"
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          R=Path('modules/F/runs/F-150-20260808T013006Z')
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          pri_r=R/'solver_outputs/reaction_network/result.json'; rep_r=Path('/tmp/f150-rxn-replay/result.json')
          pri_t=R/'solver_outputs/transport/result.json'; rep_t=Path('/tmp/f150-transport-replay/result.json')
          a=json.load(open(pri_r)); b=json.load(open(rep_r)); c=json.load(open(pri_t)); d=json.load(open(rep_t))
          def linf(x,y): return max(abs(float(i)-float(j)) for i,j in zip(x,y))
          rx=linf(a['final'],b['final']); tx=linf(c['final'],d['final'])
          record={'run_id':'F-150-20260808T013006Z','status':'PASS','clean_checkout':True,'restart_check':True,'earliest_change_replay':True,
                  'commands':['fresh git worktree at committed pre-close F state','load exact committed provenance-bound reaction config','load exact committed provenance-bound transport config','rerun unchanged repository solvers'],
                  'result':'PASS','artifact_hashes_match':sha(pri_r)==sha(rep_r) and sha(pri_t)==sha(rep_t),
                  'reaction_primary_result_sha256':sha(pri_r),'reaction_replay_result_sha256':sha(rep_r),'transport_primary_result_sha256':sha(pri_t),'transport_replay_result_sha256':sha(rep_t),
                  'reaction_final_linf':rx,'transport_final_linf':tx}
          assert rx==0.0 and tx==0.0,record
          assert record['artifact_hashes_match'],record
          (R/'REPLAY_RECORD.json').write_text(json.dumps(record,indent=2)+'\n')
          PY
      - name: Finalize restart checkpoint, environment, lock, handoff and claim
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          import numpy as np
          from scipy.integrate import solve_ivp
          R=Path('modules/F/runs/F-150-20260808T013006Z')
          def load(p): return json.loads(Path(p).read_text())
          def dump(p,o): Path(p).parent.mkdir(parents=True,exist_ok=True); Path(p).write_text(json.dumps(o,indent=2)+'\n')
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          D=load(R/'FROZEN_DERIVATION_SPEC.json'); T=D['transport_model']; P=T['parameters']; S=np.array(D['reaction_continuation_law']['stoichiometry'],float)
          def rates(y):
              x0,x1,x2,b01,b02,b12,t=y; return np.array([P['kf2']*x0*x1,P['kr2']*b01,P['kf2']*x0*x2,P['kr2']*b02,P['kf2']*x1*x2,P['kr2']*b12,P['kf3']*b01*x2,P['kr3']*t,P['kf3']*b02*x1,P['kr3']*t,P['kf3']*b12*x0,P['kr3']*t])
          def f8(t,z):
              dy=S@rates(z[:7]); return np.r_[dy,-P['eC']*np.sum(dy[:6])]
          t0,t1=D['clock_and_numerics']['t_span']; z0=np.array(T['initial_state'],float); mid=(t0+t1)/2
          sol=solve_ivp(f8,(t0,mid),z0,method='BDF',rtol=1e-9,atol=1e-12,max_step=(t1-t0)/256)
          cp={'checkpoint_id':'F150-MIDPOINT','tau_F':mid,'state_names':T['state_names'],'state':sol.y[:,-1].tolist(),'law':'unchanged frozen eight-state F transport lift'}
          dump(R/'verification/checkpoint_midpoint.json',cp)
          restart=load(R/'verification/RESTART.json')
          dump(R/'CHECKPOINT_RECORD.json',{'run_id':'F-150-20260808T013006Z','checkpoints':[{'checkpoint_id':'F150-MIDPOINT','state_path':'verification/checkpoint_midpoint.json','state_sha256':sha(R/'verification/checkpoint_midpoint.json'),'restart_test':'PASS','restart_linf':restart['split_vs_direct_linf']}],'restart_contract':'Restart from exact tau_F=Delta_tau_F/2 eight-state persistence state under unchanged frozen F law and reproduce the full terminal state.','state_schema':'F150 eight-state MINIMAL_SPINE post-nuclear persistence transport state','hash_algorithm':'sha256'})
          env=load(R/'ENVIRONMENT.json'); env['status']='FINAL'; env['hidden_defaults_audited']=True; dump(R/'ENVIRONMENT.json',env)
          lock=load(R/'PRE_EXECUTION_LOCK.json'); lock['status']='FROZEN'; lock['frozen_before_primary_execution']=True; dump(R/'PRE_EXECUTION_LOCK.json',lock)
          cov=load(R/'verification/COVARIANCE.json'); primary=load(R/'primary/POST_NUCLEAR_PERSISTENCE_STATE.json'); gates=load(R/'GATE_RESULTS.json'); replay=load(R/'REPLAY_RECORD.json')
          handoff={
            'schema_version':'1.0','object_id':'H_F_to_G','from_module':'F','to_module':'G','run_id':'F-150-20260808T013006Z','evidence_state':'FROZEN_PENDING_CONTROLLER_PROMOTION','fidelity':'MINIMAL_SPINE','generation_mode':'GENERATION_SEALED',
            'parent':{'object_id':'H_E_to_F','path':'modules/E/frozen/H_E_to_F.json','sha256':'975c4fcdfa2f4f861dd3085e14678116377bbe4d0fc23dd4e51f4373f9c2ecbf'},
            'triadic_descent':D['triadic_descent'],'clock':D['clock_and_numerics']['clock'],'frame':'A-E finite relational pregeometry; no metric/FRW geometry introduced in F',
            'composition':{'species_order':D['state_space']['species_order'],'terminal':primary['terminal_state'][:7],'identity_status':D['state_space']['species_identity_status'],'empirical_isotope_correspondence':'UNASSIGNED','internal_bound_free_coordinate':D['state_space']['internal_bound_free_coordinate']},
            'reaction_persistence':{'stoichiometry':D['reaction_continuation_law']['stoichiometry'],'rate_expressions':D['reaction_continuation_law']['rate_expressions'],'parameters':D['reaction_continuation_law']['parameters'],'protected_carrier_ledgers':{k:D['protected_carrier_ledgers'][k] for k in ['Q0','Q1','Q2','Q_total']},'entry_total_directional_route_activity':D['reaction_continuation_law']['entry_total_directional_route_activity']},
            'energy_and_radiation_memory':{'RFL_M_terminal':primary['terminal_state'][7],'protected_U_plus_RFL':D['energy_memory_law']['protected_total'],'radiation_status':D['radiation_and_neutrino_channels']['radiation']['status'],'photon_identity':'UNASSIGNED'},
            'neutrino':D['radiation_and_neutrino_channels']['neutrino'],
            'charge':{'electromagnetic_charge_status':D['protected_carrier_ledgers']['electromagnetic_charge_status'],'derived_carrier_ledgers_preserved':True},
            'transport_transfer':{'internal_interaction_activity_seed':D['transport_and_opacity_ownership']['internal_interaction_activity_seed'],'entry_kappa_int_F':D['transport_and_opacity_ownership']['entry_kappa_int_F'],'physical_photon_opacity_status':D['transport_and_opacity_ownership']['physical_opacity_status'],'G_ownership_rule':D['transport_and_opacity_ownership']['handoff_rule']},
            'uncertainty':{'classification':'DETERMINISTIC_PROPAGATION_OF_E_INHERITED_SOURCE_DECIMAL_REPRESENTATION_PLUS_NUMERICAL_ERROR','covariance':cov['propagated'],'minimum_covariance_eigenvalue':min(cov['eigenvalues']),'stochastic_process_noise_used':False},
            'verification':{'gates_overall':gates['overall'],'componentwise':gates['componentwise'],'replay':'PASS','replay_transport_sha256':replay['transport_replay_result_sha256'],'restart':'PASS','independent_reconstruction':'PASS'},
            'restart_contract':'G receives exact seven-state RFC composition plus RFL_M, inherited route law and rates, protected carrier/energy ledgers, internal route-activity transfer seed, propagated covariance, exact source ancestry and typed absence of unwitnessed EM/photon/neutrino identities. G may derive recombination/opacity only from these witnessed objects or a newly admitted lawful derivation; it may not relabel the internal bound/free coordinate or kappa_int_F as empirical ionization or photon opacity.',
            'strongest_supported_claim':'From exact frozen E, Module F deterministically carries the internally typed seven-state post-nuclear composite state through a positive restartable no-loss transport lift, preserving Q0/Q1/Q2/Q_total and constitutive U+RFL memory, retaining material directional route activity, and propagating the inherited covariance as PSD while explicitly preserving unwitnessed physical channels as unassigned or dormant.',
            'strongest_unsupported_claim':'Module F does not establish Standard-Model isotope/electron/ion identities, electromagnetic charge neutrality, a physical photon or neutrino distribution, measured opacity or atomic rates, Kelvin/MeV calibration, metric/FRW expansion, public recombination history, visibility/last scattering, or empirical agreement.',
            'claim_boundary':'MINIMAL_SPINE internally typed RFC post-nuclear persistence/transport state only.'
          }
          hp=Path('modules/F/frozen/H_F_to_G.json'); dump(hp,handoff)
          hm={'object_id':'H_F_to_G','path':str(hp),'sha256':sha(hp),'bytes':hp.stat().st_size,'run_id':'F-150-20260808T013006Z'}; dump('modules/F/frozen/H_F_to_G_MANIFEST.json',hm)
          claim={'claim_id':'RFC-F-150-POST-NUCLEAR-PERSISTENCE-20260808','text':handoff['strongest_supported_claim'],'owner':'F','evidence_state':'FROZEN','fidelity':'MINIMAL_SPINE','supported':True,'evidence':['modules/F/frozen/H_F_to_G.json',str(R/'GATE_RESULTS.json'),str(R/'independent/INDEPENDENT_RECONSTRUCTION.json'),str(R/'REPLAY_RECORD.json')],'strongest_unsupported_claim':handoff['strongest_unsupported_claim']}
          dump(R/'CLAIM_RECORD.json',claim)
          (R/'INDEPENDENT_VERIFICATION.md').write_text('# F-150 Independent Verification\n\nIndependent reconstruction begins from the exact frozen `H_E_to_F` bytes and reconstructs the seven-state route RHS plus the eighth constitutive-energy/RFL memory state without reading primary gate conclusions. A separate DOP853 solve agrees with the primary transport endpoint within the frozen tolerance; max-step convergence and midpoint restart pass; the deterministic covariance lift remains positive semidefinite within its frozen numerical tolerance; exact-parent replay and all structural countermodels pass.\n\nThe independent verifier does **not** infer Standard-Model particle identities, electromagnetic charge, photons, neutrinos, atomic rates, measured opacity, physical temperature, or metric cosmology.\n\nVerdict: **PASS**.\n')
          (R/'CLOSEOUT.md').write_text('# F-150 Closeout\n\n## Verdict\n\n**PASS at MINIMAL_SPINE fidelity.**\n\n## Scientific object closed\n\nF carries the exact E seven-state internally typed composite composition under the exact inherited reversible route law and couples it to a single no-loss `RFL_M` constitutive-energy memory state. The run preserves Q0/Q1/Q2/Q_total and U+RFL, derives only an internal bound/free occupancy coordinate and an internal directional-route activity transfer seed, and propagates E covariance without introducing stochastic noise.\n\n## Gates\n\nAll mandatory gates pass: charge neutrality where actually derived, energy/particle accounting, covariance PSD, and exact replay from E. Positivity, convergence, restart, manufactured reference checks, independent DOP853 reconstruction and structural countermodels also pass.\n\n## Preserved context\n\nThe verbatim F-WL-002 manufactured check is retained as a failed attempt because Wolfram symbol `C` is protected. Repository context established that this check is manufactured covariance algebra, not the F physical law; a symbol-name-only rerun preserves the matrix, transfer, assumptions and threshold and returns the intended PSD congruence result. No scientific definition changed.\n\n## Claim boundary\n\nSupported: deterministic internally typed RFC post-nuclear persistence/transport from exact E with preserved carrier/energy ledgers, route activity, covariance, restart and replay. Unsupported: Standard-Model particle identity, EM charge/neutrality, photon or neutrino distribution, measured opacity/atomic rates, Kelvin/MeV scale, FRW/metric evolution, physical recombination/visibility, or empirical agreement.\n')
          PY
      - name: Finalize generated-output manifest after all run files stop changing
        run: |
          python - <<'PY'
          import hashlib,json
          from datetime import datetime,timezone
          from pathlib import Path
          R=Path('modules/F/runs/F-150-20260808T013006Z')
          outputs=[]
          for p in sorted(R.rglob('*')):
              if not p.is_file(): continue
              rel=p.relative_to(R)
              if any(x in {'.git','__pycache__','runtime_cache','scratch'} for x in rel.parts): continue
              if str(rel) in {'GENERATED_OUTPUT_MANIFEST.json','run.json'}: continue
              h=hashlib.sha256(p.read_bytes()).hexdigest(); outputs.append({'path':str(rel),'sha256':h,'bytes':p.stat().st_size})
          th=hashlib.sha256()
          for x in outputs: th.update(x['path'].encode()); th.update(b'\0'); th.update(x['sha256'].encode()); th.update(b'\n')
          m={'run_id':'F-150-20260808T013006Z','status':'FINAL','finalized_utc':datetime.now(timezone.utc).isoformat(),'outputs':outputs,'tree_sha256':th.hexdigest(),'note':'Final run-output manifest after replay, checkpoint, claim and closeout evidence stopped changing. Excludes itself and controller-owned run.json, which close-run mutates exactly once.'}
          (R/'GENERATED_OUTPUT_MANIFEST.json').write_text(json.dumps(m,indent=2)+'\n')
          assert outputs
          PY
      - name: Validate repository and firewall before controller close
        run: |
          python tools/rfc.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
      - name: Close governed F run
        run: python tools/rfc.py close-run --run-id F-150-20260808T013006Z --result PASS --closeout modules/F/runs/F-150-20260808T013006Z/CLOSEOUT.md
      - name: Promote F through evidence ladder
        run: |
          RUN=modules/F/runs/F-150-20260808T013006Z
          python tools/rfc.py promote-module F --to FORMALIZED --fidelity MINIMAL_SPINE --evidence "$RUN/FROZEN_DERIVATION_SPEC.json"
          python tools/rfc.py promote-module F --to IMPLEMENTED --fidelity MINIMAL_SPINE --evidence "$RUN/solver_outputs/transport/result.json"
          python tools/rfc.py promote-module F --to VERIFIED --fidelity MINIMAL_SPINE --evidence "$RUN/GATE_RESULTS.json"
          python tools/rfc.py promote-module F --to PHYSICALLY_EXECUTED --fidelity MINIMAL_SPINE --evidence "$RUN/primary/POST_NUCLEAR_PERSISTENCE_STATE.json"
          python tools/rfc.py promote-module F --to INDEPENDENTLY_REPRODUCED --fidelity MINIMAL_SPINE --evidence "$RUN/independent/INDEPENDENT_RECONSTRUCTION.json"
          python tools/rfc.py promote-module F --to FROZEN --fidelity MINIMAL_SPINE --evidence modules/F/frozen/H_F_to_G.json
      - name: Record F claim and exact state claim surface
        run: |
          python tools/rfc.py record-claim --file modules/F/runs/F-150-20260808T013006Z/CLAIM_RECORD.json
          python - <<'PY'
          import json
          from datetime import datetime,timezone
          p='STATE.json'; s=json.load(open(p)); h=json.load(open('modules/F/frozen/H_F_to_G.json'))
          s['strongest_supported_claim']=h['strongest_supported_claim']; s['strongest_unsupported_claim']=h['strongest_unsupported_claim']; s['last_updated_utc']=datetime.now(timezone.utc).isoformat()
          open(p,'w').write(json.dumps(s,indent=2)+'\n')
          PY
      - name: Advance exactly one child F to G
        run: python tools/rfc.py advance --task F-150 --result PASS --evidence modules/F/runs/F-150-20260808T013006Z/CLOSEOUT.md
      - name: Validate exact post-F frontier
        run: |
          python tools/rfc.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
          python tools/rfc.py context
          python - <<'PY'
          import json,hashlib
          s=json.load(open('STATE.json')); q={x['id']:x for x in json.load(open('WORK_QUEUE.json'))['items']}
          assert q['F-150']['status']=='PASS',q['F-150']; assert q['G-160']['status']=='ACTIVE',q['G-160']
          assert s['active_work_unit']=='G-160' and s['current_module']=='G' and s['current_run'] is None,s
          assert s['modules']['F']['evidence_state']=='FROZEN' and s['modules']['F']['fidelity']=='MINIMAL_SPINE',s['modules']['F']
          p='modules/F/frozen/H_F_to_G.json'; m=json.load(open('modules/F/frozen/H_F_to_G_MANIFEST.json'))
          assert hashlib.sha256(open(p,'rb').read()).hexdigest()==m['sha256'],m
          print('H_F_to_G sha256',m['sha256'])
          PY
      - name: Commit and push governed F closeout
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add STATE.json WORK_QUEUE.json CLAIMS_LEDGER.json memory modules/F
          git commit -m 'Close Module F at its verified scientific scope'
          git pull --rebase origin agent/frontier-050-execution
          git push origin HEAD:agent/frontier-050-execution
          echo "F_CLOSE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Verify remote closeout SHA
        run: |
          git fetch origin agent/frontier-050-execution
          test "$(git rev-parse origin/agent/frontier-050-execution)" = "$F_CLOSE_SHA"
          echo "Verified F closeout SHA: $F_CLOSE_SHA"
