name: F-155 production execution

on:
  push:
    branches:
      - agent/frontier-050-execution
    paths:
      - tools/execute_f155.py
      - .github/workflows/f155-execute.yml
      - modules/F/runs/F-155-20260808T165152Z/scratch/wolfram_external/**

permissions:
  contents: write

jobs:
  execute-f155:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy sympy

      - name: Reopen F at production fidelity
        run: python tools/rfc.py reopen-module F --fidelity PRODUCTION --evidence recovery/BG_SUPERSEDING_LINEAGE_PACKET.md

      - name: Repository and execution-director checks
        run: |
          python tools/rfc.py doctor
          python tools/director.py doctor
          python -m unittest discover -s tests -v

      - name: Freeze F derivation and bind local engines
        run: python tools/execute_f155.py prepare --run modules/F/runs/F-155-20260808T165152Z

      - name: Register exact Wolfram results
        run: |
          python tools/director.py wolfram-record --run F-155-20260808T165152Z --call F-WL-001 --output modules/F/runs/F-155-20260808T165152Z/scratch/wolfram_external/F-WL-001.txt
          python tools/director.py wolfram-record --run F-155-20260808T165152Z --call F-WL-002 --output modules/F/runs/F-155-20260808T165152Z/scratch/wolfram_external/F-WL-002.txt

      - name: Manufactured reference checks
        run: python tools/run_reference_checks.py --module F --output modules/F/runs/F-155-20260808T165152Z/reference_checks.json

      - name: Materialize frozen solver configs
        run: |
          RUN=modules/F/runs/F-155-20260808T165152Z
          python tools/materialize_solver_config.py --template "$RUN/solver_templates/F_reaction_network.template.json" --binding-sheet "$RUN/binding_sheets/F_reaction_network.bindings.json" --output "$RUN/solver_configs/F_reaction_network.json"
          python tools/materialize_solver_config.py --template "$RUN/solver_templates/F_transport.template.json" --binding-sheet "$RUN/binding_sheets/F_transport.bindings.json" --output "$RUN/solver_configs/F_transport.json"

      - name: Execute primary local engines
        run: |
          RUN=modules/F/runs/F-155-20260808T165152Z
          python tools/run_configured_solver.py --config "$RUN/solver_configs/F_reaction_network.json" --output-dir "$RUN/solver_outputs/reaction_network"
          python tools/run_configured_solver.py --config "$RUN/solver_configs/F_transport.json" --output-dir "$RUN/solver_outputs/transport"

      - name: Freeze refinement configs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          run=Path('modules/F/runs/F-155-20260808T165152Z')
          spec=json.loads((run/'FROZEN_DERIVATION_SPEC.json').read_text())
          for name, key in [('F_reaction_network.json','reaction'),('F_transport.json','transport')]:
              src=run/'solver_configs'/name
              cfg=json.loads(src.read_text())
              refined=spec['implementation_checks'][key]['refined_max_step']
              if key=='reaction': cfg['max_step']=refined
              else: cfg['model']['max_step']=refined
              dest=run/'convergence/solver_configs_refined'/name
              dest.parent.mkdir(parents=True,exist_ok=True)
              dest.write_text(json.dumps(cfg,indent=2)+'\n')
          PY

      - name: Execute refinement engines
        run: |
          RUN=modules/F/runs/F-155-20260808T165152Z
          python tools/run_configured_solver.py --config "$RUN/convergence/solver_configs_refined/F_reaction_network.json" --output-dir "$RUN/convergence/solver_outputs_refined/reaction_network"
          python tools/run_configured_solver.py --config "$RUN/convergence/solver_configs_refined/F_transport.json" --output-dir "$RUN/convergence/solver_outputs_refined/transport"

      - name: Build primary F scientific objects
        run: python tools/execute_f155.py execute --run modules/F/runs/F-155-20260808T165152Z --output-root modules/F/runs/F-155-20260808T165152Z

      - name: Independent deterministic replay
        run: |
          RUN=modules/F/runs/F-155-20260808T165152Z
          REPLAY=/tmp/f155-replay
          mkdir -p "$REPLAY/solver_outputs" "$REPLAY/convergence/solver_outputs_refined"
          python tools/run_configured_solver.py --config "$RUN/solver_configs/F_reaction_network.json" --output-dir "$REPLAY/solver_outputs/reaction_network"
          python tools/run_configured_solver.py --config "$RUN/solver_configs/F_transport.json" --output-dir "$REPLAY/solver_outputs/transport"
          python tools/run_configured_solver.py --config "$RUN/convergence/solver_configs_refined/F_reaction_network.json" --output-dir "$REPLAY/convergence/solver_outputs_refined/reaction_network"
          python tools/run_configured_solver.py --config "$RUN/convergence/solver_configs_refined/F_transport.json" --output-dir "$REPLAY/convergence/solver_outputs_refined/transport"
          python tools/execute_f155.py execute --run "$RUN" --output-root "$REPLAY" --solver-root "$REPLAY/solver_outputs" --refinement-root "$REPLAY/convergence/solver_outputs_refined"
          python tools/execute_f155.py finalize --run "$RUN" --replay-root "$REPLAY"

      - name: Enforce live scientific completion contract
        run: python tools/scientific_completion_guard.py --run modules/F/runs/F-155-20260808T165152Z

      - name: Close run and promote F evidence
        run: |
          RUN=modules/F/runs/F-155-20260808T165152Z
          python tools/rfc.py close-run --run-id F-155-20260808T165152Z --result PASS --closeout "$RUN/CLOSEOUT.md"
          python tools/rfc.py promote-module F --to FORMALIZED --fidelity PRODUCTION --evidence "$RUN/FROZEN_DERIVATION_SPEC.json"
          python tools/rfc.py promote-module F --to IMPLEMENTED --fidelity PRODUCTION --evidence "$RUN/primary/POST_NUCLEAR_PLASMA_V2.json"
          python tools/rfc.py promote-module F --to VERIFIED --fidelity PRODUCTION --evidence "$RUN/GATE_RESULTS.json"
          python tools/rfc.py promote-module F --to PHYSICALLY_EXECUTED --fidelity PRODUCTION --evidence "$RUN/primary/POST_NUCLEAR_PLASMA_V2.json"
          python tools/rfc.py promote-module F --to INDEPENDENTLY_REPRODUCED --fidelity PRODUCTION --evidence "$RUN/independent/INDEPENDENT_RECONSTRUCTION.json"
          python tools/rfc.py promote-module F --to FROZEN --fidelity PRODUCTION --evidence modules/F/frozen/H_F_to_G_v2.json
          python tools/rfc.py freeze modules/F/frozen/H_F_to_G_v2.json --kind MODULE_HANDOFF
          python tools/rfc.py record-claim --file "$RUN/CLAIM_RECORD.json"

      - name: Update current claim boundary and context
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          hand=json.loads(Path('modules/F/frozen/H_F_to_G_v2.json').read_text())
          p=Path('STATE.json'); state=json.loads(p.read_text())
          state['strongest_supported_claim']=hand['strongest_supported_claim']
          state['strongest_unsupported_claim']=hand['strongest_unsupported_claim']
          state['repair_state']='F155_PRODUCTION_CLOSED_PENDING_VERIFIED_COMMIT_AND_CHILD_ADVANCE'
          p.write_text(json.dumps(state,indent=2)+'\n')
          PY
          python tools/rfc.py context
          python tools/rfc.py doctor

      - name: Commit closed F-155 state without advancing G
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Close F-155 superseding F replay at verified scope'
          git push origin HEAD:agent/frontier-050-execution
