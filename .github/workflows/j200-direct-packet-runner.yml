name: Boot 3-RFC exactly from root README

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  boot-repository:
    if: github.event.head_commit.message == 'Boot 3-RFC exactly from root README'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Execute root README boot exactly
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-lock.txt
          bash bootstrap.sh
          bash tools/start_work.sh
          echo '=== ACTIVE ==='
          python tools/director.py active
          echo '=== ACTIVE PACKET ==='
          cat work_packets/ACTIVE_WORK_PACKET.md
          python - <<'PY'
          import json
          s=json.load(open('STATE.json'))
          active=s['active_work_unit']
          assert active=='J-200',s
          assert s['current_module']=='J',s
          assert s['current_run'],s
          print('CURRENT_RUN='+s['current_run'])
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add STATE.json memory/CURRENT_CONTEXT.md memory/RUN_INDEX.json work_packets/ACTIVE_WORK_PACKET.md modules/J/runs
          if ! git diff --cached --quiet; then
            git commit -m 'Run repository-prescribed boot for active J-200'
            git push origin HEAD:agent/frontier-050-execution
            printf 'BOOT_COMMIT=%s\n' "$(git rev-parse HEAD)"
          else
            printf 'BOOT_NO_CHANGES_HEAD=%s\n' "$(git rev-parse HEAD)"
          fi
