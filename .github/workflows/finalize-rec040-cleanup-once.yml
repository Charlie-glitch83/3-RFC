name: Finalize REC-040 cleanup once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements-lock.txt
      - name: Correct provenance, remove temporary artifacts, and validate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          final='c29b124760302471c55dbf0fe49582af5f8cc10a'
          old='5f3216de0bf6e2e2b4cb8966bc468a852284225c'
          state_path=Path('STATE.json')
          state=json.loads(state_path.read_text())
          if state.get('active_work_unit')!='FRONTIER-050' or state.get('current_run') is not None:
              raise SystemExit('unexpected final REC-040 state')
          state['last_verified_commit']=final
          state['last_verified_branch']='agent/rec-040-execution'
          state['last_updated_utc']=datetime.now(timezone.utc).isoformat()
          state_path.write_text(json.dumps(state,indent=2)+'\n',encoding='utf-8')

          log=Path('memory/DECISION_LOG.jsonl')
          rows=[]
          for line in log.read_text(encoding='utf-8').splitlines():
              if not line.strip(): continue
              rec=json.loads(line)
              if rec.get('work_unit')=='REC-040' and rec.get('commit_sha')==old:
                  rec['commit_sha']=final
                  rec['basis']=[x.replace(old,final) for x in rec.get('basis',[])]
                  if rec.get('decision_id','').startswith('COMMIT-'):
                      rec['decision_id']='COMMIT-'+final[:12]
                      rec['decision']='Verified final REC-040 exact-object recovery commit, five source-only Module L assets, exact hashes, quarantines, preserved validator failures, gate evidence, and closeout'
              rows.append(rec)
          log.write_text(''.join(json.dumps(x,ensure_ascii=False)+'\n' for x in rows),encoding='utf-8')

          failures=Path('memory/FAILURE_LOG.jsonl')
          fid='REC-040-VERIFIED-SHA-RACE'
          existing=failures.read_text(encoding='utf-8') if failures.exists() else ''
          if fid not in existing:
              rec={'failure_id':fid,'run_id':'REC-040-20260806T135256Z','gate':'formal transition provenance','category':'IMPLEMENTATION_DEFECT','description':'Concurrent successful replays caused formal transition bookkeeping to record an earlier valid evidence SHA instead of the final clean replay SHA. Provenance was corrected to the final verified commit without changing run evidence, classifications, gates, result, or next-child authorization.','changes_frozen_science':False,'timestamp_utc':datetime.now(timezone.utc).isoformat()}
              with failures.open('a',encoding='utf-8') as f:f.write(json.dumps(rec,ensure_ascii=False)+'\n')
          PY
          find .github -maxdepth 2 -type f \( -iname '*rec-040*' -o -iname '*rec040*' \) -delete
          python tools/rfc.py context
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
          git push origin --delete agent/rec-040-execution || true
      - name: Commit final clean state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize REC-040 provenance and cleanup'
          git push origin main
