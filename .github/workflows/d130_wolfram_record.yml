name: One-use D130 Wolfram record

on:
  pull_request:
    branches:
      - agent/frontier-050-execution

permissions:
  contents: write

jobs:
  record:
    if: github.event.pull_request.head.ref == 'ops/readme-exact-startup-20260807c'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record D-WL-001 exactly
        shell: bash
        run: python tools/director.py wolfram-record --run D-130-20260807T053432Z --call D-WL-001 --output modules/D/runs/D-130-20260807T053432Z/wolfram/D-WL-001/output.txt
      - name: Record D-WL-002 exactly
        shell: bash
        run: python tools/director.py wolfram-record --run D-130-20260807T053432Z --call D-WL-002 --output modules/D/runs/D-130-20260807T053432Z/wolfram/D-WL-002/output.txt
      - name: Commit records and remove one-use Wolfram carriers
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/d130_wolfram_show.yml .github/workflows/d130_wolfram_record.yml
          git config user.name '3-RFC governed executor'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Record D130 exact Wolfram outputs'
          git pull --rebase origin agent/frontier-050-execution
          git push origin HEAD:agent/frontier-050-execution
