name: Execute D-130 frozen diagnostic once

on:
  pull_request:
    branches: [agent/frontier-050-execution]

permissions:
  contents: write

jobs:
  execute:
    if: github.event.pull_request.head.ref == 'ops/d130-execute-trigger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements-lock.txt
      - name: Freeze implementation hashes before primary execution
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,subprocess
          from datetime import datetime,timezone
          from pathlib import Path
          run=Path('modules/D/runs/D-130-20260807T044911Z')
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          lock=json.loads((run/'PRE_EXECUTION_LOCK.json').read_text())
          assert lock['status']=='FROZEN'
          freeze=json.loads((run/'NUMERICAL_EXECUTION_FREEZE.json').read_text())
          assert freeze['status']=='FROZEN_BEFORE_PRIMARY_NUMERICAL_EXECUTION'
          obj={
            'schema_version':'1.0','run_id':'D-130-20260807T044911Z','status':'FROZEN_BEFORE_PRIMARY_NUMERICAL_EXECUTION',
            'frozen_utc':datetime.now(timezone.utc).isoformat(),'source_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'scientific_lock_sha256':sha(run/'PRE_EXECUTION_LOCK.json'),'derivation_spec_sha256':sha(run/'FROZEN_DERIVATION_SPEC.json'),'numerical_freeze_sha256':sha(run/'NUMERICAL_EXECUTION_FREEZE.json'),
            'primary_implementation':{'path':str(run/'primary/execute_d130.py'),'sha256':sha(run/'primary/execute_d130.py')},
            'independent_implementation':{'path':str(run/'independent/independent_reconstruct_d130.py'),'sha256':sha(run/'independent/independent_reconstruct_d130.py')},
            'no_scientific_changes_after_this_record':True
          }
          (run/'PRE_PRIMARY_NUMERICAL_LOCK.json').write_text(json.dumps(obj,indent=2)+'\n')
          PY
      - name: Register exact Wolfram outputs
        shell: bash
        run: |
          set -euo pipefail
          run=D-130-20260807T044911Z
          base=modules/D/runs/$run/wolfram
          python tools/director.py wolfram-record --run "$run" --call D-WL-001 --output "$base/D-WL-001/CAPTURED_OUTPUT.txt"
          python tools/director.py wolfram-record --run "$run" --call D-WL-002 --output "$base/D-WL-002/CAPTURED_OUTPUT.txt"
      - name: Run reference checks and copy exact solver
        shell: bash
        run: |
          set -euo pipefail
          run=modules/D/runs/D-130-20260807T044911Z
          python tools/run_reference_checks.py --module D --output "$run/reference_checks.json"
          python tools/director.py solver-copy --module D --solver transport --destination "$run"
      - name: Fill provenance binding sheet and materialize config
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          run=Path('modules/D/runs/D-130-20260807T044911Z')
          sheet=run/'binding_sheets/D_transport.bindings.json'
          data=json.loads(sheet.read_text())
          parent=Path('modules/C/frozen/H_C_to_D.json')
          spec=run/'FROZEN_DERIVATION_SPEC.json'
          num=run/'NUMERICAL_EXECUTION_FREEZE.json'
          pobj=json.loads(parent.read_text()); nobj=json.loads(num.read_text())
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          values={
            'model.state_names':(['p1','p2','p3'],spec,'INTERNAL_DERIVATION','D_NORMALIZED_TRANSPORT_STATE_LABELS','dimensionless labels','3-state simplex'),
            'model.parameters':({},spec,'INTERNAL_DERIVATION','D_NORMALIZED_NO_FREE_RATE_PARAMETERS','dimensionless','none'),
            'model.rhs_expressions':(['-2*p1/3+p2/3+p3/3','p1/3-2*p2/3+p3/3','p1/3+p2/3-2*p3/3'],spec,'INTERNAL_DERIVATION','D_NORMALIZED_TRANSPORT_LAW','population per intrinsic-clock unit','dimensionless'),
            'model.initial_state':(pobj['prethermal_state']['node_populations'],parent,'EXACT_PARENT_ARTIFACT','H_C_to_D_PRETHERMAL_STATE','dimensionless probability','3'),
            'model.t_span':(nobj['intrinsic_execution_interval'],num,'INTERNAL_DERIVATION','D_INTRINSIC_EXECUTION_INTERVAL','intrinsic clock','dimensionless'),
            'model.max_step':(nobj['configured_solver']['max_step'],num,'INTERNAL_DERIVATION','D_NUMERICAL_STEP_FREEZE','intrinsic clock','dimensionless'),
            'model.linear_invariants':({'total_carrier':[1,1,1]},spec,'INTERNAL_DERIVATION','D_TOTAL_CARRIER_INVARIANT','dimensionless','linear invariant'),
            'model.invariant_tolerance':(nobj['configured_solver']['invariant_tolerance'],num,'INTERNAL_DERIVATION','D_NUMERICAL_TOLERANCE_FREEZE','dimensionless','absolute'),
            'model.positivity_tolerance':(nobj['configured_solver']['positivity_tolerance'],num,'INTERNAL_DERIVATION','D_NUMERICAL_TOLERANCE_FREEZE','dimensionless probability','absolute')
          }
          for rec in data['bindings']:
            v,origin,kind,dobj,units,dims=values[rec['path']]
            rec.update(value=v,origin_kind=kind,origin_path=str(origin),origin_sha256=sha(origin),module='D',derivation_object=dobj,units=units,dimensions=dims,justification='Frozen before primary numerical execution; no public targets or post-hoc values used.')
          sheet.write_text(json.dumps(data,indent=2)+'\n')
          PY
          run=modules/D/runs/D-130-20260807T044911Z
          python tools/materialize_solver_config.py --template "$run/solver_templates/D_transport.template.json" --binding-sheet "$run/binding_sheets/D_transport.bindings.json" --output "$run/solver_configs/D_transport.json"
      - name: Execute configured engine and local phase
        shell: bash
        run: |
          set -euo pipefail
          run=modules/D/runs/D-130-20260807T044911Z
          python tools/run_configured_solver.py --config "$run/solver_configs/D_transport.json" --output-dir "$run/solver_outputs/transport"
          bash tools/finish_local_phase.sh D "$run"
      - name: Execute actual parent-driven diagnostic and independent reconstruction
        shell: bash
        run: |
          set -euo pipefail
          run=modules/D/runs/D-130-20260807T044911Z
          python "$run/primary/execute_d130.py" | tee "$run/primary/EXECUTION_STDOUT.txt"
          python "$run/independent/independent_reconstruct_d130.py" | tee "$run/independent/EXECUTION_STDOUT.txt"
      - name: Clean-checkout replay from frozen source commit
        shell: bash
        run: |
          set -euo pipefail
          run=modules/D/runs/D-130-20260807T044911Z
          source_commit=$(python -c "import json;print(json.load(open('$run/PRE_PRIMARY_NUMERICAL_LOCK.json'))['source_commit'])")
          tmp=$(mktemp -d)
          git worktree add --detach "$tmp/replay" "$source_commit"
          cd "$tmp/replay"
          python -m pip install --disable-pip-version-check -r requirements-lock.txt >/dev/null
          python modules/D/runs/D-130-20260807T044911Z/primary/execute_d130.py > replay_stdout.txt
          cd - >/dev/null
          python - <<PY
          import hashlib,json
          from pathlib import Path
          live=Path('$run/primary/TRANSPORT_HISTORY.json')
          replay=Path('$tmp/replay/$run/primary/TRANSPORT_HISTORY.json')
          h=lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          rec={'source_commit':'$source_commit','clean_checkout':True,'live_sha256':h(live),'replay_sha256':h(replay),'exact_match':h(live)==h(replay),'command':'python modules/D/runs/D-130-20260807T044911Z/primary/execute_d130.py'}
          Path('$run/REPLAY_RECORD.json').write_text(json.dumps(rec,indent=2)+'\n')
          assert rec['exact_match']
          PY
          git worktree remove --force "$tmp/replay"
      - name: Assemble gates and blocker closeout
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          run=Path('modules/D/runs/D-130-20260807T044911Z')
          primary=json.loads((run/'primary/PRIMARY_DIAGNOSTICS.json').read_text())
          indep=json.loads((run/'independent/INDEPENDENT_RECONSTRUCTION.json').read_text())
          replay=json.loads((run/'REPLAY_RECORD.json').read_text())
          solver=json.loads((run/'solver_outputs/transport/result.json').read_text())
          phase=json.loads((run/'primary/PHASE_EVENT_LEDGER.json').read_text())
          gates={
            'run_id':'D-130-20260807T044911Z','overall':'BLOCKED',
            'component_gates':{
              'positive distributions':{'status':'PASS','evidence':primary['checks']['positivity'] and solver['pass_flags']['positivity']},
              'energy/charge conservation':{'status':'PASS','evidence':primary['checks']['conservation'] and solver['pass_flags']['linear_invariants']},
              'event ordering':{'status':'PASS_WITH_NO_EVENT_WITNESS','evidence':phase['public_target_values_used'] is False and phase['events']==[]},
              'stiff-solver convergence':{'status':'PASS','evidence':primary['checks']['refinement'] and primary['checks']['analytic_match']},
              'restart and independent reconstruction':{'status':'PASS','evidence':primary['checks']['restart'] and indep['pass'] and replay['exact_match']}
            },
            'blocking_gate':{'status':'BLOCKED','object':'PHYSICAL_THERMAL_HISTORY','reason':'Exact C parent supplies no dimensionful energy/temperature map, physical clock, metric expansion variable, or parent-derived phase threshold. Frozen D law therefore supports only a dimensionless transport diagnostic; claiming Generated RFC physical thermal history would exceed evidence.'},
            'public_data_used':False
          }
          (run/'GATE_RESULTS.json').write_text(json.dumps(gates,indent=2)+'\n')
          (run/'INDEPENDENT_VERIFICATION.md').write_text('# Independent verification — D-130\n\n**PASS for the normalized dimensionless transport diagnostic; BLOCKED for full physical Module D.**\n\nThe independent implementation reconstructed the exact C projector and analytic trajectory without trusting primary gate summaries. It matched the primary final state within the frozen tolerance, independently verified positivity/conservation/entropy direction, and confirmed from the exact parent that no dimensionful energy scale, physical time/metric expansion object, or phase-threshold law is available. The clean-checkout replay matched the primary transport history exactly.\n\nThis verification does **not** upgrade the diagnostic branch into a physical Kelvin-temperature or cosmological-expansion history.\n')
          blocked={'object_id':'H_D_to_E_BLOCKED','from_module':'D','to_module':'E','status':'BLOCKED_NO_FROZEN_HANDOFF','supported_object':'dimensionless normalized transport diagnostic','missing_required_objects':['physical temperature/energy scale','physical clock or lawful time map','metric/expansion state if required by D objective','parent-derived phase order parameter/threshold'],'public_data_used':False,'claim_boundary':'No primordial-abundance parent is released.'}
          (run/'H_D_to_E_BLOCKED.json').write_text(json.dumps(blocked,indent=2)+'\n')
          close='''# Module D closeout — blocked at physical thermal-history layer\n\n## Result\n\n`BLOCKED` after completing the lawful normalized dimensionless transport diagnostic.\n\n## Strongest supported claim\n\nThe exact frozen C parent uniquely fixes the nontrivial linear conservative O(2)-equivariant Markov relaxation orbit up to intrinsic clock reparameterization. The normalized branch preserves positivity and total carrier, increases Shannon entropy, decreases the inherited excitation functional, converges under the frozen BDF refinement matrix, restarts correctly, reproduces analytically, and replays exactly from a clean checkout. Nonlinear conservative flows remain a lawful but underdetermined family.\n\n## Blocking scientific object\n\nC supplies no dimensionful energy scale, thermodynamic temperature map, physical clock, metric expansion variable, or parent-derived phase order parameter/threshold. The frozen D rules prohibit importing any of these from observations, remembered cosmology, or standard thermal-history formulas. Therefore a Generated RFC **physical** thermal history cannot be claimed and no H_D_to_E physical handoff may be frozen.\n\n## Strongest unsupported claim\n\nNo Kelvin-temperature history, physical expansion history, phase-transition chronology, primordial isotope initial conditions, empirical correspondence, or complete Module D physical execution has been established.\n\n## Public-data firewall\n\nNo public or observed target values were used.\n\n## Advancement\n\nDo not advance to Module E. Resolve the missing physical scale/clock/thermodynamic objects from admitted RFC parents or preserve the obstruction.\n'''
          (run/'CLOSEOUT.md').write_text(close)
          PY
      - name: Finalize environment and manifest after outputs stop changing
        shell: bash
        run: |
          set -euo pipefail
          run=modules/D/runs/D-130-20260807T044911Z
          python tools/director.py doctor | tee "$run/FINAL_DOCTOR.txt"
          python -m unittest discover -s tests -v 2>&1 | tee "$run/UNIT_TESTS.txt"
          python tools/rfc.py firewall-scan | tee "$run/FIREWALL_SCAN.txt"
          python tools/rfc.py context
          python - <<'PY'
          import hashlib,json,platform,sys
          from datetime import datetime,timezone
          from pathlib import Path
          run=Path('modules/D/runs/D-130-20260807T044911Z')
          env={'python':sys.version,'platform':platform.platform(),'implementation':platform.python_implementation(),'random_seed':'NONE_DETERMINISTIC','network/public_data':'NONE','finalized_utc':datetime.now(timezone.utc).isoformat()}
          (run/'ENVIRONMENT_FINAL.json').write_text(json.dumps(env,indent=2)+'\n')
          files=[]
          for p in sorted(run.rglob('*')):
            if p.is_file() and '__pycache__' not in p.parts and p.name!='GENERATED_OUTPUT_MANIFEST.json':
              b=p.read_bytes(); files.append({'path':str(p),'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b)})
          canonical=json.dumps(files,sort_keys=True,separators=(',',':')).encode()
          manifest={'run_id':'D-130-20260807T044911Z','finalized_after_outputs_stopped':True,'files':files,'tree_sha256':hashlib.sha256(canonical).hexdigest()}
          (run/'GENERATED_OUTPUT_MANIFEST.json').write_text(json.dumps(manifest,indent=2)+'\n')
          PY
      - name: Close run as BLOCKED and commit verified evidence
        shell: bash
        run: |
          set -euo pipefail
          run=modules/D/runs/D-130-20260807T044911Z
          python tools/rfc.py close-run --run-id D-130-20260807T044911Z --result BLOCKED --closeout "$run/CLOSEOUT.md"
          rm -f .github/d130-execute-trigger.txt .github/workflows/d130_execute_diagnostic_once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Close Module D diagnostic at physical thermal-history obstruction'
          git push origin HEAD:agent/frontier-050-execution
