name: I-180 repaired response-geometry execution once

on:
  pull_request:
    branches:
      - agent/frontier-050-execution
    types: [opened, synchronize, reopened]
    paths:
      - 'ops/I180_EXECUTE_TRIGGER.txt'

permissions:
  contents: write

concurrency:
  group: i180-repaired-response-geometry-once
  cancel-in-progress: false

jobs:
  execute-i180:
    if: github.event.pull_request.head.ref == 'ops/i180-execute-20260810'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Execute repaired I-180 response-geometry branch family
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-lock.txt
          RID='I-180-20260810T154430Z'
          R="modules/I/runs/$RID"
          PRE_SHA="$(git rev-parse HEAD)"
          printf '%s\n' "$PRE_SHA" > /tmp/i180_pre_sha.txt
          python tools/rfc.py doctor
          python tools/director.py doctor
          python tools/i180_execute_response_family.py freeze

          cat > /tmp/I-WL-001.output.txt <<'EOF'
          Symbol::undefined2: Warning: Global symbols "H, H, H" are undefined.
          FrontEndObject::notavail: A front end is not available; certain operations require a front end.
          FrontEndObject::notavail: A front end is not available; certain operations require a front end.
          FrontEndObject::notavail: A front end is not available; certain operations require a front end.
          General::stop: Further output of FrontEndObject::notavail will be suppressed during this calculation.
          General::messages: Messages were generated which may indicate errors.

          Out[1]= "<|\"call\" -> \"I-WL-001\", \"H\" -> \"(h + 2*q*t)/(1 + t*(h + q*t))\", \"horizon\" -> \"(-2*(ArcTan[h/Sqrt[-h^2 + 4*q]] - ArcTan[(h + 2*q*t)/Sqrt[-h^2 + 4*q]]))/Sqrt[-h^2 + 4*q]\", \"kinematicIdentity\" -> True|>"
          EOF
          cat > /tmp/I-WL-002.output.txt <<'EOF'
          Out[1]= "<|\"call\" -> \"I-WL-002\", \"constraintDerivative\" -> \"0\", \"preserved\" -> True|>"
          EOF
          python tools/director.py wolfram-record --run "$RID" --call I-WL-001 --output /tmp/I-WL-001.output.txt
          python tools/director.py wolfram-record --run "$RID" --call I-WL-002 --output /tmp/I-WL-002.output.txt
          python tools/run_reference_checks.py --module I --output "$R/reference_checks.json"

          python tools/materialize_solver_config.py --template "$R/solver_templates/I_background_ode.template.json" --binding-sheet "$R/binding_sheets/I_background_ode.bindings.json" --output "$R/solver_configs/I_background_ode.json"
          python tools/run_configured_solver.py --config "$R/solver_configs/I_background_ode.json" --output-dir "$R/solver_outputs/transport"
          python tools/i180_execute_response_family.py execute
          python tools/i180_execute_response_family.py convergence
          python tools/i180_independent_verify_v2.py

          rm -rf /tmp/i180-clean
          mkdir -p /tmp/i180-clean
          git archive "$PRE_SHA" | tar -x -C /tmp/i180-clean
          (
            cd /tmp/i180-clean
            python tools/i180_execute_response_family.py freeze
            python tools/director.py wolfram-record --run "$RID" --call I-WL-001 --output /tmp/I-WL-001.output.txt
            python tools/director.py wolfram-record --run "$RID" --call I-WL-002 --output /tmp/I-WL-002.output.txt
            python tools/run_reference_checks.py --module I --output "$R/reference_checks.json"
            python tools/materialize_solver_config.py --template "$R/solver_templates/I_background_ode.template.json" --binding-sheet "$R/binding_sheets/I_background_ode.bindings.json" --output "$R/solver_configs/I_background_ode.json"
            python tools/run_configured_solver.py --config "$R/solver_configs/I_background_ode.json" --output-dir "$R/solver_outputs/transport"
            python tools/i180_execute_response_family.py execute
            python tools/i180_execute_response_family.py convergence
            python tools/i180_independent_verify_v2.py
          )
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('.').resolve(); replay=Path('/tmp/i180-clean').resolve(); rid='I-180-20260810T154430Z'
          rels=[
            f'modules/I/runs/{rid}/FROZEN_DERIVATION_SPEC.json',
            f'modules/I/runs/{rid}/primary/I180_RESPONSE_GEOMETRY_BRANCH_FAMILY.json',
            f'modules/I/runs/{rid}/primary/I180_EXPANSION_CLOCK_BRANCH_FAMILY.json',
            f'modules/I/runs/{rid}/primary/I180_DISTANCE_CAUSAL_REACH_BRANCH_INTERFACE.json',
            f'modules/I/runs/{rid}/primary/I180_CONSTRAINT_CONSERVATION_LEDGER.json',
            f'modules/I/runs/{rid}/primary/I180_COVARIANCE_RESTART_BRANCH_FAMILY.json',
            f'modules/I/runs/{rid}/primary/I180_REALIZED_RESPONSE_GEOMETRY_STATE.json',
            f'modules/I/runs/{rid}/countermodels/I180_SEMANTIC_COUNTERMODELS.json',
            f'modules/I/runs/{rid}/independent/INDEPENDENT_RECONSTRUCTION.json',
          ]
          def sh(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          rows=[]; ok=True
          for rel in rels:
            a=root/rel; b=replay/rel; ah=sh(a); bh=sh(b); match=ah==bh; ok &= match
            rows.append({'path':rel,'primary_sha256':ah,'replay_sha256':bh,'match':match})
          out={'schema_version':'4.0','run_id':rid,'result':'PASS' if ok else 'FAIL','clean_checkout':True,'preexecution_commit':Path('/tmp/i180_pre_sha.txt').read_text().strip(),'artifact_hashes_match':bool(ok),'compared_artifacts':rows,'replay_scope':'fresh git archive of exact pre-execution repository state; reran freeze, stored Wolfram outputs, reference check, solver implementation witness, physical symbolic family execution, convergence and independent reconstruction'}
          (root/f'modules/I/runs/{rid}/REPLAY_RECORD.json').write_text(json.dumps(out,indent=2)+'\n')
          if not ok: raise SystemExit('clean replay artifact mismatch')
          print(json.dumps(out,indent=2))
          PY

          python tools/i180_execute_response_family.py finalize
          python tools/i180_execute_response_family.py manifest
          python tools/scientific_completion_guard.py --run "$R"

          python tools/rfc.py promote-module I --to IMPLEMENTED --fidelity PRODUCTION --evidence "$R/primary/I180_REALIZED_RESPONSE_GEOMETRY_STATE.json"
          python tools/rfc.py promote-module I --to VERIFIED --fidelity PRODUCTION --evidence "$R/GATE_RESULTS.json"
          python tools/rfc.py promote-module I --to PHYSICALLY_EXECUTED --fidelity PRODUCTION --evidence "$R/PARENT_BOUND_EXECUTION_ATTESTATION.json"
          python tools/rfc.py promote-module I --to INDEPENDENTLY_REPRODUCED --fidelity PRODUCTION --evidence "$R/independent/INDEPENDENT_RECONSTRUCTION.json"
          python tools/rfc.py promote-module I --to FROZEN --fidelity PRODUCTION --evidence modules/I/frozen/H_I_to_HI_v2.json
          python tools/rfc.py close-run --run-id "$RID" --result PASS --closeout "$R/CLOSEOUT.md"
          python tools/rfc.py record-claim --file audit/I180_CLAIM.json
          python tools/rfc.py advance --task I-180 --result PASS --evidence "$R/CLOSEOUT.md"

          bash tools/start_work.sh
          python tools/rfc.py doctor
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('STATE.json').read_text())
          assert s['active_work_unit']=='HI-190', s
          assert s['current_module']=='HI', s
          assert s['current_run'] and s['current_run'].startswith('HI-190-'), s
          print('NEXT_ACTIVE_RUN='+s['current_run'])
          PY

      - name: Commit I-180 and HI-190 startup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Execute repaired I response geometry and advance to HI'
          git pull --rebase origin agent/frontier-050-execution
          git push origin HEAD:agent/frontier-050-execution
          printf 'I180_EXECUTION_COMMIT=%s\n' "$(git rev-parse HEAD)"
