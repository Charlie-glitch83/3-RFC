name: Execute E-140 governed local phase once

on:
  push:
    branches:
      - agent/frontier-050-execution
    paths:
      - .github/E140_EXECUTE_TRIGGER

permissions:
  contents: write

jobs:
  execute-e140:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install frozen environment
        run: python -m pip install --disable-pip-version-check -r requirements-lock.txt

      - name: Verify exact active run and frozen science
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('.')
          state = json.loads((root/'STATE.json').read_text())
          assert state['active_work_unit'] == 'E-140', state
          assert state['current_run'] == 'E-140-20260807T232334Z', state
          lock = json.loads((root/'modules/E/runs/E-140-20260807T232334Z/PRE_EXECUTION_LOCK.json').read_text())
          spec = json.loads((root/'modules/E/runs/E-140-20260807T232334Z/FROZEN_DERIVATION_SPEC.json').read_text())
          assert lock['status'] == 'FROZEN_BEFORE_PRIMARY_EXECUTION'
          assert spec['status'] == 'FROZEN_BEFORE_PRIMARY_EXECUTION'
          def h(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          assert h('modules/D/frozen/H_D_to_E.json') == '37839ecc3a570a3d9fc4ee6e29ec36ebe921bf6ae7a710f816c741d1fa498231'
          assert h('modules/C/frozen/H_C_to_D.json') == '41302a4ea12aab0f6d49ee74a6b89a0a9d25e66c79bb6fc137aee48f920caf78'
          print('E-140 frozen-state verification PASS')
          PY

      - name: Record actual execution environment before primary execution
        run: |
          python - <<'PY'
          import importlib.metadata as md, json, platform, sys
          from pathlib import Path
          p = Path('modules/E/runs/E-140-20260807T232334Z/ENVIRONMENT.json')
          obj = {
            'run_id':'E-140-20260807T232334Z',
            'status':'FROZEN_EXECUTION_ENVIRONMENT',
            'operating_system':platform.platform(),
            'hardware':{'machine':platform.machine(),'processor':platform.processor()},
            'software':[{'name':x,'version':md.version(x)} for x in ('numpy','scipy','sympy')],
            'python':sys.version,
            'imports':['numpy','scipy.integrate.solve_ivp','sympy'],
            'commands':[
              'python tools/director.py wolfram-record --run E-140-20260807T232334Z --call E-WL-001 --output modules/E/runs/E-140-20260807T232334Z/wolfram_raw/E-WL-001.txt',
              'python tools/director.py wolfram-record --run E-140-20260807T232334Z --call E-WL-002 --output modules/E/runs/E-140-20260807T232334Z/wolfram_raw/E-WL-002.txt',
              'python tools/run_reference_checks.py --module E --output modules/E/runs/E-140-20260807T232334Z/reference_checks.json',
              'python tools/materialize_solver_config.py --template modules/E/runs/E-140-20260807T232334Z/solver_templates/E_reaction_network.template.json --binding-sheet modules/E/runs/E-140-20260807T232334Z/binding_sheets/E_reaction_network.bindings.json --output modules/E/runs/E-140-20260807T232334Z/solver_configs/E_reaction_network.json',
              'bash tools/finish_local_phase.sh E modules/E/runs/E-140-20260807T232334Z'
            ],
            'network_policy':'DISABLED_DURING_GENERATION_EXCEPT_GITHUB_ACTION_RUNTIME_DEPENDENCY_INSTALL',
            'random_seeds':[],
            'hidden_defaults_audited':True,
            'note':'No runtime network source is admitted to scientific generation; dependency installation uses the frozen requirements lock only.'
          }
          p.write_text(json.dumps(obj,indent=2)+'\n')
          PY

      - name: Record exact required Wolfram calls
        run: |
          python tools/director.py wolfram-record --run E-140-20260807T232334Z --call E-WL-001 --output modules/E/runs/E-140-20260807T232334Z/wolfram_raw/E-WL-001.txt
          python tools/director.py wolfram-record --run E-140-20260807T232334Z --call E-WL-002 --output modules/E/runs/E-140-20260807T232334Z/wolfram_raw/E-WL-002.txt

      - name: Run manufactured Module E reference check
        run: python tools/run_reference_checks.py --module E --output modules/E/runs/E-140-20260807T232334Z/reference_checks.json

      - name: Bind solver only from frozen derivation
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          run = Path('modules/E/runs/E-140-20260807T232334Z')
          origin = run/'FROZEN_DERIVATION_SPEC.json'
          spec = json.loads(origin.read_text())
          sha = hashlib.sha256(origin.read_bytes()).hexdigest()
          sheet_path = run/'binding_sheets/E_reaction_network.bindings.json'
          sheet = json.loads(sheet_path.read_text())
          sm = spec['solver_model']
          cols = sm['stoichiometry_columns']
          stoich = [list(row) for row in zip(*cols)]
          q = spec['reaction_hypergraph']['carrier_invariants']
          values = {
            'model.species': sm['species_order'],
            'model.stoichiometry': stoich,
            'model.rate_expressions': sm['rate_expressions'],
            'model.parameters': sm['parameters'],
            'model.invariants': {'Q0':q['Q0'],'Q1':q['Q1'],'Q2':q['Q2']},
            'initial_state': sm['initial_state'],
            't_span': sm['t_span'],
            'max_step': sm['max_step'],
            'positivity_tolerance': sm['positivity_tolerance'],
            'invariant_tolerance': sm['invariant_tolerance'],
          }
          meta = {
            'model.species':('dimensionless internal RFC composite identity list','1','solver_model.species_order'),
            'model.stoichiometry':('integer stoichiometric incidence','1','solver_model.stoichiometry_columns'),
            'model.rate_expressions':('dimensionless mass-action flux expressions','1/tau_E','solver_model.rate_expressions'),
            'model.parameters':('parent-derived dimensionless kinetic coefficients','1/tau_E','solver_model.parameters'),
            'model.invariants':('exact protected ancestry-carrier ledgers','1','reaction_hypergraph.carrier_invariants'),
            'initial_state':('dimensionless abundance/carrier fractions','1','solver_model.initial_state'),
            't_span':('intrinsic E ordering interval','tau_E','solver_model.t_span'),
            'max_step':('maximum intrinsic solver step','tau_E','solver_model.max_step'),
            'positivity_tolerance':('absolute abundance tolerance','1','solver_model.positivity_tolerance'),
            'invariant_tolerance':('absolute ancestry-ledger drift tolerance','1','solver_model.invariant_tolerance'),
          }
          for rec in sheet['bindings']:
              path = rec['path']
              units, dims, deriv = meta[path]
              rec['value'] = values[path]
              rec['origin_kind'] = 'INTERNAL_DERIVATION'
              rec['origin_path'] = str(origin)
              rec['origin_sha256'] = sha
              rec['module'] = 'E'
              rec['derivation_object'] = f'E140_FROZEN_DERIVATION_SPEC.{deriv}'
              rec['units'] = units
              rec['dimensions'] = dims
              rec['justification'] = 'Exact value copied mechanically from the frozen E-140 derivation before primary execution; no value selected or modified here.'
          sheet_path.write_text(json.dumps(sheet,indent=2)+'\n')
          print('origin_sha256', sha)
          PY

      - name: Materialize provenance-bound solver configuration
        run: python tools/materialize_solver_config.py --template modules/E/runs/E-140-20260807T232334Z/solver_templates/E_reaction_network.template.json --binding-sheet modules/E/runs/E-140-20260807T232334Z/binding_sheets/E_reaction_network.bindings.json --output modules/E/runs/E-140-20260807T232334Z/solver_configs/E_reaction_network.json

      - name: Execute exact local phase
        run: bash tools/finish_local_phase.sh E modules/E/runs/E-140-20260807T232334Z

      - name: Preserve local-phase execution outputs
        run: |
          rm -rf modules/E/runs/E-140-20260807T232334Z/wolfram_raw
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/E/runs/E-140-20260807T232334Z
          git commit -m 'Execute Module E governed local phase'
          git push origin HEAD:agent/frontier-050-execution
          git rev-parse HEAD
