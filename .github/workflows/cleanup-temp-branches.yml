name: Cleanup temporary installation branches

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.number == 1
    runs-on: ubuntu-latest
    steps:
      - name: Delete temporary branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for ref in agent/install-authoritative-bundle agent/reconstruct-source-archives agent/close-boot-000; do
            encoded=${ref//\//%2F}
            code=$(curl -sS -o /tmp/delete-response.json -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/git/refs/heads/${encoded}")
            if [[ "$code" != "204" && "$code" != "422" ]]; then
              cat /tmp/delete-response.json
              exit 1
            fi
          done
