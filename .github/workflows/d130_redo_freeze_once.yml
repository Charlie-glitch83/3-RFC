name: D130 Redo Freeze Parent-Driven Thermal Law

on:
  push:
    branches:
      - agent/frontier-050-execution

permissions:
  contents: write

jobs:
  freeze:
    if: github.ref == 'refs/heads/agent/frontier-050-execution'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Freeze exact D derivation before any primary execution
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, importlib.metadata, json, math, platform, sys
          from pathlib import Path
          import numpy as np

          ROOT=Path('.')
          RUN_ID='D-130-20260807T220342Z'
          RUN=ROOT/'modules/D/runs'/RUN_ID
          def load(path): return json.loads(Path(path).read_text())
          def sha(path): return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          def dump(path,obj):
              path=Path(path); path.parent.mkdir(parents=True,exist_ok=True)
              path.write_text(json.dumps(obj,indent=2,ensure_ascii=False)+'\n')

          state=load('STATE.json')
          if state.get('active_work_unit')!='D-130' or state.get('current_module')!='D' or state.get('current_run')!=RUN_ID:
              raise SystemExit('HARD STOP: fresh D run is not the sole authorized run')

          c_path=Path('modules/C/frozen/H_C_to_D.json')
          b_path=Path('modules/B/frozen/H_B_to_C.json')
          a_path=Path('modules/A/frozen/H_A_to_B.json')
          c=load(c_path); b=load(b_path); ah=load(a_path)
          if c.get('thermal_history_status')!='NOT_DERIVED_IN_C_RESERVED_FOR_D':
              raise SystemExit('HARD STOP: C thermal ownership mismatch')
          if c['microscopic_constitution'].get('dimensionful_mass')!='NOT_DERIVED_NO_SCALE_IN_PARENT':
              raise SystemExit('HARD STOP: unexpected dimensionful scale in C parent')
          if b['first_physical_event'].get('pre_event_physical_time') is not None:
              raise SystemExit('HARD STOP: imported pre-event physical time')

          M=np.asarray(c['microscopic_constitution']['matrix'],float)
          p0=np.asarray(c['prethermal_state']['node_populations'],float)
          g=float(c['microscopic_constitution']['dimensionless_doublet_gap'])
          edge=float(-M[0,1])
          if np.max(np.abs(M-M.T))>1e-12 or np.max(np.abs(M.sum(axis=1)))>1e-12:
              raise SystemExit('HARD STOP: C constitutive matrix is not symmetric conservative')
          if abs(g-3*edge)>1e-12:
              raise SystemExit('HARD STOP: parent gap is not three complete-support edge rates')
          if abs(float(p0.sum())-1.0)>1e-12 or np.min(p0)<=0:
              raise SystemExit('HARD STOP: invalid C prethermal state')

          uniform=np.ones(3)/3.0
          x0=float(np.dot(p0-uniform,p0-uniform))
          U0=float(p0 @ M @ p0)
          if abs(U0-g*x0)>1e-12:
              raise SystemExit('HARD STOP: parent spectral energy identity failed')
          t_balance=math.log(2.0)/(2.0*g)
          t_gap=1.0/g
          t_end=1.0/edge
          max_step=t_end/128.0
          convergence_steps=[t_end/32.0,t_end/64.0,t_end/128.0,t_end/256.0]

          authority_paths=[
            'recipes/D/recipe.json','recipes/D/WORK_ORDER.md','recipes/D/MODEL_PROMPT.md','modules/D/spec.json',
            'configured_runs/BINDING_PROTOCOL.md','docs/09_DERIVATION_PROTOCOL.md','docs/10_EXECUTION_PROTOCOL.md',
            'docs/26_ZERO_DESIGN_OPERATOR_PROTOCOL.md','docs/11_WOLFRAM_INTEGRATION.md',
            'recipes/D/wolfram/D-WL-001.wl','recipes/D/wolfram/D-WL-002.wl',
            str(c_path),str(b_path),str(a_path)
          ]
          authority=[{'path':p,'sha256':sha(p)} for p in authority_paths]

          spec={
            'schema_version':'1.0',
            'object_id':'D130_FROZEN_DERIVATION_SPEC',
            'run_id':RUN_ID,
            'module':'D',
            'status':'FROZEN_BEFORE_PRIMARY_EXECUTION',
            'generation_mode':'GENERATION_SEALED',
            'fidelity':'MINIMAL_SPINE',
            'exact_parent':{'object_id':'H_C_to_D','path':str(c_path),'sha256':sha(c_path)},
            'ancestry':[
              {'object_id':'H_B_to_C','path':str(b_path),'sha256':sha(b_path),'role':'FIRST_PHYSICAL_EVENT_AND_INTRINSIC_ORDER_ANCESTRY'},
              {'object_id':'H_A_to_B','path':str(a_path),'sha256':sha(a_path),'role':'TRIAD_KERNEL_AND_RELATIONAL_GRAMMAR_ANCESTRY'}
            ],
            'triadic_descent':{
              'CIF':'The exact C prethermal three-carrier distribution, complete inherited K3 support, and its lawful distribution/phase possibility family.',
              'QV':'The source-owned conservative complete-support collision/transport generator G_D=-M_C redistributes the parent carrier; its edge fluxes produce monotone entropy while the exact C constitutive excitation decays.',
              'RFL':'The full distribution trajectory, intrinsic spectral-temperature coordinate, entropy/state-space expansion history, phase-event chronology, transferred constitutive-excitation memory, covariance envelope, and restart state are stabilized as D memory.'
            },
            'nbody_mode':'RELATIONAL_GRAMMAR_ACTIVE_ON_COMPLETE_PARENT_K3_TRANSPORT_GRAPH',
            'state_space':{
              'state_names':['p0','p1','p2'],
              'semantics':'Exact inherited C node-carrier distribution on the complete three-node pregeometric relational support; no empirical species labels.',
              'initial_state':p0.tolist(),
              'equilibrium_state':uniform.tolist(),
              'units':'dimensionless normalized carrier fractions',
              'frame':'B/C finite relational pregeometry; no metric spacetime or FRW geometry is introduced in D.',
              'clock':'tau_D, intrinsic dimensionless post-Big-Implosion transport clock. tau_D=0 is the C->D interface; no seconds or pre-event time are imported.'
            },
            'transport_collision_law':{
              'classification':'DERIVED_LAW',
              'parent_matrix_M_C':M.tolist(),
              'generator_G_D':(-M).tolist(),
              'edge_rate_a':edge,
              'gap_g_C':g,
              'edge_rate_expression':'a=1/(delta+2)',
              'gap_expression':'g_C=3a',
              'rhs_expressions':['a*(p1-p0)+a*(p2-p0)','a*(p0-p1)+a*(p2-p1)','a*(p0-p2)+a*(p1-p2)'],
              'compact_expression':'dp/dtau_D = -M_C p',
              'analytic_solution':'p(tau_D)=u+(p(0)-u) exp(-g_C tau_D), u=(1,1,1)/3',
              'uniqueness_scope':'Unique coefficient-free linear conservative symmetric complete-support specialization that reuses the exact C edge coefficient and O(2)-degenerate doublet gap; no new physical coefficient is introduced.'
            },
            'thermal_entropy_memory':{
              'constitutive_excitation':'U_D(tau)=p(tau)^T M_C p(tau)=g_C ||p(tau)-u||_2^2',
              'excitation_decay':'U_D(tau)=U_D(0) exp(-2 g_C tau)',
              'rfl_memory':'Q_RFL(tau)=U_D(0)-U_D(tau)',
              'energy_ledger':'U_D(tau)+Q_RFL(tau)=U_D(0) exactly in the frozen law',
              'shannon_entropy':'S_D(tau)=-sum_i p_i log(p_i)',
              'entropy_production':'sigma_D=a sum_{i<j}(p_i-p_j)(log(p_i)-log(p_j)) >= 0',
              'nonmetric_expansion':'V_eff(tau)=exp(S_D(tau)); this is expansion of occupied relational state-space support, not metric/cosmological expansion.'
            },
            'temperature_correspondence':{
              'classification':'LIMIT_OR_CORRESPONDENCE_THEOREM_NON_GENERATIVE_DIAGNOSTIC',
              'parent_spectrum':'one conserved zero mode plus an exactly degenerate doublet at g_C',
              'basis_invariance':'Use total O(2)-invariant doublet power X=||p-u||^2, so no arbitrary doublet angle is selected.',
              'power_fractions':'q0=(1/3)/(1/3+X); qexc=X/(1/3+X)',
              'intrinsic_spectral_temperature':'Theta_D=g_C/log(2*q0/qexc), the unique positive 1+2-level canonical spectral coordinate matching the instantaneous normalized zero/doublet power ratio.',
              'use':'Diagnostic/output only. Theta_D does not choose the transport law, coefficients, event ordering, or downstream branches.',
              'units':'dimensionless parent-gap energy coordinate',
              'kelvin_or_MeV_status':'NOT_DERIVED_AND_NOT_USED_FOR_GENERATION'
            },
            'phase_event_witnesses':[
              {'event':'QV_RFL_MEMORY_BALANCE','tau_D':t_balance,'rule':'U_D=Q_RFL=U_D(0)/2','meaning':'first exact balance crossing between remaining constitutive excitation and stabilized RFL transfer memory'},
              {'event':'GLOBAL_RELAXATION_EFOLD','tau_D':t_gap,'rule':'||p-u||=exp(-1)||p(0)-u||','meaning':'one exact nonuniform parent-gap relaxation e-fold'},
              {'event':'EDGE_TIMESCALE_STABILIZATION','tau_D':t_end,'rule':'tau_D=1/a=3/g_C','meaning':'one complete-support edge timescale; three global amplitude e-folds; frozen D export boundary'}
            ],
            'interval_and_numerics':{
              't_span':[0.0,t_end],
              'max_step':max_step,
              'max_step_rule':'t_end/128',
              'convergence_max_steps':convergence_steps,
              'primary_method':'BDF',
              'rtol':1e-9,'atol':1e-12,
              'invariant_tolerance':1e-9,
              'positivity_tolerance':1e-12,
              'independent_method':'closed-form parent spectral reconstruction plus DOP853 cross-check'
            },
            'uncertainty':{
              'classification':'INHERITED_SOURCE_DECIMAL_REPRESENTATION_ENVELOPE_ONLY',
              'stochastic_covariance':'ZERO_NO_STOCHASTIC_VARIABLE_ADMITTED',
              'parent_delta_members':[float(x['delta']) for x in c['uncertainty']['runs']],
              'rule':'For each exact C decimal-envelope member, rederive M_C, a, g_C, p0, event times, and the full D history without retuning; report ensemble covariance.'
            },
            'countermodels':[
              'SCALAR_COLLAPSE: replace p0,p1,p2 by their mean before D; rejects because it erases the inherited nonequilibrium state and forces zero transport/entropy production.',
              'EDGE_WITHHELD: remove one exact K3 transport edge; rejects because it breaks inherited complete-support/O(2) symmetry and changes the history.',
              'ANTI_DIFFUSION: flip the sign of G_D; rejects because entropy production changes sign and positivity/stability can fail.',
              'NONCONSERVATIVE: perturb one generator row sum; rejects because total carrier/Q_total is no longer conserved.',
              'PUBLIC_TEMPERATURE_ANCHOR: insert Kelvin/MeV or observed transition targets; forbidden by the sealed-generation firewall.'
            ],
            'falsifiers':[
              'H_C_to_D SHA-256 mismatch',
              'M_C is not symmetric or has nonzero row sum above 1e-12',
              'g_C differs from 3a above 1e-12',
              'initial parent distribution is nonpositive or not normalized above 1e-12',
              'any public/remembered thermal target or SI/laboratory anchor enters generation',
              'any primary abundance/distribution falls below -1e-12',
              'total carrier/Q_total drift exceeds 1e-9',
              'U_D+Q_RFL conservation drift exceeds 1e-9',
              'entropy production falls below -1e-10',
              'phase events are not strictly ordered as frozen',
              'finest two BDF max-step results differ above 1e-8 L_inf',
              'midpoint restart differs above 1e-8 L_inf',
              'analytic independent reconstruction differs above 1e-8 L_inf',
              'withholding an inherited edge fails to materially change the state above 1e-8'
            ],
            'claim_boundary':'Module D physically instantiates and numerically executes the RFC MINIMAL_SPINE nonequilibrium thermal/phase trajectory on the exact C three-carrier relational state: parent-derived conservative collision/transport, positive distribution history, parent-gap-scaled constitutive-energy transfer into RFL memory, nonnegative entropy production, nonmetric state-space expansion, intrinsic spectral-temperature history, exact phase-event chronology, inherited decimal-envelope uncertainty, restart and independent reconstruction. No Kelvin/MeV calibration, Standard Model species identity, metric/FRW expansion, public transition temperature, neutrino/radiation transport, primordial abundance network, or empirical agreement is claimed.'
          }
          spec_path=RUN/'FROZEN_DERIVATION_SPEC.json'
          dump(spec_path,spec)
          spec_hash=sha(spec_path)

          source_register={
            'schema_version':'1.0','run_id':RUN_ID,'module':'D','generation_mode':'GENERATION_SEALED','public_data_declaration':'NONE',
            'exact_parents':[{'object_id':'H_C_to_D','path':str(c_path),'sha256':sha(c_path),'role':'SOLE_DIRECT_PHYSICAL_PARENT'}],
            'inherited_authorities':[
              {'path':str(b_path),'sha256':sha(b_path),'role':'PHYSICAL_CLOCK_ORIGIN_AND_PREGEOMETRY_ANCESTRY'},
              {'path':str(a_path),'sha256':sha(a_path),'role':'TRIAD_KERNEL_AND_RELATIONAL_ANCESTRY'}],
            'module_authorities':authority,
            'internal_derivations':[{'path':str(spec_path),'sha256':spec_hash,'object_id':'D130_FROZEN_DERIVATION_SPEC'}],
            'imports':['hashlib','json','math','pathlib','numpy','scipy'],
            'files':[str(c_path),str(b_path),str(a_path),str(spec_path)],
            'urls':[],'constants':[],
            'historical_failures_used_for_generation':False,
            'historical_D_outputs_used_for_generation':False,
            'public_data_used':False,
            'laboratory_or_SI_anchor_used':False
          }
          dump(RUN/'SOURCE_REGISTER.json',source_register)

          lock={
            'schema_version':'1.0','run_id':RUN_ID,'status':'FROZEN','frozen_before_primary_execution':True,
            'authority_hashes':[x['sha256'] for x in authority],
            'parent_hashes':[sha(c_path)],
            'definition_hashes':[spec_hash,sha('recipes/D/wolfram/D-WL-001.wl'),sha('recipes/D/wolfram/D-WL-002.wl')],
            'candidate_classes':['unique complete-support conservative K3 parent generator','O(2)-invariant intrinsic spectral-temperature correspondence','three exact source-derived phase/event witnesses','parent decimal-envelope replay family','semantic countermodels and edge-withheld ablation'],
            'equations_and_laws':['dp/dtau_D=-M_C p','a=1/(delta+2)','g_C=3a','U_D=p^T M_C p','Q_RFL=U_D(0)-U_D','S_D=-sum p_i log p_i','sigma_D=a sum_(i<j)(p_i-p_j)(log p_i-log p_j)>=0','V_eff=exp(S_D)','Theta_D=g_C/log(2 q0/qexc) [diagnostic correspondence only]'],
            'dimensions_units_frames_gauges_clocks':['dimensionless carrier fractions','parent-gap-scaled dimensionless constitutive energy','tau_D intrinsic post-event transport clock','B/C finite relational pregeometry frame','no metric/FRW gauge','no SI/Kelvin/MeV calibration'],
            'methods':['BDF primary transport','closed-form spectral reconstruction','DOP853 independent cross-check'],
            'tolerances':['rtol=1e-9','atol=1e-12','positivity=1e-12','linear invariant=1e-9','energy ledger=1e-9','entropy production=-1e-10 floor','convergence/restart/independent=1e-8'],
            'stopping_rules':['execute exact t_span [0,1/a]','hard stop on negative distribution, conservation drift, source/hash mismatch, forbidden anchor, or unordered events'],
            'expected_invariants':['sum_i p_i=1','Q_total=sum_i p_i=1','U_D+Q_RFL=U_D(0)','S_D nondecreasing','V_eff nondecreasing'],
            'tests':['D-WL-001','D-WL-002','manufactured reference check','parent-driven BDF history','dyadic max-step convergence','semantic countermodels','edge-withheld ablation','decimal-envelope replay','midpoint restart','analytic reconstruction','DOP853 reconstruction','clean replay'],
            'gates':['positive distributions','energy/charge conservation','event ordering','stiff-solver convergence','restart and independent reconstruction'],
            'falsifiers':spec['falsifiers'],
            'claim_boundary':spec['claim_boundary'],
            'independent_verifier_design':'Reconstruct M_C, a, g_C and p0 from H_C_to_D without trusting D outputs; use the exact K3 spectral solution p=u+(p0-u)e^(-g_C tau), independently reconstruct U/S/V_eff/Theta/events, and cross-check final state with DOP853. Compare to primary BDF within 1e-8.',
            'allowed_implementation_only_corrections':['serialization','path handling','runner dependency setup','output formatting','capture/manifest plumbing; no change to parent, law, coefficients, phase witnesses, interval, tolerances, gates, falsifiers, or claim boundary']
          }
          dump(RUN/'PRE_EXECUTION_LOCK.json',lock)

          falsifier={
            'run_id':RUN_ID,'status':'FROZEN_PRE_EXECUTION','falsifiers':spec['falsifiers'],
            'all_tested_or_hard_stopped':False,'result':'PENDING_EXECUTION'
          }
          dump(RUN/'FALSIFIER_REGISTRY.json',falsifier)

          software=[]
          for pkg in ('numpy','scipy','sympy','networkx','jsonschema'):
              try: software.append({'package':pkg,'version':importlib.metadata.version(pkg)})
              except Exception: pass
          env={
            'run_id':RUN_ID,'status':'FROZEN_PRE_EXECUTION','operating_system':platform.platform(),
            'hardware':{'machine':platform.machine(),'processor':platform.processor()},'software':software,'python':sys.version,
            'imports':source_register['imports'],'commands':['repository work-order commands only; exact execution commands captured during execution phase'],
            'network_policy':'DISABLED_FOR_SCIENTIFIC_GENERATION_AFTER_DEPENDENCY_SETUP','random_seeds':[],
            'hidden_defaults_audited':True,'notes':['No stochastic variable admitted. No public thermal, laboratory, SI, Kelvin, MeV, Standard Model, or historical D output enters generation.']
          }
          dump(RUN/'ENVIRONMENT.json',env)

          sheet=load(RUN/'binding_sheets/D_transport.bindings.json')
          values={
            'model.state_names':['p0','p1','p2'],
            'model.parameters':{'a':edge},
            'model.rhs_expressions':spec['transport_collision_law']['rhs_expressions'],
            'model.initial_state':p0.tolist(),
            'model.t_span':[0.0,t_end],
            'model.max_step':max_step,
            'model.linear_invariants':{'total_carrier':[1.0,1.0,1.0],'Q_total':[1.0,1.0,1.0]},
            'model.invariant_tolerance':1e-9,
            'model.positivity_tolerance':1e-12
          }
          meta={
            'model.state_names':('dimensionless','typed C carrier labels'),
            'model.parameters':('inverse tau_D','intrinsic transport rates'),
            'model.rhs_expressions':('carrier fraction per tau_D','conservative complete-support flow'),
            'model.initial_state':('dimensionless','normalized carrier fractions'),
            'model.t_span':('tau_D','intrinsic post-event transport clock'),
            'model.max_step':('tau_D','numerical resolution'),
            'model.linear_invariants':('dimensionless','conserved linear ledgers'),
            'model.invariant_tolerance':('dimensionless','ledger residual tolerance'),
            'model.positivity_tolerance':('dimensionless','carrier fraction tolerance')
          }
          for rec in sheet['bindings']:
              key=rec['path']; rec['value']=values[key]; rec['origin_kind']='INTERNAL_DERIVATION'; rec['origin_path']=str(spec_path); rec['origin_sha256']=spec_hash
              rec['module']='D'; rec['derivation_object']='D130_FROZEN_DERIVATION_SPEC'; rec['units'],rec['dimensions']=meta[key]
              rec['justification']='Exact frozen parent-derived D binding; no historical D result, public target, remembered thermal constant, or laboratory/SI anchor used.'
          dump(RUN/'binding_sheets/D_transport.bindings.json',sheet)

          dump(RUN/'PRE_EXECUTION_SNAPSHOT.json',{
            'run_id':RUN_ID,'status':'FROZEN_BEFORE_PRIMARY_EXECUTION','parent_sha256':sha(c_path),'derivation_sha256':spec_hash,
            'source_register_sha256':sha(RUN/'SOURCE_REGISTER.json'),'pre_execution_lock_sha256':sha(RUN/'PRE_EXECUTION_LOCK.json'),
            'environment_sha256':sha(RUN/'ENVIRONMENT.json'),'falsifier_registry_sha256':sha(RUN/'FALSIFIER_REGISTRY.json'),
            'binding_sheet_sha256':sha(RUN/'binding_sheets/D_transport.bindings.json')
          })
          print(json.dumps({'run':RUN_ID,'parent_sha256':sha(c_path),'derivation_sha256':spec_hash,'edge_rate_a':edge,'gap_g_C':g,'t_end':t_end,'events':[t_balance,t_gap,t_end]},indent=2))
          PY
          python tools/director.py doctor
      - name: Commit frozen D pre-execution package
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/d130_redo_freeze_once.yml
          git config user.name '3-RFC governed executor'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Freeze fresh D-130 parent-driven thermal law before execution'
          git pull --rebase origin agent/frontier-050-execution
          git push origin HEAD:agent/frontier-050-execution
          git rev-parse HEAD
