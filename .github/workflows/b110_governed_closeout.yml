name: B110 Governed Closeout

on:
  pull_request:
    branches:
      - agent/frontier-050-execution

permissions:
  contents: write

concurrency:
  group: b110-governed-closeout
  cancel-in-progress: false

jobs:
  execute-b110:
    if: github.event.pull_request.head.ref == 'agent/b110-governed-trigger'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout locked execution branch
        uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
          path: primary_checkout

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install execution dependencies
        run: python -m pip install --disable-pip-version-check numpy networkx scipy sympy

      - name: Execute frozen Module B in primary checkout
        working-directory: primary_checkout
        shell: bash
        run: |
          set -euo pipefail
          RUN='modules/B/runs/B-110-20260807T002248Z'
          python tools/repair_registered_run_tree.py --run-id A-100-20260806T173458Z --record memory/A100_TREE_REGISTRY_REPAIR.json
          python tools/rfc.py doctor
          python tools/run_reference_checks.py --module B --output "$RUN/reference_checks.json"
          mkdir -p "$RUN/solver_configs" "$RUN/solver_outputs/big_implosion"
          python tools/materialize_solver_config.py --template configured_runs/templates/B_big_implosion.template.json --binding-sheet "$RUN/binding_sheets/B_big_implosion.bindings.json" --output "$RUN/solver_configs/B_big_implosion.json"
          python tools/run_configured_solver.py --config "$RUN/solver_configs/B_big_implosion.json" --output-dir "$RUN/solver_outputs/big_implosion"
          python "$RUN/primary_module_b.py"
          python "$RUN/independent_module_b.py"
          python "$RUN/validate_module_b.py"
          python tools/rfc.py firewall-scan | tee "$RUN/FIREWALL_SCAN.txt"
          python -m unittest discover -s tests -v

      - name: Record primary deterministic hashes
        working-directory: primary_checkout
        shell: bash
        run: |
          python - <<'PY'
          import copy,hashlib,json,pathlib
          run=pathlib.Path('modules/B/runs/B-110-20260807T002248Z')
          rels=[
            'reference_checks.json',
            'solver_outputs/big_implosion/result.json',
            'primary/BIG_IMPLOSION_PHYSICAL_STATE.json',
            'primary/FINITE_N_STRUCTURAL_AUDIT.json',
            'primary/COUNTERMODEL_RESULTS.json',
            'primary/UNCERTAINTY_ENVELOPE.json',
            'primary/PRIMARY_SUMMARY.json',
            'independent/INDEPENDENT_RECONSTRUCTION.json',
            'GATE_RESULTS.json',
            'CHECKPOINT_RECORD.json',
            'checkpoints/B_FIRST_PHYSICAL_STATE.json'
          ]
          def file_sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          cfg_path=run/'solver_configs/B_big_implosion.json'
          cfg=json.loads(cfg_path.read_text())
          canonical=copy.deepcopy(cfg)
          manifest=canonical.get('binding_manifest',{})
          manifest.pop('template_path',None)
          manifest.pop('binding_sheet_path',None)
          canonical_bytes=json.dumps(canonical,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()
          out={
            'artifact_hashes':{rel:file_sha(run/rel) for rel in rels},
            'config_raw_sha256':file_sha(cfg_path),
            'config_semantic_sha256':hashlib.sha256(canonical_bytes).hexdigest(),
            'config_semantic_normalization':'remove only absolute binding_manifest.template_path and binding_manifest.binding_sheet_path; retain template/binding hashes, every binding provenance record, model values, tolerances, generation mode, solver and classification'
          }
          pathlib.Path('../primary_hashes.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY

      - name: Clean replay checkout
        uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
          path: replay_checkout

      - name: Replay frozen Module B from clean checkout
        working-directory: replay_checkout
        shell: bash
        run: |
          set -euo pipefail
          RUN='modules/B/runs/B-110-20260807T002248Z'
          python tools/repair_registered_run_tree.py --run-id A-100-20260806T173458Z
          python tools/rfc.py doctor
          python tools/run_reference_checks.py --module B --output "$RUN/reference_checks.json"
          mkdir -p "$RUN/solver_configs" "$RUN/solver_outputs/big_implosion"
          python tools/materialize_solver_config.py --template configured_runs/templates/B_big_implosion.template.json --binding-sheet "$RUN/binding_sheets/B_big_implosion.bindings.json" --output "$RUN/solver_configs/B_big_implosion.json"
          python tools/run_configured_solver.py --config "$RUN/solver_configs/B_big_implosion.json" --output-dir "$RUN/solver_outputs/big_implosion"
          python "$RUN/primary_module_b.py"
          python "$RUN/independent_module_b.py"
          python "$RUN/validate_module_b.py"

      - name: Compare replay hashes and certify replay
        shell: bash
        run: |
          python - <<'PY'
          import copy,hashlib,json,pathlib,subprocess
          first=json.loads(pathlib.Path('primary_hashes.json').read_text())
          run=pathlib.Path('replay_checkout/modules/B/runs/B-110-20260807T002248Z')
          def file_sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          second={rel:file_sha(run/rel) for rel in first['artifact_hashes']}
          matches={rel:{'primary_sha256':first['artifact_hashes'][rel],'replay_sha256':second[rel],'match':first['artifact_hashes'][rel]==second[rel]} for rel in first['artifact_hashes']}
          cfg_path=run/'solver_configs/B_big_implosion.json'
          cfg=json.loads(cfg_path.read_text())
          canonical=copy.deepcopy(cfg)
          manifest=canonical.get('binding_manifest',{})
          manifest.pop('template_path',None)
          manifest.pop('binding_sheet_path',None)
          semantic=hashlib.sha256(json.dumps(canonical,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()).hexdigest()
          raw=file_sha(cfg_path)
          exact_ok=all(v['match'] for v in matches.values())
          semantic_ok=semantic==first['config_semantic_sha256']
          if not exact_ok: raise SystemExit('HARD STOP: clean replay scientific/evidence artifact hashes differ')
          if not semantic_ok: raise SystemExit('HARD STOP: provenance-bound scientific config differs after path normalization')
          ref=subprocess.check_output(['git','-C','replay_checkout','rev-parse','HEAD'],text=True).strip()
          rec={
            'run_id':'B-110-20260807T002248Z','result':'PASS','clean_checkout':True,'artifact_hashes_match':True,
            'replay_ref':ref,
            'method':'second actions/checkout of agent/frontier-050-execution with no generated primary artifacts, followed by full frozen materialize/solver/primary/independent/validate sequence',
            'compared_artifacts':matches,
            'config_reproducibility':{
              'semantic_match':True,
              'primary_semantic_sha256':first['config_semantic_sha256'],
              'replay_semantic_sha256':semantic,
              'primary_raw_sha256':first['config_raw_sha256'],
              'replay_raw_sha256':raw,
              'raw_hash_match':raw==first['config_raw_sha256'],
              'normalization':first['config_semantic_normalization'],
              'reason_raw_hash_may_differ':'materializer intentionally embeds checkout-specific absolute template_path and binding_sheet_path; those two transport paths are excluded from semantic comparison while their content SHA-256 values and all bindings remain included'
            }
          }
          pathlib.Path('primary_checkout/modules/B/runs/B-110-20260807T002248Z/REPLAY_RECORD.json').write_text(json.dumps(rec,indent=2,sort_keys=True)+'\n')
          PY

      - name: Finalize evidence and handoff
        working-directory: primary_checkout
        shell: bash
        run: |
          set -euo pipefail
          RUN='modules/B/runs/B-110-20260807T002248Z'
          python "$RUN/finalize_module_b.py"
          python tools/rfc.py promote-module B --to FORMALIZED --fidelity MINIMAL_SPINE --evidence "$RUN/FROZEN_DERIVATION_SPEC.json"
          python tools/rfc.py promote-module B --to IMPLEMENTED --fidelity MINIMAL_SPINE --evidence "$RUN/solver_outputs/big_implosion/result.json"
          python tools/rfc.py promote-module B --to VERIFIED --fidelity MINIMAL_SPINE --evidence "$RUN/GATE_RESULTS.json"
          python tools/rfc.py promote-module B --to PHYSICALLY_EXECUTED --fidelity MINIMAL_SPINE --evidence "$RUN/primary/BIG_IMPLOSION_PHYSICAL_STATE.json"
          python tools/rfc.py promote-module B --to INDEPENDENTLY_REPRODUCED --fidelity MINIMAL_SPINE --evidence "$RUN/independent/INDEPENDENT_RECONSTRUCTION.json"
          python tools/rfc.py promote-module B --to FROZEN --fidelity MINIMAL_SPINE --evidence modules/B/frozen/H_B_to_C.json
          python tools/rfc.py close-run --run-id B-110-20260807T002248Z --result PASS --closeout "$RUN/CLOSEOUT.md"
          python tools/rfc.py advance --task B-110 --result PASS --evidence "$RUN/CLOSEOUT.md" --note 'Module B closed at its verified first-physical-state scope; exactly one immediate child may advance.'
          python tools/rfc.py context
          python tools/director.py prepare-active
          python tools/rfc.py doctor

      - name: Commit verified Module B closeout
        working-directory: primary_checkout
        shell: bash
        run: |
          set -euo pipefail
          git config user.name '3-RFC governed executor'
          git config user.email 'actions@users.noreply.github.com'
          git status --short
          git add STATE.json WORK_QUEUE.json CLAIMS_LEDGER.json memory modules/B work_packets/ACTIVE_WORK_PACKET.md
          if git diff --cached --quiet; then echo 'HARD STOP: no governed closeout changes to commit'; exit 1; fi
          git commit -m 'Close Module B at its verified scientific scope'
          git push origin HEAD:agent/frontier-050-execution
          git rev-parse HEAD
