name: B110 Governed Closeout

on:
  pull_request:
    branches:
      - agent/frontier-050-execution

permissions:
  contents: write

concurrency:
  group: b110-governed-closeout
  cancel-in-progress: false

jobs:
  execute-b110:
    if: github.event.pull_request.head.ref == 'agent/b110-governed-trigger'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout locked execution branch
        uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
          path: primary_checkout

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install execution dependency
        run: python -m pip install --disable-pip-version-check numpy

      - name: Execute frozen Module B in primary checkout
        working-directory: primary_checkout
        shell: bash
        run: |
          set -euo pipefail
          RUN='modules/B/runs/B-110-20260807T002248Z'
          python tools/repair_registered_run_tree.py --run-id A-100-20260806T173458Z --record memory/A100_TREE_REGISTRY_REPAIR.json
          python tools/rfc.py doctor
          python tools/run_reference_checks.py --module B --output "$RUN/reference_checks.json"
          mkdir -p "$RUN/solver_configs" "$RUN/solver_outputs/big_implosion"
          python tools/materialize_solver_config.py \
            --template configured_runs/templates/B_big_implosion.template.json \
            --binding-sheet "$RUN/binding_sheets/B_big_implosion.bindings.json" \
            --output "$RUN/solver_configs/B_big_implosion.json"
          python tools/run_configured_solver.py \
            --config "$RUN/solver_configs/B_big_implosion.json" \
            --output-dir "$RUN/solver_outputs/big_implosion"
          python "$RUN/primary_module_b.py"
          python "$RUN/independent_module_b.py"
          python "$RUN/validate_module_b.py"
          python tools/rfc.py firewall-scan | tee "$RUN/FIREWALL_SCAN.txt"
          python -m unittest discover -s tests -v

      - name: Record primary deterministic hashes
        working-directory: primary_checkout
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('.')
          run=root/'modules/B/runs/B-110-20260807T002248Z'
          rels=[
            'solver_configs/B_big_implosion.json',
            'primary/BIG_IMPLOSION_PHYSICAL_STATE.json',
            'primary/FINITE_N_STRUCTURAL_AUDIT.json',
            'primary/COUNTERMODEL_RESULTS.json',
            'primary/UNCERTAINTY_ENVELOPE.json',
            'primary/PRIMARY_SUMMARY.json',
            'independent/INDEPENDENT_RECONSTRUCTION.json',
            'GATE_RESULTS.json',
            'CHECKPOINT_RECORD.json',
            'checkpoints/B_FIRST_PHYSICAL_STATE.json'
          ]
          out={}
          for rel in rels:
              p=run/rel
              out[rel]=hashlib.sha256(p.read_bytes()).hexdigest()
          pathlib.Path('../primary_hashes.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY

      - name: Clean replay checkout
        uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
          path: replay_checkout

      - name: Replay frozen Module B from clean checkout
        working-directory: replay_checkout
        shell: bash
        run: |
          set -euo pipefail
          RUN='modules/B/runs/B-110-20260807T002248Z'
          python tools/repair_registered_run_tree.py --run-id A-100-20260806T173458Z
          python tools/rfc.py doctor
          python tools/run_reference_checks.py --module B --output "$RUN/reference_checks.json"
          mkdir -p "$RUN/solver_configs" "$RUN/solver_outputs/big_implosion"
          python tools/materialize_solver_config.py \
            --template configured_runs/templates/B_big_implosion.template.json \
            --binding-sheet "$RUN/binding_sheets/B_big_implosion.bindings.json" \
            --output "$RUN/solver_configs/B_big_implosion.json"
          python tools/run_configured_solver.py \
            --config "$RUN/solver_configs/B_big_implosion.json" \
            --output-dir "$RUN/solver_outputs/big_implosion"
          python "$RUN/primary_module_b.py"
          python "$RUN/independent_module_b.py"
          python "$RUN/validate_module_b.py"

      - name: Compare replay hashes and certify replay
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,subprocess
          first=json.loads(pathlib.Path('primary_hashes.json').read_text())
          run=pathlib.Path('replay_checkout/modules/B/runs/B-110-20260807T002248Z')
          second={rel:hashlib.sha256((run/rel).read_bytes()).hexdigest() for rel in first}
          matches={rel:{'primary_sha256':first[rel],'replay_sha256':second[rel],'match':first[rel]==second[rel]} for rel in first}
          if not all(v['match'] for v in matches.values()):
              raise SystemExit('HARD STOP: clean replay scientific hashes differ')
          ref=subprocess.check_output(['git','-C','replay_checkout','rev-parse','HEAD'],text=True).strip()
          rec={
            'run_id':'B-110-20260807T002248Z',
            'result':'PASS',
            'clean_checkout':True,
            'artifact_hashes_match':True,
            'replay_ref':ref,
            'method':'second actions/checkout of agent/frontier-050-execution with no generated primary artifacts, followed by full frozen materialize/solver/primary/independent/validate sequence',
            'compared_artifacts':matches
          }
          p=pathlib.Path('primary_checkout/modules/B/runs/B-110-20260807T002248Z/REPLAY_RECORD.json')
          p.write_text(json.dumps(rec,indent=2,sort_keys=True)+'\n')
          PY

      - name: Finalize evidence and handoff
        working-directory: primary_checkout
        shell: bash
        run: |
          set -euo pipefail
          RUN='modules/B/runs/B-110-20260807T002248Z'
          python "$RUN/finalize_module_b.py"
          python tools/rfc.py promote-module B --to FORMALIZED --fidelity MINIMAL_SPINE --evidence "$RUN/FROZEN_DERIVATION_SPEC.json"
          python tools/rfc.py promote-module B --to IMPLEMENTED --fidelity MINIMAL_SPINE --evidence "$RUN/solver_outputs/big_implosion/result.json"
          python tools/rfc.py promote-module B --to VERIFIED --fidelity MINIMAL_SPINE --evidence "$RUN/GATE_RESULTS.json"
          python tools/rfc.py promote-module B --to PHYSICALLY_EXECUTED --fidelity MINIMAL_SPINE --evidence "$RUN/primary/BIG_IMPLOSION_PHYSICAL_STATE.json"
          python tools/rfc.py promote-module B --to INDEPENDENTLY_REPRODUCED --fidelity MINIMAL_SPINE --evidence "$RUN/independent/INDEPENDENT_RECONSTRUCTION.json"
          python tools/rfc.py promote-module B --to FROZEN --fidelity MINIMAL_SPINE --evidence modules/B/frozen/H_B_to_C.json
          python tools/rfc.py close-run --run-id B-110-20260807T002248Z --result PASS --closeout "$RUN/CLOSEOUT.md"
          python tools/rfc.py advance --task B-110 --result PASS --evidence "$RUN/CLOSEOUT.md" --note 'Module B closed at its verified first-physical-state scope; exactly one immediate child may advance.'
          python tools/rfc.py context
          python tools/director.py prepare-active
          python tools/rfc.py doctor

      - name: Commit verified Module B closeout
        working-directory: primary_checkout
        shell: bash
        run: |
          set -euo pipefail
          git config user.name '3-RFC governed executor'
          git config user.email 'actions@users.noreply.github.com'
          git status --short
          git add STATE.json WORK_QUEUE.json CLAIMS_LEDGER.json memory modules/B work_packets/ACTIVE_WORK_PACKET.md
          if git diff --cached --quiet; then
            echo 'HARD STOP: no governed closeout changes to commit'
            exit 1
          fi
          git commit -m 'Close Module B at its verified scientific scope'
          git push origin HEAD:agent/frontier-050-execution
          git rev-parse HEAD
