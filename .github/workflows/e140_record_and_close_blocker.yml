name: E140 Record Checks And Close Blocker

on:
  pull_request:
    branches:
      - agent/frontier-050-execution

permissions:
  contents: write

jobs:
  close-blocker:
    if: github.event.pull_request.head.ref == 'ops/readme-exact-startup-20260807c'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install repository locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Record exact Wolfram outputs and reference check
        shell: bash
        run: |
          set -euo pipefail
          RUN='modules/E/runs/E-140-20260807T142445Z'
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('modules/E/runs/E-140-20260807T142445Z/PRE_EXECUTION_LOCK.json')
          x=json.loads(p.read_text())
          if x.get('status')!='FROZEN' or x.get('classification')!='FROZEN_PREEXECUTION_SCIENTIFIC_OBSTRUCTION':
              raise SystemExit('HARD STOP: E pre-execution obstruction is not frozen')
          PY
          mkdir -p "$RUN/wolfram_outputs"
          cat > "$RUN/wolfram_outputs/E-WL-001.txt" <<'EOF'
          Symbol::undefined2: Warning: Global symbols "S, S, S" are undefined.
          General::messages: Messages were generated which may indicate errors.

          Out[1]= "<|\"call\" -> \"E-WL-001\", \"residual\" -> {{0, 0}, {0, 0}}, \"pass\" -> True, \"leftNullspace\" -> {\"{1, 0, 1}\", \"{-1, 1, 0}\"}|>"
          EOF
          cat > "$RUN/wolfram_outputs/E-WL-002.txt" <<'EOF'
          Symbol::undefined2: Warning: Global symbols "S, S, J, J" are undefined.
          General::messages: Messages were generated which may indicate errors.

          Out[1]= "<|\"call\" -> \"E-WL-002\", \"rhs\" -> \"{d*kr - kf*n*p, d*kr - kf*n*p, -(d*kr) + kf*n*p}\", \"jacobian\" -> \"{{-(kf*p), -(kf*n), kr}, {-(kf*p), -(kf*n), kr}, {kf*p, kf*n, -kr}}\", \"conservationCheck\" -> \"0\"|>"
          EOF
          python tools/director.py wolfram-record --run E-140-20260807T142445Z --call E-WL-001 --output "$RUN/wolfram_outputs/E-WL-001.txt"
          python tools/director.py wolfram-record --run E-140-20260807T142445Z --call E-WL-002 --output "$RUN/wolfram_outputs/E-WL-002.txt"
          python tools/run_reference_checks.py --module E --output modules/E/runs/E-140-20260807T142445Z/reference_checks.json
      - name: Execute exact solver-copy step and enforce binding hard stop
        shell: bash
        run: |
          set -euo pipefail
          RUN='modules/E/runs/E-140-20260807T142445Z'
          set +e
          python tools/director.py solver-copy --module E --solver reaction_network --destination "$RUN" > "$RUN/solver_copy_attempt.txt" 2>&1
          code=$?
          set -e
          printf '\nexit_code=%s\n' "$code" >> "$RUN/solver_copy_attempt.txt"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('modules/E/runs/E-140-20260807T142445Z/binding_sheets/E_reaction_network.bindings.json')
          b=json.loads(p.read_text())
          unresolved=[x['path'] for x in b['bindings'] if x.get('value') is None or '__BIND_' in str(x.get('placeholder',''))]
          required_rate={'model.rate_expressions','model.parameters','t_span','max_step'}
          if not required_rate.intersection(unresolved):
              raise SystemExit('HARD STOP: expected source-rate binding obstruction is no longer present; re-audit required')
          Path('modules/E/runs/E-140-20260807T142445Z/BINDING_HARD_STOP.json').write_text(json.dumps({
            'status':'HARD_STOP','reason':'Unresolved provenance-bound E physical rate/time bindings; materialization and physical solver execution prohibited.',
            'unresolved_paths':unresolved,'physical_solver_executed':False
          },indent=2)+'\n')
          PY
      - name: Finalize scientific blocker evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, platform
          from pathlib import Path
          RUN=Path('modules/E/runs/E-140-20260807T142445Z')
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          state=json.loads(Path('STATE.json').read_text())

          gates={
            'schema_version':'1.0','module':'E','run_id':'E-140-20260807T142445Z','overall':'BLOCKED','aggregate_scores_cannot_override':True,
            'component_gates':{
              'baryon/charge/energy accounting':{'status':'BLOCKED','reason':'Manufactured symbolic baryon/charge conservation passes, but no source-owned nuclear energy/rate ledger exists for physical execution.'},
              'network convergence':{'status':'NOT_RUN','reason':'Physical solver binding prohibited by rate-source hard stop.'},
              'rate-source audit':{'status':'FAIL_REQUIRES_ANALYSIS','score':0.0,'reason':'No provenance-bound numerical forward/reverse rate or E rate/time normalization found in exact parent or target-blind admitted sources.'},
              'no scalar-channel collapse':{'status':'PASS','reason':'Historical scalar/triadic Li7 proxy outcomes were quarantined from generation; no scalar proxy promoted.'},
              'withheld reaction and independent implementation checks':{'status':'NOT_RUN','reason':'Requires a lawfully bound physical reaction network.'}
            },
            'blocking_gate':'rate-source audit',
            'physical_execution_occurred':False
          }
          (RUN/'GATE_RESULTS.json').write_text(json.dumps(gates,indent=2)+'\n')

          (RUN/'INDEPENDENT_VERIFICATION.md').write_text('''# Independent Verification — E-140 Source/Rate Obstruction\n\nIndependent reconstruction begins from the exact frozen D→E handoff, the admitted source manifest, E recipe/work order, the repository capability boundary, and the exact E Wolfram programs. It does not trust the primary gate summary.\n\nThe D parent supplies a dimensionless thermal/transport handoff and explicitly preloads no primordial abundances; it supplies no nuclear rate coefficients. The admitted revised W2 metadata explicitly records `fullBBNNetworkCompleted=False`, `reactionRateTablesUsed=False`, and `temperatureTimeIntegrationDone=False`. The dedicated nucleosynthesis addendum is an internal theorem/proxy object with external physical network validation pending. The exact E Wolfram programs verify a manufactured `n+p↔d` conservation/Jacobian skeleton while leaving `kf` and `kr` symbolic.\n\nTherefore the current source set cannot provenance-bind the physical E reaction-network solver without inventing coefficients or importing target-conditioned proxy material.\n\n**Independent result: PASS for obstruction reconstruction. Physical E execution remains BLOCKED.**\n''')

          failure={
            'failure_id':'E-140-MISSING-SOURCE-OWNED-NUCLEAR-RATE-LAW','run_id':'E-140-20260807T142445Z','gate':'rate-source audit',
            'category':'SCIENTIFIC_UNDERDETERMINATION','description':'Exact D parent and target-blind admitted source set do not determine provenance-bound E forward/reverse nuclear rates or rate/time normalization. Historical W2/addendum proxy material is non-generative.',
            'earliest_affected_object':'E_SOURCE_OWNED_NUCLEAR_RATE_LAW','changes_frozen_science':False,'required_replay_scope':'new governed E run after lawful rate-law recovery/derivation',
            'strongest_claim_remaining':state['strongest_supported_claim']
          }
          (RUN/'FAILURES.jsonl').write_text(json.dumps(failure)+'\n')

          (RUN/'RUN_PLAN.md').write_text('''# Run Plan — E-140\n\nThe active packet was followed through the pre-execution source/rate audit, exact Wolfram checks, reference check, and solver-copy/binding stage. The physical reaction-network binding then hit the frozen hard stop because no target-blind provenance-bound numerical rate law exists in the exact D parent or admitted source set. No physical abundance execution is permitted.\n''')

          env={'schema_version':'1.0','run_id':'E-140-20260807T142445Z','status':'FINAL','python':platform.python_version(),'generation_mode':'GENERATION_SEALED','public_data_used':False,'network_use_for_science':'NONE','physical_execution_status':'NOT_RUN_DUE_FROZEN_RATE_SOURCE_OBSTRUCTION'}
          (RUN/'ENVIRONMENT.json').write_text(json.dumps(env,indent=2)+'\n')
          (RUN/'CHECKPOINT_RECORD.json').write_text(json.dumps({'status':'NOT_APPLICABLE_BLOCKED_BEFORE_PHYSICAL_EXECUTION','run_id':'E-140-20260807T142445Z'},indent=2)+'\n')
          (RUN/'REPLAY_RECORD.json').write_text(json.dumps({'result':'NOT_APPLICABLE_BLOCKED_BEFORE_PHYSICAL_EXECUTION','clean_checkout_reconstruction_scope':'source/rate obstruction only','physical_artifact_hash_replay':False},indent=2)+'\n')
          (RUN/'CLOSEOUT.md').write_text('''# E-140 Closeout — Scientific Blocker Preserved\n\n## Result\n\n`BLOCKED / FAIL_REQUIRES_ANALYSIS`. No physical primordial reaction network was executed.\n\n## Strongest supported claim\n\nModule D remains the strongest frozen physical result: a generated dimensionless nonequilibrium thermal/phase history at MINIMAL_SPINE fidelity. E additionally establishes, by frozen source audit plus independent reconstruction, that its physical reaction network is not lawfully bindable from the current exact parent/source set.\n\n## Strongest unsupported claim\n\nNo source-owned numerical nuclear reaction-rate law, nuclear energy ledger, physical primordial isotope trajectory, isotope covariance, or physical freeze-out state has been derived. Historical/proxy Li7/Be7 target-relative results are not promoted into E.\n\n## Earliest missing object\n\n`E_SOURCE_OWNED_NUCLEAR_RATE_LAW`.\n\n## Required repair\n\nRecover or derive an exact target-blind provenance-bound E nuclear rate law (including forward/reverse rates and lawful rate/time normalization) from canonical authority. Then create a new governed E run and replay the complete E matrix.\n''')

          files=['SOURCE_REGISTER.json','PRE_EXECUTION_LOCK.json','reference_checks.json','solver_copy_attempt.txt','BINDING_HARD_STOP.json','GATE_RESULTS.json','INDEPENDENT_VERIFICATION.md','FAILURES.jsonl','ENVIRONMENT.json','CHECKPOINT_RECORD.json','REPLAY_RECORD.json','CLOSEOUT.md','wolfram/E-WL-001/record.json','wolfram/E-WL-001/gate.json','wolfram/E-WL-002/record.json','wolfram/E-WL-002/gate.json']
          outputs=[]
          for rel in files:
              p=RUN/rel
              if p.exists(): outputs.append({'path':rel,'sha256':sha(p),'bytes':p.stat().st_size})
          (RUN/'GENERATED_OUTPUT_MANIFEST.json').write_text(json.dumps({'status':'FINAL_BLOCKED','generation_mode':'GENERATION_SEALED','physical_execution_occurred':False,'outputs':outputs},indent=2)+'\n')
          PY
          python tools/rfc.py close-run --run-id E-140-20260807T142445Z --result BLOCKED --closeout modules/E/runs/E-140-20260807T142445Z/CLOSEOUT.md
          python tools/rfc.py advance --task E-140 --result FAIL --evidence modules/E/runs/E-140-20260807T142445Z/CLOSEOUT.md --note 'Frozen rate-source audit found no lawful target-blind provenance-bound E nuclear rate law; physical E execution blocked.'
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('STATE.json'); s=json.loads(p.read_text())
          s['strongest_unsupported_claim']='No source-owned numerical nuclear reaction-rate law, nuclear energy ledger, physical primordial isotope trajectory, isotope covariance, or physical freeze-out state has been derived. E is blocked at E_SOURCE_OWNED_NUCLEAR_RATE_LAW; historical/proxy abundance-target results are not generative parents.'
          p.write_text(json.dumps(s,indent=2)+'\n')
          PY
          python tools/rfc.py context
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
      - name: Commit and remove carrier
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/e140_record_and_close_blocker.yml
          git config user.name '3-RFC governed executor'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Preserve E140 nuclear-rate source obstruction'
          git pull --rebase origin agent/frontier-050-execution
          git push origin HEAD:agent/frontier-050-execution
