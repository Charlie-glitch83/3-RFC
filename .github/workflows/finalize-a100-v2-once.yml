name: Finalize A-100 on isolated branch once

on:
  push:
    branches: [agent/a100-finalize-v2]
    paths:
      - '.github/a100-finalize-v2-trigger.txt'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements-lock.txt
      - name: Verify evidence and complete governed transition
        shell: bash
        env:
          RUN_ID: A-100-20260806T173458Z
          EVIDENCE_COMMIT: 23ca80aad5a565ed58648103b2908c6360d29506
          FINAL_BRANCH: agent/a100-finalize-v2
          H_A_SHA256: 728caf8c049d0114caef6f7b36af00065a32b4dc5f4faad02c6b9bcb16c933e7
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          run = Path('modules/A/runs') / os.environ['RUN_ID']
          assert hashlib.sha256(Path('modules/A/frozen/H_A_to_B.json').read_bytes()).hexdigest() == os.environ['H_A_SHA256']
          gates=json.loads((run/'GATE_RESULTS.json').read_text())
          replay=json.loads((run/'REPLAY_RECORD.json').read_text())
          assert gates['overall']=='PASS'
          assert all(g['result']=='PASS' and g['score']>=0.95 for g in gates['gates'])
          assert replay['result']=='PASS' and replay['clean_checkout'] and replay['artifact_hashes_match']
          p=run/'CLOSEOUT.md'
          text=p.read_text()
          text=text.replace('administrative close-run awaits the verified GitHub evidence commit.','verified GitHub evidence commit recorded; administrative close-run completed.')
          text=text.replace('promotion to be recorded after the evidence commit is verified','promotion recorded after exact GitHub evidence verification')
          text=text.replace('PENDING_EVIDENCE_COMMIT',os.environ['EVIDENCE_COMMIT'])
          p.write_text(text)
          PY
          python tools/rfc.py record-commit "$EVIDENCE_COMMIT" --branch agent/frontier-050-execution --note 'Verified exact A-100 evidence commit and changed-file scope on GitHub'
          python tools/rfc.py close-run --run-id "$RUN_ID" --result PASS --closeout "modules/A/runs/$RUN_ID/CLOSEOUT.md"
          python tools/rfc.py promote-module A --to FORMALIZED --fidelity PRODUCTION --evidence modules/A/frozen/H_A_to_B.json
          python tools/rfc.py promote-module A --to VERIFIED --fidelity PRODUCTION --evidence "modules/A/runs/$RUN_ID/INDEPENDENT_VERIFICATION.md"
          python tools/rfc.py promote-module A --to INDEPENDENTLY_REPRODUCED --fidelity PRODUCTION --evidence "modules/A/runs/$RUN_ID/independent/INDEPENDENT_RECONSTRUCTION.json"
          python tools/rfc.py promote-module A --to FROZEN --fidelity PRODUCTION --evidence modules/A/frozen/H_A_to_B.json
          python tools/rfc.py advance --task A-100 --result PASS --evidence "modules/A/runs/$RUN_ID/CLOSEOUT.md" --note 'Module A closed at FROZEN/PRODUCTION; authorize exactly B-110'
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/test_repository.py')
          s=p.read_text()
          old='''    def test_module_evidence_history_and_requirements(self):
        state = json.loads((ROOT / "STATE.json").read_text())
        req = json.loads((ROOT / "config/module_evidence_requirements.json").read_text())["modules"]
        for mod, rec in state["modules"].items():
            self.assertEqual(rec["evidence_state"], "DESIGN")
            self.assertEqual(rec["evidence_history"][0]["state"], "DESIGN")
            self.assertIn(mod, req)
'''
          new='''    def test_module_evidence_history_and_requirements(self):
        state = json.loads((ROOT / "STATE.json").read_text())
        req = json.loads((ROOT / "config/module_evidence_requirements.json").read_text())["modules"]
        evidence = json.loads((ROOT / "config/evidence_states.json").read_text())
        transitions = evidence["transitions"]
        exceptions = set(evidence["exception_states"])
        valid_states = set(evidence["ordered"]) | exceptions
        for mod, rec in state["modules"].items():
            self.assertIn(mod, req)
            history = rec["evidence_history"]
            self.assertTrue(history, mod)
            self.assertEqual(history[0]["state"], "DESIGN")
            self.assertEqual(rec["evidence_state"], history[-1]["state"])
            self.assertIn(rec["evidence_state"], valid_states)
            for previous, current in zip(history, history[1:]):
                before, after = previous["state"], current["state"]
                self.assertIn(after, valid_states)
                if before in transitions and after not in exceptions:
                    self.assertIn(after, transitions[before], f"{mod}: {before} -> {after}")
            if rec["evidence_state"] == "FROZEN":
                visited = [entry["state"] for entry in history]
                cursor = 0
                for required_state in req[mod]["must_visit"]:
                    cursor = visited.index(required_state, cursor) + 1
'''
          assert old in s
          p.write_text(s.replace(old,new))
          PY
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
          python tools/rfc.py context
          python - <<'PY'
          import json
          s=json.load(open('STATE.json')); q=json.load(open('WORK_QUEUE.json'))
          assert s['active_work_unit']=='B-110' and s['current_module']=='B' and s['current_run'] is None
          assert s['modules']['A']['evidence_state']=='FROZEN' and s['modules']['A']['fidelity']=='PRODUCTION'
          assert [x['id'] for x in q['items'] if x['status']=='ACTIVE']==['B-110']
          PY
          rm -f .github/a100-finalize-v2-trigger.txt .github/workflows/finalize-a100-v2-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Close Module A and authorize B-110'
          FINAL_COMMIT=$(git rev-parse HEAD)
          git push origin HEAD:"$FINAL_BRANCH"
          REMOTE=$(git ls-remote origin "refs/heads/$FINAL_BRANCH" | awk '{print $1}')
          test "$REMOTE" = "$FINAL_COMMIT"
          git diff-tree --no-commit-id --name-only -r "$FINAL_COMMIT"
