name: One-shot README Executor

on:
  pull_request:
    branches:
      - agent/frontier-050-execution

permissions:
  contents: write

jobs:
  execute:
    if: github.event.pull_request.head.ref == 'ops/readme-executor-20260806'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout active execution branch
        uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-lock.txt

      - name: Follow root README exact first commands
        shell: bash
        run: |
          set -euo pipefail
          bash bootstrap.sh
          bash tools/start_work.sh

      - name: Show active work
        shell: bash
        run: |
          set -euo pipefail
          python tools/director.py active

      - name: Commit generated startup state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name '3-RFC governed executor'
          git config user.email 'actions@users.noreply.github.com'
          git add STATE.json WORK_QUEUE.json memory work_packets modules/D/runs
          if git diff --cached --quiet; then
            echo 'No startup changes produced.'
            exit 1
          fi
          git commit -m 'Start D-130 exactly from root README'
          git push origin HEAD:agent/frontier-050-execution
          git rev-parse HEAD
