name: Close AUTH-020 and advance

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  close:
    if: github.head_ref == 'agent/auth-020-execution'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/auth-020-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements-lock.txt
      - name: Record, close, and advance AUTH-020
        shell: bash
        run: |
          set -euo pipefail
          python tools/rfc.py record-commit 795bf1c11b7ab67438b9b93b3c267f09d69ebe86 --branch agent/auth-020-execution --note 'Verified AUTH-020 constitution-lock commit, exact changed files, gate evidence, source trace, and closeout'
          python tools/rfc.py close-run --run-id AUTH-020-20260806T071800Z --result PASS --closeout runs/AUTH-020-20260806T071800Z/CLOSEOUT.md
          python tools/rfc.py advance --task AUTH-020 --result PASS --evidence runs/AUTH-020-20260806T071800Z/CLOSEOUT.md
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
          python tools/rfc.py context
      - name: Commit formal transition and remove temporary runners
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/finalize-auth-020.yml .github/workflows/run-auth-020-startup.yml
          git add -A
          git commit -m 'Close AUTH-020 and activate source crosswalk'
          git push origin agent/auth-020-execution
