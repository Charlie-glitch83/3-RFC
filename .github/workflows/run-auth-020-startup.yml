name: Execute AUTH-020 doctor

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  doctor:
    if: github.head_ref == 'agent/auth-020-execution'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/auth-020-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements-lock.txt
      - name: Run exact AUTH-020 command
        run: python tools/director.py doctor
