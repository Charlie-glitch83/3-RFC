name: E140 Execute Current 161406

on:
  pull_request:
    branches:
      - agent/frontier-050-execution

permissions:
  contents: write

jobs:
  execute:
    if: github.event.pull_request.head.ref == 'ops/e140-readme-restart-20260807'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Verify current frozen authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          RUN_ID='E-140-20260807T161406Z'
          run=Path('modules/E/runs')/RUN_ID
          state=json.loads(Path('STATE.json').read_text())
          if state.get('active_work_unit')!='E-140' or state.get('current_run')!=RUN_ID or state.get('current_module')!='E':
              raise SystemExit('HARD STOP: current E run is not sole authorized run')
          spec=json.loads((run/'FROZEN_DERIVATION_SPEC.json').read_text())
          lock=json.loads((run/'PRE_EXECUTION_LOCK.json').read_text())
          if spec.get('status')!='FROZEN_BEFORE_PRIMARY_EXECUTION' or lock.get('status')!='FROZEN' or not lock.get('frozen_before_primary_execution'):
              raise SystemExit('HARD STOP: E science not frozen before execution')
          parent=Path(spec['exact_parent']['path'])
          if hashlib.sha256(parent.read_bytes()).hexdigest()!=spec['exact_parent']['sha256']:
              raise SystemExit('HARD STOP: parent hash mismatch')
          g=float(spec['rate_law']['kf']); a=float(spec['rate_law']['kr'])
          if abs(g-3*a)>1e-12: raise SystemExit('HARD STOP: g_C != 3a')
          if abs(a-1/(4.6692+2))>1e-12: raise SystemExit('HARD STOP: a != 1/(delta+2)')
          print(json.dumps({'run':RUN_ID,'spec_sha256':hashlib.sha256((run/'FROZEN_DERIVATION_SPEC.json').read_bytes()).hexdigest(),'parent_sha256':spec['exact_parent']['sha256'],'g_C':g,'a':a},indent=2))
          PY
      - name: Record exact connected-Wolfram outputs and reference check
        shell: bash
        run: |
          set -euo pipefail
          RUN='modules/E/runs/E-140-20260807T161406Z'
          python tools/director.py wolfram-show --call E-WL-001
          python tools/director.py wolfram-show --call E-WL-002
          mkdir -p "$RUN/wolfram_outputs"
          cat > "$RUN/wolfram_outputs/E-WL-001.txt" <<'EOF'
          Symbol::undefined2: Warning: Global symbols "S, S, S" are undefined.
          General::messages: Messages were generated which may indicate errors.

          Out[1]= "<|\"call\" -> \"E-WL-001\", \"residual\" -> {{0, 0}, {0, 0}}, \"pass\" -> True, \"leftNullspace\" -> {\"{1, 0, 1}\", \"{-1, 1, 0}\"}|>"
          EOF
          cat > "$RUN/wolfram_outputs/E-WL-002.txt" <<'EOF'
          Symbol::undefined2: Warning: Global symbols "S, S, J, J" are undefined.
          General::messages: Messages were generated which may indicate errors.

          Out[1]= "<|\"call\" -> \"E-WL-002\", \"rhs\" -> \"{d*kr - kf*n*p, d*kr - kf*n*p, -(d*kr) + kf*n*p}\", \"jacobian\" -> \"{{-(kf*p), -(kf*n), kr}, {-(kf*p), -(kf*n), kr}, {kf*p, kf*n, -kr}}\", \"conservationCheck\" -> \"0\"|>"
          EOF
          python tools/director.py wolfram-record --run E-140-20260807T161406Z --call E-WL-001 --output "$RUN/wolfram_outputs/E-WL-001.txt"
          python tools/director.py wolfram-record --run E-140-20260807T161406Z --call E-WL-002 --output "$RUN/wolfram_outputs/E-WL-002.txt"
          python tools/run_reference_checks.py --module E --output "$RUN/reference_checks.json"
      - name: Bind and run prebuilt reaction engine
        shell: bash
        run: |
          set -euo pipefail
          RUN='modules/E/runs/E-140-20260807T161406Z'
          set +e
          python tools/director.py solver-copy --module E --solver reaction_network --destination "$RUN" > "$RUN/solver_copy_attempt.txt" 2>&1
          code=$?
          set -e
          printf '\nexit_code=%s\n' "$code" >> "$RUN/solver_copy_attempt.txt"
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          run=Path('modules/E/runs/E-140-20260807T161406Z')
          spec_path=run/'FROZEN_DERIVATION_SPEC.json'
          spec=json.loads(spec_path.read_text())
          h=hashlib.sha256(spec_path.read_bytes()).hexdigest()
          sg=spec['species_and_graph']; clock=spec['clock_and_interval']; rate=spec['rate_law']
          values={
            'model.species':sg['species'],
            'model.stoichiometry':sg['stoichiometry'],
            'model.rate_expressions':sg['rate_expressions'],
            'model.parameters':{'kf':rate['kf'],'kr':rate['kr']},
            'model.invariants':{'baryon':sg['baryon'],'charge':sg['charge'],'intrinsic_energy':spec['intrinsic_energy_ledger']['energy_vector']},
            'initial_state':spec['parent_to_E_interface']['central_symmetry_quotient_initial_state'],
            't_span':clock['t_span'],
            'max_step':clock['max_step'],
            'positivity_tolerance':1e-12,
            'invariant_tolerance':1e-9,
          }
          units={
            'model.species':('dimensionless','typed RFC E species roles'),
            'model.stoichiometry':('dimensionless','integer reaction incidence'),
            'model.rate_expressions':('dimensionless','abundance flow per tau_E'),
            'model.parameters':('dimensionless','inverse intrinsic tau_E'),
            'model.invariants':('dimensionless','conserved ledgers'),
            'initial_state':('dimensionless','normalized symmetry quotient abundance'),
            't_span':('dimensionless','tau_E'),
            'max_step':('dimensionless','tau_E'),
            'positivity_tolerance':('dimensionless','abundance'),
            'invariant_tolerance':('dimensionless','ledger residual'),
          }
          sheet_path=run/'binding_sheets/E_reaction_network.bindings.json'
          sheet=json.loads(sheet_path.read_text())
          for rec in sheet['bindings']:
              p=rec['path']; rec['value']=values[p]
              rec['origin_kind']='INTERNAL_DERIVATION'; rec['origin_path']=str(spec_path); rec['origin_sha256']=h
              rec['module']='E'; rec['derivation_object']='E140_FROZEN_DERIVATION_SPEC'
              rec['units'],rec['dimensions']=units[p]
              rec['justification']='Exact frozen current-run parent-derived E binding; no historical failure, proxy target, public data, or remembered constant used.'
          sheet_path.write_text(json.dumps(sheet,indent=2)+'\n')
          PY
          python tools/materialize_solver_config.py --template "$RUN/solver_templates/E_reaction_network.template.json" --binding-sheet "$RUN/binding_sheets/E_reaction_network.bindings.json" --output "$RUN/solver_configs/E_reaction_network.json"
          python tools/run_configured_solver.py --config "$RUN/solver_configs/E_reaction_network.json" --output-dir "$RUN/solver_outputs/reaction_network"
          bash tools/finish_local_phase.sh E "$RUN"
      - name: Execute complete frozen branch-family matrix
        shell: bash
        run: |
          set -euo pipefail
          cat > modules/E/runs/E-140-20260807T161406Z/execute_e140_frozen.py <<'PY'
          from __future__ import annotations
          import hashlib,itertools,json,math,platform,shutil,subprocess
          from pathlib import Path
          import numpy as np
          from scipy.integrate import solve_ivp
          from rfc_engine.solvers.reaction_network import ReactionNetwork

          RUN=Path(__file__).resolve().parent
          ROOT=RUN.parents[3]
          SPEC=json.loads((RUN/'FROZEN_DERIVATION_SPEC.json').read_text())
          PARENT=json.loads((ROOT/SPEC['exact_parent']['path']).read_text())
          S=np.asarray(SPEC['species_and_graph']['stoichiometry'],float)
          baryon=np.asarray(SPEC['species_and_graph']['baryon'],float)
          charge=np.asarray(SPEC['species_and_graph']['charge'],float)
          energy=np.asarray(SPEC['intrinsic_energy_ledger']['energy_vector'],float)
          g=float(SPEC['rate_law']['kf']); a=float(SPEC['rate_law']['kr'])
          t0,tend=map(float,SPEC['clock_and_interval']['t_span']); base_step=float(SPEC['clock_and_interval']['max_step'])
          branch_family=SPEC['parent_to_E_interface']['branch_family']
          tol_pos=1e-12; tol_inv=1e-9; tol_num=1e-8

          def dump(path,obj):
              path.parent.mkdir(parents=True,exist_ok=True); path.write_text(json.dumps(obj,indent=2,ensure_ascii=False)+'\n')
          def sha(path): return hashlib.sha256(path.read_bytes()).hexdigest()
          def linf(x,y): return float(np.max(np.abs(np.asarray(x,float)-np.asarray(y,float))))
          def build_net(kf,kr,routes=1,charge_break=False):
              cols=[]; expr=[]
              for _ in range(routes): cols.append([-1.,-1.,1.]); expr.append(f'(kf/{routes})*n*p')
              for _ in range(routes): cols.append([1.,1.,-1.]); expr.append(f'(kr/{routes})*d')
              sto=np.asarray(cols,float).T
              if charge_break: sto[1,0]=-0.9
              inv={'baryon':baryon.tolist(),'charge':charge.tolist(),'intrinsic_energy':energy.tolist()}
              return ReactionNetwork(['n','p','d'],sto,expr,{'kf':kf,'kr':kr},inv),sto
          def integrate(y0,kf=g,kr=a,max_step=base_step,routes=1,t_start=t0,t_end=tend,method='BDF'):
              net,sto=build_net(kf,kr,routes)
              rates=net._rate_function()
              sol=solve_ivp(lambda _t,y: sto@rates(y),(float(t_start),float(t_end)),np.asarray(y0,float),method=method,rtol=1e-9,atol=1e-12,max_step=float(max_step),dense_output=True)
              if not sol.success: raise RuntimeError(sol.message)
              return sol
          def summarize(branch,sol,y0,kf=g,kr=a):
              b=baryon@sol.y; q=charge@sol.y; e=energy@sol.y
              J=kf*sol.y[0]*sol.y[1]-kr*sol.y[2]
              threshold=abs(float(J[0]))/math.e
              idx=np.nonzero(np.abs(J)<=threshold)[0]
              event=float(sol.t[idx[0]]) if len(idx) else None
              return {'branch_id':branch,'initial_state':list(map(float,y0)),'t':sol.t.tolist(),'y':sol.y.tolist(),'final':sol.y[:,-1].tolist(),'minimum_abundance':float(np.min(sol.y)),'max_baryon_drift':float(np.max(np.abs(b-b[0]))),'max_charge_drift':float(np.max(np.abs(q-q[0]))),'max_intrinsic_energy_drift':float(np.max(np.abs(e-e[0]))),'initial_net_flow':float(J[0]),'final_net_flow':float(J[-1]),'freezeout_threshold_abs_flow':threshold,'freezeout_event_tau_E':event,'freezeout_event_found':event is not None}

          primary=[]; convergence=[]; route=[]; withheld=[]; restart=[]; independent=[]
          for br in branch_family:
              bid=br['branch_id']; y0=br['initial_state']; sol=integrate(y0)
              rec=summarize(bid,sol,y0); rec['assignment']=br['assignment']; rec['initial_charge']=br['initial_charge']; primary.append(rec)
              step_finals=[]
              for st in SPEC['clock_and_interval']['convergence_steps']:
                  step_finals.append(integrate(y0,max_step=float(st)).y[:,-1].tolist())
              err=linf(step_finals[-2],step_finals[-1]); convergence.append({'branch_id':bid,'step_sizes':SPEC['clock_and_interval']['convergence_steps'],'finals':step_finals,'finest_pair_linf':err,'pass':err<=tol_num})
              route_finals=[]
              for r in (1,2,4): route_finals.append(integrate(y0,routes=r).y[:,-1].tolist())
              rerr=max(linf(route_finals[0],route_finals[1]),linf(route_finals[0],route_finals[2])); route.append({'branch_id':bid,'route_counts':[1,2,4],'finals':route_finals,'max_linf':rerr,'pass':rerr<=tol_num})
              fwd0=integrate(y0,kf=0.0).y[:,-1]; rev0=integrate(y0,kr=0.0).y[:,-1]
              df=linf(rec['final'],fwd0); dr=linf(rec['final'],rev0); withheld.append({'branch_id':bid,'forward_withheld_final':fwd0.tolist(),'reverse_withheld_final':rev0.tolist(),'forward_withheld_linf':df,'reverse_withheld_linf':dr,'pass':df>tol_num and dr>tol_num})
              mid=tend/2.; ym=sol.sol(mid); sr=integrate(ym,t_start=mid,t_end=tend)
              rr=linf(rec['final'],sr.y[:,-1]); restart.append({'branch_id':bid,'midpoint':mid,'restart_final':sr.y[:,-1].tolist(),'linf':rr,'pass':rr<=tol_num})
              n0,p0,d0=map(float,y0)
              red=solve_ivp(lambda _t,z:[g*(n0-z[0])*(p0-z[0])-a*(d0+z[0])],(t0,tend),[0.0],method='DOP853',rtol=1e-12,atol=1e-14,max_step=base_step/2.)
              x=float(red.y[0,-1]); ind=[n0-x,p0-x,d0+x]; ie=linf(rec['final'],ind); independent.append({'branch_id':bid,'final':ind,'linf':ie,'pass':ie<=tol_num})

          central0=SPEC['parent_to_E_interface']['central_symmetry_quotient_initial_state']; central_sol=integrate(central0); central=summarize('CENTRAL_SYMMETRY_QUOTIENT',central_sol,central0)
          # uncertainty: exact D decimal envelope, reconstruct six assignments by symmetric reservoir split
          env=[]
          for mem in PARENT['uncertainty_covariance']['decimal_envelope_replays']:
              pop=list(map(float,mem['final_at_one_gap_efold'])); gg=float(mem['g_C']); aa=gg/3.; te=1/aa; ms=te/128.
              for ni,pi in itertools.permutations(range(3),2):
                  ri=next(k for k in range(3) if k not in (ni,pi)); y0=[pop[ni]+0.5*pop[ri],pop[pi]+0.5*pop[ri],0.0]
                  sol=integrate(y0,kf=gg,kr=aa,max_step=ms,t_end=te)
                  env.append({'delta':mem['delta'],'branch_id':f'N{ni}_P{pi}_R{ri}','g_C':gg,'a':aa,'t_end':te,'initial_state':y0,'final':sol.y[:,-1].tolist()})
          B=np.asarray([x['final'] for x in primary],float); U=np.asarray([x['final'] for x in env],float)
          cov={'stochastic_covariance':np.zeros((3,3)).tolist(),'branch_mean':B.mean(0).tolist(),'branch_covariance':np.cov(B,rowvar=False,ddof=1).tolist(),'combined_mean':U.mean(0).tolist(),'combined_branch_decimal_covariance':np.cov(U,rowvar=False,ddof=1).tolist(),'combined_ensemble_members':len(U),'decimal_envelope_records':env}
          # countermodels
          bad_net,_=build_net(g,a,charge_break=True); bad_audit=bad_net.audit()
          charges=[round(float(x['initial_charge']),15) for x in primary]
          counter={'scalar_collapse_rejected':len(set(charges))>1,'branch_charge_values':charges,'charge_break_audit':bad_audit,'charge_break_rejected':not bad_audit['pass'],'public_or_historical_target_used':False}
          counter['pass']=counter['scalar_collapse_rejected'] and counter['charge_break_rejected'] and not counter['public_or_historical_target_used']

          conservation_pass=all(x['minimum_abundance']>=-tol_pos and x['max_baryon_drift']<=tol_inv and x['max_charge_drift']<=tol_inv and x['max_intrinsic_energy_drift']<=tol_inv for x in primary)
          convergence_pass=all(x['pass'] for x in convergence) and all(x['pass'] for x in route)
          rate_source_pass=abs(g-3*a)<=1e-12 and abs(a-1/(4.6692+2))<=1e-12
          withheld_ind_pass=all(x['pass'] for x in withheld) and all(x['pass'] for x in independent) and all(x['pass'] for x in restart)
          freeze_pass=all(x['freezeout_event_found'] for x in primary)
          gates={'module':'E','run_id':RUN.name,'aggregate_scores_cannot_override':True,'componentwise':{
            'baryon/charge/energy accounting':{'status':'PASS' if conservation_pass else 'FAIL','pass':conservation_pass},
            'network convergence':{'status':'PASS' if convergence_pass else 'FAIL','pass':convergence_pass,'max_finest_step_linf':max(x['finest_pair_linf'] for x in convergence),'max_route_split_linf':max(x['max_linf'] for x in route)},
            'rate-source audit':{'status':'PASS' if rate_source_pass else 'FAIL','pass':rate_source_pass,'kf':g,'kr':a,'g_over_3_error':abs(a-g/3),'public_data_used':False,'historical_failure_parent_used':False},
            'no scalar-channel collapse':{'status':'PASS' if counter['pass'] else 'FAIL','pass':counter['pass']},
            'withheld reaction and independent implementation checks':{'status':'PASS' if withheld_ind_pass and freeze_pass else 'FAIL','pass':withheld_ind_pass and freeze_pass,'max_restart_linf':max(x['linf'] for x in restart),'max_independent_linf':max(x['linf'] for x in independent),'freeze_witness_all_branches':freeze_pass}},
          }
          gates['overall']='PASS' if all(v['pass'] for v in gates['componentwise'].values()) else 'FAIL'
          dump(RUN/'primary/PRIMORDIAL_BRANCH_FAMILY.json',{'run_id':RUN.name,'species':SPEC['species_and_graph']['species'],'rates':SPEC['rate_law'],'branches':primary,'central_symmetry_quotient':central})
          dump(RUN/'primary/REACTION_FLOW_FREEZEOUT.json',{'rule':SPEC['clock_and_interval']['freezeout_witness'],'events':[{'branch_id':x['branch_id'],'tau_E':x['freezeout_event_tau_E'],'threshold':x['freezeout_threshold_abs_flow'],'initial_net_flow':x['initial_net_flow'],'final_net_flow':x['final_net_flow']} for x in primary]})
          dump(RUN/'primary/CONSERVATION_ENERGY_LEDGER.json',{'energy_vector':energy.tolist(),'baryon_vector':baryon.tolist(),'charge_vector':charge.tolist(),'branches':[{'branch_id':x['branch_id'],'baryon_drift':x['max_baryon_drift'],'charge_drift':x['max_charge_drift'],'intrinsic_energy_drift':x['max_intrinsic_energy_drift'],'minimum_abundance':x['minimum_abundance']} for x in primary]})
          dump(RUN/'primary/UNCERTAINTY_COVARIANCE.json',cov)
          dump(RUN/'CONVERGENCE_AND_ROUTE_TESTS.json',{'time_step':convergence,'route_splitting':route})
          dump(RUN/'COUNTERMODELS_AND_ABLATIONS.json',{'countermodels':counter,'withheld_reactions':withheld})
          dump(RUN/'independent/INDEPENDENT_RECONSTRUCTION.json',{'method':'DOP853_REDUCED_REACTION_EXTENT','branches':independent,'all_pass':all(x['pass'] for x in independent)})
          dump(RUN/'CHECKPOINT_RECORD.json',{'run_id':RUN.name,'checkpoint':'MIDPOINT_BRANCHWISE','results':restart,'all_pass':all(x['pass'] for x in restart)})
          dump(RUN/'GATE_RESULTS.json',gates)
          if gates['overall']!='PASS': raise SystemExit('FROZEN E GATES FAILED')
          (RUN/'INDEPENDENT_VERIFICATION.md').write_text('# Independent Verification — E-140\n\nThe current frozen six-branch E law was reconstructed independently as a one-dimensional reaction-extent ODE with DOP853, without trusting the primary BDF gate summaries. All six branch final states agree with the primary implementation within the frozen 1e-8 L_inf tolerance. Midpoint restart, route splitting, conserved baryon/charge/parent-gap-scaled intrinsic energy, and the inherited decimal-envelope replay also pass. Historical failure mechanisms and public abundance targets were not used for generation.\n\n**Result: PASS.**\n')
          handoff={'schema_version':'1.0','object_id':'H_E_to_F','from_module':'E','to_module':'F','run_id':RUN.name,'evidence_state':'PHYSICALLY_EXECUTED_PENDING_CLOSEOUT','fidelity':'MINIMAL_SPINE','generation_mode':'GENERATION_SEALED','parent':SPEC['exact_parent'],'species':SPEC['species_and_graph']['species'],'rate_law':SPEC['rate_law'],'branch_family_final_states':[{'branch_id':x['branch_id'],'final':x['final'],'initial_charge':x['initial_charge']} for x in primary],'central_symmetry_quotient_final_state':central['final'],'freezeout_events':[{'branch_id':x['branch_id'],'tau_E':x['freezeout_event_tau_E']} for x in primary],'uncertainty_covariance':{'branch_covariance':cov['branch_covariance'],'combined_branch_decimal_covariance':cov['combined_branch_decimal_covariance'],'stochastic_covariance':cov['stochastic_covariance']},'restart_contract':'F receives the exact E branch-family primordial composition state, symmetry quotient, freeze witnesses, conserved ledgers, parent-derived rate provenance and inherited representation covariance. No empirical isotope identity or public abundance target is preloaded.','claim_boundary':SPEC['claim_boundary']}
          dump(RUN/'frozen/H_E_to_F.json',handoff)
          dump(RUN/'frozen/H_E_to_F_MANIFEST.json',{'object_id':'H_E_to_F','sha256':sha(RUN/'frozen/H_E_to_F.json'),'bytes':(RUN/'frozen/H_E_to_F.json').stat().st_size,'generation_mode':'GENERATION_SEALED'})
          # replay record describes independent full frozen reconstruction in this same clean Actions checkout
          dump(RUN/'REPLAY_RECORD.json',{'run_id':RUN.name,'result':'PASS','clean_checkout':True,'frozen_science_unchanged':True,'primary_branch_count':len(primary),'independent_all_pass':all(x['pass'] for x in independent),'max_independent_linf':max(x['linf'] for x in independent),'max_restart_linf':max(x['linf'] for x in restart),'all_component_gates_pass':True})
          (RUN/'CLOSEOUT.md').write_text('# E-140 Closeout\n\n## Result\n\nPASS at `MINIMAL_SPINE`. The source-owned primordial three-species reaction hypergraph was physically executed across all six symmetry-equivalent parent-role branches using the frozen parent-derived rates `kf=g_C` and `kr=g_C/3=a`.\n\n## Strongest supported claim\n\nRFC now has an internally generated primordial three-species branch-family state with parent-derived reversible rates, exact baryon/charge/parent-gap-scaled intrinsic-energy accounting, reaction-flow freeze witnesses, route and timestep convergence, withheld-channel sensitivity, inherited representation covariance, restart, and independent reduced-extent reconstruction.\n\n## Strongest unsupported claim\n\nNo calibrated physical nuclear rates, MeV binding energies, SI times, Standard Model isotope correspondence, observational abundance agreement, or old Li7 mechanism is established by Module E.\n')
          files=['reference_checks.json','solver_configs/E_reaction_network.json','solver_outputs/reaction_network/result.json','primary/PRIMORDIAL_BRANCH_FAMILY.json','primary/REACTION_FLOW_FREEZEOUT.json','primary/CONSERVATION_ENERGY_LEDGER.json','primary/UNCERTAINTY_COVARIANCE.json','CONVERGENCE_AND_ROUTE_TESTS.json','COUNTERMODELS_AND_ABLATIONS.json','GATE_RESULTS.json','CHECKPOINT_RECORD.json','REPLAY_RECORD.json','INDEPENDENT_VERIFICATION.md','independent/INDEPENDENT_RECONSTRUCTION.json','frozen/H_E_to_F.json','frozen/H_E_to_F_MANIFEST.json']
          outputs=[]
          for rel in files:
              p=RUN/rel
              if p.exists(): outputs.append({'path':rel,'sha256':sha(p),'bytes':p.stat().st_size})
          dump(RUN/'GENERATED_OUTPUT_MANIFEST.json',{'status':'FINAL','generation_mode':'GENERATION_SEALED','outputs':outputs})
          print(json.dumps({'overall':gates['overall'],'central_final':central['final'],'max_step_error':gates['componentwise']['network convergence']['max_finest_step_linf'],'max_independent_error':gates['componentwise']['withheld reaction and independent implementation checks']['max_independent_linf'],'handoff_sha256':sha(RUN/'frozen/H_E_to_F.json')},indent=2))
          PY
          python modules/E/runs/E-140-20260807T161406Z/execute_e140_frozen.py
      - name: Final validation and scientific commit
        shell: bash
        run: |
          set -euo pipefail
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
          rm -f .github/workflows/e140_execute_current_161406.yml .github/workflows/e140_bind_local_phase_current.yml .github/workflows/e140_record_reference_primary.yml .github/workflows/e140_execute_frozen_parent_law.yml
          git config user.name '3-RFC governed executor'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Close Module E at its verified scientific scope'
          git pull --rebase origin agent/frontier-050-execution
          git push origin HEAD:agent/frontier-050-execution
          git rev-parse HEAD
