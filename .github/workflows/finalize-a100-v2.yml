name: Finalize A-100 v2

on:
  push:
    branches: [agent/frontier-050-execution]
    paths:
      - '.github/a100-finalize-v2-trigger.txt'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    env:
      BRANCH: agent/frontier-050-execution
      RUN_ID: A-100-20260806T173458Z
      EVIDENCE_COMMIT: 23ca80aad5a565ed58648103b2908c6360d29506
      HANDOFF_SHA: 728caf8c049d0114caef6f7b36af00065a32b4dc5f4faad02c6b9bcb16c933e7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-lock.txt
      - name: Verify evidence commit and handoff
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$EVIDENCE_COMMIT^{commit}"
          test "$(git show -s --format=%s "$EVIDENCE_COMMIT")" = 'Execute and freeze Module A prephysical handoff'
          git merge-base --is-ancestor "$EVIDENCE_COMMIT" HEAD
          test "$(sha256sum modules/A/frozen/H_A_to_B.json | awk '{print $1}')" = "$HANDOFF_SHA"
          python - <<'PY'
          import json
          from pathlib import Path
          run = Path('modules/A/runs/A-100-20260806T173458Z')
          assert json.loads((run/'GATE_RESULTS.json').read_text())['overall'] == 'PASS'
          replay = json.loads((run/'REPLAY_RECORD.json').read_text())
          assert replay['result'] == 'PASS' and replay['clean_checkout'] and replay['artifact_hashes_match']
          PY
      - name: Finalize closeout, close run, promote, and advance
        shell: bash
        run: |
          set -euo pipefail
          closeout="modules/A/runs/$RUN_ID/CLOSEOUT.md"
          python - <<'PY'
          import os
          from pathlib import Path
          p=Path('modules/A/runs')/os.environ['RUN_ID']/'CLOSEOUT.md'
          s=p.read_text()
          s=s.replace('administrative close-run awaits the verified GitHub evidence commit.', 'verified GitHub evidence commit recorded; administrative close-run completed.')
          s=s.replace('promotion to be recorded after the evidence commit is verified', 'promotion recorded after exact GitHub evidence verification')
          s=s.replace('PENDING_EVIDENCE_COMMIT', os.environ['EVIDENCE_COMMIT'])
          p.write_text(s)
          PY
          python tools/rfc.py record-commit "$EVIDENCE_COMMIT" --branch "$BRANCH" --note 'Verified A-100 evidence commit and fetched handoff before advance'
          python tools/rfc.py close-run --run-id "$RUN_ID" --result PASS --closeout "$closeout"
          python tools/rfc.py promote-module A --to FORMALIZED --fidelity PRODUCTION --evidence modules/A/frozen/H_A_to_B.json
          python tools/rfc.py promote-module A --to VERIFIED --fidelity PRODUCTION --evidence "$RUN_ID_PATH"
        env:
          RUN_ID_PATH: modules/A/runs/A-100-20260806T173458Z/INDEPENDENT_VERIFICATION.md
      - name: Complete promotions and authorize sole child
        shell: bash
        run: |
          set -euo pipefail
          run="modules/A/runs/$RUN_ID"
          closeout="$run/CLOSEOUT.md"
          python tools/rfc.py promote-module A --to INDEPENDENTLY_REPRODUCED --fidelity PRODUCTION --evidence "$run/independent/INDEPENDENT_RECONSTRUCTION.json"
          python tools/rfc.py promote-module A --to FROZEN --fidelity PRODUCTION --evidence modules/A/frozen/H_A_to_B.json
          python tools/rfc.py advance --task A-100 --result PASS --evidence "$closeout" --note 'Module A closed at FROZEN/PRODUCTION; authorize exactly B-110'
          python - <<'PY'
          import json
          s=json.load(open('STATE.json'))
          q=json.load(open('WORK_QUEUE.json'))['items']
          a=[x for x in q if x['status']=='ACTIVE']
          assert s['active_work_unit']=='B-110' and s['current_module']=='B' and s['current_run'] is None
          assert s['modules']['A']['evidence_state']=='FROZEN' and s['modules']['A']['fidelity']=='PRODUCTION'
          assert len(a)==1 and a[0]['id']=='B-110'
          PY
      - name: Prepare B-110 packet and run README checks
        shell: bash
        run: |
          set -euo pipefail
          bash tools/start_work.sh
          grep -q 'B-110' work_packets/ACTIVE_WORK_PACKET.md
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
          python tools/rfc.py context
      - name: Commit final state and verify remote
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/a100-finalize-v2-trigger.txt .github/workflows/finalize-a100-v2.yml
          rm -f .github/a100-finalize-trigger.txt .github/a100-evidence-trigger.txt
          rm -f .github/workflows/apply-a100-evidence-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Close Module A and authorize B-110'
          final_sha=$(git rev-parse HEAD)
          git push origin HEAD:"$BRANCH"
          test "$(git ls-remote origin refs/heads/$BRANCH | awk '{print $1}')" = "$final_sha"
          echo "final_sha=$final_sha" >> "$GITHUB_STEP_SUMMARY"
