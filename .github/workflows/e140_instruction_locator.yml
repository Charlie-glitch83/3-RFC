name: E140 Instruction Locator

on:
  pull_request:
    branches:
      - agent/frontier-050-execution

permissions:
  contents: read

jobs:
  locate:
    if: github.event.pull_request.head.ref == 'ops/e140-instruction-locator-20260807'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - name: Locate exact E workflow sequence
        shell: bash
        run: |
          set -euo pipefail
          echo '=== E140 WORKFLOW FILES AND TRIGGERS ==='
          for f in .github/workflows/*e140* .github/workflows/*E140*; do
            [ -f "$f" ] || continue
            echo "--- $f ---"
            sed -n '1,55p' "$f"
          done
          echo '=== CURRENT E RUN CORE FILES ==='
          find modules/E/runs/E-140-20260807T161406Z -maxdepth 2 -type f -print | sort
