name: One-shot D130 Wolfram registration and reference check

on:
  push:
    branches:
      - agent/frontier-050-execution

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements-lock.txt
      - name: Register exact Wolfram outputs in frozen order
        shell: bash
        run: |
          set -euo pipefail
          python tools/director.py wolfram-record --run D-130-20260807T044911Z --call D-WL-001 --output modules/D/runs/D-130-20260807T044911Z/wolfram/D-WL-001/output.txt
          python tools/director.py wolfram-record --run D-130-20260807T044911Z --call D-WL-002 --output modules/D/runs/D-130-20260807T044911Z/wolfram/D-WL-002/output.txt
      - name: Run exact D manufactured reference check
        shell: bash
        run: |
          set -euo pipefail
          python tools/run_reference_checks.py --module D --output modules/D/runs/D-130-20260807T044911Z/reference_checks.json
      - name: Commit registered evidence and remove one-shot runner
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/d130_record_wolfram_reference.yml
          git config user.name '3-RFC governed executor'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Record D-130 Wolfram evidence and reference check'
          git push origin HEAD:agent/frontier-050-execution
