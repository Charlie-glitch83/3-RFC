name: E140 Reference Phase Once

on:
  push:
    branches:
      - agent/frontier-050-execution
    paths:
      - '.github/workflows/e140_reference_once.yml'

permissions:
  contents: write

jobs:
  reference:
    if: ${{ !contains(github.event.head_commit.message, '[E140-REF-DONE]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements-lock.txt
      - name: Record frozen Wolfram outputs
        run: |
          python tools/director.py wolfram-record --run E-140-20260807T232334Z --call E-WL-001 --output modules/E/runs/E-140-20260807T232334Z/wolfram/E-WL-001/output.txt
          python tools/director.py wolfram-record --run E-140-20260807T232334Z --call E-WL-002 --output modules/E/runs/E-140-20260807T232334Z/wolfram/E-WL-002/output.txt
      - name: Run exact manufactured reference check
        run: python tools/run_reference_checks.py --module E --output modules/E/runs/E-140-20260807T232334Z/reference_checks.json
      - name: Verify governed repository after reference phase
        run: |
          python tools/rfc.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
      - name: Commit generated reference records
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add modules/E/runs/E-140-20260807T232334Z
          if git diff --cached --quiet; then
            echo 'No generated reference changes to commit.'
          else
            git commit -m 'Record E-140 reference phase [E140-REF-DONE]'
            git push origin HEAD:agent/frontier-050-execution
          fi
