name: Refresh B-110 active packet once

on:
  push:
    branches: [agent/b110-packet-refresh]
    paths: ['.github/b110-packet-refresh-trigger.txt']

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: agent/frontier-050-execution
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements-lock.txt
      - name: Generate and verify B-110 packet
        shell: bash
        run: |
          set -euo pipefail
          python tools/director.py doctor
          bash tools/start_work.sh
          grep -q 'ACTIVE WORK PACKET — B-110' work_packets/ACTIVE_WORK_PACKET.md
          python - <<'PY'
          import json
          s=json.load(open('STATE.json'))
          q=json.load(open('WORK_QUEUE.json'))['items']
          assert s['active_work_unit']=='B-110' and s['current_module']=='B' and s['current_run'] is None
          assert [x['id'] for x in q if x['status']=='ACTIVE']==['B-110']
          PY
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
          python tools/rfc.py context
      - name: Publish packet refresh
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/b110-packet-refresh-trigger.txt .github/workflows/refresh-b110-packet-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refresh active packet for B-110'
          final_sha=$(git rev-parse HEAD)
          git fetch origin "refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          live_sha=$(git rev-parse "refs/remotes/origin/$TARGET_BRANCH")
          git push --force-with-lease="refs/heads/$TARGET_BRANCH:$live_sha" origin "HEAD:refs/heads/$TARGET_BRANCH"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$final_sha"
