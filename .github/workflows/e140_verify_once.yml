name: E140 Frozen Verification Once

on:
  pull_request:
    branches:
      - agent/frontier-050-execution
    paths:
      - '.github/e140-verify-trigger.txt'

permissions:
  contents: write

jobs:
  verify-e140:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install frozen dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-lock.txt
      - name: Verify frozen primary frontier
        run: |
          python - <<'PY'
          import json
          s=json.load(open('STATE.json'))
          assert s['active_work_unit']=='E-140',s
          assert s['current_run']=='E-140-20260807T232334Z',s
          r=json.load(open('modules/E/runs/E-140-20260807T232334Z/solver_outputs/reaction_network/result.json'))
          assert r['success'] is True,r
          lock=json.load(open('modules/E/runs/E-140-20260807T232334Z/PRE_EXECUTION_LOCK.json'))
          assert lock['status']=='FROZEN_BEFORE_PRIMARY_EXECUTION',lock
          PY
      - name: Execute full frozen matrix and corrected route-materiality interpretation
        id: matrix
        continue-on-error: true
        run: python modules/E/runs/E-140-20260807T232334Z/verification/verify_e140_attempt2.py
      - name: Commit verification evidence even on failure
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/E/runs/E-140-20260807T232334Z
          if git diff --cached --quiet; then
            echo 'No verification changes to commit'
          else
            git commit -m 'Reverify frozen Module E with trajectory route materiality'
            git pull --rebase origin agent/frontier-050-execution
            git push origin HEAD:agent/frontier-050-execution
          fi
      - name: Enforce frozen componentwise verdict
        if: always()
        run: |
          python - <<'PY'
          import json
          g=json.load(open('modules/E/runs/E-140-20260807T232334Z/GATE_RESULTS.json'))
          assert g['overall']=='PASS',g
          assert all(v['pass'] for v in g['componentwise'].values()),g
          PY
