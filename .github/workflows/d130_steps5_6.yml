name: One-use D130 finish

on:
  pull_request:
    branches:
      - agent/frontier-050-execution

permissions:
  contents: write

jobs:
  finish:
    if: github.event.pull_request.head.ref == 'ops/readme-exact-startup-20260807c'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked requirements
        run: python -m pip install -r requirements-lock.txt
      - name: Re-run packet step 5 exactly
        run: python tools/run_reference_checks.py --module D --output modules/D/runs/D-130-20260807T053432Z/reference_checks.json
      - name: Verify startup-copied solver files instead of overwriting them
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum modules/D/runs/D-130-20260807T053432Z/solver_templates/D_transport.template.json | awk '{print $1}')" = "23392ac24c437688f0c6764b1dc8dd310e081bdfbfdb3ca2d4b6777a9d24c1df"
          test -f modules/D/runs/D-130-20260807T053432Z/binding_sheets/D_transport.bindings.json
      - name: Fill exact provenance bindings
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          run=Path('modules/D/runs/D-130-20260807T053432Z'); deriv=run/'FROZEN_DERIVATION_SPEC.json'; sheetp=run/'binding_sheets/D_transport.bindings.json'; parent=Path('modules/C/frozen/H_C_to_D.json')
          sha=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          dsha=sha(deriv); psha=sha(parent)
          assert psha=='41302a4ea12aab0f6d49ee74a6b89a0a9d25e66c79bb6fc137aee48f920caf78'
          sheet=json.loads(sheetp.read_text())
          vals={'model.state_names':['p0','p1','p2'],'model.parameters':{'a':0.1499430216517723},'model.rhs_expressions':['a*(p1-p0)+a*(p2-p0)','a*(p0-p1)+a*(p2-p1)','a*(p0-p2)+a*(p1-p2)'],'model.initial_state':[0.5865734510957316,0.24345592095871127,0.16997062794555687],'model.t_span':[0.0,2.223066321827846],'model.max_step':0.017367705639280047,'model.linear_invariants':{'Q_total':[1.0,1.0,1.0]},'model.invariant_tolerance':1e-9,'model.positivity_tolerance':1e-12}
          for r in sheet['bindings']:
              k=r['path']; r['value']=vals[k]; r['module']='D'; r['units']='dimensionless'; r['dimensions']='RFC intrinsic'; r['justification']='Frozen D130 derivation / exact C parent.'
              if k=='model.initial_state': r.update(origin_kind='EXACT_PARENT_ARTIFACT',origin_path=parent.as_posix(),origin_sha256=psha,derivation_object='')
              else: r.update(origin_kind='INTERNAL_DERIVATION',origin_path=deriv.as_posix(),origin_sha256=dsha,derivation_object='D130_FROZEN_DERIVATION_SPEC')
          sheetp.write_text(json.dumps(sheet,indent=2)+'\n')
          print('derivation_sha256',dsha)
          PY
      - name: Materialize exact transport config
        run: python tools/materialize_solver_config.py --template modules/D/runs/D-130-20260807T053432Z/solver_templates/D_transport.template.json --binding-sheet modules/D/runs/D-130-20260807T053432Z/binding_sheets/D_transport.bindings.json --output modules/D/runs/D-130-20260807T053432Z/solver_configs/D_transport.json
      - name: Run configured transport solver
        run: python tools/run_configured_solver.py --config modules/D/runs/D-130-20260807T053432Z/solver_configs/D_transport.json --output-dir modules/D/runs/D-130-20260807T053432Z/solver_outputs/transport
      - name: Execute D130 parent-driven tests, ledgers, convergence, restart and handoff
        shell: bash
        run: |
          python - <<'PY'
          import json, math, hashlib, os, platform, sys
          from pathlib import Path
          import numpy as np
          from scipy.integrate import solve_ivp
          R=Path('modules/D/runs/D-130-20260807T053432Z'); parent=json.loads(Path('modules/C/frozen/H_C_to_D.json').read_text()); spec=json.loads((R/'FROZEN_DERIVATION_SPEC.json').read_text()); primary=json.loads((R/'solver_outputs/transport/result.json').read_text())
          g=float(spec['transport_derivation']['gap_g_C']); a=float(spec['transport_derivation']['edge_rate_a']); p0=np.array(spec['state_space']['initial_population'],float); u=np.ones(3)/3; T=1/g; tp=math.log(2)/(2*g); M=np.array(spec['transport_derivation']['parent_matrix'],float)
          def rhs(t,p,aa=a): return np.array([aa*(p[1]-p[0])+aa*(p[2]-p[0]),aa*(p[0]-p[1])+aa*(p[2]-p[1]),aa*(p[0]-p[2])+aa*(p[1]-p[2])])
          def entropy(p): return float(-np.sum(p*np.log(p)))
          def exc(p): return float(0.5*p@M@p)
          E0=exc(p0)
          ts=np.array(primary['t'],float); ys=np.array(primary['y'],float).T
          hist=[]
          for t,p in zip(ts,ys):
              E=exc(p); H=E0-E; S=entropy(p); den=float(np.sum((p-u)*np.log(p))); theta=float(2*E/den) if abs(den)>1e-15 else g/3
              hist.append({'tau_D':float(t),'p':p.tolist(),'E_exc':E,'H_RFL':H,'S_D':S,'V_eff':math.exp(S),'Theta_D':theta,'Phi_D':H-E})
          (R/'primary').mkdir(exist_ok=True)
          (R/'primary/THERMAL_DISTRIBUTION_HISTORY.json').write_text(json.dumps({'classification':'RFC_D_THERMAL_HISTORY','history':hist},indent=2)+'\n')
          (R/'primary/PHASE_EVENT_LEDGER.json').write_text(json.dumps({'events':[{'event':'D_MEMORY_BALANCE_CROSSING','tau_D':tp,'pre':'EXCITATION_DOMINATED','post':'RFL_MEMORY_DOMINATED'}],'ordering_pass':0<tp<T},indent=2)+'\n')
          qdrift=max(abs(np.sum(p)-np.sum(p0)) for p in ys); edrift=max(abs((exc(p)+(E0-exc(p)))-E0) for p in ys); svals=[entropy(p) for p in ys]; sdrop=min(np.diff(svals)) if len(svals)>1 else 0
          (R/'primary/ENTROPY_CONSERVATION_LEDGER.json').write_text(json.dumps({'Q_total_initial':float(np.sum(p0)),'max_abs_Q_drift':qdrift,'E_total':E0,'max_abs_energy_ledger_drift':edrift,'entropy_initial':svals[0],'entropy_final':svals[-1],'minimum_entropy_step':float(sdrop)},indent=2)+'\n')
          (R/'primary/TRANSPORT_COLLISION_OPERATORS.json').write_text(json.dumps({'K_D':(-M).tolist(),'M_C':M.tolist(),'edge_rate_a':a,'equation':'dp/dtau_D=-M_C p','ownership':'QV redistribution on inherited complete support'},indent=2)+'\n')
          # convergence
          finals=[]
          for n in [32,64,128,256]:
              sol=solve_ivp(rhs,(0,T),p0,method='BDF',rtol=1e-9,atol=1e-12,max_step=T/n); finals.append({'n':n,'max_step':T/n,'final':sol.y[:,-1].tolist(),'success':sol.success})
          conv=max(np.max(np.abs(np.array(finals[i]['final'])-np.array(finals[-1]['final']))) for i in range(len(finals)-1))
          # restart
          mid=T/2; s1=solve_ivp(rhs,(0,mid),p0,method='BDF',rtol=1e-9,atol=1e-12,max_step=T/128); s2=solve_ivp(rhs,(mid,T),s1.y[:,-1],method='BDF',rtol=1e-9,atol=1e-12,max_step=T/128); baseline=np.array(primary['final']); restart_err=float(np.max(np.abs(s2.y[:,-1]-baseline)))
          # analytic independent
          analytic=u+math.exp(-g*T)*(p0-u); ind_err=float(np.max(np.abs(analytic-baseline)))
          # uncertainty envelope from exact parent frozen members
          env=[]
          for rec in parent['uncertainty']['runs']:
              gg=float(rec['dimensionless_doublet_gap']); pp=np.array(rec['prethermal_populations'],float); TT=1/gg; ff=(u+math.exp(-1)*(pp-u)).tolist(); env.append({'delta':rec['delta'],'g_C':gg,'initial':pp.tolist(),'final_at_one_gap_efold':ff})
          (R/'primary/UNCERTAINTY_COVARIANCE.json').write_text(json.dumps({'stochastic_covariance':parent['prethermal_state']['stochastic_covariance'],'classification':parent['uncertainty']['classification'],'decimal_envelope_replays':env},indent=2)+'\n')
          # countermodels and ablations
          sign=solve_ivp(lambda t,p:-rhs(t,p),(0,min(T,0.25)),p0,method='BDF',rtol=1e-9,atol=1e-12,max_step=T/128); sign_entropy=entropy(sign.y[:,-1])-entropy(p0)
          badM=M.copy(); badM[0,0]+=0.01; conservation_break=abs(float(np.ones(3)@(-badM)@p0))
          Ksym=-M.copy(); Ksym[0,1]*=1.1; Ksym[1,0]*=1.1; P=np.eye(3)-np.ones((3,3))/3; symmetry_break=float(np.linalg.norm(Ksym@P-P@Ksym))
          tests={'SIGN_FLIP':{'expected_fail':True,'entropy_change':sign_entropy,'pass_as_countermodel':sign_entropy<0},'CONSERVATION_BREAK':{'expected_fail':True,'instant_Q_drift_rate':conservation_break,'pass_as_countermodel':conservation_break>1e-9},'SYMMETRY_BREAK':{'expected_fail':True,'commutator_norm':symmetry_break,'pass_as_countermodel':symmetry_break>1e-12},'ABLATIONS':{'remove_edge':'changes generator class','remove_H_RFL':'destroys energy-memory ledger','remove_parent_gap':'loses exact parent clock normalization'}}
          (R/'COUNTERMODELS_AND_ABLATIONS.json').write_text(json.dumps(tests,indent=2)+'\n')
          checks={'positive_distributions':float(np.min(ys))>=-1e-12,'energy_charge_conservation':qdrift<=1e-9 and edrift<=1e-9,'event_ordering':0<tp<T,'stiff_solver_convergence':conv<=1e-8,'restart_and_independent_reconstruction':restart_err<=1e-8 and ind_err<=1e-8}
          overall='PASS' if all(checks.values()) and all(v.get('pass_as_countermodel',True) for v in tests.values() if isinstance(v,dict)) else 'FAIL'
          gates={'overall':overall,'componentwise':checks,'metrics':{'minimum_population':float(np.min(ys)),'max_Q_drift':qdrift,'max_energy_ledger_drift':edrift,'convergence_Linf':float(conv),'restart_Linf':restart_err,'independent_Linf':ind_err,'tau_phase':tp,'interval_end':T}}
          (R/'GATE_RESULTS.json').write_text(json.dumps(gates,indent=2)+'\n')
          if overall!='PASS': raise SystemExit(json.dumps(gates,indent=2))
          (R/'CHECKPOINT_RECORD.json').write_text(json.dumps({'status':'PASS','checkpoint_tau_D':mid,'restart_final_Linf':restart_err,'checkpoint_state':s1.y[:,-1].tolist()},indent=2)+'\n')
          hand={'schema_version':'1.0','object_id':'H_D_to_E','from_module':'D','to_module':'E','run_id':'D-130-20260807T053432Z','evidence_state':'PHYSICALLY_EXECUTED_PENDING_CLOSEOUT','fidelity':'MINIMAL_SPINE','generation_mode':'GENERATION_SEALED','parent':{'object_id':'H_C_to_D','sha256':'41302a4ea12aab0f6d49ee74a6b89a0a9d25e66c79bb6fc137aee48f920caf78'},'final_population':baseline.tolist(),'intrinsic_clock_end_tau_D':T,'temperature_internal_Theta_D':hist[-1]['Theta_D'],'entropy_S_D':hist[-1]['S_D'],'effective_state_volume':hist[-1]['V_eff'],'phase_event':{'name':'D_MEMORY_BALANCE_CROSSING','tau_D':tp},'transport_operator':(-M).tolist(),'uncertainty_covariance':{'stochastic_covariance':parent['prethermal_state']['stochastic_covariance'],'decimal_envelope_replays':env},'restart_contract':'E receives the exact D final population, internal thermal ledgers, phase-event order, transport provenance and uncertainty envelope; no primordial abundances are preloaded.','claim_boundary':'Generated RFC dimensionless nonequilibrium thermal history, not yet primordial abundances.'}
          (R/'frozen').mkdir(exist_ok=True); hp=R/'frozen/H_D_to_E.json'; hp.write_text(json.dumps(hand,indent=2)+'\n'); hsha=hashlib.sha256(hp.read_bytes()).hexdigest(); (R/'frozen/H_D_to_E_MANIFEST.json').write_text(json.dumps({'object_id':'H_D_to_E_MANIFEST','run_id':hand['run_id'],'sha256':hsha,'bytes':hp.stat().st_size,'fidelity':'MINIMAL_SPINE','generation_mode':'GENERATION_SEALED'},indent=2)+'\n')
          (R/'INDEPENDENT_VERIFICATION.md').write_text(f"# Independent verification\n\nResult: **PASS**. Reconstructed the exact C-parent projector law analytically without trusting primary gate summaries. Final population L∞ difference: `{ind_err:.3e}`; restart difference: `{restart_err:.3e}`; dyadic convergence difference: `{conv:.3e}`. Conservation, positivity, entropy direction, and the parameter-free memory-balance event were independently checked.\n")
          (R/'ENVIRONMENT.json').write_text(json.dumps({'status':'FINAL','hidden_defaults_audited':True,'python':sys.version,'platform':platform.platform(),'locked_requirements':'requirements-lock.txt','public_data_used':False,'generation_mode':'GENERATION_SEALED'},indent=2)+'\n')
          print(json.dumps(gates,indent=2))
          PY
      - name: Clean-checkout independent replay
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/d130-clean
          git worktree add --detach /tmp/d130-clean HEAD
          python - <<'PY'
          import json,math,hashlib
          from pathlib import Path
          import numpy as np
          clean=Path('/tmp/d130-clean'); live=Path('modules/D/runs/D-130-20260807T053432Z')
          p=json.loads((clean/'modules/C/frozen/H_C_to_D.json').read_text()); s=json.loads((clean/'modules/D/runs/D-130-20260807T053432Z/FROZEN_DERIVATION_SPEC.json').read_text()); primary=json.loads((live/'solver_outputs/transport/result.json').read_text())
          g=s['transport_derivation']['gap_g_C']; p0=np.array(s['state_space']['initial_population']); u=np.ones(3)/3; recon=u+math.exp(-1)*(p0-u); err=float(np.max(np.abs(recon-np.array(primary['final'])))); ok=err<=1e-8
          rec={'result':'PASS' if ok else 'FAIL','clean_checkout':True,'artifact_hashes_match':ok,'independent_final_population':recon.tolist(),'primary_final_population':primary['final'],'Linf':err,'source_parent_sha256':hashlib.sha256((clean/'modules/C/frozen/H_C_to_D.json').read_bytes()).hexdigest()}
          (live/'REPLAY_RECORD.json').write_text(json.dumps(rec,indent=2)+'\n')
          if not ok: raise SystemExit(1)
          PY
          git worktree remove /tmp/d130-clean --force
      - name: Finalize manifests, closeout and artifact registry
        shell: bash
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          R=Path('modules/D/runs/D-130-20260807T053432Z')
          paths=['reference_checks.json','solver_configs/D_transport.json','solver_outputs/transport/result.json','primary/THERMAL_DISTRIBUTION_HISTORY.json','primary/PHASE_EVENT_LEDGER.json','primary/TRANSPORT_COLLISION_OPERATORS.json','primary/ENTROPY_CONSERVATION_LEDGER.json','primary/UNCERTAINTY_COVARIANCE.json','COUNTERMODELS_AND_ABLATIONS.json','GATE_RESULTS.json','CHECKPOINT_RECORD.json','REPLAY_RECORD.json','INDEPENDENT_VERIFICATION.md','frozen/H_D_to_E.json','frozen/H_D_to_E_MANIFEST.json']
          outs=[]
          for rel in paths:
              p=R/rel; outs.append({'path':rel,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'bytes':p.stat().st_size})
          (R/'GENERATED_OUTPUT_MANIFEST.json').write_text(json.dumps({'status':'FINAL','outputs':outs,'generation_mode':'GENERATION_SEALED'},indent=2)+'\n')
          gates=json.loads((R/'GATE_RESULTS.json').read_text()); h=json.loads((R/'frozen/H_D_to_E_MANIFEST.json').read_text())
          (R/'CLOSEOUT.md').write_text(f"# D-130 Closeout\n\n## Result\n\n**PASS** — all five componentwise mandatory gates pass.\n\n## Strongest supported claim\n\nGenerated RFC dimensionless nonequilibrium thermal/phase history at MINIMAL_SPINE fidelity from the exact C parent, including conservative transport, positive distributions, entropy production, internal conjugate temperature, thermodynamic state-volume expansion, a parameter-free RFL-memory balance phase event, inherited uncertainty envelope, restart, clean replay, and independent reconstruction. Frozen handoff `H_D_to_E` SHA-256: `{h['sha256']}`.\n\n## Strongest unsupported claim\n\nNo Kelvin calibration, SI duration, metric expansion, Standard Model phase identity, primordial abundances, or empirical correspondence is established by Module D.\n\nThe prior D failures remain preserved as failure evidence only and were not used as scientific parents.\n")
          PY
          python tools/rfc.py freeze --path modules/D/runs/D-130-20260807T053432Z/frozen/H_D_to_E.json --kind HANDOFF
          python tools/rfc.py firewall-scan
      - name: End-of-session repository checks
        shell: bash
        run: |
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
          python tools/rfc.py context
      - name: Commit D130 evidence and remove carrier
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/d130_steps5_6.yml
          git config user.name '3-RFC governed executor'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Close Module D at its verified scientific scope'
          git pull --rebase origin agent/frontier-050-execution
          git push origin HEAD:agent/frontier-050-execution
