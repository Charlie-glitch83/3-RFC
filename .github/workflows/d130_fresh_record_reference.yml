name: One-shot fresh D130 Wolfram registration and reference

on:
  push:
    branches:
      - agent/frontier-050-execution

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements-lock.txt
      - name: Verify prelock then register fresh Wolfram outputs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('modules/D/runs/D-130-20260807T045646Z/PRE_EXECUTION_LOCK.json')
          d=json.loads(p.read_text())
          assert d['status']=='FROZEN'
          assert d['numerical_controls']['execution_interval']==[0.0,1.0]
          assert d['numerical_controls']['primary_max_step']==0.0625
          assert d['numerical_controls']['refinement_matrix']==[0.25,0.125,0.0625,0.03125]
          PY
          python tools/director.py wolfram-record --run D-130-20260807T045646Z --call D-WL-001 --output modules/D/runs/D-130-20260807T045646Z/wolfram/D-WL-001/output.txt
          python tools/director.py wolfram-record --run D-130-20260807T045646Z --call D-WL-002 --output modules/D/runs/D-130-20260807T045646Z/wolfram/D-WL-002/output.txt
      - name: Run exact D manufactured reference check
        shell: bash
        run: |
          set -euo pipefail
          python tools/run_reference_checks.py --module D --output modules/D/runs/D-130-20260807T045646Z/reference_checks.json
      - name: Commit evidence and remove one-shot runner
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/d130_fresh_record_reference.yml
          git config user.name '3-RFC governed executor'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Record fresh D-130 Wolfram evidence and reference check'
          git pull --rebase origin agent/frontier-050-execution
          git push origin HEAD:agent/frontier-050-execution
