name: Cleanup temporary execution branches once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete temporary branches and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete agent/auth-020-execution || true
          git push origin --delete agent/xwalk-030-execution || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/cleanup-xwalk-branches-once.yml .github/xwalk-branch-cleanup-trigger.txt
          git add -A
          git commit -m 'Remove temporary XWALK execution artifacts'
          git push origin main
