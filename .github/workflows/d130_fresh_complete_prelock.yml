name: One-shot complete fresh D130 pre-execution freeze

on:
  push:
    branches:
      - agent/frontier-050-execution

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Freeze complete D130 scientific and numerical controls
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, datetime

          root=Path('.')
          rid='D-130-20260807T045646Z'
          run=root/'modules/D/runs'/rid
          state=json.loads((root/'STATE.json').read_text())
          assert state['active_work_unit']=='D-130'
          assert state['current_run']==rid

          def sha(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          def rec(path,role):
              p=Path(path); return {'path':str(p),'sha256':sha(p),'role':role}

          parent='modules/C/frozen/H_C_to_D.json'
          parent_manifest='modules/C/frozen/H_C_to_D_MANIFEST.json'
          parent_sha=sha(parent)
          pm=json.loads(Path(parent_manifest).read_text())
          assert parent_sha==pm['sha256']=='41302a4ea12aab0f6d49ee74a6b89a0a9d25e66c79bb6fc137aee48f920caf78'

          # Numerical conventions are frozen before any symbolic or numerical execution.
          # s is the normalized intrinsic relaxation clock. [0,1] is one exact e-fold
          # of the normalized nonzero mode, not physical time and not target-selected.
          numerical={
            'intrinsic_clock':'s',
            'execution_interval':[0.0,1.0],
            'interval_basis':'one normalized relaxation e-fold; target-blind dimensionless diagnostic convention',
            'primary_max_step':0.0625,
            'primary_max_step_basis':'1/16 of the preregistered unit intrinsic interval',
            'refinement_matrix':[0.25,0.125,0.0625,0.03125],
            'refinement_basis':'fixed dyadic sequence on the unit intrinsic interval, frozen before execution',
            'solver_method':'BDF',
            'rtol':1e-9,
            'atol':1e-12,
            'invariant_tolerance':1e-10,
            'positivity_tolerance':1e-12,
            'analytic_numeric_l2_tolerance':1e-8,
            'restart_split_s':0.5,
            'restart_basis':'midpoint of frozen unit intrinsic interval'
          }

          spec={
            'schema_version':'1.1','run_id':rid,'status':'FROZEN_PRE_EXECUTION','generation_mode':'GENERATION_SEALED',
            'exact_parent':{'object_id':'H_C_to_D','path':parent,'sha256':parent_sha},
            'triadic_descent':{
              'CIF':'the exact C simplex carries distribution and phase possibilities without a preloaded thermal history',
              'QV':'D may select only flows compelled by inherited conservation, positivity, exact symmetry, and target-blind admissibility',
              'RFL':'D may retain only dynamically witnessed entropy/event memory'
            },
            'state_space':{
              'population_state':'p in inherited three-state simplex','uniform_state':[1/3,1/3,1/3],
              'deviation_space':'V_perp={q:sum(q)=0}',
              'initial_population':[0.5865734510957316,0.24345592095871127,0.16997062794555687],
              'initial_covariance':[[0,0,0],[0,0,0],[0,0,0]]
            },
            'inherited_operator':{'law':'M_C=g_C P_perp','g_C':0.449829064955317,'P_perp':'I-11^T/3','dimension':'dimensionless'},
            'candidate_classes':[
              {'id':'D-CAND-1','class':'linear conservative positivity-preserving O(2)-equivariant Markov flows on the inherited simplex','form':'dp/dtau=-kappa P_perp p, kappa>=0','status':'LAWFUL_FAMILY','selection_basis':'uniform conservation fixes zero mode; exact O(2) symmetry makes the action scalar on V_perp; Markov positivity fixes nonnegative relaxation'},
              {'id':'D-CAND-2','class':'nonlinear conservative O(2)-equivariant simplex flows','status':'UNDERDETERMINED','selection_basis':'C contains no constitutive nonlinearity choosing a unique member'},
              {'id':'D-CAND-3','class':'physical temperature, expansion-clock, and phase-threshold/event laws','status':'NOT_DERIVED_FROM_C','selection_basis':'C contains no dimensionful energy/time scale, equation of state, order parameter, or threshold'}
            ],
            'selected_normalized_branch':{
              'law':'dp/ds=-P_perp p','clock_definition':'s=kappa*tau for any kappa>0','physical_rate_selected':False,
              'analytic_solution':'p(s)=u+exp(-s)(p0-u)','scope':'dimensionless transport diagnostic only'
            },
            'numerical_controls':numerical,
            'phase_event_rule':'NO_EVENT_WITNESS_WITHOUT_PARENT-DERIVED_ORDER_PARAMETER_AND_THRESHOLD',
            'temperature_rule':'NO_PHYSICAL_TEMPERATURE_WITHOUT_PARENT-DERIVED_ENERGY_SCALE_AND_THERMODYNAMIC_MAP',
            'expected_invariants':['sum(p)=1','p_i>=0','q(s)=exp(-s)q(0)','||q||_2^2=exp(-2s)||q(0)||_2^2','Shannon entropy nondecreasing for this doubly-stochastic relaxation'],
            'claim_boundary':'Dimensionless parent-driven relaxation family and obstruction record only; a generated RFC physical thermal history is not established unless the missing physical clock/temperature/phase-event objects are lawfully derived.',
            'hard_obstruction':'If no additional admitted premise lawfully supplies physical scale/temperature/event structure, full Module D must stop blocked rather than promote to E.'
          }
          sp=run/'FROZEN_DERIVATION_SPEC.json'; sp.write_text(json.dumps(spec,indent=2)+'\n'); spec_sha=sha(sp)

          src={
            'run_id':rid,
            'exact_parents':[{'object_id':'H_C_to_D','path':parent,'sha256':parent_sha,'manifest_path':parent_manifest,'manifest_sha256':sha(parent_manifest)}],
            'admitted_sources':[],
            'imports':['python standard library for governed record generation; frozen repository numerical engines only after provenance materialization'],
            'files':[rec('README.md','root authority'),rec('STATE.json','machine authorization'),rec('WORK_QUEUE.json','work queue'),rec('work_packets/ACTIVE_WORK_PACKET.md','active packet'),rec('recipes/D/WORK_ORDER.md','D work order'),rec('recipes/D/recipe.json','D recipe'),rec(parent,'exact scientific parent'),rec(parent_manifest,'parent content manifest'),rec(run/'solver_templates/D_transport.template.json','frozen solver template'),rec(run/'binding_sheets/D_transport.bindings.json','frozen binding sheet'),{'path':str(sp),'sha256':spec_sha,'role':'frozen D derivation specification'}],
            'urls':[],
            'constants':[{'name':'g_C','value':0.449829064955317,'origin_path':parent,'origin_sha256':parent_sha,'dimensions':'dimensionless'},{'name':'p0','value':[0.5865734510957316,0.24345592095871127,0.16997062794555687],'origin_path':parent,'origin_sha256':parent_sha,'dimensions':'dimensionless probability'}],
            'public_data_declaration':'NONE'
          }
          (run/'SOURCE_REGISTER.json').write_text(json.dumps(src,indent=2)+'\n')

          lock={
            'run_id':rid,'status':'FROZEN','frozen_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'authority_hashes':[rec('README.md','root authority'),rec('work_packets/ACTIVE_WORK_PACKET.md','active packet'),rec('recipes/D/recipe.json','recipe'),rec('recipes/D/WORK_ORDER.md','work order')],
            'parent_hashes':[{'object_id':'H_C_to_D','path':parent,'sha256':parent_sha}],
            'definition_hashes':[{'path':str(sp),'sha256':spec_sha}],
            'candidate_classes':spec['candidate_classes'],
            'equations_and_laws':['M_C=g_C P_perp inherited from C','lawful linear family dp/dtau=-kappa P_perp p, kappa>=0','normalized branch dp/ds=-P_perp p','analytic p(s)=u+exp(-s)(p0-u)','no physical temperature, physical clock, expansion, or phase-threshold law admitted'],
            'dimensions_units_frames_gauges_clocks':['p,M_C,g_C,s dimensionless','execution interval s in [0,1] is intrinsic, not physical time','kappa is unselected intrinsic clock scaling, not a physical rate','no metric frame, physical duration, energy scale, or temperature unit derived','O(2) rotations within V_perp remain equivalent internal basis choices'],
            'methods':['D-WL-001 then D-WL-002 exactly after this lock','D manufactured reference check','BDF primary execution of normalized branch after exact binding','fixed dyadic max-step convergence matrix','midpoint restart at s=0.5','countermodels executed under frozen alternatives','separate analytic independent reconstruction','true clean-checkout replay before any PASS'],
            'tolerances':[{'name':'rtol','value':1e-9},{'name':'atol','value':1e-12},{'name':'invariant_abs','value':1e-10},{'name':'positivity_abs','value':1e-12},{'name':'analytic_numeric_l2','value':1e-8}],
            'numerical_controls':numerical,
            'stopping_rules':['stop if p_i<-1e-12','stop if |sum(p)-1|>1e-10','stop if convergence worsens non-monotonically in a way not explained by solver tolerance floor','stop if event/temperature ordering requires public or remembered target values','stop if intrinsic s is labeled physical time','stop full-D promotion if physical temperature/clock/phase event remains underived'],
            'expected_invariants':spec['expected_invariants'],
            'tests':['D-WL-001 exact conservation/Lyapunov check','D-WL-002 conserved/relaxation eigenmode check','D repository manufactured reference','positive-simplex execution','dyadic max-step convergence '+str(numerical['refinement_matrix']),'restart at s=0.5','executed sign-flipped, anisotropic, and nonconservative countermodels','analytic independent reconstruction','clean-checkout replay'],
            'gates':['positive distributions','energy/charge conservation','event ordering','stiff-solver convergence','restart and independent reconstruction'],
            'falsifiers':['negative population beyond tolerance','carrier drift beyond tolerance','primary normalized solution differs from analytic exp(-s) orbit beyond tolerance','a claimed unique physical temperature/time law requires an unfrozen new premise','event ordering depends on observed target values'],
            'claim_boundary':spec['claim_boundary'],
            'independent_verifier_design':'Independent program/process reads only exact H_C_to_D and FROZEN_DERIVATION_SPEC, reconstructs p(s)=u+exp(-s)(p0-u), conservation, positivity, entropy direction, and confirms the physical-scale/event obstruction without trusting primary gate summaries or solver output.',
            'allowed_implementation_only_corrections':['syntax/path/serialization corrections only','implementation corrections that do not change parents, candidates, laws, interval, max_step, refinement matrix, tolerances, gates, falsifiers, or claim boundary','full frozen matrix rerun after any correction']
          }
          (run/'PRE_EXECUTION_LOCK.json').write_text(json.dumps(lock,indent=2)+'\n')

          rj=json.loads((run/'run.json').read_text()); rj['parent_hashes']=[parent_sha]; (run/'run.json').write_text(json.dumps(rj,indent=2)+'\n')

          plan=(run/'RUN_PLAN.md').read_text()
          plan += '\n## Frozen numerical execution controls\n\n- Intrinsic interval: `s in [0,1]` (one normalized e-fold; not physical time)\n- Primary max step: `1/16`\n- Convergence matrix: `1/4, 1/8, 1/16, 1/32`\n- Restart split: `s=1/2`\n- These were frozen before Wolfram/numerical execution and may not be retuned.\n'
          (run/'RUN_PLAN.md').write_text(plan)
          PY

          rm -f .github/workflows/d130_fresh_complete_prelock.yml
          git config user.name '3-RFC governed executor'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Freeze complete fresh D-130 execution controls'
          git pull --rebase origin agent/frontier-050-execution
          git push origin HEAD:agent/frontier-050-execution
