name: One-use D130 final checks

on:
  pull_request:
    branches:
      - agent/frontier-050-execution

permissions:
  contents: write

jobs:
  finish:
    if: github.event.pull_request.head.ref == 'ops/readme-exact-startup-20260807c'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked requirements
        run: python -m pip install -r requirements-lock.txt
      - name: Re-run packet step 5 exactly
        run: python tools/run_reference_checks.py --module D --output modules/D/runs/D-130-20260807T053432Z/reference_checks.json
      - name: Execute corrected frozen D130 implementation
        run: python modules/D/runs/D-130-20260807T053432Z/execute_d130_frozen_v2.py
      - name: Freeze handoff and run repository checks
        shell: bash
        run: |
          set -euo pipefail
          python tools/rfc.py freeze modules/D/runs/D-130-20260807T053432Z/frozen/H_D_to_E.json --kind HANDOFF
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
          python tools/rfc.py context
      - name: Commit D130 evidence and remove carrier
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/d130_retry_finish.yml
          git config user.name '3-RFC governed executor'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Close Module D at its verified scientific scope'
          git pull --rebase origin agent/frontier-050-execution
          git push origin HEAD:agent/frontier-050-execution
