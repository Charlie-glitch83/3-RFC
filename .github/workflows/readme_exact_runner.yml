name: One-shot exact root README runner

on:
  push:
    branches:
      - agent/frontier-050-execution

permissions:
  contents: write

jobs:
  run-readme-startup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact active branch
        uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-lock.txt

      - name: Run root README exact first commands
        shell: bash
        run: |
          set -euo pipefail
          bash bootstrap.sh
          bash tools/start_work.sh

      - name: Remove one-shot runner and commit README startup state
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/readme_exact_runner.yml
          git config user.name '3-RFC governed executor'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Start authorized work exactly from root README'
          git push origin HEAD:agent/frontier-050-execution
          echo "RESULT_SHA=$(git rev-parse HEAD)"
