name: Reconcile A-100 to B-110 once

on:
  push:
    branches: [agent/frontier-050-execution]
    paths: ['.github/reconcile-a100-b110-trigger.txt']

permissions:
  contents: write

concurrency:
  group: reconcile-a100-b110
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    env:
      BRANCH: agent/frontier-050-execution
      EVIDENCE_COMMIT: b6280513dc47339ddf024be6275817d3f38a9d39
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements-lock.txt
      - name: Reconcile queue with frozen Module A state
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$EVIDENCE_COMMIT" HEAD
          python - <<'PY'
          import json
          from pathlib import Path
          state_path=Path('STATE.json'); queue_path=Path('WORK_QUEUE.json')
          state=json.loads(state_path.read_text()); queue=json.loads(queue_path.read_text())
          a=state['modules']['A']
          assert state['active_work_unit']=='B-110'
          assert state['current_module']=='B'
          assert state['current_run'] is None
          assert a['evidence_state']=='FROZEN' and a['fidelity']=='PRODUCTION'
          found=set()
          for item in queue['items']:
              if item['id']=='A-100':
                  item['status']='PASS'; found.add('A-100')
              elif item['id']=='B-110':
                  item['status']='ACTIVE'; found.add('B-110')
              elif item['status']=='ACTIVE':
                  item['status']='BLOCKED'
          assert found=={'A-100','B-110'}
          active=[x for x in queue['items'] if x['status']=='ACTIVE']
          assert len(active)==1 and active[0]['id']=='B-110'
          queue_path.write_text(json.dumps(queue,indent=2,ensure_ascii=False)+'\n')
          PY
          bash tools/start_work.sh
      - name: Verify complete governed state
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'B-110' work_packets/ACTIVE_WORK_PACKET.md
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
          python tools/rfc.py context
          python - <<'PY'
          import json
          s=json.load(open('STATE.json')); q=json.load(open('WORK_QUEUE.json'))['items']
          active=[x for x in q if x['status']=='ACTIVE']
          status={x['id']:x['status'] for x in q}
          assert s['active_work_unit']=='B-110' and s['current_module']=='B' and s['current_run'] is None
          assert s['modules']['A']['evidence_state']=='FROZEN' and s['modules']['A']['fidelity']=='PRODUCTION'
          assert status['A-100']=='PASS' and status['B-110']=='ACTIVE'
          assert len(active)==1 and active[0]['id']=='B-110'
          PY
      - name: Commit, rebase, push, and verify
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/reconcile-a100-b110-trigger.txt .github/workflows/reconcile-a100-b110-once.yml
          rm -f .github/a100-*-trigger.txt
          rm -f .github/workflows/finalize-a100-*.yml .github/workflows/apply-a100-evidence-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Reconcile Module A closeout and activate B-110'
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          sha=$(git rev-parse HEAD)
          git push origin HEAD:"$BRANCH"
          remote=$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')
          test "$remote" = "$sha"
          git diff-tree --no-commit-id --name-only -r "$sha" | tee /tmp/reconcile-files.txt
          grep -qx 'WORK_QUEUE.json' /tmp/reconcile-files.txt
          grep -qx 'work_packets/ACTIVE_WORK_PACKET.md' /tmp/reconcile-files.txt
          echo "FINAL_SHA=$sha" >> "$GITHUB_STEP_SUMMARY"
