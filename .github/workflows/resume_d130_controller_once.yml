name: Resume D130 Controller Once

on:
  pull_request:
    branches:
      - agent/frontier-050-execution

permissions:
  contents: write

jobs:
  resume:
    if: github.event.pull_request.head.ref == 'ops/resume-d130-controller-20260807'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Verify exact D closeout frontier
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path('STATE.json').read_text())
          queue=json.loads(Path('WORK_QUEUE.json').read_text())['items']
          q={x['id']:x for x in queue}
          run=json.loads(Path('modules/D/runs/D-130-20260807T220342Z/run.json').read_text())
          gates=json.loads(Path('modules/D/runs/D-130-20260807T220342Z/GATE_RESULTS.json').read_text())
          replay=json.loads(Path('modules/D/runs/D-130-20260807T220342Z/REPLAY_RECORD.json').read_text())
          assert state['active_work_unit']=='D-130'
          assert state['current_run'] is None
          assert state['modules']['D']['evidence_state']=='FROZEN'
          assert q['D-130']['status']=='ACTIVE'
          assert q['E-140']['status']=='BLOCKED'
          assert run['status']=='PASS'
          assert gates['overall']=='PASS'
          assert replay['result']=='PASS' and replay['clean_checkout'] and replay['artifact_hashes_match']
          print('D-130 is a closed verified PASS awaiting only controller advance')
          PY
      - name: Execute missed README close-and-advance step
        shell: bash
        run: |
          set -euo pipefail
          python tools/rfc.py advance --task D-130 --result PASS --evidence modules/D/runs/D-130-20260807T220342Z/CLOSEOUT.md
      - name: Run exact README startup commands
        shell: bash
        run: |
          set -euo pipefail
          bash bootstrap.sh
          bash tools/start_work.sh
      - name: Verify controller selected E-140
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path('STATE.json').read_text())
          queue=json.loads(Path('WORK_QUEUE.json').read_text())['items']
          q={x['id']:x for x in queue}
          assert q['D-130']['status']=='PASS'
          assert q['E-140']['status']=='ACTIVE'
          assert state['active_work_unit']=='E-140'
          assert state['current_module']=='E'
          assert isinstance(state.get('current_run'),str) and state['current_run'].startswith('E-140-')
          packet=Path('work_packets/ACTIVE_WORK_PACKET.md').read_text()
          assert '# ACTIVE WORK PACKET — E-140' in packet
          print(json.dumps({'active_work_unit':state['active_work_unit'],'current_module':state['current_module'],'current_run':state['current_run']},indent=2))
          PY
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
      - name: Commit governed transition and fresh E packet
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/resume_d130_controller_once.yml
          git config user.name '3-RFC governed executor'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Advance D-130 and start governed E-140 work'
          git pull --rebase origin agent/frontier-050-execution
          git push origin HEAD:agent/frontier-050-execution
          git rev-parse HEAD
