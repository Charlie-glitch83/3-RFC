name: Prepare fresh D130 numerical execution

on:
  pull_request:
    branches:
      - agent/frontier-050-execution

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.pull_request.head.ref == 'ops/d130-fresh-prepare-trigger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements-lock.txt

      - name: Verify fresh run and execute exact solver-copy command
        shell: bash
        run: |
          set -euo pipefail
          run='modules/D/runs/D-130-20260807T045646Z'
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('STATE.json').read_text())
          assert s['active_work_unit']=='D-130'
          assert s['current_run']=='D-130-20260807T045646Z'
          lock=json.loads(Path('modules/D/runs/D-130-20260807T045646Z/PRE_EXECUTION_LOCK.json').read_text())
          assert lock['status']=='FROZEN'
          PY
          set +e
          python tools/director.py solver-copy --module D --solver transport --destination "$run" > /tmp/solver-copy.log 2>&1
          rc=$?
          set -e
          cat /tmp/solver-copy.log
          if [ "$rc" -ne 2 ]; then
            echo "Expected idempotency refusal rc=2 because start_work already copied exact files; got $rc"
            exit 1
          fi
          grep -q 'refusing to overwrite existing files' /tmp/solver-copy.log
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          run=Path('modules/D/runs/D-130-20260807T045646Z')
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          template=run/'solver_templates/D_transport.template.json'
          sheet=run/'binding_sheets/D_transport.bindings.json'
          canonical_template=Path('configured_runs/templates/D_transport.template.json')
          canonical_sheet=Path('configured_runs/binding_sheets/D_transport.bindings.json')
          assert sha(template)==sha(canonical_template)
          assert sha(sheet)==sha(canonical_sheet)
          fail=run/'FAILURES.jsonl'
          rec={"failure_id":"D130-SOLVER-COPY-IDEMPOTENCY-001","run_id":"D-130-20260807T045646Z","gate":"solver-copy","category":"IMPLEMENTATION_ONLY_IDEMPOTENCY_REFUSAL","description":"Packet solver-copy command refused to overwrite the exact template/binding files already copied by start_work.sh; hashes verified identical to canonical configured_runs sources.","changes_frozen_science":False,"required_replay_scope":"none beyond full frozen matrix already required","allowed_correction":"use the verified prefilled exact copies; no scientific or numerical control change"}
          old=fail.read_text() if fail.exists() else ''
          if rec['failure_id'] not in old:
              fail.write_text(old+json.dumps(rec,separators=(',',':'))+'\n')
          PY

      - name: Fill provenance binding sheet and materialize config
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          run=Path('modules/D/runs/D-130-20260807T045646Z')
          parent=Path('modules/C/frozen/H_C_to_D.json')
          deriv=run/'derivations/TRANSPORT_BINDING_DERIVATION.json'
          sheetp=run/'binding_sheets/D_transport.bindings.json'
          template=run/'solver_templates/D_transport.template.json'
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          parent_obj=json.loads(parent.read_text())
          d=json.loads(deriv.read_text())['derivation']
          sheet=json.loads(sheetp.read_text())
          sheet['template']='modules/D/runs/D-130-20260807T045646Z/solver_templates/D_transport.template.json'
          sheet['template_sha256']=sha(template)
          internal={
            'model.state_names':('state_names',d['state_names'],'dimensionless population coordinate labels','3-state vector'),
            'model.parameters':('parameters',d['parameters'],'none','empty parameter map'),
            'model.rhs_expressions':('rhs_expressions',d['rhs_expressions'],'population per unit intrinsic dimensionless clock s','3-vector ODE RHS'),
            'model.t_span':('t_span',d['t_span'],'intrinsic dimensionless clock s; not physical time','ordered pair'),
            'model.max_step':('max_step',d['max_step'],'intrinsic dimensionless clock s','scalar'),
            'model.linear_invariants':('linear_invariants',d['linear_invariants'],'dimensionless total-carrier charge','linear invariant map'),
            'model.invariant_tolerance':('invariant_tolerance',d['invariant_tolerance'],'dimensionless absolute drift','scalar tolerance'),
            'model.positivity_tolerance':('positivity_tolerance',d['positivity_tolerance'],'dimensionless population floor','scalar tolerance'),
          }
          for rec in sheet['bindings']:
              path=rec['path']
              if path=='model.initial_state':
                  rec.update({
                    'value':parent_obj['prethermal_state']['node_populations'],
                    'origin_kind':'EXACT_PARENT_ARTIFACT','origin_path':str(parent),'origin_sha256':sha(parent),
                    'module':'C','derivation_object':'prethermal_state.node_populations','units':'dimensionless probability','dimensions':'3-state population vector',
                    'justification':'Exact frozen C prethermal parent state; no D fitting or replacement.'
                  })
              else:
                  key,val,units,dims=internal[path]
                  rec.update({
                    'value':val,'origin_kind':'INTERNAL_DERIVATION','origin_path':str(deriv),'origin_sha256':sha(deriv),
                    'module':'D','derivation_object':'derivation.'+key,'units':units,'dimensions':dims,
                    'justification':'Direct materialization of the complete D-130 frozen pre-execution derivation and numerical controls.'
                  })
          sheetp.write_text(json.dumps(sheet,indent=2)+'\n')
          PY
          python tools/materialize_solver_config.py \
            --template modules/D/runs/D-130-20260807T045646Z/solver_templates/D_transport.template.json \
            --binding-sheet modules/D/runs/D-130-20260807T045646Z/binding_sheets/D_transport.bindings.json \
            --output modules/D/runs/D-130-20260807T045646Z/solver_configs/D_transport.json

      - name: Freeze implementation and config hashes before primary numerical execution
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,subprocess
          from datetime import datetime,timezone
          from pathlib import Path
          run=Path('modules/D/runs/D-130-20260807T045646Z')
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          files={
            'scientific_pre_execution_lock':run/'PRE_EXECUTION_LOCK.json',
            'derivation_spec':run/'FROZEN_DERIVATION_SPEC.json',
            'binding_derivation':run/'derivations/TRANSPORT_BINDING_DERIVATION.json',
            'binding_sheet':run/'binding_sheets/D_transport.bindings.json',
            'solver_config':run/'solver_configs/D_transport.json',
            'primary_implementation':run/'primary/execute_d130.py',
            'independent_implementation':run/'independent/independent_reconstruct_d130.py',
            'transport_engine':Path('rfc_engine/solvers/transport.py'),
            'configured_solver_runner':Path('tools/run_configured_solver.py'),
            'materializer':Path('tools/materialize_solver_config.py'),
            'finish_local_phase':Path('tools/finish_local_phase.sh'),
          }
          obj={
            'schema_version':'1.0','run_id':'D-130-20260807T045646Z','status':'FROZEN_BEFORE_PRIMARY_NUMERICAL_EXECUTION',
            'frozen_utc':datetime.now(timezone.utc).isoformat(),
            'source_commit_before_preparation':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'hashes':{k:{'path':str(v),'sha256':sha(v)} for k,v in files.items()},
            'imports':['numpy','scipy.integrate.solve_ivp','sympy via frozen transport engine','python standard library'],
            'network_urls':[],
            'public_data_used':False,
            'randomness':{'used':False,'seed':None},
            'no_scientific_changes_after_this_record':True,
            'allowed_corrections':'implementation-only corrections already allowed by PRE_EXECUTION_LOCK; full frozen matrix rerun required'
          }
          (run/'PRE_PRIMARY_NUMERICAL_LOCK.json').write_text(json.dumps(obj,indent=2)+'\n')
          PY

      - name: Commit preparation only; do not execute primary science
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/d130_fresh_prepare_numerical.yml
          git config user.name '3-RFC governed executor'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Freeze fresh D-130 numerical implementation and bindings'
          git pull --rebase origin agent/frontier-050-execution
          git push origin HEAD:agent/frontier-050-execution
