name: G160 Governed Source-Lineage Obstruction Probe Once

on:
  pull_request:
    branches:
      - agent/frontier-050-execution
    paths:
      - '.github/g160-obstruction-trigger.txt'

permissions:
  contents: write

jobs:
  probe-g160:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install frozen dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-lock.txt

      - name: Verify exact G frontier and parent handoff
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          rid='G-160-20260808T021341Z'; R=Path('modules/G/runs')/rid
          s=json.load(open('STATE.json'))
          assert s['active_work_unit']=='G-160',s
          assert s['current_module']=='G',s
          assert s['current_run']==rid,s
          p=Path('modules/F/frozen/H_F_to_G.json')
          h=hashlib.sha256(p.read_bytes()).hexdigest()
          assert h=='bc996dc35f7cf1c2bafc3523133c1470dd9184f4ebff97f5e94b0f0fe1840154',h
          m=json.load(open('modules/F/frozen/H_F_to_G_MANIFEST.json'))
          assert m['sha256']==h,m
          parent=json.load(open(p))
          assert parent['electromagnetic_charge_status']=='NOT_DERIVED_AT_MINIMAL_SPINE'
          assert parent['residual_route_network']['physical_photon_opacity_status']=='NOT_DERIVED'
          assert 'PHOTON_IDENTITY_UNASSIGNED' in parent['radiation_channel']['status']
          assert parent['neutrino_channel']['status']=='DORMANT_NO_PARENT_WITNESS_ZERO_BACKREACTION'
          PY

      - name: Preserve exact connected Wolfram outputs
        run: |
          R=modules/G/runs/G-160-20260808T021341Z
          cat > "$R/wolfram/G-WL-001/output.txt" <<'EOF'
Out[1]= "<|\"call\" -> \"G-WL-001\", \"tau\" -> \"t\", \"visibility\" -> \"E^(-t)\", \"normalization\" -> \"1\", \"pass\" -> True|>"
EOF
          cat > "$R/wolfram/G-WL-002/output.txt" <<'EOF'
Symbol::undefined2: Warning: Global symbols "S, S, S, S, S" are undefined.
General::messages: Messages were generated which may indicate errors.

Out[1]= "<|\"call\" -> \"G-WL-002\", \"numberResidual\" -> {0, 0}, \"chargeResidual\" -> {0, 0}, \"numberPass\" -> True, \"chargePass\" -> True|>"
EOF
          python tools/director.py wolfram-record --run G-160-20260808T021341Z --call G-WL-001 --output "$R/wolfram/G-WL-001/output.txt"
          python tools/director.py wolfram-record --run G-160-20260808T021341Z --call G-WL-002 --output "$R/wolfram/G-WL-002/output.txt"

      - name: Run manufactured G reference check
        run: python tools/run_reference_checks.py --module G --output modules/G/runs/G-160-20260808T021341Z/reference_checks.json

      - name: Freeze exact source-lineage analysis and pre-primary hard stop
        run: |
          python - <<'PY'
          import hashlib,json,math,platform,sys
          from datetime import datetime,timezone
          from pathlib import Path
          rid='G-160-20260808T021341Z'; R=Path('modules/G/runs')/rid
          sha=lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          parent_path=Path('modules/F/frozen/H_F_to_G.json'); parent=json.load(open(parent_path))
          assert sha(parent_path)=='bc996dc35f7cf1c2bafc3523133c1470dd9184f4ebff97f5e94b0f0fe1840154'
          p29=Path('sources/frozen/cef6d68b05eb509e471c55a18b5fffedd9c411b44bc0d5bd0f6b5ee86bd8b53e/Presentation 29 revised  raw LaTeX.md')
          p30=Path('sources/frozen/4895c3777da3aa84da4ec2343419ffbc07502b3738602308a1f402862441eaf6/Presentation 30 raw LaTex.md')
          assert sha(p29)=='cef6d68b05eb509e471c55a18b5fffedd9c411b44bc0d5bd0f6b5ee86bd8b53e'
          assert sha(p30)=='4895c3777da3aa84da4ec2343419ffbc07502b3738602308a1f402862441eaf6'

          rr=parent['residual_route_network']; rates=rr['terminal_directional_fluxes']; xfree=parent['internal_bound_free_coordinate']['terminal_value']
          k_route=sum(rates)
          k_forward=sum(rates[::2])
          k_free_weighted=xfree*k_route
          candidates=[
            {'id':'G-KAPPA-0','formula':'0','value':0.0,'meaning':'No witnessed photon/radiation scattering channel is active; parent leaves photon identity and EM charge unassigned.','selected_by_parent':False,'physical_photon_opacity_claimed':False},
            {'id':'G-KAPPA-ROUTE','formula':'sum_j r_j','value':k_route,'meaning':'Use the exact inherited nonnegative directional route-activity seed as a generic internal interaction hazard.','selected_by_parent':False,'physical_photon_opacity_claimed':False},
            {'id':'G-KAPPA-FWD','formula':'sum_forward_j r_j','value':k_forward,'meaning':'Use association-direction event activity only as a generic capture-like internal hazard.','selected_by_parent':False,'physical_photon_opacity_claimed':False},
            {'id':'G-KAPPA-FREE','formula':'x_free * sum_j r_j','value':k_free_weighted,'meaning':'Weight inherited route activity by the exact internal free-carrier occupancy.','selected_by_parent':False,'physical_photon_opacity_claimed':False}]
          for c in candidates:
            c['nonnegative']=c['value']>=0
            c['characteristic_tau']=None if c['value']==0 else 1.0/c['value']
            c['constant_hazard_visibility_normalizes_on_0_inf']=False if c['value']==0 else True
          positive=[c for c in candidates if c['value']>0]
          assert len({round(c['value'],24) for c in positive})>=3
          assert all(c['nonnegative'] for c in candidates)

          obstruction={
            'schema_version':'1.0','run_id':rid,'classification':'BLOCKED_UNDERDETERMINED_PRE_PRIMARY','generation_mode':'GENERATION_SEALED',
            'exact_parent':{'path':str(parent_path),'sha256':sha(parent_path),'fidelity':parent['fidelity']},
            'required_G_objects':['nonequilibrium recombination network from F','physical opacity and optical-depth law','visibility/radiation-surface construction','uncertainty and restart packet'],
            'context_findings':[
              'H_F_to_G exports internally typed RFC composites and an internal bound/free coordinate but explicitly forbids interpreting that coordinate as empirical electron/proton ionization.',
              'H_F_to_G declares electromagnetic charge NOT_DERIVED_AT_MINIMAL_SPINE, photon identity unassigned, physical photon opacity NOT_DERIVED, and neutrino identity dormant/no-witness.',
              'H_F_to_G exports kappa_int_F only as an internal route-activity/source-transfer seed and requires a new witnessed radiation/charge specialization before it can become photon opacity.',
              'Canonical P29 treats recombination solutions/CLASS-CAMB spectra as an external proof obligation rather than a solved internal law.',
              'Canonical P30 STEP 6W explicitly states that its recombination/CMB module is a readiness-marker construction and does not solve public recombination physics or generate a physical visibility function.',
              'G-WL-001 and G-WL-002 are manufactured algebra/invariant checks. They prove implementation identities only and do not supply the missing physical charge, radiation carrier or opacity coefficient.'
            ],
            'source_compatible_countermodels':candidates,
            'nonuniqueness_result':{
              'positive_candidate_count':len(positive),
              'distinct_positive_hazards':[c['value'] for c in positive],
              'distinct_characteristic_tau':[c['characteristic_tau'] for c in positive],
              'conclusion':'The exact parent admits multiple nonnegative internal hazard constructions with materially different visibility timescales and also admits the no-witness zero-scattering branch. No admitted source or parent witness selects one as physical photon opacity.'},
            'missing_witness':{
              'object_id':'G_RADIATION_CHARGE_OPACITY_SPECIALIZATION_WITNESS',
              'must_supply':['typed radiation carrier or field coupled to the F state','derived interaction/charge or scattering operator on the F state space','source-owned coupling/rate law with units in the intrinsic G clock','selection rule proving why this operator rather than other source-compatible hazards is the physical opacity','mapping from the executed opacity history to the visibility/radiation surface without public target insertion'],
              'cannot_be_supplied_by':['remembered Thomson cross section','public recombination history','standard electron/proton/hydrogen labels','CMB temperature/redshift targets','renaming kappa_int_F to photon opacity','the manufactured G-WL-001/G-WL-002 templates']},
            'decision':'Do not materialize either G solver config. Every __BIND token remains a hard stop until the missing witness is uniquely derived or a lawful source-level branch-family execution contract is explicitly established.',
            'strongest_supported_claim':'The exact F parent and admitted canonical sources uniquely establish the G input ancestry and the mathematical visibility/conservation templates, but they do not uniquely establish a physical recombination charge/radiation specialization or photon opacity law.',
            'strongest_unsupported_claim':'No physical RFC last-scattering surface, electron-ionization history, photon opacity, optical depth, recombination redshift, CMB surface, or G->HU/G->I physical handoff is established by this run.'}
          (R/'G_DERIVATION_OBSTRUCTION.json').write_text(json.dumps(obstruction,indent=2)+'\n')
          osha=sha(R/'G_DERIVATION_OBSTRUCTION.json')

          src={
            'schema_version':'1.0','run_id':rid,'status':'FROZEN_FOR_UNDERDETERMINATION_ANALYSIS','generation_mode':'GENERATION_SEALED',
            'exact_parents':[{'object_id':'H_F_to_G','path':str(parent_path),'sha256':sha(parent_path),'role':'DIRECT_PARENT'}],
            'admitted_sources':[{'label':'Triadic emergence and theorem architecture','path':str(p29),'sha256':sha(p29),'classification':'CANONICAL_AUTHORITY','generative_scope':'triad/kernel/no-retune and explicit recombination boundary only'},{'label':'Universe architecture and full ledger','path':str(p30),'sha256':sha(p30),'classification':'CANONICAL_AUTHORITY','generative_scope':'G placement, handoff architecture and explicit STEP6 readiness boundary only'}],
            'internal_derivations':[{'object_id':'G_DERIVATION_OBSTRUCTION','path':str(R/'G_DERIVATION_OBSTRUCTION.json'),'sha256':osha}],
            'procedure_only_sources':[{'path':'recipes/G/WORK_ORDER.md','sha256':sha('recipes/G/WORK_ORDER.md')},{'path':'recipes/G/recipe.json','sha256':sha('recipes/G/recipe.json')},{'path':'docs/26_ZERO_DESIGN_OPERATOR_PROTOCOL.md','sha256':sha('docs/26_ZERO_DESIGN_OPERATOR_PROTOCOL.md')}],
            'imports':['json','hashlib','math'],'files':[str(parent_path),str(p29),str(p30)],'urls':[],
            'constants':[{'name':'terminal_directional_route_activity','value':k_route,'origin':'H_F_to_G.residual_route_network.terminal_directional_fluxes exact sum'},{'name':'terminal_internal_free_fraction','value':xfree,'origin':'H_F_to_G.internal_bound_free_coordinate.terminal_value'}],
            'public_data_declaration':'NONE','network_policy':'DISABLED_DURING_GENERATION'}
          (R/'SOURCE_REGISTER.json').write_text(json.dumps(src,indent=2)+'\n')

          lock={
            'schema_version':'1.0','run_id':rid,'status':'FROZEN','frozen_before_primary_execution':True,'primary_execution_authorized':False,
            'authorization_reason':'BLOCKED_UNDERDETERMINED: physical recombination/radiation/opacity specialization is not uniquely selected by exact H_F_to_G plus admitted canonical sources.',
            'generation_mode':'GENERATION_SEALED','fidelity':'MINIMAL_SPINE',
            'authority_hashes':[sha(p29),sha(p30)],'parent_hashes':[sha(parent_path)],'definition_hashes':[{'path':str(R/'G_DERIVATION_OBSTRUCTION.json'),'sha256':osha}],
            'candidate_classes':['zero-witness/no-scattering branch','inherited total-route internal hazard','association-only internal hazard','free-weighted internal hazard','any future source-witnessed radiation/charge specialization'],
            'selection_rule':'No physical opacity candidate may be selected merely by familiarity, desired surface location, public target, or ability to normalize a visibility function. A source-owned witness must select it uniquely or the branch family must remain unresolved.',
            'tests':['exact F parent hash','F parent channel typing','P29/P30 boundary statements','G-WL manufactured identities','G manufactured reference check','source-compatible opacity countermodel nonuniqueness','unresolved binding hard-stop'],
            'gates':['rate and opacity lineage','normalization and positivity','stiff convergence','independent reconstruction'],
            'falsifiers':['any public/remembered coefficient enters generation','kappa_int_F is renamed photon opacity without a new witness','empirical electron/proton/hydrogen labels are inserted without derivation','one candidate is selected only because it resembles textbook recombination','primary execution occurs with unresolved binding provenance'],
            'claim_boundary':obstruction['strongest_supported_claim'],
            'allowed_corrective_scope':'A future attempt must supply the missing source-owned specialization witness as a new hashed derivation or explicit lawful branch-family contract in a new governed run; this frozen failed attempt is preserved.'}
          (R/'PRE_EXECUTION_LOCK.json').write_text(json.dumps(lock,indent=2)+'\n')
          env={'run_id':rid,'status':'FINAL','operating_system':platform.platform(),'python':sys.version,'network_policy':'DISABLED_DURING_GENERATION','hidden_defaults_audited':True,'primary_solver_execution':'NOT_AUTHORIZED_DUE_TO_FROZEN_UNDERDETERMINATION','wolfram_calls':['G-WL-001','G-WL-002'],'reference_check':'EXECUTED_MANUFACTURED_ONLY'}
          (R/'ENVIRONMENT.json').write_text(json.dumps(env,indent=2)+'\n')
          gates={'run_id':rid,'overall':'BLOCKED_UNDERDETERMINED','componentwise':{
            'rate and opacity lineage':{'status':'FAIL','pass':False,'reason':'No unique source-owned physical radiation/charge/opacity specialization exists in the exact F parent or admitted canonical sources.'},
            'normalization and positivity':{'status':'NOT_RUN_UPSTREAM_BLOCK','pass':False,'reason':'Manufactured positive-opacity normalization identity passes, but no physical opacity history is authorized.'},
            'stiff convergence':{'status':'NOT_RUN_UPSTREAM_BLOCK','pass':False,'reason':'Physical recombination network coefficients/species specialization are not uniquely bound.'},
            'independent reconstruction':{'status':'PASS_FOR_OBSTRUCTION_ONLY','pass':True,'reason':'The underdetermination is independently reconstructible from exact parent typing plus multiple explicit source-compatible hazard countermodels; no physical G result is claimed.'}},
            'manufactured_checks_do_not_override_block':True,'primary_execution_performed':False}
          (R/'GATE_RESULTS.json').write_text(json.dumps(gates,indent=2)+'\n')
          (R/'INDEPENDENT_VERIFICATION.md').write_text('# G-160 independent verification of obstruction\n\nThe exact F handoff, P29/P30 boundary language, manufactured G checks, and source-compatible hazard family were reconstructed without trusting a primary G result. The reconstruction confirms that the physical rate/opacity lineage is underdetermined before primary execution. The three nonzero parent-derived hazard candidates are positive but produce distinct characteristic intrinsic times, while the parent also permits a no-witness zero-scattering branch. No admitted rule selects one as photon opacity. Therefore the repository hard stop is upheld. No recombination, visibility, CMB, or last-scattering physical result is certified.\n')
          (R/'CLOSEOUT.md').write_text('# G-160 blocked underdetermined\n\n**Status:** `BLOCKED_UNDERDETERMINED_PRE_PRIMARY`\n\nPrimary solver execution was not authorized because the exact F parent deliberately leaves electromagnetic charge, photon identity, and physical opacity underived, while the admitted canonical sources do not supply a unique radiation/charge/opacity specialization. Manufactured G checks pass at their limited algebraic scope but do not create the missing physics. `G_DERIVATION_OBSTRUCTION.json` preserves explicit source-compatible countermodels and the exact missing witness contract. No G->HU or G->I physical handoff is frozen.\n')
          print(json.dumps({'k_route':k_route,'k_forward':k_forward,'k_free_weighted':k_free_weighted,'obstruction_sha256':osha},indent=2))
          PY

      - name: Prove solver bindings remain unresolved hard stops
        run: |
          R=modules/G/runs/G-160-20260808T021341Z
          grep -R '__BIND_FROM_FROZEN_PARENT_OR_DERIVATION__' "$R/binding_sheets" "$R/solver_templates"
          set +e
          python tools/materialize_solver_config.py --template "$R/solver_templates/G_recombination_network.template.json" --binding-sheet "$R/binding_sheets/G_recombination_network.bindings.json" --output /tmp/should-not-materialize-g.json
          CODE=$?
          set -e
          test "$CODE" -ne 0
          test ! -f /tmp/should-not-materialize-g.json

      - name: Validate repository and generation firewall
        run: |
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
          python tools/rfc.py context

      - name: Commit preserved G obstruction evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/G/runs/G-160-20260808T021341Z
          git commit -m 'Preserve G160 physical opacity underdetermination before execution'
          git pull --rebase origin agent/frontier-050-execution
          git push origin HEAD:agent/frontier-050-execution
          echo "OBSTRUCTION_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Verify remote obstruction SHA
        run: |
          git fetch origin agent/frontier-050-execution
          REMOTE=$(git rev-parse origin/agent/frontier-050-execution)
          test "$REMOTE" = "$OBSTRUCTION_SHA"
          echo "Verified G obstruction SHA: $REMOTE"
