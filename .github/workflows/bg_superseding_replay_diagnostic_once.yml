name: B-G Superseding Replay Self-Diagnosing Once

on:
  push:
    branches:
      - agent/frontier-050-execution
    paths:
      - '.github/bg-superseding-diagnostic-trigger.txt'

permissions:
  contents: write

concurrency:
  group: bg-superseding-replay-frontier-once
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements-lock.txt

      - name: Execute canonical transition with preserved diagnostic
        shell: bash
        run: |
          set +e
          LOG=/tmp/bg_repair_diagnostic.txt
          : > "$LOG"
          stage () {
            echo "===== $1 =====" | tee -a "$LOG"
            shift
            "$@" >> "$LOG" 2>&1
            rc=$?
            echo "RC=$rc" | tee -a "$LOG"
            if [ $rc -ne 0 ]; then
              echo "FAILED_STAGE=$1" >> "$LOG"
              return $rc
            fi
            return 0
          }

          python - <<'PY' >> "$LOG" 2>&1
          import json
          from pathlib import Path
          s=json.load(open('STATE.json'))
          print('START_STATE',s['active_work_unit'],s['current_module'],s['current_run'],s.get('repair_state'))
          assert s['active_work_unit']=='G-160' and s['current_module']=='G',s
          rid=s['current_run']; assert rid and rid.startswith('G-160-'),s
          lock=json.load(open(Path('modules/G/runs')/rid/'PRE_EXECUTION_LOCK.json'))
          assert lock['authorization']=='NOT_AUTHORIZED_PENDING_SUPERSEDING_F_TO_G_PARENT',lock
          assert lock['repair_prerequisite']=='recovery/BG_SUPERSEDING_LINEAGE_PACKET.md',lock
          for m in 'BCDEF':
              r=s['modules'][m]; assert r['evidence_state']=='FROZEN' and r['fidelity']=='MINIMAL_SPINE',(m,r)
          PY
          rc=$?
          [ $rc -eq 0 ] || FAIL_STAGE=verify_prerequisite

          if [ -z "${FAIL_STAGE:-}" ]; then
            RID=$(python - <<'PY'
          import json
          print(json.load(open('STATE.json'))['current_run'])
          PY
            )
            python - "$RID" <<'PY' >> "$LOG" 2>&1
          import sys
          from pathlib import Path
          rid=sys.argv[1]; R=Path('modules/G/runs')/rid
          (R/'CLOSEOUT.md').write_text(f'''# {rid} Superseding-Lineage Prerequisite Closeout

## Result

**BLOCKED BEFORE PRIMARY EXECUTION.**

The recovered B-G corpus is `REPLAY_REQUIRED`, and the frozen repair packet requires B -> C -> D -> E -> F -> G. This G planning shell closes without primary recombination execution.

## Strongest supported claim

Exact recovered source material and a frozen B-first replay order exist.

## Strongest unsupported claim

No superseding B-to-G handoff chain or repaired recombination/visibility state has yet been freshly executed and frozen.
''',encoding='utf-8')
          PY
            python tools/rfc.py close-run --run-id "$RID" --result BLOCKED --closeout "modules/G/runs/$RID/CLOSEOUT.md" >> "$LOG" 2>&1
            rc=$?; echo "close_g_rc=$rc" >> "$LOG"; [ $rc -eq 0 ] || FAIL_STAGE=close_g
          fi

          if [ -z "${FAIL_STAGE:-}" ]; then
            python tools/repair_superseding_lineage_frontier.py >> "$LOG" 2>&1
            rc=$?; echo "repair_frontier_rc=$rc" >> "$LOG"; [ $rc -eq 0 ] || FAIL_STAGE=repair_frontier
          fi

          if [ -z "${FAIL_STAGE:-}" ]; then
            python tools/rfc.py reopen-module B --fidelity PRODUCTION --evidence recovery/BG_SUPERSEDING_LINEAGE_PACKET.md >> "$LOG" 2>&1
            rc=$?; echo "reopen_b_rc=$rc" >> "$LOG"; [ $rc -eq 0 ] || FAIL_STAGE=reopen_b
          fi

          if [ -z "${FAIL_STAGE:-}" ]; then
            python tools/director.py doctor >> "$LOG" 2>&1
            rc=$?; echo "director_doctor_pre_rc=$rc" >> "$LOG"; [ $rc -eq 0 ] || FAIL_STAGE=director_doctor_pre
          fi

          if [ -z "${FAIL_STAGE:-}" ]; then
            python tools/director.py prepare-active --create-run >> "$LOG" 2>&1
            rc=$?; echo "prepare_active_rc=$rc" >> "$LOG"; [ $rc -eq 0 ] || FAIL_STAGE=prepare_active
          fi

          if [ -z "${FAIL_STAGE:-}" ]; then
            python - <<'PY' >> "$LOG" 2>&1
          import importlib.util,json
          from pathlib import Path
          s=json.load(open('STATE.json')); q={x['id']:x for x in json.load(open('WORK_QUEUE.json'))['items']}
          assert s['active_work_unit']=='B-115' and s['current_module']=='B',s
          assert s['modules']['B']['evidence_state']=='DESIGN' and s['modules']['B']['fidelity']=='PRODUCTION',s['modules']['B']
          assert [q[x]['status'] for x in ['B-115','C-125','D-135','E-145','F-155','G-160']]==['ACTIVE','BLOCKED','BLOCKED','BLOCKED','BLOCKED','BLOCKED']
          rid=s['current_run']; assert rid and rid.startswith('B-115-'),s
          R=Path('modules/B/runs')/rid
          c=json.load(open(R/'OUTPUT_CONTRACT.json')); required=json.load(open('modules/B/spec.json'))['required_outputs']
          assert [x['name'] for x in c['required_outputs']]==required and c['status']=='DRAFT'
          spec=importlib.util.spec_from_file_location('rfc',Path('tools/rfc.py')); m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          ok,errors=m.validate_required_output_contract(R,'B'); assert ok is False and errors
          print('B_RUN',rid); print('EXPECTED_INCOMPLETE_CONTRACT_ERRORS',errors)
          PY
            rc=$?; echo "frontier_assert_rc=$rc" >> "$LOG"; [ $rc -eq 0 ] || FAIL_STAGE=frontier_assert
          fi

          if [ -z "${FAIL_STAGE:-}" ]; then
            python tools/rfc.py doctor >> "$LOG" 2>&1; rc=$?; echo "rfc_doctor_rc=$rc" >> "$LOG"; [ $rc -eq 0 ] || FAIL_STAGE=rfc_doctor
          fi
          if [ -z "${FAIL_STAGE:-}" ]; then
            python tools/director.py doctor >> "$LOG" 2>&1; rc=$?; echo "director_doctor_rc=$rc" >> "$LOG"; [ $rc -eq 0 ] || FAIL_STAGE=director_doctor
          fi
          if [ -z "${FAIL_STAGE:-}" ]; then
            python -m unittest discover -s tests -v >> "$LOG" 2>&1; rc=$?; echo "tests_rc=$rc" >> "$LOG"; [ $rc -eq 0 ] || FAIL_STAGE=tests
          fi
          if [ -z "${FAIL_STAGE:-}" ]; then
            python tools/rfc.py firewall-scan >> "$LOG" 2>&1; rc=$?; echo "firewall_rc=$rc" >> "$LOG"; [ $rc -eq 0 ] || FAIL_STAGE=firewall
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if [ -n "${FAIL_STAGE:-}" ]; then
            echo "FINAL_RESULT=FAIL" >> "$LOG"
            echo "FAIL_STAGE=$FAIL_STAGE" >> "$LOG"
            git reset --hard HEAD
            git clean -fd
            mkdir -p audit
            cp "$LOG" audit/BG_SUPERSEDING_REPLAY_WORKFLOW_DIAGNOSTIC.txt
            git add audit/BG_SUPERSEDING_REPLAY_WORKFLOW_DIAGNOSTIC.txt
            git commit -m "Record B-G superseding replay workflow diagnostic"
            git pull --rebase origin agent/frontier-050-execution
            git push origin HEAD:agent/frontier-050-execution
            exit 1
          fi

          echo "FINAL_RESULT=PASS" >> "$LOG"
          mkdir -p audit
          cp "$LOG" audit/BG_SUPERSEDING_REPLAY_WORKFLOW_DIAGNOSTIC.txt
          python tools/rfc.py context >> "$LOG" 2>&1
          git add -A
          git commit -m 'Close B-G source repair and reopen B-first superseding replay'
          git pull --rebase origin agent/frontier-050-execution
          git push origin HEAD:agent/frontier-050-execution

      - name: Verify landed canonical frontier
        run: |
          git fetch origin agent/frontier-050-execution
          git reset --hard origin/agent/frontier-050-execution
          python - <<'PY'
          import json
          s=json.load(open('STATE.json')); q={x['id']:x for x in json.load(open('WORK_QUEUE.json'))['items']}
          assert s['repair_state']=='BG_SUPERSEDING_REPLAY_AUTHORIZED_B_FIRST',s
          assert s['active_work_unit']=='B-115' and s['current_run'].startswith('B-115-'),s
          assert s['modules']['B']['evidence_state']=='DESIGN' and s['modules']['B']['fidelity']=='PRODUCTION',s['modules']['B']
          assert s['modules']['G']['evidence_state']=='BLOCKED',s['modules']['G']
          assert [q[x]['status'] for x in ['B-115','C-125','D-135','E-145','F-155','G-160']]==['ACTIVE','BLOCKED','BLOCKED','BLOCKED','BLOCKED','BLOCKED']
          PY
