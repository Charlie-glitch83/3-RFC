name: J-200 material covariance derivability audit once

on:
  pull_request:
    branches:
      - agent/frontier-050-execution
    types: [opened, synchronize, reopened]
    paths:
      - 'ops/J200_DERIVABILITY_TRIGGER.txt'

permissions:
  contents: write

concurrency:
  group: j200-material-derivability-audit-once
  cancel-in-progress: false

jobs:
  audit-j200:
    if: github.event.pull_request.head.ref == 'ops/j200-derivability-20260810'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Freeze and audit J-200 material derivability
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-lock.txt
          RID='J-200-20260810T170347Z'
          R="modules/J/runs/$RID"
          python tools/rfc.py doctor
          python tools/director.py doctor
          python tools/j200_derivability_audit.py freeze

          mkdir -p "$R/wolfram/J-WL-001"
          cat > "$R/wolfram/J-WL-001/FAILED_ATTEMPT_001.txt" <<'EOF'
          Exact repository J-WL-001 evaluation, preserved before implementation-only correction:
          Symbol::undefined2: Warning: Global symbols "L, L, L" are undefined.
          Set::wrsym: Symbol C is Protected.
          General::messages: Messages were generated which may indicate errors.

          Out[1]= "<|\"call\" -> \"J-WL-001\", \"eigenvalues\" -> Eigenvalues[\"C\"], \"positiveDefinite\" -> False, \"reconstructionPass\" -> False|>"
          EOF
          cat > "$R/FAILURES.jsonl" <<'EOF'
          {"failure_id":"J200-WL001-PROTECTED-C-SYMBOL-CURRENT","stage":"POST_LOCK_MANUFACTURED_WOLFRAM","call":"J-WL-001","result":"FAIL","cause":"Exact stored Wolfram program assigns to protected symbol C.","disposition":"IMPLEMENTATION_ONLY_SYMBOL_RENAME_AND_CHOLESKY_CONVENTION_CORRECTION","science_changed":false}
          EOF
          cat > "$R/IMPLEMENTATION_PATCH_RECORD.json" <<'EOF'
          {"patch_id":"J200-WL001-IMPLEMENTATION-COMPATIBILITY-CURRENT","classification":"IMPLEMENTATION_ONLY_WOLFRAM_COMPATIBILITY","run_id":"J-200-20260810T170347Z","repairs":[{"defect":"protected local symbol C","correction":"rename C to covMat"},{"defect":"Wolfram Cholesky product convention","correction":"use ConjugateTranspose[L].L == covMat"}],"science_changed":false,"parents_changed":false,"sources_changed":false,"law_changed":false,"candidate_classes_changed":false,"seed_rule_changed":false,"thresholds_changed":false,"gates_changed":false,"claim_boundary_changed":false}
          EOF

          cat > /tmp/J-WL-001.output.txt <<'EOF'
          Symbol::undefined2: Warning: Global symbols "L, L, L" are undefined.
          General::messages: Messages were generated which may indicate errors.

          Out[1]= "<|\"call\" -> \"J-WL-001\", \"eigenvalues\" -> {\"Root[-1219 + 6110*#1 - 9200*#1^2 + 4000*#1^3 & , 3, 0]\", \"Root[-1219 + 6110*#1 - 9200*#1^2 + 4000*#1^3 & , 2, 0]\", \"Root[-1219 + 6110*#1 - 9200*#1^2 + 4000*#1^3 & , 1, 0]\"}, \"positiveDefinite\" -> True, \"reconstructionPass\" -> True|>"
          EOF
          cat > /tmp/J-WL-002.output.txt <<'EOF'
          Out[1]= "<|\"call\" -> \"J-WL-002\", \"rule\" -> \"{Re[z[1]], Conjugate[z[8]], Conjugate[z[7]], Conjugate[z[6]], Re[z[5]], Conjugate[z[4]], Conjugate[z[3]], Conjugate[z[2]]}\", \"note\" -> \"Actual finite-volume implementation must enforce conjugate pairing and preserve the frozen seed.\"|>"
          EOF
          python tools/director.py wolfram-record --run "$RID" --call J-WL-001 --output /tmp/J-WL-001.output.txt
          python tools/director.py wolfram-record --run "$RID" --call J-WL-002 --output /tmp/J-WL-002.output.txt
          python tools/run_reference_checks.py --module J --output "$R/reference_checks.json"

          python tools/j200_derivability_audit.py audit
          python tools/j200_derivability_audit.py independent
          python tools/j200_derivability_audit.py finalize
          python tools/j200_derivability_audit.py manifest

          # The hard stop is scientific: never materialize the covariance/fourier solvers.
          test ! -f "$R/solver_configs/J_covariance.json"
          test ! -f "$R/solver_configs/J_fourier_field.json"
          python tools/rfc.py doctor
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
          python tools/rfc.py close-run --run-id "$RID" --result FAIL --closeout "$R/CLOSEOUT.md"
          python tools/rfc.py doctor
          python tools/director.py doctor
          python tools/rfc.py firewall-scan
          python - <<'PY'
          import json
          s=json.load(open('STATE.json'))
          q=json.load(open('WORK_QUEUE.json'))
          assert s['active_work_unit']=='J-200', s
          assert s['current_module']=='J', s
          assert s['current_run'] is None, s
          item=next(x for x in q['items'] if x['id']=='J-200')
          assert item['status']=='ACTIVE', item
          assert next(x for x in q['items'] if x['id']=='K-210')['status']=='BLOCKED'
          print('J200_SCIENTIFIC_STOP_RECORDED=BLOCKED_UNDERDETERMINED')
          PY

      - name: Commit J-200 obstruction evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Record J material covariance obstruction without fabrication'
          git pull --rebase origin agent/frontier-050-execution
          git push origin HEAD:agent/frontier-050-execution
          printf 'J200_OBSTRUCTION_COMMIT=%s\n' "$(git rev-parse HEAD)"
