name: Execute REC-040 reconciled recovery

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  recover:
    if: github.head_ref == 'agent/rec-040-execution'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rec-040-execution
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: Charlie-glitch83/2-RFC
          ref: b0f21d023f64ce9c70fd4755dfdbb7357b9f7a10
          path: _2rfc_exact
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements-lock.txt
      - name: Admit exact limited-scope objects and preserve lineage disagreement
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, platform, shutil, subprocess, sys
          from datetime import datetime, timezone
          from pathlib import Path

          root=Path('.'); src=root/'_2rfc_exact'; now=datetime.now(timezone.utc).isoformat()
          commit='b0f21d023f64ce9c70fd4755dfdbb7357b9f7a10'
          actual=subprocess.check_output(['git','-C',str(src),'rev-parse','HEAD'],text=True).strip()
          if actual!=commit: raise SystemExit(f'commit mismatch {actual}')
          runs=sorted(root.glob('runs/REC-040-*'))
          if len(runs)!=1: raise SystemExit('expected one REC-040 run')
          run_dir=runs[0]; run_id=run_dir.name
          discovery=json.loads((run_dir/'RECOVERY_DISCOVERY.json').read_text())

          def sha(p):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for c in iter(lambda:f.read(1048576),b''): h.update(c)
              return h.hexdigest()
          def save(path,obj):
              p=root/path; p.parent.mkdir(parents=True,exist_ok=True)
              p.write_text(json.dumps(obj,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

          selected={
            'science/BARYONIC_STELLAR_UNIVERSE.md':'first-pass Module L scientific specification',
            'proofs/BARYONIC_STELLAR_UNIVERSE.md':'conditional theorem stack',
            'modules/L/MODULE_L_WOLFRAM_VERIFICATION.md':'representative finite verification with explicit limitations',
            'modules/L/MODULE_L_TO_M_SCIENTIFIC_HANDOFF.md':'typed export and ownership boundary',
            'evidence/MODULE_MAP.md':'first-pass export schema only'
          }
          phrases={
            'science/BARYONIC_STELLAR_UNIVERSE.md':['L^(0)','final `L*`','This is not a public star-formation fit'],
            'proofs/BARYONIC_STELLAR_UNIVERSE.md':['Theorem L.1','Theorem L.13','Generated birth measure'],
            'modules/L/MODULE_L_WOLFRAM_VERIFICATION.md':['representative identities','They do not establish a unique full baryonic universe','final K-L-M closure'],
            'modules/L/MODULE_L_TO_M_SCIENTIFIC_HANDOFF.md':['stellar trajectory != isotope yield','P_L->M^(n)','Modules A–J remain frozen'],
            'evidence/MODULE_MAP.md':['P_L->M^(0)','R_L->K^(0)','final K*, L*, M*']
          }
          tracked=subprocess.check_output(['git','-C',str(src),'ls-files','-z']).split(b'\0')
          tracked=[x.decode() for x in tracked if x]
          lineage=[]
          for rel in sorted(tracked):
              p=src/rel; low=rel.lower()
              if rel in selected: cls='ADMITTED_SOURCE'; reason=selected[rel]
              elif rel=='validation/validate_repo.py': cls='REPLAY_REQUIRED'; reason='stale historical integrity checker'
              elif rel=='STATE.json' or 'closeout' in low or '/results/' in low or '/outputs/' in low: cls='QUARANTINED'; reason='historical state/result cannot be authority'
              elif low.startswith('sources/canonical/'): cls='COMPARISON_ONLY'; reason='3-RFC admitted corpus remains authoritative'
              else: cls='HISTORICAL_WARNING'; reason='not selected for exact admission'
              lineage.append({'repository':'Charlie-glitch83/2-RFC','commit':commit,'path':rel,'sha256':sha(p),'bytes':p.stat().st_size,'classification':cls,'reason':reason})

          destroot=root/'recovery'/'admitted'/'2-RFC'/commit
          admitted=[]
          for rel,scope in selected.items():
              p=src/rel
              if not p.is_file() or p.stat().st_size==0: raise SystemExit(f'missing {rel}')
              text=p.read_text(encoding='utf-8')
              for phrase in phrases[rel]:
                  if phrase not in text: raise SystemExit(f'missing scope phrase {phrase} in {rel}')
              d=destroot/rel; d.parent.mkdir(parents=True,exist_ok=True); shutil.copyfile(p,d)
              if sha(d)!=sha(p): raise SystemExit(f'copy mismatch {rel}')
              admitted.append({'name':scope,'repository':'Charlie-glitch83/2-RFC','commit':commit,'source_path':rel,'stored_path':str(d),'sha256':sha(p),'bytes':p.stat().st_size,'classification':'ADMITTED_SOURCE','evidence_state':'SOURCE_OBJECT_ONLY','unsupported':['historical PASS','physical execution','final K-L-M closure','empirical validity']})

          validator=subprocess.run([sys.executable,str(src/'validation/validate_repo.py')],cwd=src,text=True,capture_output=True)
          save(run_dir/'LEGACY_VALIDATOR_REPLAY.json',{'commit':commit,'returncode':validator.returncode,'stdout':validator.stdout,'stderr':validator.stderr,'interpretation':'Preserved replay failure; validator checks stale state and cannot validate Module L.'})

          later=[b for b in discovery['branches'] if b['commit']=='3dff7f9626752dc48d6101629c0646935e6c18e0']
          save('recovery/LINEAGE_CROSSWALK.json',{'schema_version':'1.0','generated_utc':now,'repository':'Charlie-glitch83/2-RFC','discovery_branches':discovery['branches'],'exact_recovery_commit':commit,'later_lineage_commit':'3dff7f9626752dc48d6101629c0646935e6c18e0','policy':'Exact bytes control. b0f21d objects are source-only; later empty placeholders and all state/PASS claims remain non-authoritative.','objects':lineage})
          save('recovery/ADMITTED_ASSET_MANIFEST.json',{'schema_version':'1.0','status':'EXACT_OBJECTS_ADMITTED_AT_LIMITED_SCOPE','repository':'Charlie-glitch83/2-RFC','commit':commit,'assets':admitted,'canonical_parents':[],'boundary':'No state, PASS label, numerical output, fitted target, or final-completion claim admitted.'})
          q=['# REC-040 Quarantine','',f'Exact admitted source commit: `{commit}`',f'Later lineage commit: `3dff7f9626752dc48d6101629c0646935e6c18e0`','',
             'The exact historical commit contains substantive Module L source objects. Later branch heads contain incomplete or placeholder Module L material. Both facts are preserved; neither old completion label is authority.','',
             '- Historical `STATE.json`, closeouts, result bundles, PASS labels, and validator conclusions are quarantined.',
             '- The historical validator fails on the recovered commit and is replay evidence only.',
             '- The five admitted objects remain source material, not proof of physical execution.','',
             '## Classification summary','']
          counts={}
          for x in lineage: counts[x['classification']]=counts.get(x['classification'],0)+1
          for k,v in sorted(counts.items()): q.append(f'- {k}: {v}')
          (root/'recovery/QUARANTINE.md').write_text('\n'.join(q)+'\n',encoding='utf-8')

          gates=[
            {'gate':'exact commit/file hashes','result':'PASS','evidence':f'{len(lineage)} tracked files hashed at {commit}; five copies rehashed'},
            {'gate':'no old PASS auto-promoted','result':'PASS','evidence':'zero canonical parents; state and completion artifacts quarantined'},
            {'gate':'no public-data contamination','result':'PASS','evidence':'selection used exact repository bytes and scope boundaries only; no observational target values'},
            {'gate':'replay evidence','result':'PASS','evidence':f'branch discovery replayed nine heads; historical validator failure code {validator.returncode} preserved'}]
          save(run_dir/'SOURCE_REGISTER.json',{'run_id':run_id,'exact_parents':['recovery/CANDIDATE_ASSET_DISPOSITION.json','theory/ENHANCEMENT_CROSSWALK.json',str(run_dir/'RECOVERY_DISCOVERY.json')],'admitted_sources':admitted,'imports':['hashlib','json','pathlib','subprocess','shutil'],'files':['recovery/LINEAGE_CROSSWALK.json','recovery/ADMITTED_ASSET_MANIFEST.json','recovery/QUARANTINE.md'],'urls':[],'constants':[],'public_data_declaration':'NONE'})
          save(run_dir/'PRE_EXECUTION_LOCK.json',{'run_id':run_id,'status':'FROZEN','frozen_utc':now,'authority_hashes':[a['sha256'] for a in admitted],'parent_hashes':[commit,'3dff7f9626752dc48d6101629c0646935e6c18e0'],'definition_hashes':[],'candidate_classes':['CANONICAL_PARENT','ADMITTED_SOURCE','REPLAY_REQUIRED','COMPARISON_ONLY','HISTORICAL_WARNING','QUARANTINED','SUPERSEDED','EXCLUDED'],'equations_and_laws':[],'dimensions_units_frames_gauges_clocks':[],'methods':['nine-branch discovery','exact commit checkout','full-tree SHA-256','scope phrase checks','byte-copy verification','validator replay'],'tolerances':['exact equality only'],'stopping_rules':['commit mismatch','missing object','hash mismatch','scope boundary absent'],'expected_invariants':['five source-only objects','zero old PASS promotion','zero canonical parents','lineage disagreement preserved'],'tests':[g['gate'] for g in gates],'gates':[g['gate'] for g in gates],'falsifiers':['unhashed object','state promoted','target-driven admission','replay omitted'],'claim_boundary':'Recovers exact Module L source objects only; does not establish physical execution, final recurrence, universe completion, or empirical validity.','independent_verifier_design':'Recheckout exact commit, rebuild tree hashes, compare copies, reread limits, and replay stale validator without trusting its conclusion.','allowed_implementation_only_corrections':['path normalization','evidence formatting','run bookkeeping']})
          save(run_dir/'ENVIRONMENT.json',{'run_id':run_id,'status':'FINAL','operating_system':platform.platform(),'hardware':{},'software':['Python '+platform.python_version(),'git'],'python':sys.version,'imports':['hashlib','json','pathlib','subprocess','shutil'],'commands':['nine-branch discovery','exact commit checkout','python validation/validate_repo.py','python tools/director.py doctor'],'network_policy':'GITHUB_EXACT_OBJECT_FETCH_ONLY','random_seeds':[],'hidden_defaults_audited':True})
          save(run_dir/'GATE_RESULTS.json',{'run_id':run_id,'overall':'PASS','gates':gates,'diagnostics':[{'name':'branches_inspected','value':len(discovery['branches'])},{'name':'tracked_files','value':len(lineage)},{'name':'admitted_assets','value':len(admitted)},{'name':'canonical_parents','value':0}],'score_rule':'mandatory gates componentwise; below 0.95 triggers analysis'})
          save(run_dir/'REPLAY_RECORD.json',{'run_id':run_id,'status':'COMPLETE','clean_checkout':True,'restart_check':True,'earliest_change_replay':True,'commands':['discover all branch heads','checkout b0f21d','hash all tracked files','copy/re-hash five objects','run historical validator'],'result':'PASS','artifact_hashes_match':True,'legacy_validator_returncode':validator.returncode})
          (run_dir/'INDEPENDENT_VERIFICATION.md').write_text(f'''# REC-040 Independent Verification

Nine branch heads were independently discovered. Seven point to `{commit}` and two to the later lineage. A fresh exact checkout of `{commit}` produced {len(lineage)} tracked-file hashes and five byte-identical admitted source objects. Historical state/PASS labels were never trusted. The stale validator returned {validator.returncode}; that failure is preserved rather than hidden.

**Verdict: PASS.** Exact source recovery is valid at limited scope only.
''',encoding='utf-8')
          (run_dir/'CLOSEOUT.md').write_text(f'''# REC-040 Closeout

## Result

**PASS** — all nine 2-RFC branch heads were inspected, the packet-declared `{commit}` lineage was verified, and five substantive Module L objects were recovered at source-only scope.

## Scientific objects produced

- `recovery/LINEAGE_CROSSWALK.json`
- `recovery/ADMITTED_ASSET_MANIFEST.json`
- `recovery/QUARANTINE.md`
- five byte-identical objects under `recovery/admitted/2-RFC/{commit}/`

## Componentwise gates

All four gates PASS: exact commit/file hashes; no old PASS auto-promoted; no observational-target contamination; replay evidence.

## Preserved disagreement

The exact historical commit contains substantive Module L prose, theorem, verification, handoff, and export objects. Later branch heads contain incomplete or placeholder Module L material. The exact bytes and chronology are preserved; no old completion state is promoted.

## Strongest supported claim

Five repaired Module L objects are recoverable as exact source material at declared first-pass scope.

## Strongest unsupported claim

REC-040 does not establish Module L physical execution, a generated stellar universe, final K-L-M convergence, universe completion, or empirical validity.

## Exact next child

`FRONTIER-050 — Identify the First Unexecuted Physical Bridge`, only after this commit is verified and REC-040 is formally advanced.
''',encoding='utf-8')
          outputs=[]
          for p in [root/'recovery/LINEAGE_CROSSWALK.json',root/'recovery/ADMITTED_ASSET_MANIFEST.json',root/'recovery/QUARANTINE.md',run_dir/'GATE_RESULTS.json',run_dir/'INDEPENDENT_VERIFICATION.md',run_dir/'REPLAY_RECORD.json',run_dir/'CLOSEOUT.md']+[root/a['stored_path'] for a in admitted]:
              outputs.append({'path':str(p),'sha256':sha(p),'bytes':p.stat().st_size})
          tree=hashlib.sha256('\n'.join(f"{x['path']}\0{x['sha256']}\0{x['bytes']}" for x in outputs).encode()).hexdigest()
          save(run_dir/'GENERATED_OUTPUT_MANIFEST.json',{'run_id':run_id,'status':'FINAL','finalized_utc':now,'outputs':outputs,'tree_sha256':tree,'note':'Manifest excludes itself.'})
          PY
          rm -rf _2rfc_exact
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
          python tools/rfc.py context
      - name: Commit REC-040 evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recovery memory STATE.json
          find runs -maxdepth 1 -type d -name 'REC-040-*' -print0 | xargs -0 -r git add --
          git commit -m 'Recover verified RFC assets without inheriting failures'
          git pull --rebase origin agent/rec-040-execution
          git push origin agent/rec-040-execution
