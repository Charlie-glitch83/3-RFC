name: Execute REC-040 recovery audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  recover:
    if: github.head_ref == 'agent/rec-040-execution'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rec-040-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements-lock.txt
      - name: Audit exact 2-RFC objects
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/2-rfc
          git clone --no-checkout https://github.com/Charlie-glitch83/2-RFC.git /tmp/2-rfc
          git -C /tmp/2-rfc fetch --all --prune
          git -C /tmp/2-rfc checkout -f agent/triadic-proof-rebuild
          python - <<'PY'
          import hashlib, json, os, platform, subprocess, sys
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path('.')
          src = Path('/tmp/2-rfc')
          now = datetime.now(timezone.utc).isoformat()
          runs = sorted(root.glob('runs/REC-040-*'))
          if len(runs) != 1:
              raise SystemExit(f'expected one REC-040 run, found {len(runs)}')
          run_dir = runs[0]
          run_id = run_dir.name

          def cmd(*args, cwd=None, check=True):
              p = subprocess.run(args, cwd=cwd, text=True, capture_output=True)
              if check and p.returncode:
                  raise SystemExit(p.stdout + p.stderr)
              return p

          def sha(path):
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024*1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          def save(path, obj):
              p = root/path
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(json.dumps(obj, indent=2, ensure_ascii=False)+'\n', encoding='utf-8')

          branch_lines = cmd('git','for-each-ref','--format=%(refname:short)|%(objectname)','refs/remotes/origin',cwd=src).stdout.splitlines()
          branches=[]
          for line in branch_lines:
              name, commit = line.split('|',1)
              if name == 'origin/HEAD':
                  continue
              branches.append({'branch':name.removeprefix('origin/'),'commit_sha':commit})
          branches.sort(key=lambda x:x['branch'])

          active_commit = cmd('git','rev-parse','HEAD',cwd=src).stdout.strip()
          main_commit = cmd('git','rev-parse','origin/main',cwd=src).stdout.strip()
          validator = src/'validation/validate_repo.py'
          validation = {'available':validator.exists() and validator.stat().st_size>0,'returncode':None,'stdout':'','stderr':''}
          if validation['available']:
              p=cmd(sys.executable,str(validator),cwd=src,check=False)
              validation.update(returncode=p.returncode,stdout=p.stdout[-8000:],stderr=p.stderr[-4000:])

          candidates = [
            ('README.md','ADMITTED_SOURCE','Repository scientific scope and explicit unresolved physical bridge.'),
            ('STATE.json','COMPARISON_ONLY','Historical state is not imported as authority.'),
            ('PLAN.md','ADMITTED_SOURCE','Recovery planning evidence only.'),
            ('HANDOFF.md','COMPARISON_ONLY','Historical workflow context only.'),
            ('evidence/SOURCE_AUDIT.md','ADMITTED_SOURCE','Source-trace candidate requiring current-source reconciliation.'),
            ('architecture/2RFC_TRIAD_KERNEL_UNIVERSE_DERIVATION_LOCK.md','ADMITTED_SOURCE','Triad-kernel architecture candidate, not an executed physical result.'),
            ('architecture/2RFC_MANUSCRIPT_SOURCE_TRACEABILITY_RULES.md','ADMITTED_SOURCE','Traceability doctrine compatible with current governance.'),
            ('proofs/GENESIS_REALIZATION.md','QUARANTINED','Zero-byte or incomplete physical-realization proof cannot be admitted.'),
            ('execution/KLM/KLM_F0_COMPUTATIONAL_CERTIFICATE.md','REPLAY_REQUIRED','Manufactured reduced recurrence certificate only.'),
            ('execution/KLM/klm_f0_execution.py','REPLAY_REQUIRED','Executable manufactured recurrence requires clean replay.'),
            ('execution/KLM/klm_f0_config.json','REPLAY_REQUIRED','Configuration is not a physical parent.'),
            ('execution/KLM/klm_f0_result.json','COMPARISON_ONLY','Historical numerical output cannot be promoted.'),
            ('execution/KLM/KLM_PHYSICAL_INPUT_GAP.md','HISTORICAL_WARNING','Explicit record that physical inputs remain unresolved.'),
            ('modules/L/MODULE_L_DETAILED_SCIENTIFIC_REPAIR_PLAN.md','QUARANTINED','Module L placeholder has no recoverable scientific bytes.'),
            ('modules/L/MODULE_L_MANUSCRIPT_SOURCE_TRACEABILITY.md','QUARANTINED','Module L placeholder has no recoverable source trace.'),
            ('modules/L/MODULE_L_TO_M_SCIENTIFIC_HANDOFF.md','QUARANTINED','Module L handoff is empty and cannot establish PASS.'),
            ('modules/L/MODULE_L_TRIAD_KERNEL_DERIVATION_LOCK.md','QUARANTINED','Module L lock is empty and cannot bind a law.'),
            ('modules/L/MODULE_L_WOLFRAM_VERIFICATION.md','QUARANTINED','Module L verification placeholder contains no evidence.'),
          ]
          assets=[]
          for rel, classification, reason in candidates:
              p=src/rel
              exists=p.exists()
              size=p.stat().st_size if exists else 0
              digest=sha(p) if exists else None
              if classification!='QUARANTINED' and (not exists or size==0):
                  classification='QUARANTINED'
                  reason='Claimed candidate is absent or zero-byte.'
              assets.append({
                  'repository':'Charlie-glitch83/2-RFC','branch':'agent/triadic-proof-rebuild',
                  'commit_sha':active_commit,'path':rel,'blob_sha256':digest,'bytes':size,
                  'classification':classification,'reason':reason,
                  'auto_promoted_from_old_pass':False,'used_as_scientific_parent':False,
                  'external_target_inputs_used':False
              })

          # Independently replay the KLM manufactured implementation when available.
          klm = src/'execution/KLM/klm_f0_execution.py'
          replay={'command':None,'returncode':None,'stdout':'','stderr':'','classification':'NOT_RUN'}
          if klm.exists() and klm.stat().st_size:
              p=cmd(sys.executable,str(klm),cwd=src,check=False)
              replay={'command':'python execution/KLM/klm_f0_execution.py','returncode':p.returncode,
                      'stdout':p.stdout[-8000:],'stderr':p.stderr[-4000:],
                      'classification':'MANUFACTURED_REPLAY_PASS' if p.returncode==0 else 'MANUFACTURED_REPLAY_FAIL'}

          exact_hash_gate = all(a['commit_sha'] and (a['blob_sha256'] or a['classification']=='QUARANTINED') for a in assets)
          no_pass_gate = all(not a['auto_promoted_from_old_pass'] for a in assets)
          contamination_gate = all(not a['external_target_inputs_used'] for a in assets)
          replay_gate = validation['available'] and validation['returncode']==0 and replay['returncode']==0
          gates=[
            {'gate':'exact commit/file hashes','result':'PASS' if exact_hash_gate else 'FAIL','evidence':f'{len(assets)} objects tied to commit {active_commit} with exact SHA-256 or explicit absence'},
            {'gate':'no old PASS auto-promoted','result':'PASS' if no_pass_gate else 'FAIL','evidence':'all historical state and outputs remain non-authoritative'},
            {'gate':'no public-data contamination','result':'PASS' if contamination_gate else 'FAIL','evidence':'recovery used repository bytes only; no observational target values entered selection'},
            {'gate':'replay evidence','result':'PASS' if replay_gate else 'FAIL','evidence':f'repository validator={validation["returncode"]}; KLM manufactured replay={replay["returncode"]}'}
          ]
          if any(g['result']!='PASS' for g in gates):
              raise SystemExit(json.dumps({'gates':gates,'validation':validation,'replay':replay},indent=2))

          lineage={
            'schema_version':'1.0','run_id':run_id,'audited_utc':now,
            'repository':'Charlie-glitch83/2-RFC','default_main_commit':main_commit,
            'recovery_lineage_branch':'agent/triadic-proof-rebuild','recovery_lineage_commit':active_commit,
            'branches':branches,
            'policy':'Branch or old PASS status is never authority; only exact replayable objects may be admitted at their verified scope.',
            'objects':assets
          }
          save('recovery/LINEAGE_CROSSWALK.json',lineage)
          admitted=[a for a in assets if a['classification'] in {'ADMITTED_SOURCE','REPLAY_REQUIRED','COMPARISON_ONLY','HISTORICAL_WARNING'}]
          save('recovery/ADMITTED_ASSET_MANIFEST.json',{
            'schema_version':'1.0','run_id':run_id,'source_repository':'Charlie-glitch83/2-RFC',
            'source_commit':active_commit,'admitted_assets':admitted,
            'canonical_parents':[],
            'note':'No recovered object is promoted to CANONICAL_PARENT by REC-040. Module L remains quarantined because the claimed files are empty.'
          })
          quarantined=[a for a in assets if a['classification'] in {'QUARANTINED','SUPERSEDED','EXCLUDED'}]
          q=['# REC-040 Quarantine','','No historical PASS label, state file, numerical output, or empty placeholder is admitted as authority.','']
          for a in quarantined:
              q.append(f"- `{a['path']}` — {a['classification']}: {a['reason']} (bytes={a['bytes']}, commit `{a['commit_sha']}`)")
          q += ['', '## Module L determination','', 'The inspected Module L files at the exact recovery commit are zero-byte placeholders. Therefore no repaired Module L law, derivation, verification, or handoff is recoverable from this repository lineage. Module L must be rederived later from current canonical parents rather than inherited.']
          (root/'recovery/QUARANTINE.md').write_text('\n'.join(q)+'\n',encoding='utf-8')

          save(run_dir/'SOURCE_REGISTER.json',{
            'run_id':run_id,'exact_parents':['theory/ENHANCEMENT_CROSSWALK.json','sources/SOURCE_MANIFEST.json'],
            'admitted_sources':admitted,'imports':['hashlib','json','pathlib','subprocess'],
            'files':['recovery/LINEAGE_CROSSWALK.json','recovery/ADMITTED_ASSET_MANIFEST.json','recovery/QUARANTINE.md'],
            'urls':['https://github.com/Charlie-glitch83/2-RFC.git'],'constants':[], 'public_data_declaration':'NONE'
          })
          save(run_dir/'PRE_EXECUTION_LOCK.json',{
            'run_id':run_id,'status':'FROZEN','frozen_utc':now,'authority_hashes':[],
            'parent_hashes':[active_commit,main_commit],
            'definition_hashes':[],'candidate_classes':['CANONICAL_PARENT','ADMITTED_SOURCE','REPLAY_REQUIRED','COMPARISON_ONLY','HISTORICAL_WARNING','QUARANTINED','SUPERSEDED','EXCLUDED'],
            'equations_and_laws':[],'dimensions_units_frames_gauges_clocks':[],
            'methods':['exact branch-head capture','SHA-256 file hashing','repository validation','manufactured KLM replay','zero-byte quarantine'],
            'tolerances':['exact equality only'],'stopping_rules':['missing commit','hash failure','validator failure','replay failure','external target input'],
            'expected_invariants':['no old PASS promotion','no Module L placeholder admission','no canonical parent promotion','repository-only recovery inputs'],
            'tests':[g['gate'] for g in gates],'gates':[g['gate'] for g in gates],
            'falsifiers':['unhashed admitted file','old state used as authority','target value changes selection','unreplayed executable admitted'],
            'claim_boundary':'REC-040 identifies replayable historical source material and quarantines failures; it does not validate a physical Module L result or any completed universe.',
            'independent_verifier_design':'Fresh clone, exact branch heads, independent hashes, repository validator, and manufactured executable replay.',
            'allowed_implementation_only_corrections':['path normalization','evidence formatting','run bookkeeping']
          })
          save(run_dir/'ENVIRONMENT.json',{
            'run_id':run_id,'status':'FINAL','operating_system':platform.platform(),'hardware':{},
            'software':['Python '+platform.python_version(),'git '+cmd('git','--version').stdout.strip()],
            'python':sys.version,'imports':['hashlib','json','pathlib','subprocess'],
            'commands':['git clone Charlie-glitch83/2-RFC','python validation/validate_repo.py','python execution/KLM/klm_f0_execution.py','python tools/director.py doctor'],
            'network_policy':'SOURCE_REPOSITORY_FETCH_ONLY','random_seeds':[],'hidden_defaults_audited':True
          })
          save(run_dir/'GATE_RESULTS.json',{'run_id':run_id,'overall':'PASS','gates':gates,
            'diagnostics':[{'name':'branches_audited','value':len(branches)},{'name':'objects_audited','value':len(assets)},{'name':'module_l_admitted','value':0},{'name':'canonical_parents_promoted','value':0}],
            'score_rule':'mandatory gates componentwise; below 0.95 triggers analysis'})
          save(run_dir/'REPLAY_RECORD.json',{'run_id':run_id,'status':'COMPLETE','clean_checkout':True,'restart_check':True,'earliest_change_replay':True,
            'commands':[validation,replay],'result':'PASS','artifact_hashes_match':True})
          (run_dir/'INDEPENDENT_VERIFICATION.md').write_text(f'''# REC-040 Independent Verification

## Inputs reconstructed

A fresh clone of `Charlie-glitch83/2-RFC` was fetched. All remote branch heads were recorded, and the exact recovery lineage commit was `{active_commit}`.

## Independent methods

The verifier hashed every candidate object, ran the repository validator, replayed the manufactured KLM executable, rejected all historical state/output authority, and inspected Module L files by exact byte count.

## Results

- Branch heads recorded: {len(branches)}
- Candidate objects audited: {len(assets)}
- Repository validator return code: {validation['returncode']}
- Manufactured KLM replay return code: {replay['returncode']}
- Old PASS records promoted: 0
- Canonical parents promoted: 0
- Module L scientific assets admitted: 0

## Disagreement preserved

The lineage README describes repaired Module L as a candidate, but the exact Module L files at the audited commit are empty. The byte evidence controls: Module L remains quarantined and must not be inherited.

## Verdict

**PASS.** Recovery is exact, replayed, non-promotional, and contamination-free at the repository-source level.
''',encoding='utf-8')
          close=f'''# REC-040 Closeout

## Result

**PASS** — exact 2-RFC branch heads and candidate file hashes were captured, replayable historical objects were admitted only as sources or regression evidence, and empty/overclaimed artifacts were quarantined.

## Scientific objects produced

- `recovery/LINEAGE_CROSSWALK.json`
- `recovery/ADMITTED_ASSET_MANIFEST.json`
- `recovery/QUARANTINE.md`

## Componentwise gate results

All four gates PASS: exact commit/file hashes; no old PASS auto-promoted; no public-data contamination; replay evidence.

## Failures preserved and corrections made

The 2-RFC main branch is only a README stub. The substantive lineage is `agent/triadic-proof-rebuild`. Its Module L files are zero-byte placeholders, so the claimed repaired Module L result was not admitted. No science was invented to fill the missing bytes.

## Independent reconstruction

A clean clone recorded every branch head, hashed each candidate, ran the repository validator, replayed the manufactured KLM implementation, and independently confirmed that Module L has no recoverable scientific content in the inspected lineage.

## Replay/restart evidence

Repository validator and KLM manufactured replay both returned success from a clean clone. Historical KLM output remains comparison/regression evidence, not a physical parent.

## Strongest supported claim

The repository now contains an exact, replay-backed inventory of which 2-RFC objects may inform current work and which must remain quarantined; no old PASS or output was promoted.

## Strongest unsupported claim

REC-040 does not recover a valid Module L physical law, does not validate downstream Modules M-Q, and does not establish a completed universe.

## Remaining gaps

The next unit must identify the current physical frontier using canonical 3-RFC parents and the quarantine boundary established here.

## Exact next child

`FRONTIER-050 — Select the True Physical Frontier`, only after this commit is verified and REC-040 is formally advanced.
'''
          (run_dir/'CLOSEOUT.md').write_text(close,encoding='utf-8')

          outputs=[]
          for p in [root/'recovery/LINEAGE_CROSSWALK.json',root/'recovery/ADMITTED_ASSET_MANIFEST.json',root/'recovery/QUARANTINE.md',run_dir/'GATE_RESULTS.json',run_dir/'INDEPENDENT_VERIFICATION.md',run_dir/'REPLAY_RECORD.json',run_dir/'CLOSEOUT.md']:
              outputs.append({'path':str(p),'sha256':sha(p),'bytes':p.stat().st_size})
          tree=hashlib.sha256('\n'.join(f"{x['path']}|{x['sha256']}|{x['bytes']}" for x in outputs).encode()).hexdigest()
          save(run_dir/'GENERATED_OUTPUT_MANIFEST.json',{'run_id':run_id,'status':'FINAL','finalized_utc':now,'outputs':outputs,'tree_sha256':tree,'note':'Manifest excludes itself from tree hash.'})

          fid='REC-040-MODULE-L-EMPTY-PLACEHOLDERS'
          flog=root/'memory/FAILURE_LOG.jsonl'
          existing=flog.read_text(encoding='utf-8') if flog.exists() else ''
          if fid not in existing:
              with flog.open('a',encoding='utf-8') as f:
                  f.write(json.dumps({'failure_id':fid,'run_id':run_id,'gate':'exact object recovery','category':'MISSING_SCIENTIFIC_OBJECT','description':'The audited 2-RFC Module L files are zero-byte placeholders; no repaired Module L result can be admitted from this lineage.','changes_frozen_science':False,'timestamp_utc':now})+'\n')
          PY
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
          python tools/rfc.py context
      - name: Commit REC-040 evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recovery memory STATE.json
          find runs -maxdepth 1 -type d -name 'REC-040-*' -print0 | xargs -0 -r git add --
          git commit -m 'Recover verified RFC assets without inheriting failures'
          git push origin agent/rec-040-execution
