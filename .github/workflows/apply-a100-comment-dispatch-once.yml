name: Resume F-155 from owner comment once

on:
  issue_comment:
    types: [created]

permissions:
  contents: write

jobs:
  resume-f155:
    if: >-
      github.event.issue.number == 74 &&
      github.event.issue.pull_request &&
      github.event.comment.user.login == 'Charlie-glitch83' &&
      github.event.comment.body == '/resume-f155-frozen-replay-20260808'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Resume exact governed F155 sequence from frozen checkpoint
        shell: bash
        run: bash tools/resume_f155_governed.sh
