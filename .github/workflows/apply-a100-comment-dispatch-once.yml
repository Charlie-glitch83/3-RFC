name: Execute E-145 from owner comment once

on:
  issue_comment:
    types: [created]

permissions:
  contents: write

jobs:
  execute-e145:
    if: >-
      github.event.issue.number == 74 &&
      github.event.issue.pull_request &&
      github.event.comment.user.login == 'Charlie-glitch83' &&
      github.event.comment.body == '/execute-e145-superseding-replay-20260808'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Execute exact governed E145 sequence
        shell: bash
        run: bash tools/run_e145_governed.sh
