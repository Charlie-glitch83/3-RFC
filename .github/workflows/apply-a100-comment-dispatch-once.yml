name: Freeze HU-170 pre-execution lock

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  freeze-hu170:
    if: github.event.pull_request.number == 74
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Freeze exact HU170 derivation and bindings before execution
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-lock.txt
          python tools/hu170_parent_bound.py prepare
          python tools/rfc.py doctor
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Freeze HU-170 pre-execution science and bindings'
          git push origin HEAD:agent/frontier-050-execution
          printf 'HU170_FREEZE_COMMIT=%s\n' "$(git rev-parse HEAD)"
