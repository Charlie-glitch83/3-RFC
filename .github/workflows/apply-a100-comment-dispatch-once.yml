name: Freeze G-160 from owner comment once

on:
  issue_comment:
    types: [created]

permissions:
  contents: write

jobs:
  freeze-g160:
    if: >-
      github.event.issue.number == 74 &&
      github.event.issue.pull_request &&
      github.event.comment.user.login == 'Charlie-glitch83' &&
      github.event.comment.body == '/freeze-g160-preexecution-20260808'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Freeze exact G160 pre-execution state
        shell: bash
        run: bash tools/run_g160_prepare.sh
