name: Advance F-155 after verified closeout

on:
  issue_comment:
    types: [created]

permissions:
  contents: write

jobs:
  advance-f155:
    if: >-
      github.event.issue.number == 74 &&
      github.event.issue.pull_request &&
      github.event.comment.user.login == 'Charlie-glitch83' &&
      github.event.comment.body == '/advance-f155-after-verified-9df3cdd1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements-lock.txt
      - name: Record verified F155 commit and activate sole child
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='9df3cdd1b262770c4be1e50f5d4a8bbc77adb1d6'
          BRANCH='agent/frontier-050-execution'
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          python tools/rfc.py record-commit "$EXPECTED" --branch "$BRANCH" --note 'Externally fetched and verified exact F-155 closeout SHA and diff; output contract, clean replay, independent reconstruction, gates and H_F_to_G_v2 manifest verified before child activation.'
          python tools/rfc.py advance --task F-155 --result PASS --evidence modules/F/runs/F-155-20260808T165152Z/CLOSEOUT.md
          python tools/rfc.py context
          python tools/rfc.py doctor
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add STATE.json WORK_QUEUE.json memory/CURRENT_CONTEXT.md memory/DECISION_LOG.jsonl
          git commit -m 'Advance F-155 to G-160 after verified closeout'
          git push origin HEAD:"$BRANCH"
