name: Start governed HI-190 from repository README

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  start-hi190:
    if: github.event.pull_request.number == 74
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Execute exact README startup for sole active HI-190
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-lock.txt
          python - <<'PY'
          import json
          s=json.load(open('STATE.json'))
          assert s['active_work_unit']=='HI-190',s
          assert s['current_module']=='HI',s
          assert s['current_run'] is None,s
          assert s['modules']['I']['evidence_state']=='FROZEN',s['modules']['I']
          assert s['modules']['HU']['evidence_state']=='FROZEN',s['modules']['HU']
          PY
          bash bootstrap.sh
          bash tools/start_work.sh
          python tools/rfc.py doctor
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
          python tools/rfc.py context
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Start governed HI-190 from repository README'
          git push origin HEAD:agent/frontier-050-execution
          printf 'HI190_START_COMMIT=%s\n' "$(git rev-parse HEAD)"
