name: Execute G-160 from owner comment once

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  execute-g160:
    if: >-
      github.event.issue.number == 74 &&
      github.event.issue.pull_request &&
      github.event.comment.user.login == 'Charlie-glitch83' &&
      github.event.comment.body == '/execute-g160-frozen-20260808'
    runs-on: ubuntu-latest
    steps:
      - name: Publish Actions run ID
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 74 --repo "$GITHUB_REPOSITORY" --body "/g160-actions-run-${GITHUB_RUN_ID}"
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Execute exact frozen G160 packet
        shell: bash
        run: bash tools/run_g160_governed.sh
