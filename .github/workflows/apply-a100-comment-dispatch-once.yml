name: Start E-145 from owner comment once

on:
  issue_comment:
    types: [created]

permissions:
  contents: write

jobs:
  start-e145:
    if: >-
      github.event.issue.number == 74 &&
      github.event.issue.pull_request &&
      github.event.comment.user.login == 'Charlie-glitch83' &&
      github.event.comment.body == '/start-e145-superseding-replay-20260808'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements-lock.txt
      - name: Execute exact repository startup protocol for E145
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          s=json.load(open('STATE.json'))
          assert s['active_work_unit']=='E-145' and s['current_module']=='E' and s['current_run'] is None,s
          assert s['modules']['D']['evidence_state']=='FROZEN' and s['modules']['D']['fidelity']=='PRODUCTION',s['modules']['D']
          PY
          bash bootstrap.sh
          bash tools/start_work.sh
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
          python tools/rfc.py context
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.load(open('STATE.json')); rid=s['current_run']
          assert s['active_work_unit']=='E-145' and s['current_module']=='E' and rid and rid.startswith('E-145-'),s
          p=Path('work_packets/ACTIVE_WORK_PACKET.md').read_text(); assert '# ACTIVE WORK PACKET — E-145' in p
          print(rid)
          PY
      - name: Commit governed E145 startup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add STATE.json memory/RUN_INDEX.json memory/CURRENT_CONTEXT.md work_packets/ACTIVE_WORK_PACKET.md modules/E
          git commit -m 'Start E-145 superseding nucleosynthesis replay'
          git pull --rebase origin agent/frontier-050-execution
          git push origin HEAD:agent/frontier-050-execution
