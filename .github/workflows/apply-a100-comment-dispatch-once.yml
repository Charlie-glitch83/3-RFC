name: Start I-180 from root README exactly

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  start-i180:
    if: github.event.pull_request.number == 74
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Execute root README startup exactly
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-lock.txt
          bash bootstrap.sh
          bash tools/start_work.sh
          python - <<'PY'
          import json
          s=json.load(open('STATE.json'))
          assert s['active_work_unit']=='I-180', s['active_work_unit']
          assert s['current_module']=='I', s['current_module']
          assert s['current_run'], s
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Start I-180 governed work packet'
          git push origin HEAD:agent/frontier-050-execution
          printf 'I180_START_COMMIT=%s\n' "$(git rev-parse HEAD)"
