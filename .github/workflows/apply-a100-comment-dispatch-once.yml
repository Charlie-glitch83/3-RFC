name: Execute HU-170 governed packet

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  execute-hu170:
    if: github.event.pull_request.number == 74
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Execute exact frozen HU170 packet
        shell: bash
        run: bash tools/run_hu170_governed.sh
