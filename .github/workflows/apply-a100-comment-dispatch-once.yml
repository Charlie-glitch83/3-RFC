name: Repair HI-190 Wolfram implementation defect

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  repair-hi190-wolfram:
    if: github.event.pull_request.number == 74
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Preserve failure and apply implementation-only symbol repair
        shell: bash
        run: |
          set -euo pipefail
          EXPECT='9b9d1efa9c44bb9f6aa07bf83e2afc2ef36e85b2'
          test "$(git rev-parse HEAD)" = "$EXPECT"
          python -m pip install --disable-pip-version-check -r requirements-lock.txt
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from datetime import datetime, timezone
          RUN='HI-190-20260809T221124Z'; R=Path('modules/HI/runs')/RUN
          recipe=Path('recipes/HI/wolfram/HI-WL-002.wl')
          runinput=R/'wolfram/HI-WL-002/input.wl'
          original=recipe.read_text()
          assert original==runinput.read_text()
          assert 'C = {{1, r}, {r, 1}};' in original and 'T.C.Transpose[T]' in original
          corrected=original.replace('C = {{1, r}, {r, 1}};', 'cov = {{1, r}, {r, 1}};').replace('T.C.Transpose[T]', 'T.cov.Transpose[T]')
          assert corrected!=original
          failed='''Symbol::undefined2: Warning: Global symbols "T, Cp, T, T, Cp, Cp, Cp" are undefined.\nSet::wrsym: Symbol C is Protected.\nGeneral::messages: Messages were generated which may indicate errors.\n\nOut[1]= "<|\\"call\\" -> \\"HI-WL-002\\", \\"propagatedCovariance\\" -> \\"{{a, b}, {c, d}} . C . {{a, c}, {b, d}}\\", \\"symmetric\\" -> False|>"\n'''
          failpath=R/'wolfram/HI-WL-002/FAILED_ATTEMPT_001.txt'
          failpath.write_text(failed)
          recipe.write_text(corrected); runinput.write_text(corrected)
          def htxt(s): return hashlib.sha256(s.encode()).hexdigest()
          patch={
            'schema_version':'1.0','run_id':RUN,'patch_id':'HI190-WL002-PROTECTED-C-SYMBOL',
            'classification':'IMPLEMENTATION_ONLY_WOLFRAM_SYMBOL_REPAIR',
            'timestamp_utc':datetime.now(timezone.utc).isoformat(),
            'failed_input_sha256':htxt(original),'corrected_input_sha256':htxt(corrected),
            'defect':'HI-WL-002 assigns a covariance matrix to Wolfram protected symbol C; Set::wrsym prevents assignment and the manufactured symmetry gate returns False.',
            'correction':'Rename only the local covariance symbol C to cov in the assignment and the same matrix product T.cov.Transpose[T].',
            'failed_output_path':str(failpath),
            'science_changed':False,'parents_changed':False,'sources_changed':False,'law_changed':False,
            'branch_rule_changed':False,'test_semantics_changed':False,'test_implementation_changed':True,
            'thresholds_changed':False,'gates_changed':False,'falsifiers_changed':False,'claim_boundary_changed':False,
            'primary_execution_before_patch':False,'full_frozen_matrix_rerun_required':True,
            'authority':'config/WOLFRAM_CALLS.json failure_policy + frozen PRE_EXECUTION_LOCK allowed implementation-only corrections'
          }
          (R/'IMPLEMENTATION_PATCH_RECORD.json').write_text(json.dumps(patch,indent=2)+'\n')
          with (R/'FAILURES.jsonl').open('a') as f:
            f.write(json.dumps({'failure_id':'HI190-WL002-PROTECTED-C-SYMBOL','timestamp_utc':patch['timestamp_utc'],'stage':'PRE_PRIMARY_WOLFRAM','call':'HI-WL-002','result':'FAIL','cause':'Wolfram protected symbol C blocked covariance assignment','evidence':str(failpath),'disposition':'IMPLEMENTATION_ONLY_REPAIR_AND_FULL_FROZEN_MATRIX_RERUN'})+'\n')
          lock=json.load(open(R/'PRE_EXECUTION_LOCK.json'))
          assert lock['status']=='FROZEN' and lock['frozen_before_primary_execution'] is True
          assert not (R/'primary').exists()
          assert patch['law_changed'] is False and patch['parents_changed'] is False
          PY
          python tools/rfc.py doctor
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recipes/HI/wolfram/HI-WL-002.wl modules/HI/runs/HI-190-20260809T221124Z/wolfram/HI-WL-002/input.wl modules/HI/runs/HI-190-20260809T221124Z/wolfram/HI-WL-002/FAILED_ATTEMPT_001.txt modules/HI/runs/HI-190-20260809T221124Z/IMPLEMENTATION_PATCH_RECORD.json modules/HI/runs/HI-190-20260809T221124Z/FAILURES.jsonl
          git commit -m 'Repair HI-190 Wolfram protected-symbol implementation defect'
          git push origin HEAD:agent/frontier-050-execution
          printf 'HI190_WL_REPAIR_COMMIT=%s\n' "$(git rev-parse HEAD)"
