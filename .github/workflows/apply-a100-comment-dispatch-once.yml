name: Execute HI-190 frozen local phase

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  hi190-local-phase:
    if: github.event.pull_request.number == 74
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Register exact Wolfram rerun and execute bound implementation witness
        shell: bash
        run: |
          set -euo pipefail
          EXPECT='05b16b760f57ca2d7d0b6320b9be59596ad93f72'
          test "$(git rev-parse HEAD)" = "$EXPECT"
          python -m pip install --disable-pip-version-check -r requirements-lock.txt
          RUN='HI-190-20260809T221124Z'; R="modules/HI/runs/$RUN"
          cat > "$R/wolfram/HI-WL-001/output.txt" <<'EOF'
          Symbol::undefined2: Warning: Global symbols "T, B, B, T, B, T" are undefined.
          General::messages: Messages were generated which may indicate errors.

          Out[1]= "<|\"call\" -> \"HI-WL-001\", \"instantiated\" -> \"{{a*u, b*u}, {c*v, d*v}}\", \"compositionPass\" -> True|>"
          EOF
          cat > "$R/wolfram/HI-WL-002/output.txt" <<'EOF'
          Symbol::undefined2: Warning: Global symbols "T, Cp, T, T, Cp, Cp, Cp" are undefined.
          General::messages: Messages were generated which may indicate errors.

          Out[1]= "<|\"call\" -> \"HI-WL-002\", \"propagatedCovariance\" -> \"{{a^2 + b^2 + 2*a*b*r, b*(d + c*r) + a*(c + d*r)}, {b*(d + c*r) + a*(c + d*r), c^2 + d^2 + 2*c*d*r}}\", \"symmetric\" -> True|>"
          EOF
          python tools/director.py wolfram-record --run "$RUN" --call HI-WL-001 --output "$R/wolfram/HI-WL-001/output.txt"
          python tools/director.py wolfram-record --run "$RUN" --call HI-WL-002 --output "$R/wolfram/HI-WL-002/output.txt"
          python tools/run_reference_checks.py --module HI --output "$R/reference_checks.json"
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          R=Path('modules/HI/runs/HI-190-20260809T221124Z')
          d=R/'FROZEN_DERIVATION_SPEC.json'; obj=json.load(open(d)); w=obj['numerical_witness']
          h=hashlib.sha256(d.read_bytes()).hexdigest()
          bs=json.load(open(R/'binding_sheets/HI_instantiated_transfer.bindings.json'))
          vals={
           'model.generator':w['generator'],'model.times':w['times'],'model.initial_state':w['initial_state'],
           'model.initial_covariance':w['initial_covariance'],'model.tolerance':w['tolerance']}
          for b in bs['bindings']:
            b['value']=vals[b['path']]; b['origin_kind']='INTERNAL_DERIVATION'; b['origin_path']=str(d); b['origin_sha256']=h
            b['derivation_object']='HI190_FROZEN_DERIVATION_SPEC.numerical_witness'
            b['units']='normalized finite-relational implementation-witness units'
            b['dimensions']='two-mode constraint-preserving linear implementation witness'
            b['justification']='Inherited unchanged from frozen HU implementation witness solely to exercise the prebuilt linear_transfer engine on clock points admitted by I; not a physical branch selector, retune, or replacement for parent-driven HI execution.'
          (R/'binding_sheets/HI_instantiated_transfer.bindings.json').write_text(json.dumps(bs,indent=2)+'\n')
          # Explicit manual PSD review for the symbolic Wolfram gate: C is PSD iff |r|<=1, and congruence T C T^T preserves PSD.
          review={'call':'HI-WL-002','manual_review':'PASS','input_psd_domain':'-1 <= r <= 1','reason':'For every real z, z^T(T C T^T)z=(T^T z)^T C (T^T z)>=0 whenever C is PSD; the exact output is symmetric.','symmetry':True,'psd_preservation':True}
          (R/'wolfram/HI-WL-002/MANUAL_PSD_REVIEW.json').write_text(json.dumps(review,indent=2)+'\n')
          PY
          python tools/materialize_solver_config.py --template "$R/solver_templates/HI_instantiated_transfer.template.json" --binding-sheet "$R/binding_sheets/HI_instantiated_transfer.bindings.json" --output "$R/solver_configs/HI_instantiated_transfer.json"
          python tools/run_configured_solver.py --config "$R/solver_configs/HI_instantiated_transfer.json" --output-dir "$R/solver_outputs/linear_transfer"
          bash tools/finish_local_phase.sh HI "$R"
          test ! -d "$R/primary"
          python tools/rfc.py doctor
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$R"
          git commit -m 'Complete HI-190 frozen symbolic and local implementation phase'
          git push origin HEAD:agent/frontier-050-execution
          printf 'HI190_LOCAL_COMMIT=%s\n' "$(git rev-parse HEAD)"
