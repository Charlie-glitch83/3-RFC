name: Freeze corrected versioned HI-190 before primary execution

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  freeze-hi190-v2:
    if: github.event.pull_request.number == 74
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Retarget locked executor and freeze corrected parent-compatible law
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-lock.txt
          OLD='HI-190-20260809T151108Z'
          NEW='HI-190-20260809T152136Z'
          python - <<'PY'
          import json
          from pathlib import Path
          OLD='HI-190-20260809T151108Z'; NEW='HI-190-20260809T152136Z'
          s=json.load(open('STATE.json'))
          assert s['active_work_unit']=='HI-190' and s['current_module']=='HI' and s['current_run']==NEW,s
          r=Path('modules/HI/runs')/NEW
          lock=json.load(open(r/'PRE_EXECUTION_LOCK.json'))
          assert lock['status']=='DRAFT',lock
          assert not (r/'primary').exists() or not any((r/'primary').iterdir()),'primary exists before corrected freeze'
          p=Path('tools/hi190_execute_locked.py'); txt=p.read_text()
          if OLD in txt:
              p.write_text(txt.replace(OLD,NEW))
          else:
              assert NEW in txt,(p,'executor not targeted to active run')
          f=Path('tools/hi190_freeze.py').read_text()
          assert "['current_run']" in f or NEW in f, 'freeze helper is not targeted to active versioned run'
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/hi190_execute_locked.py tools/hi190_freeze.py
          if ! git diff --cached --quiet; then
            git commit -m 'Retarget HI-190 governed helpers to superseding run'
            git pull --rebase origin agent/frontier-050-execution
            git push origin HEAD:agent/frontier-050-execution
          fi
          python tools/hi190_freeze.py
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.load(open('STATE.json')); r=Path('modules/HI/runs')/s['current_run']
          lock=json.load(open(r/'PRE_EXECUTION_LOCK.json')); spec=json.load(open(r/'FROZEN_DERIVATION_SPEC.json'))
          assert lock['status']=='FROZEN' and lock.get('frozen_before_primary_execution') is True
          law=spec['laws']['instantiation']
          assert 'typed fiber-product/association' in law and 'not multiplication by an invented background factor' in law
          assert not (r/'primary').exists() or not any((r/'primary').iterdir())
          print(json.dumps({'run':r.name,'status':'FROZEN_PARENT_EXACT'},indent=2))
          PY
          python tools/rfc.py doctor
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
          git add "modules/HI/runs/$NEW/PRE_EXECUTION_LOCK.json" "modules/HI/runs/$NEW/SOURCE_REGISTER.json" "modules/HI/runs/$NEW/FROZEN_DERIVATION_SPEC.json"
          git commit -m 'Freeze corrected HI-190 immutable parent composition before execution'
          git pull --rebase origin agent/frontier-050-execution
          git push origin HEAD:agent/frontier-050-execution
          printf 'HI190_V2_FREEZE_COMMIT=%s\n' "$(git rev-parse HEAD)"
