name: Execute corrected governed HI-190

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  execute-hi190:
    if: github.event.pull_request.number == 74
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Correct frozen-law references and execute complete HI-190 matrix
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-lock.txt
          RUN='HI-190-20260809T152136Z'; R="modules/HI/runs/$RUN"
          python - <<'PY'
          import json
          from pathlib import Path
          run='HI-190-20260809T152136Z'; r=Path('modules/HI/runs')/run; s=json.load(open('STATE.json'))
          assert s['active_work_unit']=='HI-190' and s['current_module']=='HI' and s['current_run']==run,s
          lock=json.load(open(r/'PRE_EXECUTION_LOCK.json')); spec=json.load(open(r/'FROZEN_DERIVATION_SPEC.json'))
          assert lock['status']=='FROZEN' and lock.get('frozen_before_primary_execution') is True
          assert 'typed fiber-product/association' in spec['laws']['instantiation']
          assert 'eta_b(t2)' not in json.dumps(spec) and 'eta_b(t2)' not in json.dumps(lock)
          assert not (r/'primary/HI_INSTANTIATED_TRANSFER_MINIMAL_SPINE.json').exists()
          p=Path('tools/hi190_execute_locked.py'); t=p.read_text()
          old=t
          t=t.replace("'instantiated_transfer_system':{'law':lock['equations_and_laws'][0]", "'instantiated_transfer_system':{'law':lock['equations_and_laws'][1]")
          t=t.replace("'mode_eigenstructure':{'law':lock['equations_and_laws'][3]", "'mode_eigenstructure':{'law':lock['equations_and_laws'][2]")
          t=t.replace("'error_covariance_propagation':{'law':lock['equations_and_laws'][4]", "'error_covariance_propagation':{'law':lock['equations_and_laws'][3]")
          assert t!=old,'expected pre-primary law-index corrections not found'
          p.write_text(t)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/hi190_execute_locked.py
          git commit -m 'Correct HI-190 frozen-law evidence references before primary execution'
          git pull --rebase origin agent/frontier-050-execution
          git push origin HEAD:agent/frontier-050-execution
          bash tools/run_hi190_governed.sh
