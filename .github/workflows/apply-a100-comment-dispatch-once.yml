name: Freeze scientifically clean HI-190 before primary execution

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  freeze-hi190:
    if: github.event.pull_request.number == 74
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Freeze exact immutable HU/I parent composition
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-lock.txt
          python - <<'PY'
          import json
          from pathlib import Path
          R=Path('modules/HI/runs/HI-190-20260809T151108Z')
          s=json.load(open('STATE.json'))
          assert s['active_work_unit']=='HI-190' and s['current_module']=='HI' and s['current_run']==R.name,s
          lock=json.load(open(R/'PRE_EXECUTION_LOCK.json'))
          assert lock['status']=='DRAFT',lock
          assert not (R/'primary').exists() or not any((R/'primary').iterdir()),'primary output exists before freeze'
          PY
          python tools/hi190_freeze.py
          python tools/rfc.py doctor
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/HI/runs/HI-190-20260809T151108Z/PRE_EXECUTION_LOCK.json modules/HI/runs/HI-190-20260809T151108Z/SOURCE_REGISTER.json modules/HI/runs/HI-190-20260809T151108Z/FROZEN_DERIVATION_SPEC.json
          git commit -m 'Freeze HI-190 immutable parent composition before execution'
          git push origin HEAD:agent/frontier-050-execution
          printf 'HI190_FREEZE_COMMIT=%s\n' "$(git rev-parse HEAD)"
