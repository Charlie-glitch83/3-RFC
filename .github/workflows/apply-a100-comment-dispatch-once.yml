name: Start governed J-200 exactly from root README

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  start-j200:
    if: github.event.pull_request.number == 74
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Run exact repository startup
        shell: bash
        run: |
          set -euo pipefail
          EXPECT='c4dbf5231f558744dc11e6bc6410400beeca157a'
          test "$(git rev-parse HEAD)" = "$EXPECT"
          python -m pip install --disable-pip-version-check -r requirements-lock.txt
          bash bootstrap.sh
          bash tools/start_work.sh
          python - <<'PY'
          import json
          s=json.load(open('STATE.json'))
          q=json.load(open('WORK_QUEUE.json'))
          active=[x for x in q['items'] if x.get('status')=='ACTIVE']
          assert s['active_work_unit']=='J-200',s
          assert s['current_module']=='J',s
          assert s['current_run'] and s['current_run'].startswith('J-200-'),s
          assert len(active)==1 and active[0]['id']=='J-200',active
          print('RUN_ID='+s['current_run'])
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add STATE.json memory/CURRENT_CONTEXT.md memory/RUN_INDEX.json work_packets/ACTIVE_WORK_PACKET.md modules/J/runs
          git commit -m 'Start governed J-200 from repository README'
          git push origin HEAD:agent/frontier-050-execution
          printf 'J200_START_COMMIT=%s\n' "$(git rev-parse HEAD)"
