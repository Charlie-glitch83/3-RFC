name: Advance verified I-180 to one authorized child

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  advance-i180:
    if: github.event.pull_request.number == 74
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Verify exact closeout and advance once
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-lock.txt
          EXPECT='f8d4bc9549d052c9e4ac33d53fe88e71505c6481'
          test "$(git rev-parse HEAD)" = "$EXPECT"
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.load(open('STATE.json'))
          assert s['active_work_unit']=='I-180',s
          assert s['current_module']=='I',s
          assert s['current_run'] is None,s
          assert s['modules']['I']['evidence_state']=='FROZEN',s['modules']['I']
          assert s['modules']['I']['fidelity']=='MINIMAL_SPINE',s['modules']['I']
          assert s['modules']['HI']['evidence_state']=='DESIGN',s['modules']['HI']
          g=json.load(open('modules/I/runs/I-180-20260809T050839Z/GATE_RESULTS.json'))
          assert g['overall']=='PASS' and all(v.get('pass') for v in g['componentwise'].values()),g
          rp=json.load(open('modules/I/runs/I-180-20260809T050839Z/REPLAY_RECORD.json'))
          assert rp['pass'] and rp['clean_checkout'] and rp['artifact_hashes_match'],rp
          ind=json.load(open('modules/I/runs/I-180-20260809T050839Z/independent/INDEPENDENT_RECONSTRUCTION.json'))
          assert ind['pass'] and ind['public_inputs_used'] is False,ind
          h=json.load(open('modules/I/frozen/H_I_to_HI.json'))
          assert h['object_id']=='H_I_to_HI' and h['from_module']=='I' and h['to_module']=='HI',h
          assert Path('modules/I/runs/I-180-20260809T050839Z/CLOSEOUT.md').is_file()
          PY
          python tools/rfc.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
          python tools/rfc.py advance --task I-180 --result PASS --evidence modules/I/runs/I-180-20260809T050839Z/CLOSEOUT.md
          python tools/rfc.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
          python tools/rfc.py context
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Advance from I-180 to the next authorized child'
          git push origin HEAD:agent/frontier-050-execution
          printf 'I180_ADVANCE_COMMIT=%s\n' "$(git rev-parse HEAD)"
