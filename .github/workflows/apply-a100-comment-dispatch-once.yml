name: Execute corrected I-180 governed full rerun

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  execute-i180:
    if: github.event.pull_request.number == 74
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Execute complete I-180 frozen matrix from corrected source taxonomy state
        shell: bash
        run: |
          set -euo pipefail
          bash tools/run_i180_governed.sh
