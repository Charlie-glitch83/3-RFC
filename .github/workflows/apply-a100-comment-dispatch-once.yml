name: Apply A-100 evidence from owner comment once

on:
  issue_comment:
    types: [created]

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.issue.number == 8 &&
      github.event.issue.pull_request &&
      github.event.comment.user.login == 'Charlie-glitch83' &&
      github.event.comment.body == '/apply-a100-evidence-f4b1ea136c7b26fd6d587ae11d5470521092392d9c371801172919e2b3a33102'
    runs-on: ubuntu-latest
    env:
      EXECUTION_BRANCH: agent/frontier-050-execution
      RUN_ID: A-100-20260806T173458Z
      EVIDENCE_ARCHIVE_SHA256: f4b1ea136c7b26fd6d587ae11d5470521092392d9c371801172919e2b3a33102
      H_A_SHA256: 728caf8c049d0114caef6f7b36af00065a32b4dc5f4faad02c6b9bcb16c933e7
      OUTPUT_TREE_SHA256: 33d1967c587a282e43896bc3f6c1f00a49bd1c2da0bfdcd4cc26982512e81b6c
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-lock.txt
      - name: Reconstruct exact A-100 evidence payload
        shell: bash
        run: |
          set -euo pipefail
          cat .a100_bundle/chunk-* | base64 -d > /tmp/a100-evidence.tar.xz
          echo "$EVIDENCE_ARCHIVE_SHA256  /tmp/a100-evidence.tar.xz" | sha256sum -c -
          mkdir -p /tmp/a100-reference
          tar -xJf /tmp/a100-evidence.tar.xz -C /tmp/a100-reference
          tar -xJf /tmp/a100-evidence.tar.xz -C .
      - name: Verify frozen Module A evidence before checks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          run_id = os.environ['RUN_ID']
          run = Path('modules/A/runs') / run_id
          state = json.loads(Path('STATE.json').read_text())
          gates = json.loads((run / 'GATE_RESULTS.json').read_text())
          replay = json.loads((run / 'REPLAY_RECORD.json').read_text())
          manifest = json.loads((run / 'GENERATED_OUTPUT_MANIFEST.json').read_text())
          assert state['generation_mode'] == 'GENERATION_SEALED'
          assert state['active_work_unit'] == 'A-100'
          assert state['current_module'] == 'A'
          assert state['current_run'] == run_id
          assert gates['overall'] == 'PASS'
          assert all(g['result'] == 'PASS' and g['score'] >= 0.95 for g in gates['gates'])
          assert replay['result'] == 'PASS'
          assert replay['clean_checkout'] is True
          assert replay['artifact_hashes_match'] is True
          handoff = Path('modules/A/frozen/H_A_to_B.json')
          assert hashlib.sha256(handoff.read_bytes()).hexdigest() == os.environ['H_A_SHA256']
          errors = []
          for item in manifest['outputs']:
              p = Path(item['path'])
              if not p.exists():
                  errors.append((item['path'], 'missing'))
                  continue
              digest = hashlib.sha256(p.read_bytes()).hexdigest()
              if digest != item['sha256'] or p.stat().st_size != item['bytes']:
                  errors.append((item['path'], digest, p.stat().st_size))
          canonical = json.dumps(manifest['outputs'], sort_keys=True, separators=(',', ':')).encode()
          tree = hashlib.sha256(canonical).hexdigest()
          assert not errors, errors
          assert tree == manifest['tree_sha256'] == os.environ['OUTPUT_TREE_SHA256']
          assert manifest['status'] == 'FINAL'
          assert len(manifest['outputs']) == 56
          PY
      - name: Run README end-session commands exactly
        shell: bash
        run: |
          set -euo pipefail
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
          python tools/rfc.py context
      - name: Restore and reverify exact frozen payload
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/a100-reference/memory/CURRENT_CONTEXT.md memory/CURRENT_CONTEXT.md
          while IFS= read -r rel; do
            test -f "$rel"
            cmp -s "/tmp/a100-reference/$rel" "$rel" || {
              echo "Frozen payload drifted after validation: $rel" >&2
              exit 1
            }
          done < <(tar -tJf /tmp/a100-evidence.tar.xz)
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          run = Path('modules/A/runs') / os.environ['RUN_ID']
          manifest = json.loads((run / 'GENERATED_OUTPUT_MANIFEST.json').read_text())
          canonical = json.dumps(manifest['outputs'], sort_keys=True, separators=(',', ':')).encode()
          assert hashlib.sha256(canonical).hexdigest() == os.environ['OUTPUT_TREE_SHA256']
          assert hashlib.sha256(Path('modules/A/frozen/H_A_to_B.json').read_bytes()).hexdigest() == os.environ['H_A_SHA256']
          PY
      - name: Remove one-use branch staging and verify change scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t staged_files < <(git ls-files '.a100_bundle/*')
          rm -rf .a100_bundle
          rm -f .github/a100-evidence-trigger.txt .github/workflows/apply-a100-evidence-once.yml
          python - <<'PY'
          import subprocess, tarfile
          from pathlib import Path
          archive = Path('/tmp/a100-evidence.tar.xz')
          with tarfile.open(archive, 'r:xz') as tf:
              allowed = {m.name for m in tf.getmembers() if m.isfile()}
          allowed.update({'.github/a100-evidence-trigger.txt', '.github/workflows/apply-a100-evidence-once.yml'})
          allowed.update(subprocess.check_output(['git', 'ls-files', '.a100_bundle/*'], text=True).splitlines())
          rows = subprocess.check_output(['git', 'status', '--porcelain=v1', '--untracked-files=all'], text=True).splitlines()
          actual = set()
          for row in rows:
              path = row[3:]
              if ' -> ' in path:
                  path = path.split(' -> ', 1)[1]
              actual.add(path)
          unexpected = sorted(actual - allowed)
          assert not unexpected, unexpected
          PY
      - name: Commit exact verified Module A evidence
        shell: bash
        run: |
          set -euo pipefail
          test -f modules/A/frozen/H_A_to_B.json
          test -f "modules/A/runs/$RUN_ID/CLOSEOUT.md"
          test ! -e .a100_bundle
          test ! -e .github/a100-evidence-trigger.txt
          test ! -e .github/workflows/apply-a100-evidence-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --name-only | grep -E '^(\.a100_bundle/|\.github/a100-evidence-trigger\.txt$|\.github/workflows/apply-a100-evidence-once\.yml$)' >/dev/null; then
            :
          fi
          git diff --cached --quiet && { echo 'No A-100 evidence changes produced' >&2; exit 1; }
          git commit -m 'Execute and freeze Module A prephysical handoff'
          git push origin HEAD:"$EXECUTION_BRANCH"
