name: Supersede unsupported HI-190 pre-primary lock

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  supersede-hi190:
    if: github.event.pull_request.number == 74
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Preserve frozen-spec defect and create new versioned HI run
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-lock.txt
          OLD='HI-190-20260809T151108Z'
          R="modules/HI/runs/$OLD"
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          R=Path('modules/HI/runs/HI-190-20260809T151108Z')
          s=json.load(open('STATE.json'))
          assert s['active_work_unit']=='HI-190' and s['current_module']=='HI' and s['current_run']==R.name,s
          lock=json.load(open(R/'PRE_EXECUTION_LOCK.json'))
          assert lock['status']=='FROZEN' and lock.get('frozen_before_primary_execution') is True,lock
          assert not (R/'primary').exists() or not any((R/'primary').iterdir()),'primary HI execution already exists; supersession is no longer pre-primary'
          bad='eta_b(t2),eta_b(t1)'
          assert any(bad in x for x in lock['equations_and_laws']), 'expected unsupported eta bridge is not in the frozen lock'
          ts=datetime.now(timezone.utc).isoformat()
          failure={
            'failure_id':'HI-190-UNSUPPORTED-ETA-BRIDGE-PREPRIMARY-20260809',
            'run_id':R.name,
            'gate':'pre-primary exact parent type compatibility',
            'category':'FROZEN_SCIENTIFIC_SPECIFICATION_DEFECT',
            'description':'The frozen HI pre-execution law introduced eta_b(t) as a mapping from the I background clock/frame into the HU propagator coordinate. Exact H_HU_to_HI and H_I_to_HI do not supply or derive that mapping. Executing it would invent a bridge between the independently frozen parents, violating exact-parent instantiation and no-retune discipline.',
            'earliest_affected_object':'PRE_EXECUTION_LOCK.json equations_and_laws[0]',
            'changes_frozen_science':True,
            'primary_execution_occurred_before_failure':False,
            'required_replay_scope':'new versioned HI-190 scientific run from exact frozen HU and I parents',
            'strongest_claim_remaining':'HU and I remain independently frozen; HI transfer instantiation is not yet scientifically established.',
            'timestamp_utc':ts
          }
          with (R/'FAILURES.jsonl').open('a',encoding='utf-8') as f: f.write(json.dumps(failure,ensure_ascii=False)+'\n')
          (R/'CLOSEOUT.md').write_text('''# HI-190 Pre-Primary Superseded Run\n\nResult: FAIL — scientific specification defect found before primary execution.\n\nThe frozen lock introduced an `eta_b(t)` mapping between the I physical background clock/frame and the HU propagator coordinate, but neither exact frozen parent derives that bridge. Executing the run would therefore add an unowned scientific law during instantiation.\n\nNo HI primary execution occurred. HU and I parent bytes, hashes, laws, coefficients, thresholds, gates, and claim boundaries remain unchanged. The correct repository action is to preserve this run and create a new versioned HI-190 run with the parent-compatible composition frozen before execution.\n\nStrongest supported claim: the independently frozen HU operator and I background remain valid exact parents.\n\nStrongest unsupported claim: no HI instantiated transfer law is established by this failed run.\n''',encoding='utf-8')
          print(json.dumps(failure,indent=2))
          PY
          python tools/rfc.py close-run --run-id "$OLD" --result FAIL --closeout "$R/CLOSEOUT.md"
          python tools/rfc.py new-run HI
          python tools/director.py prepare-active
          python tools/rfc.py context
          python tools/rfc.py doctor
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Supersede unsupported HI-190 pre-primary specification'
          git pull --rebase origin agent/frontier-050-execution
          git push origin HEAD:agent/frontier-050-execution
          printf 'HI190_SUPERSESSION_COMMIT=%s\n' "$(git rev-parse HEAD)"
          python - <<'PY'
          import json
          s=json.load(open('STATE.json'))
          print('NEW_HI_RUN='+str(s['current_run']))
          PY
