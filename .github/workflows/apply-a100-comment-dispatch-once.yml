name: Execute and close frozen HI-190

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  execute-close-hi190:
    if: github.event.pull_request.number == 74
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Execute governed full frozen matrix
        shell: bash
        env:
          EXPECTED_PRE: 72f24e691992340bf31b93edb3f5d0b5d097c041
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_PRE"
          python -m pip install --disable-pip-version-check -r requirements-lock.txt
          bash modules/HI/runs/HI-190-20260809T221124Z/RUN_FULL_FROZEN_MATRIX.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Close Module HI at its verified scientific scope'
          git push origin HEAD:agent/frontier-050-execution
          printf 'HI190_CLOSEOUT_COMMIT=%s\n' "$(git rev-parse HEAD)"
