name: Finalize A-100 v3

on:
  push:
    branches: [agent/frontier-050-execution]
    paths: ['.github/a100-finalize-v3-trigger.txt']

permissions:
  contents: write

concurrency:
  group: a100-governed-finalization
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    env:
      BRANCH: agent/frontier-050-execution
      RUN_ID: A-100-20260806T173458Z
      EVIDENCE_COMMIT: b6280513dc47339ddf024be6275817d3f38a9d39
      HANDOFF_SHA256: 728caf8c049d0114caef6f7b36af00065a32b4dc5f4faad02c6b9bcb16c933e7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements-lock.txt
      - name: Verify exact evidence and pre-close state
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$EVIDENCE_COMMIT" HEAD
          test "$(git show -s --format=%s "$EVIDENCE_COMMIT")" = 'Execute and freeze Module A prephysical handoff'
          test "$(sha256sum modules/A/frozen/H_A_to_B.json | awk '{print $1}')" = "$HANDOFF_SHA256"
          python - <<'PY'
          import json, os
          from pathlib import Path
          run = Path('modules/A/runs') / os.environ['RUN_ID']
          state = json.loads(Path('STATE.json').read_text())
          gates = json.loads((run/'GATE_RESULTS.json').read_text())
          replay = json.loads((run/'REPLAY_RECORD.json').read_text())
          assert state['active_work_unit'] == 'A-100'
          assert state['current_module'] == 'A'
          assert state['current_run'] == os.environ['RUN_ID']
          assert gates['overall'] == 'PASS'
          assert all(g['result']=='PASS' and g['score'] >= 0.95 for g in gates['gates'])
          assert replay['result']=='PASS' and replay['clean_checkout'] and replay['artifact_hashes_match']
          PY
      - name: Record, close, promote, and advance
        shell: bash
        run: |
          set -euo pipefail
          run="modules/A/runs/$RUN_ID"
          closeout="$run/CLOSEOUT.md"
          python - <<'PY'
          import os
          from pathlib import Path
          p=Path('modules/A/runs')/os.environ['RUN_ID']/'CLOSEOUT.md'
          t=p.read_text()
          t=t.replace('administrative close-run awaits the verified GitHub evidence commit.','verified GitHub evidence commit recorded; administrative close-run completed.')
          t=t.replace('promotion to be recorded after the evidence commit is verified','promotion recorded after exact GitHub evidence verification')
          t=t.replace('PENDING_EVIDENCE_COMMIT',os.environ['EVIDENCE_COMMIT'])
          assert os.environ['EVIDENCE_COMMIT'] in t
          p.write_text(t)
          PY
          python tools/rfc.py record-commit "$EVIDENCE_COMMIT" --branch "$BRANCH" --note 'Verified exact A-100 evidence commit, content, and branch ancestry before advance'
          python tools/rfc.py close-run --run-id "$RUN_ID" --result PASS --closeout "$closeout"
          python tools/rfc.py promote-module A --to FORMALIZED --fidelity PRODUCTION --evidence modules/A/frozen/H_A_to_B.json
          python tools/rfc.py promote-module A --to VERIFIED --fidelity PRODUCTION --evidence "$run/INDEPENDENT_VERIFICATION.md"
          python tools/rfc.py promote-module A --to INDEPENDENTLY_REPRODUCED --fidelity PRODUCTION --evidence "$run/independent/INDEPENDENT_RECONSTRUCTION.json"
          python tools/rfc.py promote-module A --to FROZEN --fidelity PRODUCTION --evidence modules/A/frozen/H_A_to_B.json
          python tools/rfc.py advance --task A-100 --result PASS --evidence "$closeout" --note 'Module A closed at FROZEN/PRODUCTION; authorize exactly B-110'
      - name: Verify final governed state
        shell: bash
        run: |
          set -euo pipefail
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
          python tools/rfc.py context
          python - <<'PY'
          import json
          s=json.load(open('STATE.json'))
          q=json.load(open('WORK_QUEUE.json'))['items']
          active=[x for x in q if x['status']=='ACTIVE']
          a=s['modules']['A']
          assert s['active_work_unit']=='B-110'
          assert s['current_module']=='B'
          assert s['current_run'] is None
          assert a['evidence_state']=='FROZEN'
          assert a['fidelity']=='PRODUCTION'
          assert len(active)==1 and active[0]['id']=='B-110'
          PY
      - name: Commit, rebase safely, push, and verify
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/a100-finalize-v3-trigger.txt \
            .github/workflows/finalize-a100-v3.yml \
            .github/a100-finalize-trigger.txt \
            .github/workflows/finalize-a100-closeout-once.yml \
            .github/a100-finalize-v2-trigger.txt \
            .github/workflows/finalize-a100-v2.yml \
            .github/a100-evidence-trigger.txt \
            .github/workflows/apply-a100-evidence-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Close Module A and authorize B-110'
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          final_sha=$(git rev-parse HEAD)
          git push origin HEAD:"$BRANCH"
          remote_sha=$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')
          test "$remote_sha" = "$final_sha"
          git diff-tree --no-commit-id --name-only -r "$final_sha" | tee /tmp/a100-final-files.txt
          grep -qx 'STATE.json' /tmp/a100-final-files.txt
          grep -qx 'WORK_QUEUE.json' /tmp/a100-final-files.txt
          grep -qx "modules/A/runs/$RUN_ID/CLOSEOUT.md" /tmp/a100-final-files.txt
          echo "FINAL_SHA=$final_sha" >> "$GITHUB_STEP_SUMMARY"
