name: One-shot D130 pre-execution freeze

on:
  push:
    branches:
      - agent/frontier-050-execution

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Freeze source register, derivation specification, and pre-execution lock
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, datetime

          root=Path('.')
          run=root/'modules/D/runs/D-130-20260807T044911Z'
          state=json.loads((root/'STATE.json').read_text())
          assert state['active_work_unit']=='D-130'
          assert state['current_run']=='D-130-20260807T044911Z'

          def sha(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          def rec(path, role):
              p=Path(path)
              return {'path':str(p),'sha256':sha(p),'role':role}

          parent_path='modules/C/frozen/H_C_to_D.json'
          parent_manifest='modules/C/frozen/H_C_to_D_MANIFEST.json'
          parent_sha=sha(parent_path)
          manifest=json.loads(Path(parent_manifest).read_text())
          assert parent_sha==manifest['sha256']=='41302a4ea12aab0f6d49ee74a6b89a0a9d25e66c79bb6fc137aee48f920caf78'

          spec={
            'schema_version':'1.0',
            'run_id':'D-130-20260807T044911Z',
            'status':'FROZEN_PRE_EXECUTION',
            'generation_mode':'GENERATION_SEALED',
            'exact_parent':{'object_id':'H_C_to_D','path':parent_path,'sha256':parent_sha},
            'triadic_descent':{
              'CIF':'the C simplex carries distribution and phase possibilities without a preloaded thermal law',
              'QV':'admissible D transport must preserve total carrier memory, positivity, inherited symmetry, and target blindness',
              'RFL':'only dynamically witnessed entropy/event memory may be retained'
            },
            'state_space':{
              'population_state':'p in the three-state probability simplex inherited from C',
              'uniform_state':'u=(1/3,1/3,1/3)',
              'deviation_space':'V_perp={q: sum(q)=0}',
              'initial_population':[0.5865734510957316,0.24345592095871127,0.16997062794555687],
              'stochastic_covariance':[[0,0,0],[0,0,0],[0,0,0]]
            },
            'inherited_operator':{
              'name':'M_C',
              'law':'M_C=I-Q_B=g_C P_perp',
              'g_C':0.449829064955317,
              'P_perp':'I-11^T/3',
              'dimension':'dimensionless'
            },
            'candidate_classes':[
              {
                'id':'D-CAND-1',
                'class':'linear conservative positivity-preserving symmetry-equivariant Markov flows on the inherited simplex',
                'form':'dp/dtau=-kappa P_perp p, kappa>=0',
                'status':'LAWFUL_FAMILY',
                'reason':'conservation fixes the uniform zero mode; exact O(2) symmetry on V_perp forces a scalar action there; positivity requires nonnegative decay rate'
              },
              {
                'id':'D-CAND-2',
                'class':'nonlinear conservative O(2)-equivariant simplex flows',
                'status':'UNDERDETERMINED',
                'reason':'C supplies no constitutive nonlinearity or selection principle that chooses one member'
              },
              {
                'id':'D-CAND-3',
                'class':'phase-threshold/event laws and physical temperature laws',
                'status':'NOT_DERIVED_FROM_C',
                'reason':'C supplies no dimensionful scale, equation of state, temperature map, order parameter threshold, or physical clock'
              }
            ],
            'selection_result':{
              'normalized_transport_orbit':'dp/ds=-P_perp p with s=kappa*tau; equivalently any kappa>0 member differs only by intrinsic clock reparameterization',
              'unique_physical_rate':False,
              'physical_time_derived':False,
              'temperature_derived':False,
              'phase_threshold_derived':False,
              'allowed_execution_scope':'execute the normalized lawful transport branch only as a dimensionless D diagnostic; do not call it a complete physical thermal history'
            },
            'analytic_invariants':[
              'sum_i p_i = 1',
              'p_i >= 0 for the Markov semigroup',
              'q=p-u obeys q(s)=exp(-s)q(0)',
              '||q||_2^2 decays as exp(-2s)',
              'Shannon entropy is nondecreasing along this doubly-stochastic relaxation branch'
            ],
            'phase_event_rule':'NO_EVENT_WITNESS_ADMITTED_WITHOUT_A_PARENT-DERIVED_ORDER_PARAMETER_AND_THRESHOLD',
            'temperature_rule':'NO_PHYSICAL_TEMPERATURE_ADMITTED_WITHOUT_A_PARENT-DERIVED_ENERGY_SCALE_AND_THERMODYNAMIC_MAP',
            'claim_boundary':'Dimensionless parent-driven relaxation family and its obstruction record only; Generated RFC physical thermal history is not yet established.',
            'hard_obstruction':'Full Module D remains underdetermined at the physical-temperature/clock/phase-event layer unless a lawful additional object is derived from admitted sources without public targets.'
          }
          spec_path=run/'FROZEN_DERIVATION_SPEC.json'
          spec_path.write_text(json.dumps(spec,indent=2)+'\n')
          spec_sha=sha(spec_path)

          source_register={
            'run_id':'D-130-20260807T044911Z',
            'exact_parents':[{'object_id':'H_C_to_D','path':parent_path,'sha256':parent_sha,'manifest_path':parent_manifest,'manifest_sha256':sha(parent_manifest)}],
            'admitted_sources':[],
            'imports':['python: standard library for governed record generation; repository solver imports remain governed by frozen engine files'],
            'files':[
              rec('README.md','repository authority'),
              rec('STATE.json','machine authorization state'),
              rec('WORK_QUEUE.json','machine work queue'),
              rec('work_packets/ACTIVE_WORK_PACKET.md','active execution packet'),
              rec('recipes/D/WORK_ORDER.md','D exact work order'),
              rec('recipes/D/recipe.json','D frozen recipe'),
              rec(parent_path,'exact scientific parent'),
              rec(parent_manifest,'exact parent manifest'),
              rec(run/'solver_templates/D_transport.template.json','frozen local solver template'),
              rec(run/'binding_sheets/D_transport.bindings.json','frozen provenance binding sheet'),
              {'path':str(spec_path),'sha256':spec_sha,'role':'frozen pre-execution scientific derivation specification'}
            ],
            'urls':[],
            'constants':[
              {'name':'g_C','value':0.449829064955317,'origin_path':parent_path,'origin_sha256':parent_sha,'dimension':'dimensionless'},
              {'name':'initial_population','value':[0.5865734510957316,0.24345592095871127,0.16997062794555687],'origin_path':parent_path,'origin_sha256':parent_sha,'dimension':'dimensionless probability'}
            ],
            'public_data_declaration':'NONE'
          }
          (run/'SOURCE_REGISTER.json').write_text(json.dumps(source_register,indent=2)+'\n')

          now=datetime.datetime.now(datetime.timezone.utc).isoformat()
          lock={
            'run_id':'D-130-20260807T044911Z',
            'status':'FROZEN',
            'frozen_utc':now,
            'authority_hashes':[
              rec('README.md','root authority'),rec('work_packets/ACTIVE_WORK_PACKET.md','active packet'),rec('recipes/D/recipe.json','module recipe'),rec('recipes/D/WORK_ORDER.md','work order')
            ],
            'parent_hashes':[{'object_id':'H_C_to_D','path':parent_path,'sha256':parent_sha}],
            'definition_hashes':[{'path':str(spec_path),'sha256':spec_sha}],
            'candidate_classes':spec['candidate_classes'],
            'equations_and_laws':[
              'M_C=g_C P_perp inherited from C',
              'lawful linear family dp/dtau=-kappa P_perp p, kappa>=0',
              'normalized intrinsic branch dp/ds=-P_perp p for kappa>0',
              'q(s)=exp(-s)q(0)',
              'no physical temperature law or phase threshold is admitted at freeze'
            ],
            'dimensions_units_frames_gauges_clocks':[
              'p, M_C, g_C and normalized intrinsic clock s are dimensionless',
              'kappa is pure intrinsic-clock scaling within the admitted family and is not a physical rate',
              'no metric frame, physical time, physical temperature, energy scale, or expansion scale is derived from C',
              'O(2) rotations inside V_perp remain gauge-equivalent basis choices'
            ],
            'methods':[
              'exact symbolic manufactured calls D-WL-001 then D-WL-002 after this lock',
              'repository manufactured reference check for D',
              'BDF local solver only after provenance-complete binding to the frozen normalized branch',
              'analytic closed-form reconstruction independent of primary numerical integrator',
              'actual clean-checkout replay required before any PASS claim'
            ],
            'tolerances':[
              {'name':'solver_rtol','value':1e-9,'source':'frozen solver template'},
              {'name':'solver_atol','value':1e-12,'source':'frozen solver template'},
              {'name':'conservation_abs','value':1e-10,'basis':'stricter than component gate floor and above floating representation noise; frozen before execution'},
              {'name':'positivity_abs','value':1e-12,'basis':'aligned with solver absolute tolerance; frozen before execution'},
              {'name':'analytic_numeric_l2','value':1e-8,'basis':'pre-execution diagnostic tolerance'}
            ],
            'stopping_rules':[
              'hard stop on any negative population below -1e-12',
              'hard stop on total-carrier drift above 1e-10',
              'hard stop if any event/temperature rule requires an observed or remembered target',
              'hard stop on any attempt to label intrinsic clock s as physical time',
              'hard stop on any attempt to claim complete D thermal history without a derived physical temperature/clock/phase-event object'
            ],
            'expected_invariants':spec['analytic_invariants'],
            'tests':[
              'D-WL-001 exact conservation/Lyapunov manufactured identity',
              'D-WL-002 Jacobian eigenstructure/stiffness manufactured diagnostic',
              'repository D reference check',
              'positive-simplex evolution',
              'time-step/refinement comparison',
              'restart equivalence',
              'countermodel execution for sign-flipped/anisotropic/nonconservative alternatives',
              'independent analytic reconstruction',
              'clean checkout replay'
            ],
            'gates':['positive distributions','energy/charge conservation','event ordering','stiff-solver convergence','restart and independent reconstruction'],
            'falsifiers':[
              'negative populations beyond frozen tolerance',
              'carrier conservation failure',
              'normalized transport branch disagrees with analytic exp(-s) decay beyond tolerance',
              'an allegedly unique physical temperature/time law requires a new unfrozen premise',
              'event ordering changes when public/observed target values are introduced'
            ],
            'claim_boundary':spec['claim_boundary'],
            'independent_verifier_design':'Separate analytic reconstruction from H_C_to_D plus FROZEN_DERIVATION_SPEC only; do not trust primary solver outputs or gate summaries; reconstruct p(s)=u+exp(-s)(p0-u), conservation, positivity and entropy direction independently. Physical temperature/phase-event obstruction must also be independently confirmed from absence of scale/order-parameter data in the exact parent.',
            'allowed_implementation_only_corrections':['syntax/path/serialization fixes only','numerical implementation fixes that leave candidate classes, equations, source hashes, tolerances, gates, falsifiers, and claim boundary unchanged','after any correction rerun the entire frozen matrix']
          }
          (run/'PRE_EXECUTION_LOCK.json').write_text(json.dumps(lock,indent=2)+'\n')

          run_json=json.loads((run/'run.json').read_text())
          run_json['parent_hashes']=[parent_sha]
          (run/'run.json').write_text(json.dumps(run_json,indent=2)+'\n')
          PY

          rm -f .github/workflows/d130_freeze_preexecution.yml
          git config user.name '3-RFC governed executor'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Freeze D-130 pre-execution scientific scope'
          git push origin HEAD:agent/frontier-050-execution
