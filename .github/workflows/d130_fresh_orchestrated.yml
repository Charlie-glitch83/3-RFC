name: One-shot orchestrated fresh D130 execution

on:
  pull_request:
    branches:
      - agent/frontier-050-execution

permissions:
  contents: write

jobs:
  execute:
    if: github.event.pull_request.head.ref == 'ops/d130-fresh-orchestrated-trigger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements-lock.txt
      - name: Execute governed D-130 orchestration
        run: python tools/d130_closeout_orchestrator.py
      - name: Commit exact verified scientific scope
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/d130_fresh_orchestrated.yml
          git config user.name '3-RFC governed executor'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Close Module D at its verified scientific scope'
          git pull --rebase origin agent/frontier-050-execution
          git push origin HEAD:agent/frontier-050-execution
