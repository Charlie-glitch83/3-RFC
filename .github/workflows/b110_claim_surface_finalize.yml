name: B110 Claim Surface Finalize

on:
  pull_request:
    branches:
      - agent/frontier-050-execution

permissions:
  contents: write

jobs:
  finalize-claim-surface:
    if: github.event.pull_request.head.ref == 'agent/b110-governed-trigger'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout execution branch
        uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - name: Guard and update claim surface
        shell: bash
        run: |
          set -euo pipefail
          python tools/finalize_b110_claim_surface.py
          python tools/rfc.py context
          python tools/director.py prepare-active
          python tools/rfc.py doctor
      - name: Commit verified claim-surface repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name '3-RFC governed executor'
          git config user.email 'actions@users.noreply.github.com'
          git add STATE.json memory/CURRENT_CONTEXT.md work_packets/ACTIVE_WORK_PACKET.md
          if git diff --cached --quiet; then
            echo 'HARD STOP: no claim-surface changes to commit'
            exit 1
          fi
          git commit -m 'Align state claims with verified Module B closeout'
          git push origin HEAD:agent/frontier-050-execution
          git rev-parse HEAD
