name: D130 Redo Exact README Startup

on:
  push:
    branches:
      - agent/frontier-050-execution

permissions:
  contents: write

jobs:
  startup:
    if: github.ref == 'refs/heads/agent/frontier-050-execution'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout D-start branch
        uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Follow root README exact first commands
        shell: bash
        run: |
          set -euo pipefail
          bash bootstrap.sh
          bash tools/start_work.sh
          python tools/director.py active
      - name: Commit governed D startup and remove one-use carrier
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/d130_redo_readme_once.yml
          git config user.name '3-RFC governed executor'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No governed startup changes produced.'
            exit 1
          fi
          git commit -m 'Restart Module D exactly from root README'
          git push origin HEAD:agent/frontier-050-execution
          git rev-parse HEAD
