            'falsifiers':['H_E_to_F hash mismatch','species or route lineage changed','empirical isotope/electron/photon/neutrino identity inserted generatively','electromagnetic neutrality claimed without a derived EM charge operator','Q0/Q1/Q2/Q_total or U+RFL drift above 1e-9','state below -1e-12','covariance eigenvalue below -1e-18','convergence/restart/replay/independent reconstruction discrepancy above 1e-8','physical photon opacity or public recombination coordinate inferred from kappa_int_F without a new witness'],
