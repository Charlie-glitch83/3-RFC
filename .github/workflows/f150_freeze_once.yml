            'tolerances':['rtol=1e-9','atol=1e-12','positivity_tolerance=1e-12','carrier/energy invariant_tolerance=1e-9','primary-vs-independent L_inf tolerance=1e-8','restart/replay L_inf tolerance=1e-8','covariance PSD lambda_min>=-1e-18','convergence L_inf tolerance=1e-8'],
            'stopping_rules':['Delta_tau_F=1/kr3=126582.49817344503','primary max_step=Delta_tau_F/128','stop if exact E lineage is changed or empirical identities/constants enter generation','stop if protected carrier or U+RFL ledger fails','stop if covariance becomes non-PSD beyond frozen tolerance','stop BLOCKED_UNDERDETERMINED rather than inventing any missing electromagnetic/radiation/neutrino specialization'],
