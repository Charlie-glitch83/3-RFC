            binding('t_span',spec['clock_and_numerics']['t_span'],'F150.clock_and_numerics.t_span','tau_F','2 endpoints','One slowest inherited reverse-route persistence timescale.'),
            binding('max_step',spec['clock_and_numerics']['max_step'],'F150.clock_and_numerics.max_step','tau_F','scalar','Frozen Delta_tau_F/128 step ceiling.'),
            binding('positivity_tolerance',spec['clock_and_numerics']['positivity_tolerance'],'F150.clock_and_numerics.positivity_tolerance','abundance','scalar','Frozen positivity tolerance.'),
            binding('invariant_tolerance',spec['clock_and_numerics']['invariant_tolerance'],'F150.clock_and_numerics.invariant_tolerance','carrier count','scalar','Frozen ledger tolerance.')]
          # model.invariants must contain only numeric rows, not policy metadata.
          rn[4]['value']={k:spec['protected_carrier_ledgers'][k] for k in ('Q0','Q1','Q2','Q_total')}
          rns=json.loads((run/'binding_sheets/F_reaction_network.bindings.json').read_text())
          rns['bindings']=rn
