            binding('model.rate_expressions',spec['reaction_continuation_law']['rate_expressions'],'F150.reaction_continuation_law.rate_expressions','inverse tau_F with abundance factors','12 flux laws','Exact inherited reversible flux expressions.'),
            binding('model.parameters',spec['reaction_continuation_law']['parameters'],'F150.reaction_continuation_law.parameters','intrinsic dimensionless rates','4 coefficients','Exact frozen E rates; no F retuning.'),
            binding('model.invariants',spec['protected_carrier_ledgers'],'F150.protected_carrier_ledgers','protected carrier count','four left-null functionals','Use only Q0/Q1/Q2/Q_total arrays from protected carrier ledgers.'),
