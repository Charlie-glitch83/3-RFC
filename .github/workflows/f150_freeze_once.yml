            binding('model.rhs_expressions',tm['rhs_expressions'],'F150.transport_model.rhs_expressions','state per tau_F','8 ODEs','Exact E reaction RHS lifted with dRFL_M=-dU.'),
            binding('model.initial_state',tm['initial_state'],'F150.transport_model.initial_state','dimensionless internal state','8-vector','Exact E terminal composition plus exact E RFL memory.'),
            binding('model.t_span',cn['t_span'],'F150.clock_and_numerics.t_span','tau_F','2 endpoints','Frozen persistence-test horizon.'),
            binding('model.max_step',cn['max_step'],'F150.clock_and_numerics.max_step','tau_F','scalar','Frozen Delta_tau_F/128 step ceiling.'),
            binding('model.linear_invariants',tm['linear_invariants'],'F150.transport_model.linear_invariants','protected ledgers','five rows','Q0/Q1/Q2/Q_total plus exact U+RFL no-loss ledger.'),
            binding('model.invariant_tolerance',cn['invariant_tolerance'],'F150.clock_and_numerics.invariant_tolerance','internal ledger','scalar','Frozen ledger tolerance.'),
            binding('model.positivity_tolerance',cn['positivity_tolerance'],'F150.clock_and_numerics.positivity_tolerance','state','scalar','Frozen positivity tolerance.')]
          trs=json.loads((run/'binding_sheets/F_transport.bindings.json').read_text()); trs['bindings']=tr
          (run/'binding_sheets/F_transport.bindings.json').write_text(json.dumps(trs,indent=2)+'\n')
          lock={
            'schema_version':'1.0','run_id':rid,'status':'FROZEN_BEFORE_PRIMARY_EXECUTION','frozen_utc':'2026-08-08T02:00:00Z','generation_mode':'GENERATION_SEALED','fidelity':'MINIMAL_SPINE',
            'authority_hashes':[h for _,_,h,_ in authorities],
            'parent_hashes':[h for _,_,h,_ in parents],
            'definition_hashes':[{'path':str(spec_path),'sha256':spec_sha},{'path':str(run/'SOURCE_REGISTER.json'),'sha256':src_sha},{'path':str(run/'binding_sheets/F_reaction_network.bindings.json'),'sha256':sha(run/'binding_sheets/F_reaction_network.bindings.json')},{'path':str(run/'binding_sheets/F_transport.bindings.json'),'sha256':sha(run/'binding_sheets/F_transport.bindings.json')}],
            'candidate_classes':['exact seven internal RFC E composites','exact six reversible inherited route families','three protected carrier ledgers plus Q_total','primitive/composite internal bound-free occupancy coordinate','constitutive-energy/RFL no-loss memory lift','internal nonnegative inherited route-activity transfer seed','explicit dormant/unassigned radiation-neutrino-electromagnetic channels when unwitnessed'],
            'equations_and_laws':['dy_F/dtau_F=S_E r_E(y_F)','same exact E kf2,kr2,kf3,kr3; no new F coefficient','x_free_F=(X0+X1+X2)/Q_total','U_F=eC*(X0+X1+X2+B01+B02+B12)','dRFL_M/dtau_F=-dU_F/dtau_F','U_F+RFL_M invariant','kappa_int_F=sum_j r_j(y_F)>=0 as internal route-activity seed only','Sigma_F,0=L Sigma_E L^T and Sigma_F=Phi Sigma_F,0 Phi^T with Phi=exp(J_F Delta_tau_F)'],
