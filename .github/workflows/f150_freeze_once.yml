name: F150 Governed Pre-Execution Freeze Once

on:
  pull_request:
    branches:
      - agent/frontier-050-execution
    paths:
      - '.github/f150-freeze-trigger.txt'

permissions:
  contents: write

jobs:
  freeze-f150:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install frozen dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-lock.txt
      - name: Verify active F run and exact parent
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          rid='F-150-20260808T013006Z'
          s=json.load(open('STATE.json'))
          assert s['active_work_unit']=='F-150',s
          assert s['current_module']=='F',s
          assert s['current_run']==rid,s
          p=Path('modules/E/frozen/H_E_to_F.json')
          h=hashlib.sha256(p.read_bytes()).hexdigest()
          assert h=='975c4fcdfa2f4f861dd3085e14678116377bbe4d0fc23dd4e51f4373f9c2ecbf',h
          spec=Path(f'modules/F/runs/{rid}/FROZEN_DERIVATION_SPEC.json')
          assert spec.is_file()
          x=json.loads(spec.read_text())
          assert x['status']=='FROZEN_PRE_EXECUTION',x['status']
          assert x['direct_parent']['sha256']==h
          PY
      - name: Freeze source register, environment, bindings and pre-execution lock
        run: |
          python - <<'PY'
          import hashlib,json,platform,sys
          from pathlib import Path
          rid='F-150-20260808T013006Z'
