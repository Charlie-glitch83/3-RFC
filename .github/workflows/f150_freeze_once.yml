            'internal_derivations':[{'path':str(spec_path),'sha256':spec_sha,'object_id':'F150_FROZEN_DERIVATION_SPEC'}],
            'historical_context_policy':{'classification':'HISTORICAL_WARNING_PROCEDURE_ONLY','rule':'Recovered 2-RFC F science/proof/completion artifacts may explain intended coverage but cannot supply current numerical values, empirical identities, PASS status or missing parent fields.'},
