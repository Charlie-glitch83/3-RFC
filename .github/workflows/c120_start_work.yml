name: C120 Governed Startup

on:
  pull_request:
    branches:
      - agent/frontier-050-execution

permissions:
  contents: write

jobs:
  start-c120:
    if: github.event.pull_request.head.ref == 'agent/c120-startup-trigger'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout execution branch
        uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install repository execution dependencies
        run: python -m pip install --disable-pip-version-check numpy networkx scipy sympy
      - name: Run repository startup exactly
        shell: bash
        run: |
          set -euo pipefail
          bash bootstrap.sh
          bash tools/start_work.sh
      - name: Commit generated governed workspace
        shell: bash
        run: |
          set -euo pipefail
          git config user.name '3-RFC governed executor'
          git config user.email 'actions@users.noreply.github.com'
          git status --short
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo 'HARD STOP: startup produced no governed workspace changes'
            exit 1
          fi
          git add -A
          git commit -m 'Prepare C-120 governed workspace'
          git push origin HEAD:agent/frontier-050-execution
          git rev-parse HEAD

  resume-b115-science-repair:
    if: github.event.pull_request.head.ref == 'ops/science-lineage-resume-20260808'
    runs-on: ubuntu-latest
    concurrency:
      group: science-lineage-repair-once
      cancel-in-progress: false
    steps:
      - name: Checkout authoritative execution branch
        uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install frozen repository dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-lock.txt
      - name: Execute resume-safe B-first repair closeout
        run: bash tools/run_b115_resume_closeout.sh

  c125-channel-complete-repair:
    if: github.event.pull_request.head.ref == 'ops/c125-repair-20260808'
    runs-on: ubuntu-latest
    concurrency:
      group: c125-channel-complete-repair
      cancel-in-progress: false
    steps:
      - name: Checkout authoritative execution branch
        uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install frozen repository dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-lock.txt
      - name: Execute governed C-125 superseding replay
        run: bash tools/run_c125_resume_closeout.sh
