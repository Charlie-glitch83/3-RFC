name: Finalize FRONTIER-050 once

on:
  pull_request:
    types: [edited]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'agent/frontier-050-execution'
    runs-on: ubuntu-latest
    env:
      RUN_ID: FRONTIER-050-20260806T142549Z
      EVIDENCE_SHA: 5ac899a0ad800a743af814f74163af586780ee54
      EXECUTION_BRANCH: agent/frontier-050-execution
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-lock.txt
      - name: Verify frozen evidence before transition
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$EVIDENCE_SHA" HEAD
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          run_id = os.environ['RUN_ID']
          state = json.loads(Path('STATE.json').read_text())
          queue = json.loads(Path('WORK_QUEUE.json').read_text())['items']
          gates = json.loads(Path(f'runs/{run_id}/GATE_RESULTS.json').read_text())
          replay = json.loads(Path(f'runs/{run_id}/REPLAY_RECORD.json').read_text())
          frontier = json.loads(Path('audit/PHYSICAL_FRONTIER.json').read_text())

          assert state['active_work_unit'] == 'FRONTIER-050'
          assert state['current_module'] == 'AUDIT'
          assert state['current_run'] == run_id
          assert state['generation_mode'] == 'GENERATION_SEALED'
          assert [x['id'] for x in queue if x.get('status') == 'ACTIVE'] == ['FRONTIER-050']
          assert gates['overall'] == 'PASS'
          assert all(x['result'] == 'PASS' and x['score'] >= 0.95 for x in gates['gates'])
          assert replay['result'] == 'PASS'
          assert replay['artifact_hashes_match'] is True
          assert frontier['selected_frontier']['module'] == 'A'
          assert frontier['selected_frontier']['authorized_child'] == 'A-100'
          PY
      - name: Record verified evidence commit and finalize stable run files
        shell: bash
        run: |
          set -euo pipefail
          run="runs/$RUN_ID"
          python tools/rfc.py record-commit "$EVIDENCE_SHA" --branch "$EXECUTION_BRANCH" --note 'FRONTIER-050 exact evidence commit verified after external SHA and diff review.'
          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          run_id = os.environ['RUN_ID']
          evidence_sha = os.environ['EVIDENCE_SHA']
          closeout = Path(f'runs/{run_id}/CLOSEOUT.md')
          text = closeout.read_text()
          marker = 'PENDING_EVIDENCE_STAGE'
          assert text.count(marker) == 1
          closeout.write_text(text.replace(marker, evidence_sha))
          PY
          python tools/director.py doctor | tee "$run/FINAL_DOCTOR.txt"
          python -m unittest discover -s tests -v 2>&1 | tee "$run/UNIT_TESTS.txt"
          python tools/rfc.py firewall-scan | tee "$run/FIREWALL_SCAN.txt"
          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          run_id = os.environ['RUN_ID']
          selected = [
              'audit/PHYSICAL_FRONTIER.json',
              'audit/PHYSICAL_FRONTIER.md',
              f'runs/{run_id}/GATE_RESULTS.json',
              f'runs/{run_id}/INDEPENDENT_FRONTIER_RECONSTRUCTION.json',
              f'runs/{run_id}/INDEPENDENT_VERIFICATION.md',
              f'runs/{run_id}/REPLAY_RECORD.json',
              f'runs/{run_id}/CLOSEOUT.md',
              f'runs/{run_id}/primary_frontier_audit.py',
              f'runs/{run_id}/independent_frontier_reconstruction.py',
          ]
          outputs = []
          for rel in selected:
              p = Path(rel)
              data = p.read_bytes()
              outputs.append({'path': rel, 'sha256': hashlib.sha256(data).hexdigest(), 'bytes': len(data)})
          canonical = json.dumps(outputs, sort_keys=True, separators=(',', ':')).encode()
          manifest = {
              'run_id': run_id,
              'status': 'FINAL',
              'finalized_utc': datetime.now(timezone.utc).isoformat(),
              'outputs': outputs,
              'tree_sha256': hashlib.sha256(canonical).hexdigest(),
              'note': 'Manifest covers the frozen audit products, gate evidence, replay, closeout, and both reconstruction scripts; it excludes itself and mutable administrative run metadata.'
          }
          Path(f'runs/{run_id}/GENERATED_OUTPUT_MANIFEST.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY
      - name: Close exactly FRONTIER-050 and activate only A-100
        shell: bash
        run: |
          set -euo pipefail
          run="runs/$RUN_ID"
          python tools/rfc.py close-run --run-id "$RUN_ID" --result PASS --closeout "$run/CLOSEOUT.md"
          python tools/rfc.py advance --task FRONTIER-050 --result PASS --evidence "$run/CLOSEOUT.md" --note 'FRONTIER-050 passed; activate only A-100.'
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence_sha = os.environ['EVIDENCE_SHA']
          state_path = Path('STATE.json')
          state = json.loads(state_path.read_text())
          state['strongest_supported_claim'] = 'A governed exact-object audit identifies Module A as the unique earliest missing physical parent: the authority and formal architecture exist, but no frozen typed H_A_to_B execution packet exists.'
          state['strongest_unsupported_claim'] = 'No Module A physical execution, Module B Big Implosion, manifested universe, downstream A-J validation, empirical agreement, or universe completion has been established.'
          state_path.write_text(json.dumps(state, indent=2) + '\n')

          queue = json.loads(Path('WORK_QUEUE.json').read_text())['items']
          active = [x['id'] for x in queue if x.get('status') == 'ACTIVE']
          state = json.loads(state_path.read_text())
          assert active == ['A-100']
          assert state['active_work_unit'] == 'A-100'
          assert state['current_module'] == 'A'
          assert state['current_run'] is None
          assert state['generation_mode'] == 'GENERATION_SEALED'
          assert state['last_verified_commit'] == evidence_sha
          assert state['last_verified_branch'] == os.environ['EXECUTION_BRANCH']
          run_index = json.loads(Path('memory/RUN_INDEX.json').read_text())['runs']
          rec = [x for x in run_index if x.get('run_id') == os.environ['RUN_ID']]
          assert len(rec) == 1 and rec[0]['status'] == 'PASS'
          PY
          if find runs modules/A/runs -maxdepth 1 -type d -name 'A-100-*' -print 2>/dev/null | grep -q .; then
            echo 'A-100 workspace exists unexpectedly' >&2
            exit 1
          fi
          python tools/rfc.py context
      - name: Remove one-use finalizer and verify final repository state
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/finalize-frontier050-once.yml
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
          python tools/rfc.py status
      - name: Commit governed transition
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git ls-files -- .github/workflows/finalize-frontier050-once.yml | grep -q .; then
            echo 'One-use finalizer remains in final index' >&2
            exit 1
          fi
          git diff --cached --quiet && { echo 'No transition changes produced' >&2; exit 1; }
          git commit -m 'Close FRONTIER-050 and activate Module A'
          git push origin HEAD:agent/frontier-050-execution
