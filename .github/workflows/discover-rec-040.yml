name: Close REC-040 and advance

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  close:
    if: github.head_ref == 'agent/rec-040-execution'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rec-040-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements-lock.txt
      - name: Record, close, advance, and replay
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin agent/rec-040-execution
          python tools/rfc.py record-commit 5f3216de0bf6e2e2b4cb8966bc468a852284225c --branch agent/rec-040-execution --note 'Verified REC-040 exact-object recovery commit, changed files, source hashes, gates, replay, quarantine, and closeout'
          python tools/rfc.py close-run --run-id REC-040-20260806T135256Z --result PASS --closeout runs/REC-040-20260806T135256Z/CLOSEOUT.md
          python tools/rfc.py advance --task REC-040 --result PASS --evidence runs/REC-040-20260806T135256Z/CLOSEOUT.md
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
          python tools/rfc.py context
      - name: Commit formal transition and remove branch runners
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/discover-rec-040.yml .github/workflows/run-rec-040-startup.yml || true
          rm -f .github/rec-040-*.txt
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Close REC-040 and activate physical frontier audit'
          git push origin agent/rec-040-execution
