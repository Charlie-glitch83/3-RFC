name: Execute REC-040 exact recovery

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  recover:
    if: github.head_ref == 'agent/rec-040-execution'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rec-040-execution
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: Charlie-glitch83/2-RFC
          ref: b0f21d023f64ce9c70fd4755dfdbb7357b9f7a10
          path: _2rfc_exact
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements-lock.txt
      - name: Execute frozen reconciled REC-040 script
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/run-rec-040-startup.yml').read_text(encoding='utf-8')
          start = text.index("          python - <<'PY'\n") + len("          python - <<'PY'\n")
          end = text.index("\n          PY\n", start)
          lines = text[start:end].splitlines()
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/rec040_recovery.py').write_text(code, encoding='utf-8')
          PY
          python /tmp/rec040_recovery.py
          rm -rf _2rfc_exact
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
          python tools/rfc.py context
      - name: Commit REC-040 evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recovery memory STATE.json
          find runs -maxdepth 1 -type d -name 'REC-040-*' -print0 | xargs -0 -r git add --
          git commit -m 'Recover verified RFC assets without inheriting failures'
          git pull --rebase origin agent/rec-040-execution
          git push origin agent/rec-040-execution
