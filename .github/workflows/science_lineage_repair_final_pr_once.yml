name: Monitorable Final B-First Science Repair Once

on:
  pull_request:
    branches:
      - agent/frontier-050-execution
    paths:
      - '.github/science-lineage-repair-final-pr-trigger.txt'

permissions:
  contents: write

concurrency:
  group: science-lineage-repair-once
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'ops/final-b115-repair-20260808'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements-lock.txt

      - name: Resolve live repair state
        id: state
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          s=json.load(open('STATE.json')); a=s['active_work_unit']; rid=s.get('current_run')
          if a=='C-125' and s['modules']['B']['evidence_state']=='FROZEN' and s['modules']['B']['fidelity']=='PRODUCTION': mode='DONE'
          elif a=='B-115' and rid and rid.startswith('B-115-'): mode='B_RESUME'
          elif a=='G-160' and rid and rid.startswith('G-160-'): mode='G_START'
          else: raise SystemExit(f'HARD STOP: unsupported state {a}/{rid}')
          print('mode='+mode); print('rid='+(rid or ''))
          PY

      - name: Open B-first repair from G
        if: steps.state.outputs.mode == 'G_START'
        run: |
          RID=$(python - <<'PY'
          import json; print(json.load(open('STATE.json'))['current_run'])
          PY
          )
          python - "$RID" <<'PY'
          import json,sys
          from pathlib import Path
          rid=sys.argv[1]; R=Path('modules/G/runs')/rid
          run=json.load(open(R/'run.json')); assert run['status']=='CREATED',run
          lock=json.load(open(R/'PRE_EXECUTION_LOCK.json'))
          assert lock.get('authorization')=='NOT_AUTHORIZED_PENDING_SUPERSEDING_F_TO_G_PARENT',lock
          assert lock.get('repair_prerequisite')=='recovery/BG_SUPERSEDING_LINEAGE_PACKET.md',lock
          (R/'CLOSEOUT.md').write_text(f'''# {rid} B-first prerequisite closeout

## Result

**BLOCKED BEFORE PRIMARY EXECUTION.** The recovered repair packet requires B -> C -> D -> E -> F -> G. No G recombination physics was executed.

## Strongest supported claim

The exact prior B-G corpus is recovered as REPLAY_REQUIRED and the superseding replay order is fixed.

## Strongest unsupported claim

No superseding B-to-G physical handoff chain or repaired recombination/visibility state is established by this shell.
''',encoding='utf-8')
          PY
          python tools/rfc.py close-run --run-id "$RID" --result BLOCKED --closeout "modules/G/runs/$RID/CLOSEOUT.md"
          python tools/repair_superseding_lineage_frontier.py
          python tools/rfc.py reopen-module B --fidelity PRODUCTION --evidence recovery/BG_SUPERSEDING_LINEAGE_PACKET.md

      - name: Canonicalize B-115 foundation
        if: steps.state.outputs.mode != 'DONE'
        run: |
          CANON=B-115-20260808T060000Z
          CURRENT=$(python - <<'PY'
          import json; print(json.load(open('STATE.json')).get('current_run') or '')
          PY
          )
          if [ -n "$CURRENT" ] && [ "$CURRENT" != "$CANON" ]; then
            python - "$CURRENT" <<'PY'
          import json,sys
          from pathlib import Path
          rid=sys.argv[1]; R=Path('modules/B/runs')/rid; run=json.load(open(R/'run.json')); assert run['status']=='CREATED',run
          assert not (R/'primary/FOUR_SECTOR_GENESIS_STATE.json').exists()
          (R/'CLOSEOUT.md').write_text(f'''# {rid} superseded workspace closeout

## Result

**BLOCKED / SUPERSEDED BEFORE PRIMARY EXECUTION.** The canonical fixed B-115 replay workspace replaces this empty workspace.

## Strongest supported claim

No scientific output from this workspace is promoted.

## Strongest unsupported claim

This workspace establishes no superseding B-to-C handoff.
''',encoding='utf-8')
          PY
            python tools/rfc.py close-run --run-id "$CURRENT" --result BLOCKED --closeout "modules/B/runs/$CURRENT/CLOSEOUT.md"
            CURRENT=''
          fi
          if [ -z "$CURRENT" ]; then
            if [ -d "modules/B/runs/$CANON" ]; then
              python - <<'PY'
          import json
          r=json.load(open('modules/B/runs/B-115-20260808T060000Z/run.json')); assert r['status']=='CREATED',r
          p='STATE.json'; s=json.load(open(p)); s['current_run']='B-115-20260808T060000Z'; s['modules']['B']['active_run']='B-115-20260808T060000Z'; open(p,'w').write(json.dumps(s,indent=2)+'\n')
          PY
            else
              python tools/rfc.py new-run B --run-id "$CANON"
            fi
          fi
          python tools/director.py prepare-active
          STATUS=$(python - <<'PY'
          import json,pathlib
          p=pathlib.Path('modules/B/runs/B-115-20260808T060000Z/PRE_EXECUTION_LOCK.json')
          print(json.load(open(p)).get('status','') if p.exists() else '')
          PY
          )
          if [ "$STATUS" != FROZEN ]; then python tools/execute_b115.py prepare --run "modules/B/runs/$CANON"; fi
          python tools/rfc.py context
          python tools/rfc.py doctor
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Freeze canonical B-115 superseding replay foundation'
            git pull --rebase origin agent/frontier-050-execution
            git push origin HEAD:agent/frontier-050-execution
          fi

      - name: Execute and finalize B-115
        if: steps.state.outputs.mode != 'DONE'
        run: |
          git fetch origin agent/frontier-050-execution
          git reset --hard origin/agent/frontier-050-execution
          R=modules/B/runs/B-115-20260808T060000Z
          LOCK_SHA=$(git log -n 1 --format=%H -- "$R/PRE_EXECUTION_LOCK.json")
          test -n "$LOCK_SHA"
          python tools/execute_b115.py execute --run "$R"
          rm -rf /tmp/b115-lock /tmp/b115-replay
          git worktree add --detach /tmp/b115-lock "$LOCK_SHA"
          cd /tmp/b115-lock
          python tools/execute_b115.py execute --run "$R" --output-root /tmp/b115-replay
          cd "$GITHUB_WORKSPACE"
          python tools/execute_b115.py finalize --run "$R" --replay-root /tmp/b115-replay
          python tools/normalize_b115_output_contract.py
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          R=Path('modules/B/runs/B-115-20260808T060000Z'); c=json.load(open(R/'OUTPUT_CONTRACT.json')); rows=[]
          for rec in c['required_outputs']:
              ev=[]
              for rel in rec['artifact_paths']:
                  p=Path(rel); assert p.is_file(),rel
                  ev.append({'path':rel,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
              rows.append({'requirement':rec['name'],'status':'PASS','semantic_check':'Exact B-115 sector-completion output is artifact-backed, independently reconstructed, cleanly replayed and child-ready under the frozen superseding contract.','evidence':ev})
          (R/'OUTPUT_COMPLETENESS.json').write_text(json.dumps({'schema_version':'1.0','run_id':'B-115-20260808T060000Z','module':'B','overall':'PASS','required_outputs':rows},indent=2)+'\n')
          PY
          python tools/refinalize_run_manifest.py --run "$R"
          python tools/rfc.py doctor
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan

      - name: Close B and activate C
        if: steps.state.outputs.mode != 'DONE'
        run: |
          R=modules/B/runs/B-115-20260808T060000Z
          python tools/rfc.py close-run --run-id B-115-20260808T060000Z --result PASS --closeout "$R/CLOSEOUT.md"
          python tools/rfc.py promote-module B --to FORMALIZED --fidelity PRODUCTION --evidence "$R/FROZEN_DERIVATION_SPEC.json"
          python tools/rfc.py promote-module B --to IMPLEMENTED --fidelity PRODUCTION --evidence "$R/primary/FOUR_SECTOR_GENESIS_STATE.json"
          python tools/rfc.py promote-module B --to VERIFIED --fidelity PRODUCTION --evidence "$R/GATE_RESULTS.json"
          python tools/rfc.py promote-module B --to PHYSICALLY_EXECUTED --fidelity PRODUCTION --evidence "$R/primary/FOUR_SECTOR_GENESIS_STATE.json"
          python tools/rfc.py promote-module B --to INDEPENDENTLY_REPRODUCED --fidelity PRODUCTION --evidence "$R/independent/INDEPENDENT_RECONSTRUCTION.json"
          python tools/rfc.py promote-module B --to FROZEN --fidelity PRODUCTION --evidence modules/B/frozen/H_B_to_C_v2.json
          python tools/rfc.py freeze modules/B/frozen/H_B_to_C_v2.json --kind MODULE_HANDOFF
          python tools/rfc.py record-claim --file "$R/CLAIM_RECORD.json"
          python tools/rfc.py advance --task B-115 --result PASS --evidence "$R/CLOSEOUT.md" --note 'Exact four-sector B repair closed; activate only C-125.'
          python tools/rfc.py context
          python tools/rfc.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Close B-115 and activate channel-complete microscopic replay C-125'
          git pull --rebase origin agent/frontier-050-execution
          git push origin HEAD:agent/frontier-050-execution
          SHA=$(git rev-parse HEAD)
          python tools/rfc.py record-commit "$SHA" --branch agent/frontier-050-execution --note 'Verified B-first repair: exact four-sector B-115 completion, final child-ready manifest, PRODUCTION freeze and one-child C-125 activation.'
          python tools/rfc.py context
          git add STATE.json memory/DECISION_LOG.jsonl memory/CURRENT_CONTEXT.md
          git commit -m 'Record verified B-115 repair closeout'
          git pull --rebase origin agent/frontier-050-execution
          git push origin HEAD:agent/frontier-050-execution

      - name: Reconcile DONE state
        if: steps.state.outputs.mode == 'DONE'
        run: |
          R=modules/B/runs/B-115-20260808T060000Z
          python tools/refinalize_run_manifest.py --run "$R" --reconcile-closed-registration
          python tools/rfc.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$R/GENERATED_OUTPUT_MANIFEST.json" memory/RUN_INDEX.json memory/ARTIFACT_REGISTRY.json
          if ! git diff --cached --quiet; then
            git commit -m 'Reconcile final B-115 manifest and run registration'
            git pull --rebase origin agent/frontier-050-execution
            git push origin HEAD:agent/frontier-050-execution
          fi

      - name: Final verification
        run: |
          git fetch origin agent/frontier-050-execution
          git reset --hard origin/agent/frontier-050-execution
          python - <<'PY'
          import json
          s=json.load(open('STATE.json')); q={x['id']:x for x in json.load(open('WORK_QUEUE.json'))['items']}
          assert s['active_work_unit']=='C-125' and s['current_module']=='C' and s['current_run'] is None,s
          assert s['modules']['B']['evidence_state']=='FROZEN' and s['modules']['B']['fidelity']=='PRODUCTION',s['modules']['B']
          assert json.load(open('modules/B/runs/B-115-20260808T060000Z/run.json'))['status']=='PASS'
          assert q['B-115']['status']=='PASS' and q['C-125']['status']=='ACTIVE'
          PY
          python tools/rfc.py doctor
