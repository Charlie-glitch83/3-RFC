name: Advance Verified C120 to D130

on:
  pull_request:
    types: [opened, reopened]
    branches:
      - agent/frontier-050-execution

permissions:
  contents: write

jobs:
  advance-c120:
    if: github.event.pull_request.head.ref == 'agent/c120-advance-trigger'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout execution branch
        uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install repository execution dependencies
        run: python -m pip install --disable-pip-version-check numpy networkx scipy sympy
      - name: Advance only the verified direct child
        shell: bash
        run: |
          set -euo pipefail
          VERIFIED_C='4645aefed4d3d1bc1e2462f44ab12082dbb291c8'
          git merge-base --is-ancestor "$VERIFIED_C" HEAD
          python - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path('STATE.json').read_text())
          queue=json.loads(Path('WORK_QUEUE.json').read_text())
          c=state['modules']['C']
          if c.get('evidence_state')!='FROZEN' or c.get('fidelity')!='MINIMAL_SPINE':
              raise SystemExit('HARD STOP: C is not FROZEN/MINIMAL_SPINE')
          if 'C-120-20260807T032543Z' not in c.get('completed_runs',[]):
              raise SystemExit('HARD STOP: verified C run not registered')
          run=json.loads(Path('modules/C/runs/C-120-20260807T032543Z/run.json').read_text())
          if run.get('status')!='PASS': raise SystemExit('HARD STOP: C run not PASS')
          items={i['id']:i for i in queue['items']}
          if items['C-120']['status']!='ACTIVE' or items['D-130']['status']!='BLOCKED':
              raise SystemExit('HARD STOP: expected C ACTIVE and D BLOCKED before one-child advance')
          PY
          python tools/rfc.py doctor
          python tools/rfc.py advance --task C-120 --result PASS --evidence modules/C/runs/C-120-20260807T032543Z/CLOSEOUT.md --note 'Externally verified C closeout commit 4645aefed4d3d1bc1e2462f44ab12082dbb291c8; activate exactly one direct child D-130.'
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          p=Path('STATE.json'); state=json.loads(p.read_text())
          if state.get('active_work_unit')!='D-130' or state.get('current_module')!='D':
              raise SystemExit('HARD STOP: D-130 was not sole activated child')
          state['strongest_supported_claim']='The exact frozen B first physical state supports a parent-derived dimensionless microscopic constitution M_C=I-Q_B with one conserved uniform mode, an exactly degenerate positive internal excitation doublet, O(2) internal law symmetry, conserved total carrier, deterministic prethermal populations, and unitary dimensionless internal phase evolution at MINIMAL_SPINE fidelity.'
          state['strongest_unsupported_claim']='No dimensionful masses, empirical particle identities, calibrated couplings, metric spacetime, nonequilibrium thermal history, or Standard Model correspondence has been derived.'
          state['last_verified_commit']='4645aefed4d3d1bc1e2462f44ab12082dbb291c8'
          state['last_verified_branch']='agent/frontier-050-execution'
          state['last_updated_utc']=datetime.now(timezone.utc).isoformat()
          p.write_text(json.dumps(state,indent=2,ensure_ascii=False)+'\n')
          PY
          python tools/rfc.py context
          python tools/director.py prepare-active
          python tools/director.py doctor
          python tools/rfc.py doctor
          python tools/rfc.py firewall-scan
          python -m unittest discover -s tests -v
      - name: Commit separate verified advancement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name '3-RFC governed executor'
          git config user.email 'actions@users.noreply.github.com'
          git add STATE.json WORK_QUEUE.json memory work_packets/ACTIVE_WORK_PACKET.md
          if git diff --cached --quiet; then echo 'HARD STOP: no advancement changes'; exit 1; fi
          git commit -m 'Advance from verified Module C closeout to D-130'
          git push origin HEAD:agent/frontier-050-execution
          git rev-parse HEAD
