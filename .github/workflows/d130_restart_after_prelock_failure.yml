name: Restart D-130 after incomplete prelock

on:
  push:
    branches: [agent/frontier-050-execution]
    paths: ['.github/d130-restart-trigger.txt']

permissions:
  contents: write

jobs:
  restart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements-lock.txt
      - name: Preserve failure and close old run
        shell: bash
        run: |
          set -euo pipefail
          run=modules/D/runs/D-130-20260807T044911Z
          cat > "$run/CLOSEOUT.md" <<'EOF'
          # D-130 pre-execution failure closeout

          Result: FAIL before primary numerical execution.

          The run correctly froze exact parent/source hashes and candidate classes, then executed the two required manufactured Wolfram calls. During the post-lock audit, the frozen PRE_EXECUTION_LOCK was found not to explicitly freeze the intrinsic execution interval, the bound `max_step`, or the preregistered refinement matrix. Those are numerical/stopping controls and therefore cannot be added after derivation execution under the repository no-retune rule.

          No configured D transport solver, physical thermal history, phase-event law, physical temperature law, or Module D PASS claim was executed or accepted in this run. The exact C parent, source hashes, candidate classes, and the physical-temperature/clock obstruction remain valid inputs for a fresh run; the incomplete lock itself is preserved as failed evidence only.

          Strongest supported claim: exact C admits a lawful dimensionless linear relaxation family up to intrinsic clock reparameterization, while nonlinear transport remains underdetermined and no physical temperature/clock/phase threshold is supplied by C.

          Strongest unsupported claim: a complete generated RFC physical thermal history suitable for Module E has not been established.
          EOF
          cat >> "$run/FAILURES.jsonl" <<'EOF'
          {"failure_id":"D130-INCOMPLETE-PRELOCK-001","category":"PRE_EXECUTION_LOCK_INCOMPLETE","description":"Intrinsic execution interval, bound max_step, and refinement matrix were not explicitly frozen before required Wolfram derivation execution.","earliest_affected_object":"PRE_EXECUTION_LOCK.json","changes_frozen_science":false,"required_replay_scope":"fresh D-130 run from exact H_C_to_D parent","preserved_old_results_as_parents":false}
          EOF
          python tools/rfc.py close-run --run-id D-130-20260807T044911Z --result FAIL --closeout "$run/CLOSEOUT.md"
      - name: Start fresh authorized D-130 run
        shell: bash
        run: |
          set -euo pipefail
          bash tools/start_work.sh
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('STATE.json').read_text())
          assert s['active_work_unit']=='D-130'
          assert s['current_module']=='D'
          assert s['current_run'] and s['current_run']!='D-130-20260807T044911Z'
          print('NEW_RUN='+s['current_run'])
          PY
      - name: Validate and commit restart
        shell: bash
        run: |
          set -euo pipefail
          python tools/director.py doctor
          rm -f .github/d130-restart-trigger.txt .github/workflows/d130_restart_after_prelock_failure.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Preserve incomplete D-130 prelock attempt and restart D-130'
          git push origin HEAD:agent/frontier-050-execution
