name: Prepare FRONTIER-050 governed workspace

on:
  push:
    branches: [agent/frontier-050-execution]
    paths:
      - '.github/frontier-050-startup-trigger.txt'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements-lock.txt
      - name: Follow root README startup exactly
        shell: bash
        run: |
          set -euo pipefail
          bash bootstrap.sh
          bash tools/start_work.sh
      - name: Commit governed workspace
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add STATE.json memory work_packets runs
          git diff --cached --quiet && { echo 'No startup changes produced'; exit 1; }
          git commit -m 'Prepare FRONTIER-050 governed workspace'
          git push origin HEAD:agent/frontier-050-execution
