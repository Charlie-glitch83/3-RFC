name: One-use D130 reference check

on:
  pull_request:
    branches:
      - agent/frontier-050-execution

permissions:
  contents: write

jobs:
  reference:
    if: github.event.pull_request.head.ref == 'ops/readme-exact-startup-20260807c'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install repository requirements
        shell: bash
        run: python -m pip install -r requirements-lock.txt
      - name: Run exact D130 reference check
        shell: bash
        run: python tools/run_reference_checks.py --module D --output modules/D/runs/D-130-20260807T053432Z/reference_checks.json
      - name: Commit reference check and remove carrier
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/d130_reference_check.yml
          git config user.name '3-RFC governed executor'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Record D130 manufactured reference check'
          git pull --rebase origin agent/frontier-050-execution
          git push origin HEAD:agent/frontier-050-execution
