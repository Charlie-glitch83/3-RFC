name: F155 Child-Readiness Repair Once (Superseded)

on:
  push:
    branches:
      - agent/frontier-050-execution
    paths:
      - '.github/f155-repair-trigger.txt'

permissions:
  contents: read

jobs:
  superseded:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Superseded by recovery/BG_SUPERSEDING_LINEAGE_PACKET.md; canonical repair order is B -> C -> D -> E -> F -> G.'
