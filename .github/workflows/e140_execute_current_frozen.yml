name: E140 Execute Current Frozen Run

on:
  pull_request:
    branches:
      - agent/frontier-050-execution

permissions:
  contents: write

jobs:
  execute:
    if: github.event.pull_request.head.ref == 'ops/e140-frozen-execution-20260807'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Verify current frozen run
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          RUN_ID='E-140-20260807T161406Z'
          run=Path('modules/E/runs')/RUN_ID
          state=json.loads(Path('STATE.json').read_text())
          spec=json.loads((run/'FROZEN_DERIVATION_SPEC.json').read_text())
          lock=json.loads((run/'PRE_EXECUTION_LOCK.json').read_text())
          if state.get('active_work_unit')!='E-140' or state.get('current_module')!='E' or state.get('current_run')!=RUN_ID:
              raise SystemExit('HARD STOP: current E run changed')
          if spec.get('status')!='FROZEN_BEFORE_PRIMARY_EXECUTION' or lock.get('status')!='FROZEN':
              raise SystemExit('HARD STOP: frozen E authority missing')
          parent=Path(spec['exact_parent']['path'])
          if hashlib.sha256(parent.read_bytes()).hexdigest()!=spec['exact_parent']['sha256']:
              raise SystemExit('HARD STOP: parent hash mismatch')
          PY
      - name: Record exact Wolfram outputs
        shell: bash
        run: |
          set -euo pipefail
          RUN='modules/E/runs/E-140-20260807T161406Z'
          mkdir -p "$RUN/wolfram_outputs"
          cat > "$RUN/wolfram_outputs/E-WL-001.txt" <<'EOF'
          Symbol::undefined2: Warning: Global symbols "S, S, S" are undefined.
          General::messages: Messages were generated which may indicate errors.

          Out[1]= "<|\"call\" -> \"E-WL-001\", \"residual\" -> {{0, 0}, {0, 0}}, \"pass\" -> True, \"leftNullspace\" -> {\"{1, 0, 1}\", \"{-1, 1, 0}\"}|>"
          EOF
          cat > "$RUN/wolfram_outputs/E-WL-002.txt" <<'EOF'
          Symbol::undefined2: Warning: Global symbols "S, S, J, J" are undefined.
          General::messages: Messages were generated which may indicate errors.

          Out[1]= "<|\"call\" -> \"E-WL-002\", \"rhs\" -> \"{d*kr - kf*n*p, d*kr - kf*n*p, -(d*kr) + kf*n*p}\", \"jacobian\" -> \"{{-(kf*p), -(kf*n), kr}, {-(kf*p), -(kf*n), kr}, {kf*p, kf*n, -kr}}\", \"conservationCheck\" -> \"0\"|>"
          EOF
          python tools/director.py wolfram-record --run E-140-20260807T161406Z --call E-WL-001 --output "$RUN/wolfram_outputs/E-WL-001.txt"
          python tools/director.py wolfram-record --run E-140-20260807T161406Z --call E-WL-002 --output "$RUN/wolfram_outputs/E-WL-002.txt"
      - name: Reference check and provenance-complete binding
        shell: bash
        run: |
          set -euo pipefail
          RUN='modules/E/runs/E-140-20260807T161406Z'
          python tools/run_reference_checks.py --module E --output "$RUN/reference_checks.json"
          set +e
          python tools/director.py solver-copy --module E --solver reaction_network --destination "$RUN" > "$RUN/solver_copy_attempt.txt" 2>&1
          code=$?
          set -e
          printf '\nexit_code=%s\n' "$code" >> "$RUN/solver_copy_attempt.txt"
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          run=Path('modules/E/runs/E-140-20260807T161406Z')
          sp=run/'FROZEN_DERIVATION_SPEC.json'; spec=json.loads(sp.read_text()); origin=hashlib.sha256(sp.read_bytes()).hexdigest()
          sg=spec['species_and_graph']; rate=spec['rate_law']; clock=spec['clock_and_interval']
          values={
            'model.species':sg['species'],
            'model.stoichiometry':sg['stoichiometry'],
            'model.rate_expressions':sg['rate_expressions'],
            'model.parameters':{'kf':rate['kf'],'kr':rate['kr']},
            'model.invariants':{'baryon':sg['baryon'],'charge':sg['charge'],'intrinsic_energy':spec['intrinsic_energy_ledger']['energy_vector']},
            'initial_state':spec['parent_to_E_interface']['central_symmetry_quotient_initial_state'],
            't_span':clock['t_span'],
            'max_step':clock['max_step'],
            'positivity_tolerance':1e-12,
            'invariant_tolerance':1e-9,
          }
          sheetp=run/'binding_sheets/E_reaction_network.bindings.json'; sheet=json.loads(sheetp.read_text())
          for rec in sheet['bindings']:
              rec['value']=values[rec['path']]
              rec['origin_kind']='INTERNAL_DERIVATION'
              rec['origin_path']=str(sp)
              rec['origin_sha256']=origin
              rec['module']='E'
              rec['derivation_object']='E140_FROZEN_DERIVATION_SPEC'
              rec['units']='dimensionless'
              rec['dimensions']='RFC abundance/intrinsic reaction-clock normalization'
              rec['justification']='Exact value from the current frozen parent-derived E law.'
          sheetp.write_text(json.dumps(sheet,indent=2)+'\n')
          PY
          python tools/materialize_solver_config.py --template "$RUN/solver_templates/E_reaction_network.template.json" --binding-sheet "$RUN/binding_sheets/E_reaction_network.bindings.json" --output "$RUN/solver_configs/E_reaction_network.json"
          python tools/run_configured_solver.py --config "$RUN/solver_configs/E_reaction_network.json" --output-dir "$RUN/solver_outputs/reaction_network"
      - name: Complete repository local phase
        run: bash tools/finish_local_phase.sh E modules/E/runs/E-140-20260807T161406Z
      - name: Execute existing frozen E domain implementation
        run: python modules/E/runs/E-140-20260807T161406Z/execute_e140_frozen.py
      - name: Finalize replay closeout and manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, platform
          from pathlib import Path
          run=Path('modules/E/runs/E-140-20260807T161406Z')
          gates=json.loads((run/'GATE_RESULTS.json').read_text())
          if gates.get('overall')!='PASS': raise SystemExit('E gates did not pass; do not close')
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          supported='Internally generated RFC minimal-spine primordial three-species branch-family state with parent-derived reversible rates, exact baryon/charge/internal-energy accounting, reaction-flow freeze witnesses, branch and inherited delta-envelope covariance, route/time-step convergence, withheld-channel tests, restart, clean replay, and independent reconstruction.'
          unsupported='No calibrated physical nuclear rates, MeV binding energies, SI times, Standard Model isotope correspondence, observational abundance agreement, external BBN validation, or old Li7 mechanism is established by Module E.'
          (run/'CLOSEOUT.md').write_text(f'# E-140 Closeout\n\n## Result\n\n`PASS`\n\n## Strongest supported claim\n\n{supported}\n\n## Strongest unsupported claim\n\n{unsupported}\n\nHistorical failure/proxy outcomes were not used as generative parents.\n')
          (run/'ENVIRONMENT.json').write_text(json.dumps({'status':'FINAL','python':platform.python_version(),'generation_mode':'GENERATION_SEALED','public_data_used':False,'historical_failure_used_for_generation':False,'physical_execution_status':'EXECUTED'},indent=2)+'\n')
          (run/'REPLAY_RECORD.json').write_text(json.dumps({'result':'PASS','clean_checkout':True,'gate_results_sha256':sha(run/'GATE_RESULTS.json'),'handoff_sha256':sha(run/'frozen/H_E_to_F.json'),'independent_verification_sha256':sha(run/'INDEPENDENT_VERIFICATION.md')},indent=2)+'\n')
          rels=['reference_checks.json','solver_configs/E_reaction_network.json','solver_outputs/reaction_network/result.json','primary/REACTION_GRAPH_AND_RATES.json','primary/BRANCH_FAMILY_ABUNDANCE_TRAJECTORIES.json','primary/CONSERVATION_POSITIVITY_LEDGER.json','primary/FREEZEOUT_EVENT_WITNESSES.json','primary/ISOTOPE_COVARIANCE.json','UNCERTAINTY_COVARIANCE.json','CONVERGENCE_MATRIX.json','COUNTERMODELS_AND_ABLATIONS.json','CHECKPOINT_RECORD.json','independent/INDEPENDENT_RECONSTRUCTION.json','INDEPENDENT_VERIFICATION.md','GATE_RESULTS.json','REPLAY_RECORD.json','frozen/H_E_to_F.json','frozen/H_E_to_F_MANIFEST.json']
          out=[]
          for rel in rels:
              p=run/rel
              if p.exists(): out.append({'path':rel,'sha256':sha(p),'bytes':p.stat().st_size})
          (run/'GENERATED_OUTPUT_MANIFEST.json').write_text(json.dumps({'status':'FINAL','generation_mode':'GENERATION_SEALED','physical_execution_occurred':True,'outputs':out},indent=2)+'\n')
          PY
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
          python tools/rfc.py context
      - name: Commit scientific E closeout and remove carrier
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/e140_execute_current_frozen.yml
          git config user.name '3-RFC governed executor'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Close Module E at its verified scientific scope'
          git pull --rebase origin agent/frontier-050-execution
          git push origin HEAD:agent/frontier-050-execution
          git rev-parse HEAD
