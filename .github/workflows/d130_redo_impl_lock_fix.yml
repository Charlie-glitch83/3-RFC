name: D130 Redo Implementation Lock Correction

on:
  pull_request:
    branches:
      - agent/frontier-050-execution

permissions:
  contents: write

jobs:
  correct:
    if: github.event.pull_request.head.ref == 'ops/d130-redo-impl-lock-fix-20260807'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify science unchanged and correct committed implementation hashes
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile modules/D/runs/D-130-20260807T220342Z/execute_d130_physical.py modules/D/runs/D-130-20260807T220342Z/independent_reconstruct_d130.py
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          run=Path('modules/D/runs/D-130-20260807T220342Z')
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          snap=json.loads((run/'PRE_EXECUTION_SNAPSHOT.json').read_text())
          if sha(run/'FROZEN_DERIVATION_SPEC.json')!=snap['derivation_sha256']:
              raise SystemExit('HARD STOP: frozen D science changed')
          impl=json.loads((run/'IMPLEMENTATION_LOCK.json').read_text())
          actual=[]
          for rec in impl['implementations']:
              rec['sha256']=sha(rec['path'])
              actual.append({'path':rec['path'],'sha256':rec['sha256'],'role':rec['role']})
          impl['status']='FROZEN_BEFORE_PRIMARY_EXECUTION'
          impl['primary_execution_occurred_at_lock']=False
          impl['correction_basis']='GitHub Actions run 31224209866 stopped before Wolfram/reference/primary execution because locally staged hash strings did not match the actual committed GitHub bytes. Only implementation hashes are corrected.'
          (run/'IMPLEMENTATION_LOCK.json').write_text(json.dumps(impl,indent=2)+'\n')
          failure={
            'failure_id':'D130_REDO_PREEXEC_IMPLEMENTATION_HASH_001',
            'classification':'IMPLEMENTATION_ONLY_PREEXECUTION',
            'actions_run':31224209866,
            'failure':'Committed implementation bytes differed from hashes calculated from the local staging copies.',
            'resolution':'Compiled the actual committed scripts and froze SHA-256 from those exact repository bytes.',
            'actual_implementations':actual,
            'scientific_change':False,
            'primary_execution_occurred':False
          }
          p=run/'implementation_corrections/D130_REDO_PREEXEC_IMPLEMENTATION_HASH_001.json'
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(failure,indent=2)+'\n')
          with (run/'FAILURES.jsonl').open('a') as f: f.write(json.dumps(failure,separators=(',',':'))+'\n')
          print(json.dumps(failure,indent=2))
          PY
          python tools/director.py doctor
      - name: Commit corrected implementation lock
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/d130_redo_impl_lock_fix.yml
          git config user.name '3-RFC governed executor'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Correct D-130 pre-execution implementation hashes'
          git pull --rebase origin agent/frontier-050-execution
          git push origin HEAD:agent/frontier-050-execution
          git rev-parse HEAD
