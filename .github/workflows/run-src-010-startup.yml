name: Execute SRC-010 admission

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  execute:
    if: github.head_ref == 'agent/src-010-execution'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/src-010-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements-lock.txt
      - name: Run exact SRC-010 commands
        shell: bash
        run: |
          set -euo pipefail
          python tools/rfc.py admit-seed
          python tools/rfc.py doctor
      - name: Commit exact SRC-010 outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sources memory/SOURCE_REGISTRY.json
          find runs -maxdepth 1 -type d -name 'SRC-010-*' -print0 | xargs -0 -r git add --
          if git diff --cached --quiet; then
            echo 'No SRC-010 output changes to commit.'
          else
            git commit -m 'Admit and lock the core RFC source corpus'
            git push origin agent/src-010-execution
          fi
