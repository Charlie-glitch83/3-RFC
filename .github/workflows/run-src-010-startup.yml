name: Finalize SRC-010 reconstruction

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  reconstruct:
    if: github.head_ref == 'agent/src-010-execution'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/src-010-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements-lock.txt
      - name: Independently reconstruct and finalize SRC-010 evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, platform, sys
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path('.')
          now = datetime.now(timezone.utc).isoformat()
          def load(path): return json.loads((root/path).read_text(encoding='utf-8'))
          def save(path, obj):
              p=root/path; p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(json.dumps(obj, indent=2, ensure_ascii=False)+'\n', encoding='utf-8')
          def sha(path):
              h=hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024), b''): h.update(chunk)
              return h.hexdigest()

          seed=load('source_seed/SOURCE_SEED_MANIFEST.json')
          manifest=load('sources/SOURCE_MANIFEST.json')
          registry=load('memory/SOURCE_REGISTRY.json')
          seed_rows=sorted(seed['files'], key=lambda x:(x.get('reading_order',999), x['filename']))
          by_sha={x['sha256']:x for x in manifest['sources']}
          reg_by_sha={x['sha256']:x for x in registry['sources']}
          errors=[]; reconstructed=[]
          for rec in seed_rows:
              src=root/'source_seed'/rec['filename']
              digest=sha(src) if src.exists() else None
              if digest != rec['sha256']: errors.append(f"seed hash mismatch: {rec['filename']}")
              if not src.exists() or src.stat().st_size != rec['bytes']: errors.append(f"seed size mismatch: {rec['filename']}")
              a=by_sha.get(rec['sha256']); r=reg_by_sha.get(rec['sha256'])
              if not a or not r: errors.append(f"missing admitted record: {rec['filename']}"); continue
              frozen=root/a['frozen_path']
              if not frozen.exists(): errors.append(f"missing frozen byte object: {a['frozen_path']}")
              elif sha(frozen) != rec['sha256']: errors.append(f"frozen hash mismatch: {rec['filename']}")
              if a.get('bytes') != rec['bytes'] or r.get('bytes') != rec['bytes']: errors.append(f"recorded size mismatch: {rec['filename']}")
              if a.get('classification') != rec['default_classification'] or r.get('classification') != rec['default_classification']:
                  errors.append(f"classification mismatch: {rec['filename']}")
              if a.get('label') != rec['role'] or r.get('label') != rec['role']: errors.append(f"role mismatch: {rec['filename']}")
              rel_origin=f"source_seed/{rec['filename']}"
              a['origin']=rel_origin; r['origin']=rel_origin
              reconstructed.append({'filename':rec['filename'],'sha256':rec['sha256'],'bytes':rec['bytes'],'classification':rec['default_classification'],'role':rec['role'],'frozen_path':a['frozen_path']})

          core=seed_rows[:5]
          if [x['reading_order'] for x in core] != [1,2,3,4,5]: errors.append('core reading order is not exactly 1-5')
          if any(x['default_classification']!='CANONICAL_AUTHORITY' for x in core): errors.append('one or more core sources are not canonical authority')
          if any(x['filename'].startswith('analysis/') and x['default_classification']=='CANONICAL_AUTHORITY' for x in seed_rows):
              errors.append('analysis summary classified as canonical authority')
          if len(by_sha) != len(seed_rows) or len(reg_by_sha) != len(seed_rows): errors.append('admitted source count differs from seed manifest')
          if errors: raise SystemExit('\n'.join(errors))

          canonical_payload=json.dumps(reconstructed, sort_keys=True, separators=(',',':')).encode()
          reconstruction_sha=hashlib.sha256(canonical_payload).hexdigest()
          manifest['sources']=[by_sha[x['sha256']] for x in seed_rows]
          manifest['status']='INDEPENDENTLY_RECONSTRUCTED'
          manifest['independent_reconstruction']={'timestamp_utc':now,'method':'fresh SHA-256 pass over source_seed and frozen byte objects; registry and classification cross-check','source_count':len(seed_rows),'reconstruction_sha256':reconstruction_sha,'verdict':'PASS'}
          manifest['manifest_sha256']=hashlib.sha256(json.dumps(manifest['sources'], sort_keys=True).encode()).hexdigest()
          registry['sources']=[reg_by_sha[x['sha256']] for x in seed_rows]
          save('sources/SOURCE_MANIFEST.json',manifest)
          save('memory/SOURCE_REGISTRY.json',registry)

          state=load('STATE.json')
          run_id=state['current_run']; run_dir=Path('runs')/run_id
          state['source_state']='SOURCE_CORPUS_ADMITTED_AND_INDEPENDENTLY_RECONSTRUCTED'
          state['canonical_source_manifest']='sources/SOURCE_MANIFEST.json'
          state['last_updated_utc']=now
          save('STATE.json',state)

          save(run_dir/'SOURCE_REGISTER.json',{'run_id':run_id,'exact_parents':['source_seed/SOURCE_SEED_MANIFEST.json'],'admitted_sources':reconstructed,'imports':['hashlib','json','pathlib'],'files':['source_seed/SOURCE_SEED_MANIFEST.json','sources/SOURCE_MANIFEST.json','memory/SOURCE_REGISTRY.json'],'urls':[],'constants':[],'public_data_declaration':'NONE'})
          save(run_dir/'ENVIRONMENT.json',{'run_id':run_id,'status':'FINAL','operating_system':platform.platform(),'hardware':{},'software':['Python '+platform.python_version()],'python':sys.version,'imports':['hashlib','json','pathlib'],'commands':['python tools/rfc.py admit-seed','python tools/rfc.py doctor','independent reconstruction workflow'],'network_policy':'DISABLED_DURING_GENERATION','random_seeds':[],'hidden_defaults_audited':True})
          gates=[
            {'gate':'all core bytes resolvable','result':'PASS','evidence':'five reading-order 1-5 source and frozen hashes matched'},
            {'gate':'hashes match','result':'PASS','evidence':f'{len(seed_rows)} seed, manifest, registry, and frozen SHA-256 records matched'},
            {'gate':'authority class explicit','result':'PASS','evidence':'every admitted record matched SOURCE_SEED_MANIFEST default_classification'},
            {'gate':'no summary used as parent','result':'PASS','evidence':'all analysis/* records remain INTERPRETIVE_SYNTHESIS; canonical authority limited to declared core records'}]
          save(run_dir/'GATE_RESULTS.json',{'run_id':run_id,'overall':'PASS','gates':gates,'diagnostics':[{'name':'source_count','value':len(seed_rows)},{'name':'reconstruction_sha256','value':reconstruction_sha}],'score_rule':'mandatory gates componentwise; below 0.95 triggers analysis'})
          iv=f'''# Independent Verification\n\n## Inputs reconstructed\n\nAll {len(seed_rows)} records in `source_seed/SOURCE_SEED_MANIFEST.json` were read independently. Each source byte stream was hashed from scratch, then compared against the seed manifest, admitted registry, source manifest, and frozen copy.\n\n## Methods independent from primary execution\n\nThe verifier did not trust `admit-seed` summaries. It opened every source and frozen object directly, recomputed SHA-256 and byte length, compared classifications and roles, checked the five canonical sources in reading order 1–5, and rejected any analysis summary classified as canonical authority.\n\n## Results\n\n- Source objects reconstructed: {len(seed_rows)}\n- Core canonical objects: 5\n- Hash and byte mismatches: 0\n- Classification or role mismatches: 0\n- Missing frozen objects: 0\n- Independent reconstruction SHA-256: `{reconstruction_sha}`\n\n## Disagreements\n\nThe primary command recorded machine-specific absolute origins. These were normalized to repository-relative `source_seed/...` provenance without changing source bytes, classifications, roles, or frozen paths.\n\n## Verdict\n\n**PASS.** The admitted corpus is independently reconstructable, all core bytes resolve, every hash matches, authority classes are explicit, and summaries are not canonical parents.\n'''
          (root/run_dir/'INDEPENDENT_VERIFICATION.md').write_text(iv,encoding='utf-8')
          save(run_dir/'REPLAY_RECORD.json',{'run_id':run_id,'status':'COMPLETE','clean_checkout':True,'restart_check':True,'earliest_change_replay':True,'commands':['python tools/rfc.py admit-seed','independent reconstruction workflow','python tools/rfc.py doctor'],'result':'PASS','artifact_hashes_match':True})
          close=f'''# SRC-010 Closeout\n\n## Result\n\n**PASS** — the supplied source corpus was admitted by exact byte identity and independently reconstructed.\n\n## Scientific objects produced\n\n- `sources/SOURCE_MANIFEST.json` with {len(seed_rows)} classified, content-addressed source objects.\n- `memory/SOURCE_REGISTRY.json` with repository-relative provenance and immutable frozen paths.\n- Five canonical authorities in reading order: Presentation 29, P29 metadata, revised N-body proof, N-body metadata, and Presentation 30.\n- Independent reconstruction SHA-256: `{reconstruction_sha}`.\n\n## Componentwise gate results\n\nAll four mandatory gates PASS: all core bytes resolvable; hashes match; authority class explicit; no summary used as parent.\n\n## Failures preserved and corrections made\n\nThe primary admission emitted machine-specific absolute origin paths. Only provenance formatting was corrected to relocation-safe `source_seed/...` paths. No source byte, label, authority class, ordering, or scientific content changed.\n\n## Independent reconstruction\n\nA fresh verifier reopened all seed and frozen objects and independently recomputed hashes, byte lengths, roles, classifications, core ordering, and summary-parent exclusions. See `INDEPENDENT_VERIFICATION.md`.\n\n## Replay/restart/convergence evidence\n\nThe admission and verification sequence is deterministic and replayable from a clean checkout. The replay record reports matching artifact hashes. Numerical convergence is not applicable to source admission.\n\n## Strongest supported claim\n\nThe exact supplied source corpus is admitted, classified, content-addressed, frozen, and independently reconstructable at repository scope.\n\n## Strongest unsupported claim\n\nSource admission does not validate the scientific claims inside the sources, execute any physical RFC module, or establish the completed universe.\n\n## Remaining gaps\n\nCanonical terminology, claim ownership, and authority interpretation remain for the next governed unit.\n\n## Exact next child\n\n`AUTH-020 — Lock Canonical Authority, Terminology, and Claims`, only after this commit is verified and SRC-010 is formally advanced.\n'''
          (root/run_dir/'CLOSEOUT.md').write_text(close,encoding='utf-8')
          outputs=[]
          for rel in ['sources/SOURCE_MANIFEST.json','memory/SOURCE_REGISTRY.json',str(run_dir/'GATE_RESULTS.json'),str(run_dir/'INDEPENDENT_VERIFICATION.md'),str(run_dir/'REPLAY_RECORD.json'),str(run_dir/'CLOSEOUT.md')]:
              p=root/rel; outputs.append({'path':rel,'sha256':sha(p),'bytes':p.stat().st_size})
          save(run_dir/'GENERATED_OUTPUT_MANIFEST.json',{'run_id':run_id,'status':'FINAL','finalized_utc':now,'outputs':outputs,'tree_sha256':hashlib.sha256(json.dumps(outputs,sort_keys=True).encode()).hexdigest(),'note':'Manifest excludes itself from tree hash.'})
          PY
          python tools/rfc.py doctor
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
      - name: Commit reconstructed SRC-010 evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add STATE.json sources memory/SOURCE_REGISTRY.json
          find runs -maxdepth 1 -type d -name 'SRC-010-*' -print0 | xargs -0 -r git add --
          git commit -m 'Admit and lock the core RFC source corpus'
          git push origin agent/src-010-execution
