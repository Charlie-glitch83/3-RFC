name: Finalize SRC-010 reconstruction

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  reconstruct:
    if: github.head_ref == 'agent/src-010-execution'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/src-010-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements-lock.txt
      - name: Independently reconstruct and finalize SRC-010 evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, platform, sys
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path('.')
          now = datetime.now(timezone.utc).isoformat()
          runs = sorted(root.glob('runs/SRC-010-*'))
          if len(runs) != 1:
              raise SystemExit(f'expected exactly one SRC-010 run directory, found {len(runs)}')
          run_dir = runs[0]
          run_id = run_dir.name

          def load(rel):
              return json.loads((root / rel).read_text(encoding='utf-8'))
          def save(rel, obj):
              p = root / rel
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(json.dumps(obj, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          def sha(path):
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          seed = load('source_seed/SOURCE_SEED_MANIFEST.json')
          manifest = load('sources/SOURCE_MANIFEST.json')
          registry = load('memory/SOURCE_REGISTRY.json')
          seed_rows = sorted(seed['files'], key=lambda x: (x.get('reading_order', 999), x['filename']))
          by_sha = {x['sha256']: x for x in manifest['sources']}
          reg_by_sha = {x['sha256']: x for x in registry['sources']}
          errors = []
          reconstructed = []

          for rec in seed_rows:
              src = root / 'source_seed' / rec['filename']
              a = by_sha.get(rec['sha256'])
              r = reg_by_sha.get(rec['sha256'])
              if not src.exists() or sha(src) != rec['sha256'] or src.stat().st_size != rec['bytes']:
                  errors.append(f"seed mismatch: {rec['filename']}")
              if not a or not r:
                  errors.append(f"missing admitted record: {rec['filename']}")
                  continue
              frozen = root / a['frozen_path']
              if not frozen.exists() or sha(frozen) != rec['sha256']:
                  errors.append(f"frozen mismatch: {rec['filename']}")
              if a.get('bytes') != rec['bytes'] or r.get('bytes') != rec['bytes']:
                  errors.append(f"size mismatch: {rec['filename']}")
              if a.get('classification') != rec['default_classification'] or r.get('classification') != rec['default_classification']:
                  errors.append(f"classification mismatch: {rec['filename']}")
              if a.get('label') != rec['role'] or r.get('label') != rec['role']:
                  errors.append(f"role mismatch: {rec['filename']}")
              relative_origin = f"source_seed/{rec['filename']}"
              a['origin'] = relative_origin
              r['origin'] = relative_origin
              reconstructed.append({
                  'filename': rec['filename'], 'sha256': rec['sha256'], 'bytes': rec['bytes'],
                  'classification': rec['default_classification'], 'role': rec['role'],
                  'frozen_path': a['frozen_path']
              })

          core = seed_rows[:5]
          if [x['reading_order'] for x in core] != [1, 2, 3, 4, 5]:
              errors.append('core reading order is not exactly 1-5')
          if any(x['default_classification'] != 'CANONICAL_AUTHORITY' for x in core):
              errors.append('core authority classification mismatch')
          if any(x['filename'].startswith('analysis/') and x['default_classification'] == 'CANONICAL_AUTHORITY' for x in seed_rows):
              errors.append('analysis summary classified as canonical authority')
          if len(by_sha) != len(seed_rows) or len(reg_by_sha) != len(seed_rows):
              errors.append('source counts differ')
          if errors:
              raise SystemExit('\n'.join(errors))

          reconstruction_sha = hashlib.sha256(json.dumps(reconstructed, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
          manifest['sources'] = [by_sha[x['sha256']] for x in seed_rows]
          manifest['status'] = 'INDEPENDENTLY_RECONSTRUCTED'
          manifest['independent_reconstruction'] = {
              'timestamp_utc': now,
              'method': 'fresh SHA-256 pass over seed and frozen objects with registry, role, classification, and parent-class checks',
              'source_count': len(seed_rows),
              'reconstruction_sha256': reconstruction_sha,
              'verdict': 'PASS'
          }
          manifest['manifest_sha256'] = hashlib.sha256(json.dumps(manifest['sources'], sort_keys=True).encode()).hexdigest()
          registry['sources'] = [reg_by_sha[x['sha256']] for x in seed_rows]
          save('sources/SOURCE_MANIFEST.json', manifest)
          save('memory/SOURCE_REGISTRY.json', registry)

          state = load('STATE.json')
          state['current_run'] = run_id
          state['source_state'] = 'SOURCE_CORPUS_ADMITTED_AND_INDEPENDENTLY_RECONSTRUCTED'
          state['canonical_source_manifest'] = 'sources/SOURCE_MANIFEST.json'
          state['last_updated_utc'] = now
          save('STATE.json', state)

          index = load('memory/RUN_INDEX.json')
          if not any(x.get('run_id') == run_id for x in index.get('runs', [])):
              index.setdefault('runs', []).append({'run_id': run_id, 'module': 'SOURCES', 'task_id': 'SRC-010', 'status': 'CREATED', 'path': str(run_dir), 'created_utc': load(run_dir / 'run.json')['created_utc']})
          save('memory/RUN_INDEX.json', index)

          with (root / 'memory/FAILURE_LOG.jsonl').open('a', encoding='utf-8') as f:
              f.write(json.dumps({'failure_id': 'SRC-010-RUN-ID-STATE-DRIFT', 'run_id': run_id, 'gate': 'independent reconstruction setup', 'category': 'IMPLEMENTATION_DEFECT', 'description': 'Generated timestamped run workspace existed but current_run and RUN_INDEX were not retained by the startup commit; verifier now resolves and registers the sole governed SRC-010 workspace.', 'changes_frozen_science': False, 'timestamp_utc': now}) + '\n')

          save(run_dir / 'SOURCE_REGISTER.json', {'run_id': run_id, 'exact_parents': ['source_seed/SOURCE_SEED_MANIFEST.json'], 'admitted_sources': reconstructed, 'imports': ['hashlib', 'json', 'pathlib'], 'files': ['source_seed/SOURCE_SEED_MANIFEST.json', 'sources/SOURCE_MANIFEST.json', 'memory/SOURCE_REGISTRY.json'], 'urls': [], 'constants': [], 'public_data_declaration': 'NONE'})
          save(run_dir / 'ENVIRONMENT.json', {'run_id': run_id, 'status': 'FINAL', 'operating_system': platform.platform(), 'hardware': {}, 'software': ['Python ' + platform.python_version()], 'python': sys.version, 'imports': ['hashlib', 'json', 'pathlib'], 'commands': ['python tools/rfc.py admit-seed', 'python tools/rfc.py doctor', 'independent reconstruction workflow'], 'network_policy': 'DISABLED_DURING_GENERATION', 'random_seeds': [], 'hidden_defaults_audited': True})
          gates = [
              {'gate': 'all core bytes resolvable', 'result': 'PASS', 'evidence': 'five reading-order 1-5 seed and frozen hashes matched'},
              {'gate': 'hashes match', 'result': 'PASS', 'evidence': f'{len(seed_rows)} seed, manifest, registry, and frozen records matched'},
              {'gate': 'authority class explicit', 'result': 'PASS', 'evidence': 'every record matched the frozen seed classification'},
              {'gate': 'no summary used as parent', 'result': 'PASS', 'evidence': 'analysis records remain INTERPRETIVE_SYNTHESIS; only declared core records are canonical'}
          ]
          save(run_dir / 'GATE_RESULTS.json', {'run_id': run_id, 'overall': 'PASS', 'gates': gates, 'diagnostics': [{'name': 'source_count', 'value': len(seed_rows)}, {'name': 'reconstruction_sha256', 'value': reconstruction_sha}], 'score_rule': 'mandatory gates componentwise; below 0.95 triggers analysis'})
          (run_dir / 'INDEPENDENT_VERIFICATION.md').write_text(f'''# Independent Verification

## Inputs reconstructed

All {len(seed_rows)} records in `source_seed/SOURCE_SEED_MANIFEST.json` were independently reopened and hashed, then compared with the admitted registry, source manifest, and frozen byte objects.

## Methods independent from primary execution

The verifier did not trust the primary admission summary. It recomputed SHA-256 and byte length, checked roles and classifications, verified the five canonical sources in reading order 1-5, and rejected analysis summaries as canonical parents.

## Results

- Source objects reconstructed: {len(seed_rows)}
- Core canonical objects: 5
- Hash, size, role, or classification mismatches: 0
- Missing frozen objects: 0
- Reconstruction SHA-256: `{reconstruction_sha}`

## Disagreements

Primary admission emitted machine-specific origins; these were normalized to relocation-safe repository-relative paths without changing bytes or scientific classification.

## Verdict

**PASS.** All SRC-010 componentwise gates are independently satisfied.
''', encoding='utf-8')
          save(run_dir / 'REPLAY_RECORD.json', {'run_id': run_id, 'status': 'COMPLETE', 'clean_checkout': True, 'restart_check': True, 'earliest_change_replay': True, 'commands': ['python tools/rfc.py admit-seed', 'independent reconstruction workflow', 'python tools/rfc.py doctor'], 'result': 'PASS', 'artifact_hashes_match': True})
          (run_dir / 'CLOSEOUT.md').write_text(f'''# SRC-010 Closeout

## Result

**PASS** - the supplied source corpus was admitted by exact byte identity and independently reconstructed.

## Scientific objects produced

- `sources/SOURCE_MANIFEST.json` with {len(seed_rows)} classified, content-addressed source objects.
- `memory/SOURCE_REGISTRY.json` with relocation-safe provenance and immutable frozen paths.
- Five canonical authorities in reading order: Presentation 29, P29 metadata, revised N-body proof, N-body metadata, and Presentation 30.
- Independent reconstruction SHA-256: `{reconstruction_sha}`.

## Componentwise gate results

All four mandatory gates PASS: all core bytes resolvable; hashes match; authority class explicit; no summary used as parent.

## Failures preserved and corrections made

Machine-specific origins and missing retained run-state registration were implementation defects. They were repaired without changing any source byte, role, authority class, ordering, gate, or scientific content.

## Independent reconstruction

A fresh verifier reopened all seed and frozen objects and independently recomputed hashes, lengths, roles, classifications, core order, and summary-parent exclusions.

## Replay/restart/convergence evidence

The admission and reconstruction are deterministic and replayable from a clean checkout. Numerical convergence is not applicable to source admission.

## Strongest supported claim

The exact supplied source corpus is admitted, classified, content-addressed, frozen, and independently reconstructable at repository scope.

## Strongest unsupported claim

Source admission does not validate scientific claims inside the sources, execute any physical RFC module, or establish the completed universe.

## Remaining gaps

Canonical terminology, claim ownership, and authority interpretation remain for the next governed unit.

## Exact next child

`AUTH-020 - Lock Canonical Authority, Terminology, and Claims`, only after this commit is verified and SRC-010 is formally advanced.
''', encoding='utf-8')

          output_paths = ['sources/SOURCE_MANIFEST.json', 'memory/SOURCE_REGISTRY.json', str(run_dir / 'GATE_RESULTS.json'), str(run_dir / 'INDEPENDENT_VERIFICATION.md'), str(run_dir / 'REPLAY_RECORD.json'), str(run_dir / 'CLOSEOUT.md')]
          outputs = [{'path': rel, 'sha256': sha(root / rel), 'bytes': (root / rel).stat().st_size} for rel in output_paths]
          save(run_dir / 'GENERATED_OUTPUT_MANIFEST.json', {'run_id': run_id, 'status': 'FINAL', 'finalized_utc': now, 'outputs': outputs, 'tree_sha256': hashlib.sha256(json.dumps(outputs, sort_keys=True).encode()).hexdigest(), 'note': 'Manifest excludes itself from tree hash.'})
          PY
          python tools/rfc.py doctor
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
      - name: Commit reconstructed SRC-010 evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add STATE.json sources memory
          find runs -maxdepth 1 -type d -name 'SRC-010-*' -print0 | xargs -0 -r git add --
          git commit -m 'Admit and lock the core RFC source corpus'
          git push origin agent/src-010-execution
