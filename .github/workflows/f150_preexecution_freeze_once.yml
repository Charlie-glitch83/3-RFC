name: F150 Governed Preexecution Freeze Once

on:
  pull_request:
    branches:
      - agent/frontier-050-execution
    paths:
      - '.github/f150-preexec-trigger.txt'

permissions:
  contents: write

jobs:
  freeze-f150:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install frozen dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-lock.txt
      - name: Verify exact active F frontier and parent
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          s=json.load(open('STATE.json'))
          assert s['active_work_unit']=='F-150',s
          assert s['current_module']=='F',s
          assert s['current_run']=='F-150-20260808T013006Z',s
          assert s['modules']['E']['evidence_state']=='FROZEN',s['modules']['E']
          p=Path('modules/E/frozen/H_E_to_F.json')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='975c4fcdfa2f4f861dd3085e14678116377bbe4d0fc23dd4e51f4373f9c2ecbf'
          d=json.load(open('modules/F/runs/F-150-20260808T013006Z/FROZEN_DERIVATION_SPEC.json'))
          assert d['status']=='FROZEN_PRE_EXECUTION',d
          assert d['direct_parent']['sha256']=='975c4fcdfa2f4f861dd3085e14678116377bbe4d0fc23dd4e51f4373f9c2ecbf'
          PY
      - name: Preserve failed verbatim F-WL-002 context and apply syntax-only correction
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          run=Path('modules/F/runs/F-150-20260808T013006Z')
          prog=Path('recipes/F/wolfram/F-WL-002.wl')
          original=prog.read_text()
          assert 'C = {{1, 1/4}, {1/4, 1/2}};' in original
          assert 'T.C.Transpose[T]' in original
          original_sha=hashlib.sha256(prog.read_bytes()).hexdigest()
          failed='''Symbol::undefined2: Warning: Global symbols "T, Cp, T, T, Cp, Cp, Cp, Cp" are undefined.\nSet::wrsym: Symbol C is Protected.\nGeneral::messages: Messages were generated which may indicate errors.\n\nOut[1]= "<|\\"call\\" -> \\"F-WL-002\\", \\"propagated\\" -> \\"{{1, a}, {0, 1}} . C . {{1, 0}, {a, 1}}\\", \\"principalMinors\\" -> {\\"{1, a}\\", \\"Det[{{1, a}, {0, 1}} . C . {{1, 0}, {a, 1}}]\\"}, \\"determinantPreservedNonnegative\\" -> False|>"\n'''
          evidence=run/'wolfram'/'F-WL-002'
          evidence.mkdir(parents=True,exist_ok=True)
          (evidence/'prelock_failed_verbatim_output.txt').write_text(failed)
          corrected=original.replace('C = {{1, 1/4}, {1/4, 1/2}};','cov = {{1, 1/4}, {1/4, 1/2}};').replace('T.C.Transpose[T]','T.cov.Transpose[T]')
          assert corrected != original
          prog.write_text(corrected)
          corrected_sha=hashlib.sha256(prog.read_bytes()).hexdigest()
          ledger={
            'schema_version':'1.0','run_id':'F-150-20260808T013006Z',
            'classification':'PRE_PRIMARY_IMPLEMENTATION_ONLY_CORRECTION',
            'context_reconstructed_before_correction':True,
            'frozen_science_changed':False,'scientific_definitions_changed':False,
            'species_changed':False,'reactions_changed':False,'coefficients_changed':False,
            'initial_state_changed':False,'integration_interval_changed':False,
            'tolerances_changed':False,'gates_changed':False,'falsifiers_changed':False,
            'claim_boundary_changed':False,
            'corrections':[{
              'id':'F150-WL-002-001','object':'recipes/F/wolfram/F-WL-002.wl',
              'original_sha256':original_sha,'corrected_sha256':corrected_sha,
              'change':'Rename the local covariance matrix symbol C to cov in its assignment and multiplication only.',
