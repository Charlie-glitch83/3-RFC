              'expected_corrected_result':{'principal_minor_1':'(2 + a + a^2)/2','determinant':'7/16','determinantPreservedNonnegative':True}
            }],
            'required_replay_scope':'Run the complete official F Wolfram sequence after PRE_EXECUTION_LOCK is frozen; then run the full frozen F numerical and verification matrix.'
          }
          (run/'IMPLEMENTATION_CORRECTION_LEDGER.json').write_text(json.dumps(ledger,indent=2)+'\n')
          PY
