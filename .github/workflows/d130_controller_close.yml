name: One-use D130 controller closeout

on:
  pull_request:
    branches:
      - agent/frontier-050-execution

permissions:
  contents: write

jobs:
  close:
    if: github.event.pull_request.head.ref == 'ops/readme-exact-startup-20260807c'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked requirements
        run: python -m pip install -r requirements-lock.txt
      - name: Record verified D130 evidence commit
        run: python tools/rfc.py record-commit 44ed126d494f41e0448e5e751b3b17b5d8f1848e --branch agent/frontier-050-execution --note 'Verified D130 closeout commit, fetched artifacts, diff, tests, doctor and firewall.'
      - name: Close D130 PASS run
        run: python tools/rfc.py close-run --run-id D-130-20260807T053432Z --result PASS --closeout modules/D/runs/D-130-20260807T053432Z/CLOSEOUT.md
      - name: Promote D through mandatory evidence states
        shell: bash
        run: |
          set -euo pipefail
          python tools/rfc.py promote-module D --to FORMALIZED --fidelity MINIMAL_SPINE --evidence modules/D/runs/D-130-20260807T053432Z/FROZEN_DERIVATION_SPEC.json
          python tools/rfc.py promote-module D --to IMPLEMENTED --fidelity MINIMAL_SPINE --evidence modules/D/runs/D-130-20260807T053432Z/solver_outputs/transport/result.json
          python tools/rfc.py promote-module D --to VERIFIED --fidelity MINIMAL_SPINE --evidence modules/D/runs/D-130-20260807T053432Z/GATE_RESULTS.json
          python tools/rfc.py promote-module D --to PHYSICALLY_EXECUTED --fidelity MINIMAL_SPINE --evidence modules/D/runs/D-130-20260807T053432Z/primary/THERMAL_DISTRIBUTION_HISTORY.json
          python tools/rfc.py promote-module D --to INDEPENDENTLY_REPRODUCED --fidelity MINIMAL_SPINE --evidence modules/D/runs/D-130-20260807T053432Z/INDEPENDENT_VERIFICATION.md
          python tools/rfc.py promote-module D --to FROZEN --fidelity MINIMAL_SPINE --evidence modules/D/runs/D-130-20260807T053432Z/frozen/H_D_to_E.json
      - name: Advance exactly one child
        run: python tools/rfc.py advance --task D-130 --result PASS --evidence modules/D/runs/D-130-20260807T053432Z/CLOSEOUT.md
      - name: Validate post-transition repository
        shell: bash
        run: |
          set -euo pipefail
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
          python tools/rfc.py context
      - name: Commit controller transition and remove carrier
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/d130_controller_close.yml
          git config user.name '3-RFC governed executor'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Advance verified D130 to E140'
          git pull --rebase origin agent/frontier-050-execution
          git push origin HEAD:agent/frontier-050-execution
