name: D130 Redo Freeze Observable Trigger

on:
  pull_request:
    branches:
      - agent/frontier-050-execution

permissions:
  contents: write

jobs:
  freeze:
    if: github.event.pull_request.head.ref == 'ops/d130-redo-freeze-trigger-20260807'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Execute the already-reviewed freeze payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/d130_redo_freeze_once.yml').read_text()
          marker="          python - <<'PY'\n"
          start=text.index(marker)+len(marker)
          end=text.index("\n          PY\n",start)
          block=text[start:end]
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          exec(compile(code,'d130_redo_freeze_once.yml','exec'),{})
          PY
          python tools/director.py doctor
      - name: Commit frozen D pre-execution package
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/d130_redo_freeze_once.yml .github/workflows/d130_redo_freeze_pr.yml
          git config user.name '3-RFC governed executor'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Freeze fresh D-130 parent-driven thermal law before execution'
          git pull --rebase origin agent/frontier-050-execution
          git push origin HEAD:agent/frontier-050-execution
          git rev-parse HEAD
