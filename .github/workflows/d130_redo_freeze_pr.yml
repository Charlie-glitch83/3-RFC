name: D130 Redo Freeze Observable Trigger

on:
  pull_request:
    branches:
      - agent/frontier-050-execution

permissions:
  contents: write

jobs:
  freeze:
    if: github.event.pull_request.head.ref == 'ops/d130-redo-freeze-trigger-20260807'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Execute corrected freeze payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          text=Path('.github/workflows/d130_redo_freeze_once.yml').read_text()
          marker="          python - <<'PY'\n"
          start=text.index(marker)+len(marker)
          end=text.index("\n          PY\n",start)
          block=text[start:end]
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          code=code.replace(",'docs/11_WOLFRAM_INTEGRATION.md'","")
          exec(compile(code,'d130_redo_freeze_once.yml','exec'),{})
          run=Path('modules/D/runs/D-130-20260807T220342Z')
          failure={
            'failure_id':'D130_REDO_PREEXEC_HELPER_STALE_DOC_001',
            'classification':'IMPLEMENTATION_ONLY_PREEXECUTION',
            'actions_runs':[31223415610,31223540127],
            'failure':'Freeze helper carried obsolete docs/11_WOLFRAM_INTEGRATION.md path that is not cited by the live D active packet; first correction was indentation-sensitive and therefore ineffective.',
            'resolution':'Removed only the obsolete helper authority token by exact token substitution after re-reading the live ACTIVE_WORK_PACKET.md. Frozen D scientific law, parent, coefficients, events, tolerances, gates and claim boundary unchanged.',
            'scientific_change':False,
            'primary_execution_occurred':False
          }
          (run/'IMPLEMENTATION_CORRECTION_LEDGER.json').write_text(json.dumps(failure,indent=2)+'\n')
          with (run/'FAILURES.jsonl').open('a') as f:
              f.write(json.dumps(failure,separators=(',',':'))+'\n')
          PY
          python tools/director.py doctor
      - name: Commit frozen D pre-execution package
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/d130_redo_freeze_once.yml .github/workflows/d130_redo_freeze_pr.yml
          git config user.name '3-RFC governed executor'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Freeze fresh D-130 parent-driven thermal law before execution'
          git pull --rebase origin agent/frontier-050-execution
          git push origin HEAD:agent/frontier-050-execution
          git rev-parse HEAD
