name: D130 Governed Startup

on:
  pull_request:
    types: [opened, reopened]
    branches:
      - agent/frontier-050-execution

permissions:
  contents: write

jobs:
  startup-d130:
    if: github.event.pull_request.head.ref == 'agent/d130-startup-trigger'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout execution branch
        uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install repository execution dependencies
        run: python -m pip install --disable-pip-version-check numpy networkx scipy sympy
      - name: Run root README startup exactly
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path('STATE.json').read_text())
          queue=json.loads(Path('WORK_QUEUE.json').read_text())
          items={i['id']:i for i in queue['items']}
          if state.get('active_work_unit')!='D-130' or state.get('current_module')!='D':
              raise SystemExit('HARD STOP: D-130 is not the sole active work unit')
          if state.get('current_run') is not None:
              raise SystemExit('HARD STOP: D run already exists; startup workflow is one-shot')
          if items['D-130']['status']!='ACTIVE' or items['E-140']['status']!='BLOCKED':
              raise SystemExit('HARD STOP: expected D ACTIVE and E BLOCKED')
          PY
          bash bootstrap.sh
          bash tools/start_work.sh
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
          python tools/rfc.py context
          python - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path('STATE.json').read_text())
          run=state.get('current_run')
          if not run or not run.startswith('D-130-'):
              raise SystemExit(f'HARD STOP: governed D run was not created: {run!r}')
          run_path=Path('modules/D/runs')/run
          if not run_path.is_dir(): raise SystemExit('HARD STOP: D run directory missing')
          if '__BIND_' not in (run_path/'binding_sheets'/'D_transport.bindings.json').read_text():
              raise SystemExit('HARD STOP: copied D binding sheet was unexpectedly pre-bound')
          print(run)
          PY
      - name: Commit governed startup artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name '3-RFC governed executor'
          git config user.email 'actions@users.noreply.github.com'
          git add STATE.json WORK_QUEUE.json memory work_packets/ACTIVE_WORK_PACKET.md modules/D/runs
          if git diff --cached --quiet; then echo 'HARD STOP: no governed startup changes'; exit 1; fi
          git commit -m 'Start governed D-130 run from root README'
          git push origin HEAD:agent/frontier-050-execution
          git rev-parse HEAD
