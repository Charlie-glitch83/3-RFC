name: E140 Wolfram Show

on:
  pull_request:
    branches:
      - agent/frontier-050-execution

permissions:
  contents: write

jobs:
  show:
    if: github.event.pull_request.head.ref == 'ops/readme-exact-startup-20260807c'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - name: Display exact frozen Wolfram calls
        shell: bash
        run: |
          set -euo pipefail
          python tools/director.py wolfram-show --call E-WL-001
          python tools/director.py wolfram-show --call E-WL-002
      - name: Remove display carrier
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/e140_wolfram_show.yml
          git config user.name '3-RFC governed executor'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Display exact E140 Wolfram calls'
          git pull --rebase origin agent/frontier-050-execution
          git push origin HEAD:agent/frontier-050-execution
