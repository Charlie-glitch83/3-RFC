name: One-shot fresh D130 full diagnostic execution

on:
  pull_request:
    branches:
      - agent/frontier-050-execution

permissions:
  contents: write

jobs:
  execute:
    if: github.event.pull_request.head.ref == 'ops/d130-fresh-execute-trigger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements-lock.txt

      - name: Freeze implementation hashes before primary execution
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          run=Path('modules/D/runs/D-130-20260807T045646Z')
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          state=json.loads(Path('STATE.json').read_text())
          lock=json.loads((run/'PRE_EXECUTION_LOCK.json').read_text())
          assert state['current_run']=='D-130-20260807T045646Z'
          assert state['active_work_unit']=='D-130'
          assert lock['status']=='FROZEN'
          obj={
            'schema_version':'1.0','run_id':'D-130-20260807T045646Z','status':'FROZEN_BEFORE_PRIMARY_EXECUTION',
            'frozen_utc':datetime.now(timezone.utc).isoformat(),
            'source_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'pre_execution_lock_sha256':sha(run/'PRE_EXECUTION_LOCK.json'),
            'derivation_spec_sha256':sha(run/'FROZEN_DERIVATION_SPEC.json'),
            'primary_implementation':{'path':str(run/'primary/execute_d130.py'),'sha256':sha(run/'primary/execute_d130.py')},
            'independent_implementation':{'path':str(run/'independent/independent_reconstruct_d130.py'),'sha256':sha(run/'independent/independent_reconstruct_d130.py')},
            'allowed_corrections':'implementation-only per frozen PRE_EXECUTION_LOCK; full frozen matrix rerun required'
          }
          (run/'IMPLEMENTATION_LOCK.json').write_text(json.dumps(obj,indent=2)+'\n')
          PY

      - name: Copy exact transport solver, bind provenance, and materialize
        shell: bash
        run: |
          set -euo pipefail
          run=modules/D/runs/D-130-20260807T045646Z
          python tools/director.py solver-copy --module D --solver transport --destination "$run"
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          run=Path('modules/D/runs/D-130-20260807T045646Z')
          parent=Path('modules/C/frozen/H_C_to_D.json')
          spec=run/'FROZEN_DERIVATION_SPEC.json'
          lock=run/'PRE_EXECUTION_LOCK.json'
          sheet=run/'binding_sheets/D_transport.bindings.json'
          pobj=json.loads(parent.read_text())
          sobj=json.loads(spec.read_text())
          lobj=json.loads(lock.read_text())
          data=json.loads(sheet.read_text())
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          c=lobj['numerical_controls']
          values={
            'model.state_names':(['p1','p2','p3'],spec,'INTERNAL_DERIVATION','D_NORMALIZED_TRANSPORT_STATE','dimensionless labels','3-state simplex'),
            'model.parameters':({},spec,'INTERNAL_DERIVATION','D_NO_FREE_RATE_AFTER_INTRINSIC_NORMALIZATION','dimensionless','none'),
            'model.rhs_expressions':(['-2*p1/3+p2/3+p3/3','p1/3-2*p2/3+p3/3','p1/3+p2/3-2*p3/3'],spec,'INTERNAL_DERIVATION','D_SELECTED_NORMALIZED_BRANCH','population per intrinsic-clock unit','dimensionless'),
            'model.initial_state':(pobj['prethermal_state']['node_populations'],parent,'EXACT_PARENT_ARTIFACT','H_C_to_D_PRETHERMAL_STATE','dimensionless probability','3'),
            'model.t_span':(c['execution_interval'],lock,'INTERNAL_DERIVATION','D_FROZEN_INTRINSIC_INTERVAL','intrinsic clock s','dimensionless'),
            'model.max_step':(c['primary_max_step'],lock,'INTERNAL_DERIVATION','D_FROZEN_PRIMARY_MAX_STEP','intrinsic clock s','dimensionless'),
            'model.linear_invariants':({'Q_total':[1,1,1]},spec,'INTERNAL_DERIVATION','D_TOTAL_CHARGE_INVARIANT','dimensionless','linear invariant'),
            'model.invariant_tolerance':(c['invariant_tolerance'],lock,'INTERNAL_DERIVATION','D_FROZEN_INVARIANT_TOLERANCE','dimensionless','absolute'),
            'model.positivity_tolerance':(c['positivity_tolerance'],lock,'INTERNAL_DERIVATION','D_FROZEN_POSITIVITY_TOLERANCE','dimensionless probability','absolute')
          }
          for rec in data['bindings']:
            value,origin,kind,dobj,units,dims=values[rec['path']]
            rec.update(value=value,origin_kind=kind,origin_path=str(origin),origin_sha256=sha(origin),module='D',derivation_object=dobj,units=units,dimensions=dims,justification='Exact frozen parent or pre-execution derivation only; no public targets or post-hoc values.')
          sheet.write_text(json.dumps(data,indent=2)+'\n')
          PY
          python tools/materialize_solver_config.py --template "$run/solver_templates/D_transport.template.json" --binding-sheet "$run/binding_sheets/D_transport.bindings.json" --output "$run/solver_configs/D_transport.json"

      - name: Execute exact configured engine and local phase
        shell: bash
        run: |
          set -euo pipefail
          run=modules/D/runs/D-130-20260807T045646Z
          python tools/run_configured_solver.py --config "$run/solver_configs/D_transport.json" --output-dir "$run/solver_outputs/transport"
          bash tools/finish_local_phase.sh D "$run"

      - name: Execute parent-driven D diagnostic and independent reconstruction
        shell: bash
        run: |
          set -euo pipefail
          run=modules/D/runs/D-130-20260807T045646Z
          python "$run/primary/execute_d130.py" | tee "$run/primary/EXECUTION_STDOUT.txt"
          python "$run/independent/independent_reconstruct_d130.py" | tee "$run/independent/EXECUTION_STDOUT.txt"

      - name: True clean-checkout replay
        shell: bash
        run: |
          set -euo pipefail
          run=modules/D/runs/D-130-20260807T045646Z
          source_commit=$(python -c "import json;print(json.load(open('$run/IMPLEMENTATION_LOCK.json'))['source_commit'])")
          tmp=$(mktemp -d)
          git worktree add --detach "$tmp/replay" "$source_commit"
          cd "$tmp/replay"
          python modules/D/runs/D-130-20260807T045646Z/primary/execute_d130.py > /tmp/d130-replay-primary.txt
          python modules/D/runs/D-130-20260807T045646Z/independent/independent_reconstruct_d130.py > /tmp/d130-replay-independent.txt
          cd - >/dev/null
          python - <<PY
          import hashlib,json
          from pathlib import Path
          run=Path('$run')
          replay=Path('$tmp/replay')/run
          def h(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          pairs=['primary/DISTRIBUTION_HISTORY.json','primary/PRIMARY_DIAGNOSTICS.json','independent/INDEPENDENT_RECONSTRUCTION.json']
          checks=[]
          for rel in pairs:
            checks.append({'path':rel,'live_sha256':h(run/rel),'replay_sha256':h(replay/rel),'exact_match':h(run/rel)==h(replay/rel)})
          rec={'source_commit':'$source_commit','clean_checkout':True,'command_primary':'python modules/D/runs/D-130-20260807T045646Z/primary/execute_d130.py','command_independent':'python modules/D/runs/D-130-20260807T045646Z/independent/independent_reconstruct_d130.py','checks':checks,'pass':all(x['exact_match'] for x in checks)}
          (run/'REPLAY_RECORD.json').write_text(json.dumps(rec,indent=2)+'\n')
          assert rec['pass']
          PY
          git worktree remove --force "$tmp/replay"

      - name: Assemble component gates, independent verification, and blocked handoff
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          run=Path('modules/D/runs/D-130-20260807T045646Z')
          primary=json.loads((run/'primary/PRIMARY_DIAGNOSTICS.json').read_text())
          ledger=json.loads((run/'primary/ENTROPY_CONSERVATION_LEDGER.json').read_text())
          phase=json.loads((run/'primary/PHASE_EVENT_LEDGER.json').read_text())
          indep=json.loads((run/'independent/INDEPENDENT_RECONSTRUCTION.json').read_text())
          replay=json.loads((run/'REPLAY_RECORD.json').read_text())
          solver=json.loads((run/'solver_outputs/transport/result.json').read_text())
          gates={
            'run_id':'D-130-20260807T045646Z','overall':'BLOCKED',
            'component_gates':{
              'positive distributions':{'status':'PASS' if primary['checks']['positive_distributions'] and solver['pass_flags']['positivity'] else 'FAIL','normalized_score':1.0 if primary['checks']['positive_distributions'] and solver['pass_flags']['positivity'] else 0.0},
              'energy/charge conservation':{'status':'BLOCKED_PHYSICAL_ENERGY_NOT_DERIVED','charge_status':ledger['charge_conservation_status'],'physical_energy_status':ledger['physical_energy_conservation_status'],'normalized_score':None},
              'event ordering':{'status':'PASS_NO_EVENT_WITNESS','public_targets_used':phase['observed_or_public_target_values_used'],'events':phase['events'],'normalized_score':1.0},
              'stiff-solver convergence':{'status':'PASS' if primary['checks']['dyadic_convergence'] and primary['checks']['analytic_orbit'] else 'FAIL','normalized_score':1.0 if primary['checks']['dyadic_convergence'] and primary['checks']['analytic_orbit'] else 0.0,'scope':'BDF convergence of normalized branch; physical stiffness scale not claimed'},
              'restart and independent reconstruction':{'status':'PASS' if primary['checks']['restart'] and indep['diagnostic_pass'] and replay['pass'] else 'FAIL','normalized_score':1.0 if primary['checks']['restart'] and indep['diagnostic_pass'] and replay['pass'] else 0.0}
            },
            'blocking_object':{
              'status':'BLOCKED','name':'PHYSICAL_THERMAL_HISTORY',
              'reason':'Exact C parent provides no dimensionful energy/temperature map, physical clock, metric expansion state, or parent-derived phase order parameter/threshold. Full D claim would exceed evidence.'
            },
            'public_data_used':False
          }
          (run/'GATE_RESULTS.json').write_text(json.dumps(gates,indent=2)+'\n')
          (run/'INDEPENDENT_VERIFICATION.md').write_text('''# Independent verification — D-130\n\n## Result\n\n**PASS for the normalized dimensionless transport diagnostic; BLOCKED for full physical Module D.**\n\nThe independent implementation reconstructed the exact C projector and analytic orbit from `H_C_to_D` and `FROZEN_DERIVATION_SPEC.json` before reading the primary trajectory. It independently verified normalization, positivity, entropy direction, dimensionless excitation decay, and the analytic final state within the frozen tolerance. The clean-checkout replay reproduced the selected primary and independent artifacts byte-for-byte.\n\nThe same independent inspection confirms that the exact parent provides no dimensionful energy scale or thermodynamic temperature map, no physical clock or metric expansion state, and no phase order parameter/threshold. Therefore this verification does not support a Kelvin-temperature history, physical expansion chronology, phase-transition chronology, or D-to-E physical handoff.\n''')
          blocked={
            'schema_version':'1.0','object_id':'H_D_to_E_BLOCKED','from_module':'D','to_module':'E','run_id':'D-130-20260807T045646Z','status':'BLOCKED_NO_PHYSICAL_HANDOFF',
            'supported_object':'normalized dimensionless parent-driven transport diagnostic',
            'missing_required_objects':['dimensionful energy/temperature map','physical clock or lawful time map','metric/expansion state required by D objective','parent-derived phase order parameter and threshold'],
            'public_data_used':False,'generation_mode':'GENERATION_SEALED','claim_boundary':'No primordial-abundance parent is released; Module E remains blocked.'
          }
          (run/'H_D_to_E_BLOCKED.json').write_text(json.dumps(blocked,indent=2)+'\n')
          (run/'CLOSEOUT.md').write_text('''# Module D closeout — physical thermal-history obstruction\n\n## Result\n\n`BLOCKED` at the physical thermal-history layer after successful execution of the lawful normalized dimensionless transport diagnostic.\n\n## Strongest supported claim\n\nThe exact frozen C parent and inherited O(2) symmetry support the nontrivial linear conservative positivity-preserving relaxation family `dp/dtau=-kappa P_perp p` up to intrinsic clock reparameterization. The normalized branch `dp/ds=-P_perp p` was executed with the frozen BDF controls, remained positive, conserved total carrier charge, matched the analytic orbit, increased Shannon entropy, decreased the inherited dimensionless excitation functional, passed the frozen dyadic convergence matrix, passed midpoint restart, executed the preregistered structural countermodels/ablations, reproduced independently, and replayed from a clean checkout. The nonlinear conservative O(2)-equivariant family remains underdetermined rather than silently discarded.\n\n## Blocking scientific object\n\nThe exact C parent contains no dimensionful energy scale, thermodynamic temperature map, physical clock, metric/expansion state, or parent-derived phase order parameter/threshold. Physical energy conservation therefore cannot be tested as a D quantity, no Kelvin-temperature history can be generated, and no physical phase chronology exists to hand to Module E. Importing standard cosmological values or formulas would violate the generation firewall and the frozen claim boundary.\n\n## Strongest unsupported claim\n\nNo complete generated RFC physical thermal history, Kelvin-temperature trajectory, physical expansion history, phase-transition chronology, primordial isotope initial conditions, empirical correspondence, or valid `H_D_to_E` physical handoff has been established.\n\n## Public-data firewall\n\nNo public, observational, remembered best-fit, or target-derived value was used.\n\n## Advancement\n\nDo not advance to Module E. Preserve `H_D_to_E_BLOCKED.json` and resolve the missing physical scale/clock/thermodynamic/event objects through a new lawfully frozen D derivation if possible.\n''')
          PY

      - name: End-of-session repository checks
        shell: bash
        run: |
          set -euo pipefail
          run=modules/D/runs/D-130-20260807T045646Z
          python tools/director.py doctor | tee "$run/FINAL_DOCTOR.txt"
          python -m unittest discover -s tests -v 2>&1 | tee "$run/UNIT_TESTS.txt"
          python tools/rfc.py firewall-scan | tee "$run/FIREWALL_SCAN.txt"
          python tools/rfc.py context

      - name: Close run BLOCKED and finalize run manifest last
        shell: bash
        run: |
          set -euo pipefail
          run=modules/D/runs/D-130-20260807T045646Z
          python tools/rfc.py close-run --run-id D-130-20260807T045646Z --result BLOCKED --closeout "$run/CLOSEOUT.md"
          python - <<'PY'
          import hashlib,json,platform,sys
          from datetime import datetime,timezone
          from pathlib import Path
          run=Path('modules/D/runs/D-130-20260807T045646Z')
          env={'python':sys.version,'platform':platform.platform(),'implementation':platform.python_implementation(),'random_seed':'NONE_DETERMINISTIC','public_network_or_data':'NONE','finalized_utc':datetime.now(timezone.utc).isoformat()}
          (run/'ENVIRONMENT_FINAL.json').write_text(json.dumps(env,indent=2)+'\n')
          files=[]
          for p in sorted(run.rglob('*')):
            if p.is_file() and '__pycache__' not in p.parts and p.name!='GENERATED_OUTPUT_MANIFEST.json':
              b=p.read_bytes(); files.append({'path':str(p),'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b)})
          canonical=json.dumps(files,sort_keys=True,separators=(',',':')).encode()
          (run/'GENERATED_OUTPUT_MANIFEST.json').write_text(json.dumps({'run_id':'D-130-20260807T045646Z','finalized_after_all_run_outputs_stopped':True,'files':files,'tree_sha256':hashlib.sha256(canonical).hexdigest()},indent=2)+'\n')
          PY
          python tools/director.py doctor
          python tools/rfc.py firewall-scan

      - name: Commit exact blocked scientific scope and remove one-shot runner
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/d130_fresh_execute.yml
          git config user.name '3-RFC governed executor'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Close Module D at its verified scientific scope'
          git pull --rebase origin agent/frontier-050-execution
          git push origin HEAD:agent/frontier-050-execution
