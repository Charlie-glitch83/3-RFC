name: E140 Freeze Parent Derived Law

on:
  pull_request:
    branches:
      - agent/frontier-050-execution

permissions:
  contents: write

jobs:
  freeze:
    if: github.event.pull_request.head.ref == 'ops/e140-readme-restart-20260807'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Freeze exact parent-derived E law and bindings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, math
          from pathlib import Path

          RUN_ID='E-140-20260807T155635Z'
          RUN=Path('modules/E/runs')/RUN_ID
          state=json.loads(Path('STATE.json').read_text())
          if state.get('active_work_unit')!='E-140' or state.get('current_module')!='E' or state.get('current_run')!=RUN_ID:
              raise SystemExit('HARD STOP: fresh E140 run is not solely active')
          if state['modules']['E']['evidence_state']!='DESIGN':
              raise SystemExit('HARD STOP: E no longer at DESIGN before freeze')

          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          def dump(p,obj): Path(p).write_text(json.dumps(obj,indent=2,ensure_ascii=False)+'\n')

          A='modules/A/frozen/H_A_to_B.json'
          B='modules/B/frozen/H_B_to_C.json'
          C='modules/C/frozen/H_C_to_D.json'
          D='modules/D/runs/D-130-20260807T053432Z/frozen/H_D_to_E.json'
          DM='modules/D/runs/D-130-20260807T053432Z/frozen/H_D_to_E_MANIFEST.json'
          DU='modules/D/runs/D-130-20260807T053432Z/primary/UNCERTAINTY_COVARIANCE.json'
          DS='modules/D/runs/D-130-20260807T053432Z/FROZEN_DERIVATION_SPEC.json'
          WO='recipes/E/WORK_ORDER.md'
          REC='recipes/E/recipe.json'
          GATES='recipes/E/gates.json'
          WL1='recipes/E/wolfram/E-WL-001.wl'
          WL2='recipes/E/wolfram/E-WL-002.wl'
          CROSS='theory/ENHANCEMENT_CROSSWALK.json'
          ATLAS='theory/DERIVATION_ATLAS.md'
          OP='MODEL_OPERATOR_PROMPT.md'

          manifest=json.loads(Path(DM).read_text())
          if sha(D)!=manifest['sha256'] or manifest['sha256']!='199b89ccbdea06714a5539c5d3baf53cd332e5b65922676c6c8d37cc7c824af8':
              raise SystemExit('HARD STOP: exact D->E handoff hash mismatch')

          a=json.loads(Path(A).read_text())
          c=json.loads(Path(C).read_text())
          d=json.loads(Path(D).read_text())
          du=json.loads(Path(DU).read_text())
          ds=json.loads(Path(DS).read_text())

          delta=float(a['recursive_kernel']['specification']['delta'])
          alpha=float(a['recursive_kernel']['specification']['alpha'])
          g=float(c['microscopic_constitution']['dimensionless_doublet_gap'])
          theta=float(d['temperature_internal_Theta_D'])
          y0=list(map(float,d['final_population']))
          kf=g
          kr=g*theta

          # Exact E-WL-001/002 topology reduces to one reaction extent x:
          # n=n0-x, p=p0-x, d=d0+x; dx/dtau=kf*n*p-kr*d.
          n0,p0,d0=y0
          qb=-(n0+p0+theta)
          qc=n0*p0-theta*d0
          disc=qb*qb-4.0*qc
          roots=[(-qb-math.sqrt(disc))/2.0,(-qb+math.sqrt(disc))/2.0]
          admiss=[x for x in roots if x>=0 and x<=min(n0,p0)]
          if len(admiss)!=1:
              raise SystemExit(f'HARD STOP: E equilibrium branch is not uniquely admissible: {roots}')
          xeq=admiss[0]
          lambda_E=kf*(n0+p0-2.0*xeq)+kr
          if not (lambda_E>0): raise SystemExit('HARD STOP: derived E equilibrium is not stable')
          t_end=1.0/lambda_E
          max_step=t_end/128.0

          # Internal energy ownership: each free excitation role carries the exact C gap g;
          # net capture transfers 2g per reaction extent into RFL binding-memory.
          energy_quantum=2.0*g

          # Reconstruct D envelope Theta for each source-decimal branch from D's frozen law.
          u=[1/3,1/3,1/3]
          env=[]
          for row in du['decimal_envelope_replays']:
              gg=float(row['g_C']); pp=list(map(float,row['final_at_one_gap_efold']))
              norm2=sum((pp[i]-u[i])**2 for i in range(3))
              den=sum((pp[i]-u[i])*math.log(pp[i]) for i in range(3))
              th=gg*norm2/den
              nn,qq,dd=pp
              bb=-(nn+qq+th); cc=nn*qq-th*dd; di=bb*bb-4*cc
              rr=[(-bb-math.sqrt(di))/2,(-bb+math.sqrt(di))/2]
              aa=[x for x in rr if x>=0 and x<=min(nn,qq)]
              if len(aa)!=1: raise SystemExit('HARD STOP: uncertainty branch has no unique admissible E equilibrium')
              xx=aa[0]; kff=gg; krr=gg*th; lam=kff*(nn+qq-2*xx)+krr
              env.append({'delta':row['delta'],'g_C':gg,'Theta_D_reconstructed':th,'initial_E_state':pp,'kf':kff,'kr':krr,'x_equilibrium':xx,'lambda_E':lam,'t_end_one_E_efold':1/lam})

          deriv={
            'schema_version':'1.0','object_id':'E140_FROZEN_DERIVATION_SPEC','run_id':RUN_ID,'module':'E',
            'status':'FROZEN_BEFORE_PRIMARY_EXECUTION','generation_mode':'GENERATION_SEALED','fidelity':'MINIMAL_SPINE',
            'authority':{
              'work_order':{'path':WO,'sha256':sha(WO)},'recipe':{'path':REC,'sha256':sha(REC)},'gates':{'path':GATES,'sha256':sha(GATES)},
              'derivation_atlas':{'path':ATLAS,'sha256':sha(ATLAS)},'enhancement_crosswalk':{'path':CROSS,'sha256':sha(CROSS)},
              'operator_prompt':{'path':OP,'sha256':sha(OP)},'wolfram_E_WL_001':{'path':WL1,'sha256':sha(WL1)},'wolfram_E_WL_002':{'path':WL2,'sha256':sha(WL2)}
            },
            'exact_parent':{'object_id':'H_D_to_E','path':D,'sha256':sha(D)},
            'ancestry':[
              {'object_id':'H_A_to_B','path':A,'sha256':sha(A)}, {'object_id':'H_B_to_C','path':B,'sha256':sha(B)},
              {'object_id':'H_C_to_D','path':C,'sha256':sha(C)}, {'object_id':'D130_FROZEN_DERIVATION_SPEC','path':DS,'sha256':sha(DS)},
              {'object_id':'D_UNCERTAINTY_COVARIANCE','path':DU,'sha256':sha(DU)}
            ],
            'triadic_descent':{
              'CIF':'The exact E symbolic reaction hypergraph supplies the three source-owned nuclear roles n,p,d and reversible possibility n+p<->d on the inherited three-channel carrier.',
              'QV':'Reaction flow uses the unique positive parent microscopic interaction gap g_C as the forward selection scale; no public rate or fitted coefficient is admitted.',
              'RFL':'Reverse reopening is the same parent interaction scale multiplied by the exact residual D internal conjugate-temperature availability Theta_D; abundance, reaction-progress, binding-memory and covariance are stabilized downstream.'
            },
            'nbody_mode':'RELATIONAL_GRAMMAR_ACTIVE',
            'state_space':{
              'species':['n','p','d'],'species_semantics':'E-internal source-owned nuclear role labels fixed by E-WL-001/002; no empirical identity calibration claimed',
              'initial_state':y0,'clock':'tau_E is a dimensionless intrinsic reaction-flow clock derived from the E linearized equilibrium rate; not SI time',
              'stoichiometry':[[-1,1],[-1,1],[1,-1]],'invariants':{'baryon':[1,1,2],'charge':[0,1,1]}
            },
            'candidate_class':{
              'name':'LOWEST_ORDER_POSITIVE_MASS_ACTION_ON_EXACT_E_HYPEREDGE_WITH_NO_NEW_DIMENSIONLESS_CONSTANTS',
              'rate_form':['kf*n*p','kr*d'],
              'selection_rule':'Use only exact parent scalars with typed E roles. The unique parent interaction gap g_C sets QV forward flow. The only exact D scalar that types residual thermal reopening at the E boundary is Theta_D, so the lowest-order RFL reopening coefficient is g_C*Theta_D. Higher-order functions or extra constants are reserved, not selected at MINIMAL_SPINE.',
              'branch_status':'UNIQUE_WITHIN_FROZEN_LOWEST_ORDER_NO_NEW_CONSTANT_CLASS',
              'forbidden':'No old Li7 mechanism, target-relative abundance, public nuclear table, remembered physical constant, or generic old triad coefficient is generative.'
            },
            'rate_law':{'equations':['r_f=kf*n*p','r_r=kr*d','dy/dtau_E=S.(r_f,r_r)','kf=g_C','kr=g_C*Theta_D'],
                        'g_C':g,'Theta_D':theta,'kf':kf,'kr':kr,'units':'dimensionless per intrinsic tau_E under normalized abundance convention'},
            'equilibrium_and_clock':{
              'extent_equation':'dx/dtau_E=kf(n0-x)(p0-x)-kr(d0+x)',
              'admissible_equilibrium_extent':xeq,'rejected_equilibrium_root':[x for x in roots if x!=xeq],
              'linearized_relaxation_rate_lambda_E':lambda_E,'t_span':[0.0,t_end],
              't_span_definition':'exactly one local E reaction-relaxation e-fold 1/lambda_E from the inherited D boundary state',
              'max_step':max_step,'max_step_definition':'(1/lambda_E)/128',
              'convergence_steps':[t_end/32,t_end/64,t_end/128,t_end/256]
            },
            'energy_memory_law':{
              'free_excitation_energy':'E_free=g_C*(n+p)',
              'rfl_binding_memory':'H_bind=2*g_C*(d-d0)',
              'conserved_total':'E_free+H_bind=g_C*(n0+p0)',
              'event_energy_quantum':energy_quantum,
              'scope':'dimensionless RFC excitation/binding-memory accounting only; no MeV binding energy or public mass calibration claimed'
            },
            'freeze_out_witness':{
              'equilibrium_condition':'kf*n*p=kr*d',
              'memory_balance_event':'E_REACTION_MEMORY_BALANCE_CROSSING when realized extent x equals remaining equilibrium extent x_eq-x, i.e. x=x_eq/2',
              'endpoint':'one derived E relaxation e-fold; terminal net flux and residual-to-equilibrium are recorded, not forced to zero'
            },
            'uncertainty':{'classification':'INHERITED_SOURCE_DECIMAL_REPRESENTATION_ENVELOPE_ONLY','stochastic_covariance_inherited':d['uncertainty_covariance']['stochastic_covariance'],'decimal_envelope_replays':env},
            'countermodels':['SIGN_FLIP_RATE: kf<0 must violate positivity/flow direction','CONSERVATION_BREAK: perturb one stoichiometric entry must fail baryon/charge nullspace','SCALAR_CHANNEL_COLLAPSE: replace distinct CIF topology/QV flow/RFL reopening roles with one undifferentiated scalar mechanism and require semantic rejection'],
            'ablations':['withhold reverse reaction kr*d','remove RFL binding-memory ledger','replace parent-derived kr=g_C*Theta_D by kf=kr scalar collapse as negative control'],
            'falsifiers':['any abundance below -1e-12','baryon or charge drift above 1e-9','dimensionless excitation+binding-memory drift above 1e-9','network refinement final-state L_inf change above 1e-8','midpoint restart final-state L_inf change above 1e-8','independent scalar-extent reconstruction final-state L_inf change above 1e-8','historical/public abundance target influences generation'],
            'independent_verifier_design':'Reduce the exact three-species network to the single reaction extent x using baryon/charge conservation, integrate the scalar Riccati law independently of ReactionNetwork, reconstruct n,p,d and energy-memory ledgers, and compare against primary output without trusting primary gate summaries.',
            'claim_boundary':'Internally generated RFC primordial three-role nuclear state at MINIMAL_SPINE fidelity only. No public abundance fit, no empirical isotope calibration, no MeV binding energies, no SI duration, and no external BBN validation is claimed.'
          }
          deriv_path=RUN/'FROZEN_DERIVATION_SPEC.json'; dump(deriv_path,deriv); deriv_sha=sha(deriv_path)

          source={
            'schema_version':'1.0','run_id':RUN_ID,'module':'E','generation_mode':'GENERATION_SEALED','public_data_declaration':'NONE',
            'exact_parents':[{'object_id':'H_D_to_E','path':D,'sha256':sha(D),'role':'EXACT_DIRECT_PHYSICAL_PARENT'}],
            'admitted_ancestry':[{'path':p,'sha256':sha(p)} for p in [A,B,C,DS,DU]],
            'authority_files':[{'path':p,'sha256':sha(p)} for p in [WO,REC,GATES,ATLAS,CROSS,OP,WL1,WL2]],
            'internal_derivations':[{'path':str(deriv_path),'sha256':deriv_sha,'object_id':'E140_FROZEN_DERIVATION_SPEC'}],
            'excluded_generative_material':['prior E blocked run','historical scalar Li7 lane','target-relative W2/W3/W4 proxy outputs','public nuclear-rate or abundance tables'],
            'imports':['math','json','hashlib'],'files':[],'urls':[],'constants':[],
            'rate_source_audit':'PASS_PARENT_DERIVED_NO_PUBLIC_OR_HISTORICAL_FAILURE_PARENT'
          }
          dump(RUN/'SOURCE_REGISTER.json',source)

          lock={
            'schema_version':'1.0','run_id':RUN_ID,'status':'FROZEN','frozen_before_primary_execution':True,
            'authority_hashes':[sha(x) for x in [WO,REC,GATES,ATLAS,CROSS,OP,WL1,WL2]],
            'parent_hashes':[sha(D)],'definition_hashes':[deriv_sha],
            'candidate_classes':[deriv['candidate_class']['name']],
            'equations_and_laws':deriv['rate_law']['equations']+[deriv['energy_memory_law']['conserved_total']],
            'dimensions_units_frames_gauges_clocks':[deriv['state_space']['clock'],deriv['rate_law']['units']],
            'methods':['BDF primary reaction integrator','scalar reaction-extent independent implementation'],
            'tolerances':['rtol=1e-9','atol=1e-12','positivity=1e-12','invariants=1e-9','convergence/restart/independent L_inf=1e-8'],
            'stopping_rules':['one local E reaction-relaxation e-fold','hard stop on public/remembered target use','hard stop on baryon/charge failure'],
            'expected_invariants':['baryon','charge','dimensionless excitation+RFL binding memory'],
            'tests':['E-WL-001','E-WL-002','manufactured E reference check','network convergence','withheld reverse reaction','countermodels','restart','uncertainty envelope','independent scalar reconstruction'],
            'gates':['baryon/charge/energy accounting','network convergence','rate-source audit','no scalar-channel collapse','withheld reaction and independent implementation checks'],
            'falsifiers':deriv['falsifiers'],'claim_boundary':deriv['claim_boundary'],'independent_verifier_design':deriv['independent_verifier_design'],
            'allowed_implementation_only_corrections':['serialization','path handling','relocation safety','numerical implementation defects only; no changes to frozen science, rates, tests, thresholds, gates or claim scope']
          }
          dump(RUN/'PRE_EXECUTION_LOCK.json',lock)

          sheet_path=RUN/'binding_sheets/E_reaction_network.bindings.json'
          sheet=json.loads(sheet_path.read_text())
          vals={
            'model.species':['n','p','d'],
            'model.stoichiometry':[[-1,1],[-1,1],[1,-1]],
            'model.rate_expressions':['kf*n*p','kr*d'],
            'model.parameters':{'kf':kf,'kr':kr},
            'model.invariants':{'baryon':[1,1,2],'charge':[0,1,1]},
            'initial_state':y0,
            't_span':[0.0,t_end],
            'max_step':max_step,
            'positivity_tolerance':1e-12,
            'invariant_tolerance':1e-9
          }
          dims={
            'model.species':'typed labels','model.stoichiometry':'dimensionless integer incidence','model.rate_expressions':'dimensionless abundance flow per tau_E',
            'model.parameters':'dimensionless intrinsic rate coefficients','model.invariants':'dimensionless conserved ledgers','initial_state':'normalized abundance state',
            't_span':'dimensionless tau_E','max_step':'dimensionless tau_E','positivity_tolerance':'dimensionless','invariant_tolerance':'dimensionless'
          }
          for rec in sheet['bindings']:
              path=rec['path']; rec['value']=vals[path]; rec['origin_kind']='INTERNAL_DERIVATION'; rec['origin_path']=str(deriv_path); rec['origin_sha256']=deriv_sha
              rec['derivation_object']='E140_FROZEN_DERIVATION_SPEC'; rec['units']='dimensionless'; rec['dimensions']=dims[path]
              rec['justification']='Bound from exact E symbolic topology plus exact A/B/C/D ancestry under the frozen lowest-order no-new-constant E derivation.'
          dump(sheet_path,sheet)

          (RUN/'RUN_PLAN.md').write_text('''# Run Plan — E-140\n\nExecute the active E packet exactly. The physical minimal-spine network is derived from the exact E-WL n+p<->d hyperedge and exact A/B/C/D parent lineage. Historical failure/proxy outcomes are regression-only and are not generative. Freeze the parent-derived mass-action law before Wolfram/primary execution; then run the exact symbolic checks, manufactured reference, materialized physical solver, parent-driven energy/freeze-out/uncertainty analysis, countermodels, convergence, restart, replay and independent scalar-extent reconstruction.\n''')
          print(json.dumps({'run_id':RUN_ID,'derivation_sha256':deriv_sha,'kf':kf,'kr':kr,'x_eq':xeq,'lambda_E':lambda_E,'t_end':t_end,'max_step':max_step},indent=2))
          PY
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
      - name: Commit frozen E law and remove carrier
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/e140_freeze_parent_derived_law.yml
          git config user.name '3-RFC governed executor'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Freeze parent-derived E140 reaction law'
          git pull --rebase origin agent/frontier-050-execution
          git push origin HEAD:agent/frontier-050-execution
