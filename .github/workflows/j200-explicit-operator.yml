name: J-200 governed Wolfram recording and prebinding

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  j200-wolfram-record-prebind:
    if: github.event.pull_request.head.ref == 'ops/j200-prebind-final-20260809'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-050-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Record exact evaluator outputs and run repository prebinding machinery
        shell: bash
        run: |
          set -euo pipefail
          EXPECT='46c1fa43668bf9da20f02a442913461480d6111f'
          RUN='J-200-20260809T225756Z'
          R="modules/J/runs/$RUN"
          test "$(git rev-parse HEAD)" = "$EXPECT"
          python -m pip install --disable-pip-version-check -r requirements-lock.txt
          test "$(python -c "import json; print(json.load(open('$R/PRE_EXECUTION_LOCK.json'))['status'])")" = FROZEN
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime,timezone
          R=Path('modules/J/runs/J-200-20260809T225756Z')
          now=datetime.now(timezone.utc).isoformat()
          failures=[
            {'failure_id':'J200-WL001-PROTECTED-C-SYMBOL','stage':'POST_LOCK_MANUFACTURED_WOLFRAM','call':'J-WL-001','result':'FAIL','cause':'Protected Wolfram symbol C blocked covariance assignment.','evidence':'wolfram/J-WL-001/FAILED_ATTEMPT_001.txt','disposition':'IMPLEMENTATION_ONLY_SYMBOL_RENAME_AND_FULL_FROZEN_MATRIX_RERUN','science_changed':False},
            {'failure_id':'J200-WL001-CHOLESKY-CONVENTION','stage':'POST_LOCK_MANUFACTURED_WOLFRAM_RERUN','call':'J-WL-001','result':'FAIL','cause':'Wolfram CholeskyDecomposition satisfies ConjugateTranspose[L].L == covMat; the frozen manufactured test used the opposite product order.','evidence':'wolfram/J-WL-001/FAILED_ATTEMPT_002.txt','disposition':'IMPLEMENTATION_ONLY_CHOLESKY_PRODUCT_ORDER_AND_FULL_FROZEN_MATRIX_RERUN','science_changed':False}
          ]
          for f in failures: f['timestamp_utc']=now
          (R/'FAILURES.jsonl').write_text(''.join(json.dumps(f)+'\n' for f in failures))
          rec={'patch_id':'J200-WL001-IMPLEMENTATION-COMPATIBILITY','timestamp_utc':now,'classification':'IMPLEMENTATION_ONLY_WOLFRAM_COMPATIBILITY','run_id':R.name,'repairs':[{'defect':'protected local symbol C','correction':'rename C to covMat'},{'defect':'Wolfram Cholesky product convention','correction':'use ConjugateTranspose[L].L == covMat'}],'science_changed':False,'parents_changed':False,'sources_changed':False,'law_changed':False,'candidate_classes_changed':False,'seed_rule_changed':False,'test_semantics_changed':False,'thresholds_changed':False,'gates_changed':False,'claim_boundary_changed':False,'required_action':'Rerun J-WL-001 and J-WL-002 in order and then the full frozen J matrix.'}
          (R/'IMPLEMENTATION_PATCH_RECORD.json').write_text(json.dumps(rec,indent=2)+'\n')
          PY
          cat > /tmp/J-WL-001.output.txt <<'EOF'
Symbol::undefined2: Warning: Global symbols "L, L, L" are undefined.
General::messages: Messages were generated which may indicate errors.

Out[1]= "<|\"call\" -> \"J-WL-001\", \"eigenvalues\" -> {\"Root[-1219 + 6110*#1 - 9200*#1^2 + 4000*#1^3 & , 3, 0]\", \"Root[-1219 + 6110*#1 - 9200*#1^2 + 4000*#1^3 & , 2, 0]\", \"Root[-1219 + 6110*#1 - 9200*#1^2 + 4000*#1^3 & , 1, 0]\"}, \"positiveDefinite\" -> True, \"reconstructionPass\" -> True|>"
EOF
          cat > /tmp/J-WL-002.output.txt <<'EOF'
Out[1]= "<|\"call\" -> \"J-WL-002\", \"rule\" -> \"{Re[z[1]], Conjugate[z[8]], Conjugate[z[7]], Conjugate[z[6]], Re[z[5]], Conjugate[z[4]], Conjugate[z[3]], Conjugate[z[2]]}\", \"note\" -> \"Actual finite-volume implementation must enforce conjugate pairing and preserve the frozen seed.\"|>"
EOF
          python tools/director.py wolfram-record --run "$RUN" --call J-WL-001 --output /tmp/J-WL-001.output.txt
          python tools/director.py wolfram-record --run "$RUN" --call J-WL-002 --output /tmp/J-WL-002.output.txt
          python tools/run_reference_checks.py --module J --output "$R/reference_checks.json"
          python tools/director.py solver-copy --module J --solver covariance --destination "$R"
          python tools/director.py solver-copy --module J --solver fourier_field --destination "$R"
          python tools/rfc.py doctor
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$R"
          git commit -m 'Run J-200 prescribed symbolic and prebinding steps'
          git push origin HEAD:agent/frontier-050-execution
          printf 'J200_PREBIND_COMMIT=%s\n' "$(git rev-parse HEAD)"
